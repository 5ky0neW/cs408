monospace;font-weight:${h?800:600}\">${i}<\/div>\n      <\/div>`;\n    }).join('')}<\/div>\n      <div class=\"legend\" style=\"margin-top:10px\">\n        <span><i style=\"background:#fff4e3;border:1px solid #d97706\"><\/i>正在探测（冲突，继续往后找）<\/span>\n        <span><i style=\"background:#e8f6ec;border:1px solid #15803d\"><\/i>最终放入 / 找到<\/span>\n        <span><i style=\"background:#fdeceb;border:1px solid #dc2626\"><\/i>探测到空位 → 确定不存在<\/span>\n      <\/div>`;\n  }\n  const cnt = HS.mode === 'chain'\n    ? HS.table.reduce((s,b)=>s+(b?b.length:0),0)\n    : HS.table.filter(v=>v!==null&&v!==undefined).length;\n  $('hsStage').innerHTML = rows;\n  $('hsOut').innerHTML =\n    `<div class=\"res\">\n      <div class=\"r\"><span class=\"lbl\">哈希函数<\/span><span style=\"font-size:13px\">H(key) = key mod ${HS.M}<\/span><\/div>\n      <div class=\"r\" style=\"margin-top:5px\"><span class=\"lbl\">冲突处理<\/span><span style=\"font-size:13px\">${HS.mode==='linear'?'线性探测法（往后找第一个空位）':'拉链法（同地址的挂成链表）'}<\/span><\/div>\n      <div class=\"r\" style=\"margin-top:5px\"><span class=\"lbl\">已存元素<\/span><span class=\"val\">${cnt}<\/span>\n        <span style=\"font-size:12px;color:#8b95a3\">装填因子 α = ${cnt} / ${HS.M} = ${(cnt/HS.M).toFixed(2)}<\/span><\/div>\n    <\/div>\n    <div class=\"tip i\" style=\"margin-top:10px\"><span class=\"ti\">关键<\/span><span>\n      <b>装填因子 α 越大，冲突越多，查找越长。<\/b>散列表的 ASL 只与 α 有关，与 n、m 的绝对值无关。\n      另外注意：<b>线性探测会产生「堆积」<\/b> —— 连续被占的格子越来越长，后续元素被迫探测很远；\n      <b>拉链法不会堆积<\/b>，而且删除更方便。\n    <\/span><\/div>`;\n  renderLog('hsLog', HS.log);\n}\nfunction hsReset(){\n  HS.M = Math.max(7, Math.min(19, parseInt($('hsM').value,10) || 11));\n  HS.mode = $('hsMode').value;\n  HS.table = HS.mode === 'chain' ? new Array(HS.M).fill(null).map(()=>[]) : new Array(HS.M).fill(null);\n  HS.log = [];\n  hsLog(`初始化：表长 m = ${HS.M}，哈希函数 H(key) = key mod ${HS.M}`, 'mut');\n  if(HS.mode === 'chain') hsLog('拉链法：每个地址挂一个链表', 'mut');\n  else hsLog('线性探测法：冲突时依次检查下一个位置', 'mut');\n  hsRender();\n}\nlet HS_BUSY = false;\nfunction hsInsert(){\n  if(HS_BUSY) return;\n  const k = parseInt($('hsVal').value,10);\n  if(isNaN(k)){ hsLog('请输入一个关键字','err'); hsRender(); return; }\n  const h = hsHash(k);\n  if(HS.mode === 'chain'){\n    HS.table[h].push(k);\n    hsLog(`插入 ${k}：H(${k}) = ${k} mod ${HS.M} = ${h} → 挂到 ${h} 号链表${HS.table[h].length>1?'（<b>发生冲突<\/b>，链在后面）':'（无冲突）'}`, 'ok');\n    hsRender(); return;\n  }\n  HS_BUSY = true;\n  hsLog(`插入 ${k}：H(${k}) = ${k} mod ${HS.M} = <b>${h}<\/b>，先看 ${h} 号位置`, 'ok');\n  let i = h, probe = 0;\n  const step = ()=>{\n    const cell = HS.table[i];\n    if(cell === null || cell === undefined){\n      HS.table[i] = k;\n      hsRender({ [i]:'ok' });\n      hsLog(probe === 0 ? `位置 ${h} 正好空着 → <b>一次命中，没有冲突<\/b>`\n                        : `探查 ${probe} 次后，位置 ${i} 是空的 → 把 ${k} 放进这里`, 'ok');\n      HS_BUSY = false; return;\n    }\n    if(cell === k){ hsLog(`${k} 已经存在，不重复插入`, 'err'); hsRender({}); HS_BUSY = false; return; }\n    hsLog(`位置 ${i} 被 <b>${cell}<\/b> 占着 → <b>冲突<\/b>，线性探测往后挪一位`, 'warn');\n    hsRender({ [i]:'probe' });\n    probe++; i = (i+1) % HS.M;\n    if(probe >= HS.M){ hsLog('探完整个表都满了，插入失败', 'err'); HS_BUSY = false; hsRender({}); return; }\n    setTimeout(step, 520);\n  };\n  step();\n}\nfunction hsFind(){\n  if(HS_BUSY) return;\n  const k = parseInt($('hsVal').value,10);\n  if(isNaN(k)){ hsLog('请输入一个关键字','err'); hsRender(); return; }\n  const h = hsHash(k);\n  if(HS.mode === 'chain'){\n    const idx = HS.table[h].indexOf(k);\n    if(idx >= 0) hsLog(`查找 ${k}：H(${k}) = ${h}，在 ${h} 号链表的第 ${idx+1} 个结点找到`, 'ok');\n    else hsLog(`查找 ${k}：H(${k}) = ${h}，该链表里没有 → 查找失败`, 'err');\n    hsRender(); return;\n  }\n  HS_BUSY = true;\n  hsLog(`查找 ${k}：H(${k}) = ${h}，从 ${h} 号位置开始探`, 'ok');\n  let i = h, probe = 0;\n  const step = ()=>{\n    const cell = HS.table[i];\n    if(cell === null || cell === undefined){\n      hsRender({ [i]:'fail' });\n      hsLog(`位置 ${i} 是<b>空的<\/b> → 可以确定 ${k} 不存在（一共比较 ${probe+1} 次）`, 'err');\n      hsLog('★ 这是开放地址法最关键的判断：<b>必须探到空位才能断定不存在<\/b>，中途不能放弃', 'warn');\n      HS_BUSY = false; return;\n    }\n    if(cell === k){\n      hsRender({ [i]:'ok' });\n      hsLog(`在位置 ${i} 找到 ${k}，共比较 ${probe+1} 次`, 'ok');\n      HS_BUSY = false; return;\n    }\n    hsLog(`位置 ${i} 是 ${cell} ≠ ${k} → 继续往后探一位`, 'warn');\n    hsRender({ [i]:'probe' });\n    probe++; i = (i+1) % HS.M;\n    if(probe >= HS.M){ hsLog('探完整个表也没找到', 'err'); HS_BUSY = false; hsRender({}); return; }\n    setTimeout(step, 520);\n  };\n  step();\n}\nfunction hsDelete(){\n  if(HS_BUSY) return;\n  const k = parseInt($('hsVal').value,10);\n  if(isNaN(k)){ hsLog('请输入一个关键字','err'); hsRender(); return; }\n  const h = hsHash(k);\n  if(HS.mode === 'chain'){\n    const idx = HS.table[h].indexOf(k);\n    if(idx < 0){ hsLog(`${h} 号链表里没有 ${k}，删除失败`, 'err'); hsRender(); return; }\n    HS.table[h].splice(idx,1);\n    hsLog(`删除 ${k}：从 ${h} 号链表摘掉 —— 拉链法删除很简单`, 'ok');\n    hsRender(); return;\n  }\n  let i = h, probe = 0;\n  while(probe <= HS.M && HS.table[i] !== null && HS.table[i] !== undefined){\n    if(HS.table[i] === k){\n      HS.table[i] = null;\n      hsLog(`删除 ${k}：位置 ${i} 置空`, 'ok');\n      hsLog('⚠ 但这里有个问题：直接置空会<b>切断探测链<\/b>，导致后面的元素查不到', 'warn');\n      hsLog('所以开放地址法的删除通常要用<b>墓碑标记（tombstone）<\/b>而不是直接置空', 'mut');\n      hsRender(); return;\n    }\n    probe++; i = (i + 1) % HS.M;\n  }\n  hsLog(`没找到 ${k}，删除失败`, 'err');\n  hsRender();\n}\n$('hsIns').onclick = hsInsert;\n$('hsFind').onclick = hsFind;\n$('hsDel').onclick = hsDelete;\n$('hsReset').onclick = hsReset;\n$('hsM').oninput = hsReset;\n$('hsMode').onchange = hsReset;\n$('hsDemo').onclick = ()=>{\n  hsReset();\n  const vals = [22, 41, 53, 46, 30, 13, 1];\n  let idx = 0;\n  const next = ()=>{\n    if(idx >= vals.length){\n      hsLog('示例数据插入完毕。往上翻日志，看哪些关键字发生了冲突、各探测了几次。', 'mut');\n      hsRender(); return;\n    }\n    $('hsVal').value = vals[idx++];\n    hsInsert();\n    const wait = ()=>{\n      if(HS_BUSY) setTimeout(wait, 160);\n      else setTimeout(next, 180);\n    };\n    setTimeout(wait, 160);\n  };\n  next();\n};\nhsReset();\n\n/* ============================================================\n   动画 36 · 排序演示台\n   ============================================================ */\nfunction soParse(){\n  return ($('soData').value||'').split(/[,，\\s]+/).map(x=>parseInt(x,10)).filter(x=>!isNaN(x));\n}\nconst SO_NAME = { insert:'直接插入排序', shell:'希尔排序', bubble:'冒泡排序', quick:'快速排序',\n  select:'简单选择排序', heap:'堆排序', merge:'二路归并排序', radix:'基数排序' };\nconst SO_CMPLX = {\n  insert:['O(n²)','O(n)','O(n²)','O(1)','稳定'], shell:['O(n^1.3)','—','—','O(1)','不稳定'],\n  bubble:['O(n²)','O(n)','O(n²)','O(1)','稳定'], quick:['O(n log n)','O(n log n)','O(n²)','O(log n)','不稳定'],\n  select:['O(n²)','O(n²)','O(n²)','O(1)','不稳定'], heap:['O(n log n)','O(n log n)','O(n log n)','O(1)','不稳定'],\n  merge:['O(n log n)','O(n log n)','O(n log n)','O(n)','稳定'], radix:['O(d(n+r))','—','—','O(r)','稳定']\n};\n/* 每种排序的「原理」与「特点」 —— 光给复杂度不够，得先说清它是怎么做的 */\nconst SO_DESC = {\n  insert: ['把序列分成「<b>已排序段<\/b>」和「<b>未排序段<\/b>」两半。每趟取未排序段的<b>第一个<\/b>元素，在已排序段里<b>从后往前<\/b>找位置插进去 —— 就像整理扑克牌时一张张插进手里。',\n           '数据<b>基本有序<\/b>时几乎退化成 O(n)（每趟只比一次）；数据量很小时也常用。'],\n  shell:  ['先按<b>增量 gap<\/b> 把序列分组（相隔 gap 的元素算一组），每组内部做插入排序；然后不断缩小 gap 重复，最后 gap = 1 时做一次完整的插入排序。',\n           '前面几轮的目的<b>不是排好<\/b>，而是让序列变得「基本有序」，这样最后一轮插入排序就不用搬太多元素。整体效率比直接插入高一个档次。'],\n  bubble: ['从前往后<b>两两比较相邻元素<\/b>，逆序就交换。每趟走完，当前最大的元素会被「冒」到末尾 —— 也就是<b>每趟确定一个元素的最终位置<\/b>。',\n           '如果某一趟<b>一次交换都没发生<\/b>，说明已经有序，可以提前结束 —— 这就是「最好 O(n)」的来源。'],\n  quick:  ['选一个枢轴（通常取第一个元素），一趟划分把序列变成「<b>比枢轴小的<\/b> | 枢轴 | <b>比枢轴大的<\/b>」三段，枢轴就此归位；再对左右两段<b>递归<\/b>做同样的事。',\n           '枢轴每次都能归到最终位置。但若在<b>已经基本有序<\/b>的序列上每次都只分出 1 个元素，就退化成 O(n²) —— 这是快排最大的坑。'],\n  select: ['每趟从未排序段里<b>找出最小的元素<\/b>，与未排序段的第一个位置交换。交换完，那个位置就确定下来了。',\n           '不管数据什么状态都得走完所有比较，所以<b>最好、最坏都是 O(n²)<\/b>，没有提前结束的机会。'],\n  heap:   ['先把整个序列调整成<b>大根堆<\/b>（每个结点都 ≥ 它的孩子，于是堆顶就是全局最大值）；然后反复做三件事：<b>堆顶和末尾交换<\/b>（最大值归位）→ 堆的有效范围减 1 → 把新的堆顶<b>下沉<\/b>调整回堆。',\n           '建堆只要 O(n)。每次调整 O(log n)，共 n−1 次。特别适合求 <b>Top-K<\/b> —— 不用全排完，取 k 次堆顶就够了。'],\n  merge:  ['把长度为 1 的相邻两段<b>两两合并<\/b>成有序段（长度 2），再把长度 2 的合并成 4，依次翻倍，直到整段有序。',\n           '每一趟都是「归并」操作、<b>不做交换<\/b>，所以稳定。但需要和原数组<b>等长的辅助空间<\/b> —— 这是它唯一的短板，也是外部排序首选它的原因。'],\n  radix:  ['<b>不比较元素大小<\/b>，而是按位排序：先按个位把元素「分配」到 0~9 号桶里，再按桶的顺序「收集」回来；然后按十位、百位……重复。',\n           '位数少、取值范围小的整数用它最快 O(d(n+r))。属于<b>非比较排序<\/b>，所以不受 O(n log n) 下界约束。']\n};\nfunction sortSteps(arr, algo){\n  const steps = [];\n  const a = arr.slice();\n  const snap = (hl, note, sorted) => steps.push({ arr:a.slice(), hl:Object.assign({}, hl||{}), note:note||'', sorted:sorted||[] });\n\n  if(algo === 'insert'){\n    snap({}, '初始序列', []);\n    for(let i=1;i<a.length;i++){\n      const key = a[i];\n      const hl = {}; hl[i] = 'act';\n      snap(hl, `第 ${i} 趟：取出 ${key}，要在前面已排好的 [0..${i-1}] 中找位置`);\n      let j = i - 1;\n      while(j >= 0 && a[j] > key){ a[j+1] = a[j]; j--; }\n      a[j+1] = key;\n      const h2 = {}; for(let k=0;k<=i;k++) h2[k] = 'new';\n      snap(h2, `把 ${key} 插到位置 ${j+1}，前面 ${i+1} 个元素已经有序`);\n    }\n  }\n  else if(algo === 'shell'){\n    snap({}, '初始序列', []);\n    for(let gap = Math.floor(a.length/2); gap > 0; gap = Math.floor(gap/2)){\n      snap({}, `增量 gap = ${gap}：把序列分成 ${gap} 组，每组内部做插入排序`);\n      for(let i=gap;i<a.length;i++){\n        const key = a[i];\n        let j = i - gap;\n        while(j >= 0 && a[j] > key){ a[j+gap] = a[j]; j -= gap; }\n        a[j+gap] = key;\n        const hl = {}; hl[i] = 'act';\n        snap(hl, `  组内插入：把 ${key} 放到位置 ${j+gap}`);\n      }\n      snap({}, `gap = ${gap} 这一轮结束`);\n    }\n    snap({}, 'gap = 1，序列已完全有序', a.map((_,i)=>i));\n  }\n  else if(algo === 'bubble'){\n    snap({}, '初始序列', []);\n    const sorted = [];\n    for(let i=0;i<a.length-1;i++){\n      let swapped = false;\n      for(let j=0;j<a.length-1-i;j++){\n        if(a[j] > a[j+1]){\n          [a[j], a[j+1]] = [a[j+1], a[j]];\n          swapped = true;\n          snap({ [j]:'act', [j+1]:'cmp' }, `比较后交换：${a[j+1]} ↔ ${a[j]}（大的往右冒）`);\n        }\n      }\n      sorted.push(a.length-1-i);\n      snap({}, `第 ${i+1} 趟结束：位置 ${a.length-1-i} 已经确定（${a[a.length-1-i]}）`);\n      if(!swapped){ snap({}, '本趟没有发生任何交换 → 说明已经有序，提前结束'); break; }\n    }\n  }\n  else if(algo === 'quick'){\n    const sorted = [];\n    const qs = (lo, hi, depth)=>{\n      if(lo >= hi){ if(lo === hi) sorted.push(lo); return; }\n      const pivot = a[lo];\n      let i = lo, j = hi;\n      snap({ [lo]:'act' }, `划分区间 [${lo}, ${hi}]，选枢轴 ${pivot}`);\n      while(i < j){\n        while(i < j && a[j] >= pivot) j--;\n        if(i < j){ a[i] = a[j]; i++; }\n        while(i < j && a[i] <= pivot) i++;\n        if(i < j){ a[j] = a[i]; j--; }\n        snap({ [i]:'cmp', [j]:'cmp' }, `双向扫描中：i = ${i}, j = ${j}`);\n      }\n      a[i] = pivot;\n      sorted.push(i);\n      snap({ [i]:'new' }, `枢轴 ${pivot} 归位到下标 ${i}（左边都比它小，右边都比它大）`);\n      qs(lo, i-1, depth+1);\n      qs(i+1, hi, depth+1);\n    };\n    qs(0, a.length-1, 0);\n    snap({}, '递归结束，全部有序', a.map((_,i)=>i));\n  }\n  else if(algo === 'select'){\n    snap({}, '初始序列', []);\n    const sorted = [];\n    for(let i=0;i<a.length-1;i++){\n      let mi = i;\n      for(let j=i+1;j<a.length;j++){ if(a[j] < a[mi]) mi = j; }\n      if(mi !== i) [a[i], a[mi]] = [a[mi], a[i]];\n      sorted.push(i);\n      snap({ [i]:'new', [mi]:'cmp' }, `第 ${i+1} 趟：在未排序区找到最小值 ${a[i]}，换到位置 ${i}`);\n    }\n    sorted.push(a.length-1);\n    snap({}, '排序完成', sorted);\n  }\n  else if(algo === 'heap'){\n    const n = a.length;\n    snap({}, '初始序列（先把它看成一棵完全二叉树）', []);\n    const sink = (i, size, tag)=>{\n      let k = i;\n      while(true){\n        const l = 2*k+1, r = 2*k+2;\n        let mx = k;\n        if(l < size && a[l] > a[mx]) mx = l;\n        if(r < size && a[r] > a[mx]) mx = r;\n        if(mx === k) break;\n        [a[k], a[mx]] = [a[mx], a[k]];\n        snap({ [k]:'act', [mx]:'cmp' }, `${tag}：${a[mx]} 与 ${a[k]} 交换（大根堆要求父 ≥ 子）`);\n        k = mx;\n      }\n    };\n    for(let i=Math.floor(n/2)-1;i>=0;i--) sink(i, n, '建堆');\n    snap({ 0:'new' }, `建堆完成，堆顶 ${a[0]} 是最大值`);\n    let size = n;\n    const sorted = [];\n    while(size > 1){\n      [a[0], a[size-1]] = [a[size-1], a[0]];\n      sorted.push(size-1);\n      snap({ [size-1]:'new' }, `把堆顶 ${a[size-1]} 换到末尾位置 ${size-1}（它已归位）`);\n      size--;\n      sink(0, size, '调整堆');\n    }\n    sorted.push(0);\n    snap({}, '排序完成', sorted);\n  }\n  else if(algo === 'merge'){\n    snap({}, '初始序列（每个元素看作长度 1 的有序段）', []);\n    let width = 1;\n    while(width < a.length){\n      for(let lo=0; lo<a.length; lo += width*2){\n        const mid = Math.min(lo+width, a.length);\n        const hi = Math.min(lo+width*2, a.length);\n        if(mid >= hi) continue;\n        const left = a.slice(lo, mid), right = a.slice(mid, hi);\n        let i2 = 0, j2 = 0, k = lo;\n        while(i2 < left.length && j2 < right.length) a[k++] = left[i2] <= right[j2] ? left[i2++] : right[j2++];\n        while(i2 < left.length) a[k++] = left[i2++];\n        while(j2 < right.length) a[k++] = right[j2++];\n        snap({}, `合并 [${lo},${mid}) 与 [${mid},${hi}) → 得到长度 ${hi-lo} 的有序段`);\n      }\n      snap({}, `本轮结束：有序段长度变为 ${width*2}`);\n      width *= 2;\n    }\n    snap({}, '排序完成', a.map((_,i)=>i));\n  }\n  else if(algo === 'radix'){\n    snap({}, '基数排序：按位从低到高，分配 + 收集', []);\n    const max = Math.max.apply(null, a.map(x=>Math.abs(x)));\n    let exp = 1;\n    while(Math.floor(max/exp) > 0){\n      const buckets = Array.from({length:10}, ()=>[]);\n      a.forEach(v=>buckets[Math.floor(v/exp)%10].push(v));\n      snap({}, `按${exp===1?'个':(exp===10?'十':(exp===100?'百':'更高'))}位分配：${buckets.map((b,i)=>b.length?`${i}→[${b.join(',')}]`:'').filter(Boolean).join('  ')}`);\n      a.length = 0;\n      buckets.forEach(b=>b.forEach(v=>a.push(v)));\n      snap({}, `收集完成，当前序列：${a.join(', ')}`);\n      exp *= 10;\n    }\n    snap({}, '排序完成', a.map((_,i)=>i));\n  }\n  return steps;\n}\nlet SO_STEPS = [], soIdx = 0, soTimer = null;\nfunction soRender(){\n  const algo = $('soAlgo').value;\n  if(!SO_STEPS.length) return;\n  const st = SO_STEPS[Math.min(soIdx, SO_STEPS.length-1)];\n  const maxV = Math.max.apply(null, st.arr.map(x=>Math.abs(x))) || 1;\n  const bars = st.arr.map((v,i)=>{\n    const cls = st.hl[i] || (st.sorted.indexOf(i) >= 0 ? 'done' : '');\n    const hgt = Math.max(14, Math.abs(v) / maxV * 110);\n    const bg = cls === 'act' ? 'var(--primary)' : cls === 'cmp' ? 'var(--accent)' : cls === 'new' ? 'var(--green)' : cls === 'done' ? '#c4b0f5' : '#bcb6cc';\n    return `<div style=\"display:flex;flex-direction:column;align-items:center;gap:5px;min-width:34px\">\n      <span style=\"font-size:11px;font-weight:700;color:#5c5773;font-family:Consolas,monospace\">${v}<\/span>\n      <div style=\"width:30px;height:${hgt}px;border-radius:6px 6px 3px 3px;background:${bg};transition:.28s\"><\/div>\n    <\/div>`;\n  }).join('');\n  const c = SO_CMPLX[algo];\n  $('soStage').innerHTML =\n    `<div style=\"display:flex;gap:6px;align-items:flex-end;justify-content:center;flex-wrap:wrap;\n      padding:16px 10px 4px;background:#f8f7fc;border:1px solid var(--line);border-radius:10px;min-height:170px\">${bars}<\/div>\n     <div style=\"margin-top:12px;font-size:12.8px;color:#4b5665;line-height:1.9\">\n       <b>第 ${soIdx+1} / ${SO_STEPS.length} 步：<\/b>${st.note}\n     <\/div>\n     <div class=\"legend\" style=\"margin-top:10px\">\n       <span><i style=\"background:#7c3aed\"><\/i>当前操作<\/span>\n       <span><i style=\"background:#d97706\"><\/i>被比较<\/span>\n       <span><i style=\"background:#15803d\"><\/i>刚归位<\/span>\n       <span><i style=\"background:#c4b0f5\"><\/i>已确定最终位置<\/span>\n     <\/div>`;\n  const dd = SO_DESC[algo];\n  $('soOut').innerHTML =\n    `<div class=\"res\">\n      <div class=\"r\"><span class=\"lbl\">算法<\/span><span class=\"val\">${SO_NAME[algo]}<\/span><\/div>\n      <div class=\"r\" style=\"margin-top:6px\"><span class=\"lbl\">复杂度<\/span><span style=\"font-size:13px\">\n        平均 ${c[0]}　·　最好 ${c[1]}　·　最坏 ${c[2]}　·　空间 ${c[3]}　·　<b style=\"color:${c[4]==='稳定'?'#15803d':'#dc2626'}\">${c[4]}<\/b><\/span><\/div>\n    <\/div>\n    <div class=\"tip i\" style=\"margin-top:10px\"><span class=\"ti\">怎么排的<\/span><span>${dd[0]}<\/span><\/div>\n    <div class=\"tip s\" style=\"margin-top:6px\"><span class=\"ti\">记住这一点<\/span><span>${dd[1]}<\/span><\/div>`;\n}\nfunction soBuild(){\n  const arr = soParse();\n  if(!arr.length){ $('soStage').innerHTML = '<div class=\"tip m\"><span class=\"ti\">提示<\/span><span>请输入待排序的序列，用逗号分隔。<\/span><\/div>'; $('soOut').innerHTML=''; return false; }\n  SO_STEPS = sortSteps(arr, $('soAlgo').value);\n  soIdx = 0;\n  soRender();\n  return true;\n}\n$('soPlay').onclick = ()=>{\n  clearInterval(soTimer);\n  if(!soBuild()) return;\n  soTimer = setInterval(()=>{\n    if(soIdx < SO_STEPS.length-1){ soIdx++; soRender(); }\n    else { clearInterval(soTimer); soTimer = null; }\n  }, 620);\n};\n$('soNext').onclick = ()=>{ clearInterval(soTimer); soTimer = null; if(soIdx < SO_STEPS.length-1){ soIdx++; soRender(); } };\n$('soReset').onclick = ()=>{ clearInterval(soTimer); soTimer = null; soBuild(); };\n$('soAlgo').onchange = ()=>{ clearInterval(soTimer); soTimer = null; soBuild(); };\n$('soData').oninput = ()=>{ clearInterval(soTimer); soTimer = null; soBuild(); };\nqsa('[data-so]').forEach(b=>b.onclick = ()=>{ $('soData').value = b.dataset.so; clearInterval(soTimer); soTimer = null; soBuild(); });\nsoBuild();\n<\/script>\n<script>\n/* 打包桥接：见 build_四门课合集.py 的说明 */\n(function(){\n  document.addEventListener(\"click\", function(e){\n    var a = e.target && e.target.closest ? e.target.closest(\"a[href]\") : null;\n    if(!a) return;\n    var href = a.getAttribute(\"href\") || \"\";\n    if(href.charAt(0) === \"#\"){\n      var t = document.getElementById(href.slice(1));\n      if(t){ e.preventDefault(); t.scrollIntoView({ block: \"start\" }); }\n      return;\n    }\n    if(!/\\.html$/i.test(href)) return;\n    e.preventDefault();\n    try { parent.postMessage({ __pack: \"goto\", page: href }, \"*\"); } c
