====================== */\nconst AP_STEPS = [\n  { t:'① A 要发数据给 192.168.1.20，但不知道它的 MAC', mode:'none',\n    note:'主机 A（192.168.1.10）要发一个 IP 分组给 192.168.1.20。<b>IP 分组最终必须装进帧里才能上线，而帧需要目的 MAC 地址。<\/b><br>A 先查自己的 ARP 缓存 —— 没有 192.168.1.20 的记录，只能发起解析。' },\n  { t:'② A 广播 ARP 请求：谁是 192.168.1.20？', mode:'bcast',\n    note:'ARP 请求帧的<b>目的 MAC 填全 F（FF-FF-FF-FF-FF-FF），这就是广播<\/b>；但目的 IP 字段里填的是<b>具体的<\/b> 192.168.1.20。<br>同一局域网内的<b>所有主机都会收到<\/b>这个请求 —— 这是 A 在「广而告之」。' },\n  { t:'③ 只有 192.168.1.20 认领：IP 是我', mode:'recv',\n    note:'B、C、网关都收到了这个广播，但只有 <b>192.168.1.20 发现目的 IP 和自己一致<\/b>，于是准备应答。<br>其余主机（.30、网关）看不是自己的就<b>直接丢弃<\/b>，不作任何回应。' },\n  { t:'④ 192.168.1.20 单播应答：我的 MAC 是 0A-1B-2C-3D-4E-5F', mode:'unicast',\n    note:'应答是<b>单播<\/b> —— 因为它已经知道 A 的 MAC 了（从请求帧的源 MAC 字段里读到的）。<br>「<b>请求用广播、应答用单播<\/b>」是 ARP 最经典的考点，也是常考的细节题。' },\n  { t:'⑤ A 写入 ARP 缓存，现在可以发帧了', mode:'cache',\n    note:'A 把「192.168.1.20 → 0A-1B-2C-3D-4E-5F」写进 ARP 缓存（有老化时间，通常几分钟），然后就能把 IP 分组封装成帧发出去了。<br><b>补充考点：<\/b>如果目标 IP <b>不在同一网段<\/b>，A 解析的是<b>默认网关<\/b>的 MAC —— 因为它必须先把帧发给网关，让网关帮忙转出去。' }\n];\nlet AP_i = 0, AP_timer = null;\nfunction apSvg(s){\n  const W = 640, H = 258, y = 92;\n  const hosts = [\n    { x:96,  ip:'192.168.1.10', mac:'…0A', name:'A（发起方）', self:true },\n    { x:288, ip:'192.168.1.20', mac:'…5F', name:'B（目标）', tgt:true },\n    { x:452, ip:'192.168.1.30', mac:'…73', name:'C', tgt:false },\n    { x:592, ip:'192.168.1.1',  mac:'…01', name:'网关', tgt:false }\n  ];\n  let g = '';\n  g += `<line x1=\"40\" y1=\"${y}\" x2=\"${W-16}\" y2=\"${y}\" stroke=\"#ded8cf\" stroke-width=\"6\" stroke-linecap=\"round\"/>`;\n  g += `<text x=\"${W/2}\" y=\"${y-58}\" text-anchor=\"middle\" font-size=\"11\" fill=\"#b0a89b\">同一个局域网（广播能到达所有主机）<\/text>`;\n  hosts.forEach(h=>{\n    const hi = (s.mode === 'recv' && h.tgt) || (s.mode === 'unicast' && h.self) || (s.mode === 'cache' && h.self);\n    const dim = (s.mode === 'recv' && !h.tgt && !h.self) || (s.mode === 'unicast' && !h.self) || (s.mode === 'bcast' && !h.self);\n    const stroke = hi ? '#15803d' : (dim ? '#e8e4de' : '#ded8cf');\n    const fill   = hi ? '#e8f6ec' : (dim ? '#faf8f5' : '#fff');\n    g += `<rect x=\"${h.x-46}\" y=\"${y+8}\" width=\"92\" height=\"52\" rx=\"9\" fill=\"${fill}\" stroke=\"${stroke}\" stroke-width=\"2\"/>`;\n    g += `<text x=\"${h.x}\" y=\"${y+26}\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"800\" fill=\"${dim ? '#c8c2b8' : '#2b3542'}\">${h.ip}<\/text>`;\n    g += `<text x=\"${h.x}\" y=\"${y+42}\" text-anchor=\"middle\" font-size=\"10\" fill=\"#b0a89b\">MAC ${h.mac}<\/text>`;\n    g += `<text x=\"${h.x}\" y=\"${y+78}\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"${dim ? '#c8c2b8' : '#7d7890'}\">${h.name}<\/text>`;\n  });\n  const arrow = (x1, x2, yy, color, txt) => `\n    <line x1=\"${x1}\" y1=\"${yy}\" x2=\"${x2}\" y2=\"${yy}\" stroke=\"${color}\" stroke-width=\"2\" marker-end=\"url(#ah${color === '#dc2626' ? 'r' : color === '#15803d' ? 'g' : 'o'})\"/>\n    <text x=\"${(x1+x2)/2}\" y=\"${yy-6}\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"${color}\">${txt}<\/text>`;\n  g += `<defs>\n    <marker id=\"ahor\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 z\" fill=\"#d97706\"/><\/marker>\n    <marker id=\"ahr\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 z\" fill=\"#dc2626\"/><\/marker>\n    <marker id=\"ahg\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 z\" fill=\"#15803d\"/><\/marker>\n  <\/defs>`;\n  if(s.mode === 'bcast'){\n    g += arrow(150, 540, y - 30, '#dc2626', '广播 ARP 请求：谁是 192.168.1.20？');\n  }\n  if(s.mode === 'recv'){\n    g += arrow(150, 540, y - 30, '#dc2626', '广播 ARP 请求（所有主机都收到了）');\n  }\n  if(s.mode === 'unicast'){\n    g += arrow(244, 148, y - 30, '#15803d', '单播应答：我是，MAC = …5F');\n  }\n  if(s.mode === 'cache'){\n    g += `<rect x=\"${30}\" y=\"${y+96}\" width=\"290\" height=\"60\" rx=\"9\" fill=\"#fff4e3\" stroke=\"#d97706\"/>`;\n    g += `<text x=\"44\" y=\"${y+116}\" font-size=\"11.5\" font-weight=\"800\" fill=\"#8a5209\">A 的 ARP 缓存<\/text>`;\n    g += `<text x=\"44\" y=\"${y+136}\" font-size=\"11\" font-family=\"Consolas,monospace\" fill=\"#403a55\">192.168.1.20 → 0A-1B-2C-3D-4E-5F<\/text>`;\n    g += `<text x=\"44\" y=\"${y+152}\" font-size=\"10\" fill=\"#a49db8\">（带老化时间，几分钟后失效）<\/text>`;\n  } else {\n    g += `<rect x=\"${30}\" y=\"${y+96}\" width=\"290\" height=\"60\" rx=\"9\" fill=\"#fbf8f4\" stroke=\"#ded8cf\" stroke-dasharray=\"4 3\"/>`;\n    g += `<text x=\"44\" y=\"${y+116}\" font-size=\"11.5\" font-weight=\"800\" fill=\"#b0a89b\">A 的 ARP 缓存<\/text>`;\n    g += `<text x=\"44\" y=\"${y+136}\" font-size=\"11\" fill=\"#c8c2b8\">（空 —— 没有 192.168.1.20 的记录）<\/text>`;\n  }\n  return `<div class=\"stage\"><svg viewBox=\"0 0 ${W} ${H}\">${g}<\/svg><\/div>\n  <div class=\"legend\">\n    <span><i style=\"background:#dc2626\"><\/i>ARP 请求（广播，目的 MAC 全 F）<\/span>\n    <span><i style=\"background:#15803d\"><\/i>ARP 应答（单播）<\/span>\n    <span><i style=\"background:#e8f6ec;border:1px solid #15803d\"><\/i>本次参与的主机<\/span>\n    <span><i style=\"background:#faf8f5;border:1px solid #e8e4de\"><\/i>收到但直接丢弃的主机<\/span>\n  <\/div>`;\n}\nfunction apRender(){\n  const s = AP_STEPS[AP_i];\n  $('apStage').innerHTML = apSvg(s);\n  $('apOut').innerHTML = stepNote(s.t, s.note) +\n    `<div class=\"hint\">第 ${AP_i + 1} / ${AP_STEPS.length} 步 · 点「下一步」继续<\/div>`;\n}\nfunction apStop(){ if(AP_timer){ clearInterval(AP_timer); AP_timer = null; } }\n$('apPlay').onclick = ()=>{\n  apStop(); AP_i = 0; apRender();\n  AP_timer = setInterval(()=>{\n    if(AP_i >= AP_STEPS.length - 1){ apStop(); return; }\n    AP_i++; apRender();\n  }, 1100);\n};\n$('apStep').onclick = ()=>{ apStop(); if(AP_i < AP_STEPS.length - 1){ AP_i++; apRender(); } };\n$('apReset').onclick = ()=>{ apStop(); AP_i = 0; apRender(); };\napRender();\n/* ============================================================\n   动画 09 · IP 分片与重组\n   ============================================================ */\nconst FR_HEAD = 20;\nfunction renderFr(){\n  const len = Math.round(numVal('frLen', 4000, 20, 65535, 1));\n  const mtu = Math.round(numVal('frMtu', 1500, 20, 65535, 1));\n  const df  = ($('frDF').value === '1');\n  const dl  = len - FR_HEAD;\n  const pkt = (fields) => `<div class=\"pkt\">${fields.map(f=>\n    `<div class=\"pf ${f.c || ''}\"><span class=\"pn\">${f.n}<\/span><span class=\"pv\">${f.v}<\/span><\/div>`).join('')}<\/div>`;\n\n  const src = pkt([\n    { n:'IP 首部', v:FR_HEAD + ' B', c:'act' },\n    { n:'数据部分', v:dl + ' B' },\n    { n:'总长度', v:len + ' B' }\n  ]);\n\n  let body = '';\n  if(dl <= 0){\n    body = `<div class=\"pkt\"><div class=\"pf drop\"><span class=\"pn\">数据长度 ≤ 0<\/span><span class=\"pv\">${dl}<\/span><\/div><\/div>`;\n  } else if(len <= mtu){\n    body = pkt([\n      { n:'无需分片', v:'单帧发出', c:'new' },\n      { n:'总长度', v:len + ' B' },\n      { n:'MF', v:'0' },\n      { n:'片偏移', v:'0' }\n    ]);\n  } else if(df){\n    body = pkt([\n      { n:'DF = 1 且总长 > MTU', v:'丢弃', c:'drop' },\n      { n:'并回送 ICMP 差错', v:'需要分片但 DF=1', c:'new' }\n    ]);\n  } else {\n    const maxPay = Math.floor((mtu - FR_HEAD) / 8) * 8;\n    if(maxPay <= 0){\n      body = `<div class=\"pkt\"><div class=\"pf drop\"><span class=\"pn\">MTU 过小<\/span><span class=\"pv\">装不下首部<\/span><\/div><\/div>`;\n    } else {\n      const parts = [];\n      let off = 0;\n      while(off < dl){\n        const d = Math.min(maxPay, dl - off);\n        parts.push({ off, d });\n        off += d;\n      }\n      body = parts.map((p, i)=>{\n        const last = (i === parts.length - 1);\n        return `<div style=\"margin-bottom:12px\">\n          <div class=\"cap\" style=\"font-size:11.5px;font-weight:800;color:var(--muted);margin-bottom:5px\">片 ${i+1}${last ? '（最后一片）' : ''}<\/div>\n          ${pkt([\n            { n:'总长度', v:(p.d + FR_HEAD) + ' B', c:'act' },\n            { n:'数据长度', v:p.d + ' B', c: last ? '' : 'new' },\n            { n:'片偏移', v:(p.off / 8) + '', c:'new' },\n            { n:'MF', v: last ? '0' : '1', c: last ? '' : 'new' },\n            { n:'分片后数据范围', v:`第 ${p.off + 1} ~ ${p.off + p.d} 字节` }\n          ])}<\/div>`;\n      }).join('');\n    }\n  }\n\n  $('frStage').innerHTML =\n    `<div class=\"cap\" style=\"font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.6px;margin-bottom:6px\">原始 IP 数据报<\/div>\n     ${src}\n     <div class=\"cap\" style=\"font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.6px;margin:16px 0 6px\">经过 MTU = ${mtu} B 的链路之后<\/div>\n     ${body}`;\n\n  let concl;\n  if(dl <= 0) concl = '数据部分长度不为正，请把「数据报总长」调到大于 20。';\n  else if(len <= mtu) concl = `总长度 ${len} B ≤ MTU ${mtu} B，<b>不需要分片<\/b>，原样发送。`;\n  else if(df) concl = `<b>DF = 1 表示\"禁止分片\"。<\/b>总长 ${len} B 超过了 MTU ${mtu} B，路由器<b>只能丢弃<\/b>，并用 ICMP 差错报文告诉源主机「需要分片但 DF 被置位」。<br><b>这正是路径 MTU 发现的原理<\/b> —— 源主机收到这个差错后，下次就把报文改小。`;\n  else {\n    const maxPay = Math.floor((mtu - FR_HEAD) / 8) * 8;\n    const n = Math.ceil(dl / maxPay);\n    concl = `每片数据上限 = MTU − 首部 = ${mtu} − ${FR_HEAD} = ${mtu - FR_HEAD} B，<b>向下取到 8 的倍数 = ${maxPay} B<\/b>（因为片偏移的单位就是 8 字节）。<br>\n      数据共 ${dl} B → 切成 <b>${n} 片<\/b>。最后一片往往不满，其余都是 ${maxPay} B。<br>\n      <b>重组只在目的主机进行<\/b> —— 中间路由器只管转发，不管重组。`;\n  }\n\n  $('frOut').innerHTML = stepNote('分片规则', concl +\n    `<div class=\"kv\" style=\"margin-top:10px\">\n      <span>首部固定 <b>${FR_HEAD} B<\/b><\/span>\n      <span>片偏移单位 <b>8 B<\/b><\/span>\n      <span>每片都<b>各带一个首部<\/b><\/span>\n      <span>重组在<b>目的主机<\/b>完成<\/span>\n    <\/div>`) +\n    `<div class=\"hint\">把总长度改成 <b>4000<\/b>、MTU 保持 <b>1500<\/b>，就是最经典的例题：3 片，总长 1500 / 1500 / 1040，偏移 0 / 185 / 370。自己先手算一遍再对照。<\/div>`;\n}\n['frLen','frMtu'].forEach(id=>{ $(id).oninput = renderFr; });\n$('frDF').onchange = renderFr;\nrenderFr();\n\n/* ============================================================\n   动画 10 · 子网划分 / CIDR 计算器\n   ============================================================ */\nfunction ipToInt(s){\n  const p = String(s == null ? '' : s).trim().split('.');\n  if(p.length !== 4) return null;\n  let n = 0;\n  for(let i=0;i<4;i++){\n    if(!/^\\d{1,3}$/.test(p[i])) return null;\n    const v = parseInt(p[i], 10);\n    if(v > 255) return null;\n    n = n * 256 + v;\n  }\n  return n >>> 0;\n}\nfunction intToIp(n){\n  n = n >>> 0;\n  return [(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255].join('.');\n}\nfunction bin32(n){\n  n = n >>> 0;\n  let s = '';\n  for(let i = 31; i >= 0; i--) s += ((n >>> i) & 1);\n  return s;\n}\nfunction ipClass(n){\n  const f = (n >>> 24) & 255;\n  if(f === 0) return '保留（0.0.0.0/8）';\n  if(f === 127) return '回环地址';\n  if(f < 128) return 'A 类（/8）';\n  if(f < 192) return 'B 类（/16）';\n  if(f < 224) return 'C 类（/24）';\n  if(f < 240) return 'D 类（组播）';\n  return 'E 类（保留）';\n}\nfunction isPriv(n){\n  const ip = n >>> 0;\n  if((ip >>> 24) === 10) return true;\n  if(ip >= ipToInt('172.16.0.0') && ip <= ipToInt('172.31.255.255')) return true;\n  if(ip >= ipToInt('192.168.0.0') && ip <= ipToInt('192.168.255.255')) return true;\n  return false;\n}\nfunction renderSn(){\n  const raw = $('snIp').value;\n  let ip = ipToInt(raw);\n  const bad = (ip === null);\n  if(bad) ip = ipToInt('192.168.10.130');\n  const pre = Math.round(numVal('snPre', 26, 0, 32, 1));\n  const mask = pre === 0 ? 0 : (0xFFFFFFFF << (32 - pre)) >>> 0;\n  const net = (ip & mask) >>> 0;\n  const bcast = (net | (~mask >>> 0)) >>> 0;\n  const first = ((net + 1) >>> 0);\n  const last  = ((bcast - 1) >>> 0);\n  const size  = Math.pow(2, 32 - pre);\n  const hosts = Math.max(0, size - 2);\n\n  const bIp = bin32(ip), bN = bin32(net), bM = bin32(mask);\n  const seg = (s, hi) => hi\n    ? `<span style=\"color:#d97706;font-weight:800\">${s.slice(0, pre)}<\/span><span style=\"color:#b0a89b\">${s.slice(pre)}<\/span>`\n    : `<span style=\"color:#403a55\">${s}<\/span>`;\n  const ruler = `<span style=\"color:#b0a89b\">${'·'.repeat(0)}<\/span>`;\n  const fmt4 = s => s.replace(/(.{8})(?=.)/g, '$1 ');\n\n  $('snStage').innerHTML =\n    `<div class=\"cap\" style=\"font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.6px;margin-bottom:6px\">32 位二进制对照（橙色 = 网络前缀 ${pre} 位，灰色 = 主机号 ${32 - pre} 位）<\/div>\n     <div class=\"mono\" style=\"font-size:13px;letter-spacing:.8px;line-height:2.1;background:#fbf8f4;border:1px solid var(--line);border-radius:9px;padding:11px 14px;overflow-x:auto\">\n       <div>IP  &nbsp;${seg(bIp)}&nbsp;&nbsp;<span style=\"color:#b0a89b\">${fmt4(bIp)}<\/span><\/div>\n       <div>掩码&nbsp;${seg(bM)}&nbsp;&nbsp;<span style=\"color:#b0a89b\">${fmt4(bM)}<\/span><\/div>\n       <div style=\"border-top:1px dashed #e8e4de;margin-top:5px;padding-top:5px\">网络&nbsp;${seg(bN)}&nbsp;&nbsp;<span style=\"color:#b0a89b\">${fmt4(bN)}<\/span><\/div>\n     <\/div>\n     <div class=\"legend\">\n       <span><i style=\"background:#d97706\"><\/i>网络前缀（掩码为 1 的位）<\/span>\n       <span><i style=\"background:#b0a89b\"><\/i>主机号（掩码为 0 的位）<\/span>\n       <span>网络地址 = IP <b>按位与<\/b> 掩码（主机号位清零）<\/span>\n     <\/div>\n     <div class=\"res\" style=\"margin-top:14px\">\n       <div class=\"r\"><span class=\"lbl\">输入地址<\/span><span class=\"val\">${intToIp(ip)}<\/span><span style=\"font-size:12px;color:var(--muted)\">${ipClass(ip)}${isPriv(ip) ? ' · <b style=\"color:var(--primary)\">私有地址<\/b>' : ''}<\/span><\/div>\n       <div class=\"r\"><span class=\"lbl\">子网掩码<\/span><span class=\"val\">${intToIp(mask)}<\/span><span style=\"font-size:12px;color:var(--muted)\">/${pre}<\/span><\/div>\n       <div class=\"r\"><span class=\"lbl\">网络地址<\/span><span class=\"val\">${intToIp(net)}<\/span><span style=\"font-size:12px;color:var(--muted)\">主机号全 0，代表整个网络<\/span><\/div>\n       <div class=\"r\"><span class=\"lbl\">广播地址<\/span><span class=\"val\">${intToIp(bcast)}<\/span><span style=\"font-size:12px;color:var(--muted)\">主机号全 1<\/span><\/div>\n       <div class=\"r\"><span class=\"lbl\">可用地址范围<\/span><span class=\"val\">${hosts > 0 ? intToIp(first) + ' ~ ' + intToIp(last) : '无'}<\/span><\/div>\n       <div class=\"r\"><span class=\"lbl\">地址块大小<\/span><span class=\"val\">${fmtNum(size, 0)}<\/span><span style=\"font-size:12px;color:var(--muted)\">= 2^(32−${pre})<\/span><\/div>\n       <div class=\"r\"><span class=\"lbl\">可用主机数<\/span><span class=\"val\" style=\"font-size:16px\">${fmtNum(hosts, 0)}<\/span><span style=\"font-size:12px;color:var(--muted)\">= 块大小 − 2（减掉网络地址和广播地址）<\/span><\/div>\n     <\/div>`;\n\n  const netSeg = Math.floor(net / size);\n  const k2 = pre + 2 <= 32 ? pre + 2 : pre;\n  const size2 = Math.pow(2, 32 - k2);\n  let subRows = '';\n  if(k2 > pre){\n    for(let k=0;k<4;k++){\n      const sn = (net + k * size2) >>> 0;\n      subRows += `<tr><td class=\"mono\">子网 ${k+1}<\/td><td class=\"mono\">${intToIp(sn)}/${k2}<\/td>\n        <td class=\"mono\">${intToIp(sn)} ~ ${intToIp((sn + size2 - 1) >>> 0)}<\/td>\n        <td class=\"mono\">${fmtNum(Math.max(0, size2 - 2), 0)}<\/td><\/tr>`;\n    }\n  }\n\n  $('snOut').innerHTML = stepNote('手算三步', \n    `<b>① 写掩码<\/b>：/${pre} 表示前 ${pre} 位是 1 —— 掩码就是 ${intToIp(mask)}。<br>\n     <b>② 求网络地址<\/b>：IP 和掩码<b>按位与<\/b>（等价于把主机号那 ${32 - pre} 位清零）→ ${intToIp(net)}。<br>\n     <b>③ 求广播地址<\/b>：网络地址把主机号那 ${32 - pre} 位全置 1 → ${intToIp(bcast)}。<br>\n     可用地址就是这两者<b>之间的部分<\/b>，共 <b>${fmtNum(hosts, 0)}<\/b> 个。` +\n    (subRows ? `<div style=\"margin-top:12px\"><b>按 /${k2} 再划 4 个子网（每个 ${fmtNum(Math.max(0, size2 - 2), 0)} 台可用）：<\/b><\/div>\n      <table class=\"tb\" style=\"margin-top:8px\"><tr><th>编号<\/th><th>网络地址<\/th><th>地址范围<\/th><th>可用主机<\/th><\/tr>${subRows}<\/table>` : '') +\n    `<div class=\"hint\">换几个地址练手：<b>10.0.0.5/8<\/b>、<b>172.16.33.7/20<\/b>、<b>192.168.200.60/27<\/b>。看二进制那行怎么变 ——\n       <b>子网划分就是把\"主机号的高位\"借过来当子网号用<\/b>。<\/div>`) +\n    (bad ? `<div class=\"tip e\"><span class=\"ti\">输入无效<\/span><span>「${String(raw)}」不是一个合法的 IPv4 地址，已按 192.168.10.130 计算。请按 a.b.c.d 的格式输入。<\/span><\/div>` : '');\n}\n$('snIp').oninput = renderSn;\n$('snPre').oninput = renderSn;\n$('snLs').onclick = ()=>{\n  const p = Math.round(numVal('snPre', 26, 0, 32, 1));\n  $('snPre').value = Math.min(32, p + 2);\n  renderSn();\n};\n$('snReset').onclick = ()=>{ $('snIp').value = '192.168.10.130'; $('snPre').value = 26; renderSn(); };\nrenderSn();\n/* ============================================================\n   动画 11 · TCP 三次握手 / 四次挥手\n   ============================================================ */\nconst HS_OPEN = [\n  { f:'init', msg:'双方都处于 CLOSED。客户端准备发起连接。',\n    c:'CLOSED', s:'LISTEN',\n    note:'服务器先调用 listen 进入 LISTEN 状态，等待连接请求。<b>此时双方还没有任何连接状态。<\/b>' },\n  { f:'c2s', txt:'SYN=1, seq=x', c:'SYN_SENT', s:'LISTEN',\n    note:'<b>第一次握手。<\/b>客户端发 SYN=1 请求建立连接，并给出自己的初始序号 x。<br><b>注意：SYN 报文段不能携带数据，但要消耗一个序号<\/b> —— 所以下一次客户端发的数据要从 x+1 开始。' },\n  { f:'s2c', txt:'SYN=1, ACK=1, seq=y, ack=x+1', c:'SYN_SENT', s:'SYN_RCVD',\n    note:'<b>第二次握手。<\/b>服务器同意连接：SYN=1 表示自己也要同步序号（初始序号 y），ACK=1 表示确认收到了对方的 SYN。<br><b>ack = x+1<\/b>：因为 SYN 占用了序号 x，所以期望对方下一个字节是 x+1。' },\n  { f:'c2s', txt:'ACK=1, seq=x+1, ack=y+1', c:'ESTABLISHED', s:'ESTABLISHED',\n    note:'<b>第三次握手。<\/b>客户端确认收到了服务器的 SYN。<b>这一步可以携带数据<\/b>（前两次都不行）。<br>双方都进入 <b>ESTABLISHED<\/b>，连接建立完成。' }\n];\nconst HS_CLOSE = [\n  { f:'init', msg:'双方处于 ESTABLISHED，数据传输已结束。',\n    c:'ESTABLISHED', s:'ESTABLISHED',\n    note:'连接是<b>全双工<\/b>的：两个方向各自独立。所以关闭时不能一次性关掉两边。' },\n  { f:'c2s', txt:'FIN=1, seq=u', c:'FIN_WAIT_1', s:'ESTABLISHED',\n    note:'<b>第一次挥手。<\/b>客户端说「<b>我没有数据要发了<\/b>」（注意：不是「我不能收了」）。<br>客户端进入 FIN_WAIT_1。<b>FIN 同样消耗一个序号。<\/b>' },\n  { f:'s2c', txt:'ACK=1, seq=v, ack=u+1', c:'FIN_WAIT_2', s:'CLOSE_WAIT',\n    note:'<b>第二次挥手。<\/b>服务器先确认收到 FIN，客户端进入 FIN_WAIT_2。<br>服务器进入 <b>CLOSE_WAIT<\/b> —— 这就是<b>半关闭<\/b>状态：客户不再发数据了，但<b>服务器可能还有数据要发<\/b>，客户端仍然要正常接收。' },\n  { f:'s2c', txt:'FIN=1, ACK=1, seq=w, ack=u+1', c:'FIN_WAIT_2', s:'LAST_ACK',\n    note:'<b>第三次挥手。<\/b>服务器终于也把数据发完了，于是发出自己的 FIN（seq=w）。<br><b>看清这里：ACK 和 FIN 是分开发的两个报文<\/b> —— 这就是「挥手要四次、握手只要三次」的根本原因。' },\n  { f:'c2s', txt:'ACK=1, seq=u+1, ack=w+1', c:'TIME_WAIT', s:'CLOSED',\n    note:'<b>第四次挥手。<\/b>客户端确认服务器的 FIN，服务器收到后直接进入 CLOSED。<br>但客户端<b>不立刻关闭，而是进入 TIME_WAIT<\/b>，要等 <b>2MSL<\/b>（最长报文段寿命的两倍）。' },\n  { f:'wait', msg:'客户端等 2MSL 之后才真正关闭', c:'CLOSED', s:'CLOSED',\n    note:'<b>为什么要等 2MSL？<\/b><br><b>①<\/b> 万一最后那个 ACK 在路上丢了，服务器会超时重传 FIN，客户端还在等就能再确认一次。如果客户端已经关了，服务器就永远等不到确认了。<br><b>②<\/b> 让本次连接产生的所有报文段都从网络中彻底消失，避免它们干扰下一次使用相同四元组的新连接。' }\n];\nfunction hsSteps(){ return ($('hsMode').value === 'close') ? HS_CLOSE : HS_OPEN; }\nlet HS_i = 0, HS_timer = null;\nfunction hsSvg(steps){\n  const W = 660, H = 60 + steps.length * 46 + 40;\n  const xc = 168, xs = 496, top = 62, gap = 46;\n  const yOf = k => top + k * gap;\n  let g = '';\n  g += `<line x1=\"${xc}\" y1=\"44\" x2=\"${xc}\" y2=\"${H-30}\" stroke=\"#ded8cf\" stroke-width=\"2\"/>`;\n  g += `<line x1=\"${xs}\" y1=\"44\" x2=\"${xs}\" y2=\"${H-30}\" stroke=\"#ded8cf\" stroke-width=\"2\"/>`;\n  g += `<rect x=\"${xc-62}\" y=\"8\" width=\"124\" height=\"30\" rx=\"8\" fill=\"#fff4e3\" stroke=\"#d97706\"/>`;\n  g += `<text x=\"${xc}\" y=\"28\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"800\" fill=\"#8a5209\">客户端<\/text>`;\n  g += `<rect x=\"${xs-62}\" y=\"8\" width=\"124\" height=\"30\" rx=\"8\" fill=\"#e0f5f2\" stroke=\"#0f766e\"/>`;\n  g += `<text x=\"${xs}\" y=\"28\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"800\" fill=\"#0a5f58\">服务器<\/text>`;\n  const arrow = (x1, x2, y, color, txt, up) => {\n    const id = color === '#15803d' ? 'hsg' : (color === '#7c3aed' ? 'hsp' : 'hso');\n    return `<line x1=\"${x1}\" y1=\"${y}\" x2=\"${x2}\" y2=\"${y}\" stroke=\"${color}\" stroke-width=\"2.2\" marker-end=\"url(#${id})\"/>\n      <text x=\"${(x1+x2)/2}\" y=\"${y + (up ? -8 : -8)}\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"${color}\">${txt}<\/text>`;\n  };\n  g += `<defs>\n    <marker id=\"hso\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L7,3 L0,6 z\" fill=\"#d97706\"/><\/marker>\n    <marker id=\"hsg\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L7,3 L0,6 z\" fill=\"#15803d\"/><\/marker>\n    <marker id=\"hsp\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L7,3 L0,6 z\" fill=\"#7c3aed\"/><\/marker>\n  <\/defs>`;\n  let done = 0;\n  steps.forEach((s, k)=>{\n    const y = yOf(k);\n    if(s.f === 'c2s'){\n      const col = /FIN/.test(s.txt) ? '#dc2626' : '#d97706';\n      g += arrow(xc + 6, xs - 8, y, col, s.txt);\n      done = k;\n    } else if(s.f === 's2c'){\n      const col = /SYN=1, ACK=1, seq=y/.test(s.txt) ? '#7c3aed' : (/ACK=1, seq=v/.test(s.txt) ? '#15803d' : '#dc2626');\n      g += arrow(xs - 6, xc + 8, y, col, s.txt);\n      done = k;\n    } else if(s.f === 'init'){\n      g += `<text x=\"${W/2}\" y=\"${y+4}\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#a49db8\">${s.msg}<\/text>`;\n    } else if(s.f === 'wait'){\n      g += `<rect x=\"${xc-96}\" y=\"${y-18}\" width=\"192\" height=\"34\" rx=\"8\" fill=\"#fdeceb\" stroke=\"#dc2626\"/>`;\n      g += `<text x=\"${xc}\" y=\"${y+4}\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"800\" fill=\"#8d2020\">TIME_WAIT · 等 2MSL<\/text>`;\n    }\n  });\n  const cur = steps[done];\n  g += `<text x=\"${28}\" y=\"${yOf(done)+4}\" font-size=\"11\" font-weight=\"700\" fill=\"#8a5209\">${cur.c}<\/text>`;\n  g += `<text x=\"${W-28}\" y=\"${yOf(done)+4}\" text-anchor=\"end\" font-size=\"11\" font-weight=\"700\" fill=\"#0a5f58\">${cur.s}<\/text>`;\n  return `<div class=\"stage\"><svg viewBox=\"0 0 ${W} ${H}\">${g}<\/svg><\/div>\n  <div class=\"legend\">\n    <span><i style=\"background:#d97706\"><\/i>客户端发出<\/span>\n    <span><i style=\"background:#7c3aed\"><\/i>服务器发出的 SYN+ACK<\/span>\n    <span><i style=\"background:#15803d\"><\/i>纯 ACK 确认<\/span>\n    <span><i style=\"background:#dc2626\"><\/i>FIN（结束报文）<\/span>\n    <span>两端文字 = 各自当前状态<\/span>\n  <\/div>`;\n}\nfunction hsRender(){\n  const steps = hsSteps();\n  const idx = Math.min(HS_i, steps.length - 1);\n  const shown = steps.slice(0, idx + 1);\n  $('hsStage').innerHTML = hsSvg(shown);\n  const s = steps[idx];\n  $('hsOut').innerHTML = stepNote(s.f === 'init' ? '初始状态' : s.f === 'wait' ? '等待 2MSL' : '报文交互',\n    s.note) + `<div class=\"hint\">第 ${idx + 1} / ${steps.length} 步 · 切换下拉框可看另一种过程<\/div>`;\n}\nfunction hsStop(){ if(HS_timer){ clearInterval(HS_timer); HS_timer = null; } }\n$('hsPlay').onclick = ()=>{\n  hsStop(); HS_i = 0; hsRender();\n  HS_timer = setInterval(()=>{\n    if(HS_i >= hsSteps().length - 1){ hsStop(); return; }\n    HS_i++; hsRender();\n  }, 1200);\n};\n$('hsStep').onclick = ()=>{ hsStop(); if(HS_i < hsSteps().length - 1){ HS_i++; hsRender(); } };\n$('hsReset').onclick = ()=>{ hsStop(); HS_i = 0; hsRender(); };\n$('hsMode').onchange = ()=>{ hsStop(); HS_i = 0; hsRender(); };\nhsRender();\n\n/* ============================================================\n   动画 12 · TCP 滑动窗口\n   ============================================================ */\nconst SW_N = 12;\nfunction swBuild(){\n  const W = Math.round(numVal('swSize', 4, 1, 8, 1));\n  const lost = Math.round(numVal('swLost', 3, 1, SW_N, 1));\n  const sr = ($('swMode').value === 'sr');\n  const ev = [];\n  let base = 1;\n  let guard = 0;\n  while(base <= SW_N && guard++ < 30){\n    const winEnd = Math.min(SW_N, base + W - 1);\n    ev.push({ k:'send', from:base, to:winEnd, base, winEnd, lost,\n      t:`发送窗口 [${base} ~ ${winEnd}] —— 把这 ${winEnd - base + 1} 个报文段全部发出，然后等确认。` });\n    if(lost >= base && lost <= winEnd){\n      if(sr){\n        if(lost > base) ev.push({ k:'ack', upto:lost - 1, base, winEnd, lost,\n          t:`收到 ${lost - 1} 号及之前的确认。<b>${lost} 号丢失<\/b>，但后面的 ${lost + 1}~${winEnd} 号<b>被接收方缓存了下来<\/b>（SR 的接收窗口 > 1）。` });\n        ev.push({ k:'bad', base, winEnd, lost,\n          t:`<b>${lost} 号超时。<\/b>因为后面几个已经被缓存，接收方也明确告诉过它\"我缺 ${lost} 号\" —— 所以<b>只需重传 ${lost} 号这一个<\/b>。` });\n        ev.push({ k:'retx', from:lost, to:lost, base, winEnd, lost,\n          t:`重传 ${lost} 号。收到后接收方把缓存里的一起按序交给上层，窗口一次性右移。` });\n      } else {\n        if(lost > base) ev.push({ k:'ack', upto:lost - 1, base, winEnd, lost,\n          t:`收到累积确认 <b>ack = ${lost}<\/b>（表示 ${lost - 1} 号及之前都收到了）。<b>窗口只能停在 ${lost}<\/b>，后面的全部作废。` });\n        ev.push({ k:'bad', base, winEnd, lost,\n          t:`<b>${lost} 号超时。<\/b>GBN 的接收窗口只有 1，<b>乱序到达的帧一律丢弃<\/b> —— 所以 ${lost + 1}~${winEnd} 号虽然发过，但接收方根本没留。` });\n        ev.push({ k:'retx', from:lost, to:winEnd, base, winEnd, lost,\n          t:`<b>重传 ${lost} 号以及它之后的全部 ${winEnd - lost + 1} 个报文段<\/b> —— 这就是「后退 N 帧」名字的由来，代价明显更大。` });\n      }\n      ev.push({ k:'ack', upto:winEnd, base, winEnd, lost,\n        t:`${winEnd} 号全部确认。窗口右移到 [${winEnd + 1} ~ ${Math.min(SW_N, winEnd + W)}]。` });\n      base = winEnd + 1;\n    } else {\n      ev.push({ k:'ack', upto:winEnd, base, winEnd, lost,\n        t:`${base} ~ ${winEnd} 号全部按序到达并确认，窗口整体右移。` });\n      base = winEnd + 1;\n    }\n  }\n  return { ev, W, lost, sr };\n}\nlet SW_i = 0, SW_timer = null;\nfunction swRender(){\n  const { ev, W, lost, sr } = swBuild();\n  const idx = Math.min(SW_i, ev.length - 1);\n  const st = new Array(SW_N + 1).fill('idle');\n  let curWin = null;\n  for(let k = 0; k <= idx; k++){\n    const e = ev[k];\n    curWin = { base:e.base, winEnd:e.winEnd };\n    if(e.k === 'send') for(let i=e.from;i<=e.to;i++) if(st[i] === 'idle') st[i] = 'tx';\n    if(e.k === 'ack')  for(let i=1;i<=e.upto;i++) st[i] = 'ok';\n    if(e.k === 'bad')  st[e.lost] = 'bad';\n    if(e.k === 'retx') for(let i=e.from;i<=e.to;i++) st[i] = 'tx2';\n  }\n  const clsOf = { idle:'', tx:'tx', tx2:'on', bad:'bad', ok:'ok' };\n  const titleOf = { idle:'未发送', tx:'已发送·等确认', tx2:'重传中', bad:'丢失', ok:'已确认' };\n\n  const cells = [];\n  for(let i=1;i<=SW_N;i++){\n    const inWin = curWin && i >= curWin.base && i <= curWin.winEnd;\n    cells.push(`<span class=\"bit ${clsOf[st[i]]}\" style=\"${inWin ? 'box-shadow:0 0 0 2px #d97706;z-index:2' : ''}\">${i}<\/span>`);\n  }\n  const nums = [];\n  for(let i=1;i<=SW_N;i++) nums.push(`<span style=\"width:26px;text-align:center;font-size:10px;color:#b0a89b;margin-left:-1px;display:inline-block\">${st[i] === 'idle' ? '' : titleOf[st[i]]}<\/span>`);\n\n  const logs = ev.slice(Math.max(0, idx - 3), idx + 1).map((e, k2)=>\n    `<span class=\"lg ${k2 === Math.min(3, idx) ? 'ok' : 'mut'}\">第 ${Math.max(1, idx - 3) + k2 + 1} 步 · ${e.t.replace(/<[^>]+>/g, '')}<\/span>`).join('');\n\n  $('swStage').innerHTML =\n    `<div class=\"kv\">\n      <span>窗口大小 W = <b>${W}<\/b><\/span>\n      <span>要传 <b>${SW_N}<\/b> 个报文段<\/span>\n      <span>第 <b>${lost}<\/b> 号丢失<\/span>\n      <span>策略 <b>${sr ? '选择重传 SR' : '后退 N 帧 GBN'}<\/b><\/span>\n     <\/div>\n     <div class=\"cap\" style=\"font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.6px;margin:14px 0 6px\">报文段序号（橙色描边 = 当前发送窗口）<\/div>\n     <div class=\"bits\">${cells.join('')}<\/div>\n     <div style=\"display:flex;margin-top:4px\">${nums.join('')}<\/div>\n     <div class=\"legend\">\n       <span><i style=\"background:#fff;border:1px solid #ded8cf\"><\/i>未发送<\/span>\n       <span><i style=\"background:#fff4e3;border:1px solid #d97706\"><\/i>已发送·等待确认<\/span>\n       <span><i style=\"background:#d97706;border:1px solid #d97706\"><\/i>重传中<\/span>\n       <span><i style=\"background:#fdeceb;border:1px solid #dc2626\"><\/i>丢失<\/span>\n       <span><i style=\"background:#e8f6ec;border:1px solid #15803d\"><\/i>已确认<\/span>\n     <\/div>\n     <div class=\"logbox\" style=\"margin-top:14px\">${logs}<\/div>`;\n\n  const e = ev[idx];\n  $('swOut').innerHTML = stepNote(`第 ${idx + 1} / ${ev.length} 步`, e.t) +\n    `<div class=\"hint\">把「策略」在 GBN 和 SR 之间来回切换，<b>重点看丢包之后重传范围有什么不同<\/b> —— 这就是两者的全部区别。\n     <br>另外注意：<b>窗口右移的条件是「窗口内最左边那个已被确认」<\/b>，不是\"收到任意一个确认\"。<\/div>`;\n}\nfunction swStop(){ if(SW_timer){ clearInterval(SW_timer); SW_timer = null; } }\n$('swRun').onclick = ()=>{\n  swStop(); SW_i = 0; swRender();\n  SW_timer = setInterval(()=>{\n    if(SW_i >= swBuild().ev.length - 1){ swStop(); return; }\n    SW_i++; swRender();\n  }, 1100);\n};\n$('swStep').onclick = ()=>{ swStop(); if(SW_i < swBuild().ev.length - 1){ SW_i++; swRender(); } };\n$('swReset').onclick = ()=>{ swStop(); SW_i = 0; swRender(); };\n['swSize','swLost'].forEach(id=>{ $(id).oninput = ()=>{ swStop(); SW_i = 0; swRender(); }; });\n$('swMode').onchange = ()=>{ swStop(); SW_i = 0; swRender(); };\nswRender();\n/* ============================================================\n   动画 13 · TCP 拥塞控制曲线\n   ============================================================ */\nfunction ccBuild(){\n  const th0 = Math.round(numVal('ccTh', 16, 2, 64, 1));\n  const ev = $('ccEv').value || 'to';\n  const toR = ev === 'to' ? 12 : (ev === 'both' ? 10 : -1);\n  const a3R = ev === 'ack3' ? 12 : (ev === 'both' ? 16 : -1);\n  const pts = [];\n  let cwnd = 1, th = th0, phase = 'slow';\n  for(let r = 1; r <= 22; r++){\n    if(r === toR){\n      const old = cwnd;\n      th = Math.max(2, Math.floor(cwnd / 2));\n      pts.push({ r, cwnd, th, phase: 'slow', mark: '超时', old });\n      cwnd = 1; phase = 'slow';\n      continue;\n    }\n    if(r === a3R){\n      const old = cwnd;\n      th = Math.max(2, Math.floor(cwnd / 2));\n      pts.push({ r, cwnd, th, phase: 'avoid', mark: '3个ACK', old });\n      cwnd = th; phase = 'avoid';\n      continue;\n    }\n    pts.push({ r, cwnd, th, phase, mark: '' });\n    if(phase === 'slow'){\n      cwnd = cwnd * 2;\n      if(cwnd >= th){ cwnd = th; phase = 'avoid'; }\n    } else cwnd += 1;\n  }\n  return { pts, th0, toR, a3R, ev };\n}\nfunction renderCc(){\n  const { pts, th0, toR, a3R, ev } = ccBuild();\n  const W = 660, H = 250, PL = 56, PR = 24, PT = 26, PB = 42;\n  const maxY = Math.max(th0, ...pts.map(p=>p.cwnd)) * 1.15;\n  const X = r => PL + (r - 1) / 21 * (W - PL - PR);\n  const Y = v => H - PB - v / maxY * (H - PB - PT);\n\n  let grid = '';\n  for(let v = 0; v <= maxY; v += Math.max(4, Math.round(maxY / 6 / 4) * 4)){\n    if(v > maxY) break;\n    grid += `<line x1=\"${PL}\" y1=\"${Y(v)}\" x2=\"${W-PR}\" y2=\"${Y(v)}\" stroke=\"#eeecf5\"/>\n             <text x=\"${PL-8}\" y=\"${Y(v)+4}\" text-anchor=\"end\" font-size=\"10\" fill=\"#a49db8\">${v}<\/text>`;\n  }\n  for(let r = 1; r <= 22; r += 2){\n    grid += `<text x=\"${X(r)}\" y=\"${H-PB+18}\" text-anchor=\"middle\" font-size=\"10\" fill=\"#a49db8\">${r}<\/text>`;\n  }\n  let line = '', dots = '', marks = '';\n  pts.forEach((p, i)=>{\n    const x = X(p.r), y = Y(p.cwnd);\n    line += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';\n    const c = p.mark ? '#dc2626' : (p.phase === 'slow' ? '#d97706' : '#0891b2');\n    dots += `<circle cx=\"${x.toFixed(1)}\" cy=\"${y.toFixed(1)}\" r=\"${p.mark ? 5 : 3.2}\" fill=\"${c}\"/>`;\n    if(p.mark){\n      marks += `<line x1=\"${x.toFixed(1)}\" y1=\"${(y-8).toFixed(1)}\" x2=\"${x.toFixed(1)}\" y2=\"${(y-26).toFixed(1)}\" stroke=\"#dc2626\" stroke-width=\"1.5\"/>\n                <text x=\"${x.toFixed(1)}\" y=\"${(y-31).toFixed(1)}\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"800\" fill=\"#dc2626\">${p.mark}<\/text>`;\n    }\n  });\n  const thLine = (v, y0, y1, label) =>\n    `<line x1=\"${PL}\" y1=\"${Y(v)}\" x2=\"${W-PR}\" y2=\"${Y(v)}\" stroke=\"#7c3aed\" stroke-width=\"1.4\" stroke-dasharray=\"6 4\"/>\n     <text x=\"${W-PR-4}\" y=\"${Y(v)-6}\" text-anchor=\"end\" font-size=\"10.5\" font-weight=\"700\" fill=\"#7c3aed\">ssthresh = ${v}<\/text>`;\n\n  const last = pts[pts.length - 1];\n  $('ccStage').innerHTML =\n    `<div class=\"stage\"><svg viewBox=\"0 0 ${W} ${H}\">\n      ${grid}\n      <line x1=\"${PL}\" y1=\"${H-PB}\" x2=\"${W-PR}\" y2=\"${H-PB}\" stroke=\"#d8d2c8\" stroke-width=\"1.5\"/>\n      <line x1=\"${PL}\" y1=\"${PT-8}\" x2=\"${PL}\" y2=\"${H-PB}\" stroke=\"#d8d2c8\" stroke-width=\"1.5\"/>\n      ${thLine(th0)}\n      ${line ? `<path d=\"${line}\" fill=\"none\" stroke=\"#d97706\" stroke-width=\"2.4\" stroke-linejoin=\"round\" opacity=\".95\"/>` : ''}\n      ${dots}${marks}\n      <text x=\"${W/2}\" y=\"${H-6}\" text-anchor=\"middle\" font-size=\"11\" fill=\"#a49db8\">传输轮次（每轮 ≈ 一个 RTT）<\/text>\n      <text x=\"${PL-42}\" y=\"${PT-6}\" font-size=\"10\" fill=\"#a49db8\">cwnd<\/text>\n    <\/svg><\/div>\n    <div class=\"legend\">\n      <span><i style=\"background:#d97706\"><\/i>慢开始阶段（指数增长）<\/span>\n      <span><i style=\"background:#0891b2\"><\/i>拥塞避免阶段（线性增长）<\/span>\n      <span><i style=\"background:#7c3aed\"><\/i>紫色虚线 = ssthresh 门限<\/span>\n      <span><i style=\"background:#dc2626\"><\/i>红点 = 发生拥塞事件<\/span>\n    <\/div>`;\n\n  let expl = '';\n  if(ev === 'to'){\n    const p = pts.find(x => x.mark === '超时');\n    expl = `第 ${toR} 轮发生<b>超时<\/b>（判为严重拥塞）：当时 cwnd = ${p ? p.old : '?'} → 新 ssthresh = ⌊cwnd/2⌋ = <b>${p ? p.th : '?'}<\/b>，cwnd <b>直接回到 1<\/b>，重新走慢开始。<br>\n      所以曲线在那一刻<b>垂直跌到最底部<\/b>，然后重新指数上升 —— 这是超时最典型的形状（锯齿的\"深谷\"）。`;\n  } else if(ev === 'ack3'){\n    const p = pts.find(x => x.mark === '3个ACK');\n    expl = `第 ${a3R} 轮收到<b>3 个重复 ACK<\/b>（快重传 + 快恢复）：当时 cwnd = ${p ? p.old : '?'} → 新 ssthresh = <b>${p ? p.th : '?'}<\/b>，cwnd <b>= ssthresh（${p ? p.th : '?'}），不回到 1<\/b>，直接进入拥塞避免。<br>\n      所以曲线只<b>掉一半就继续线性上升<\/b> —— 和超时那条\"深谷\"对比一下，就明白为什么说「快恢复说明网络只是轻微拥塞」。`;\n  } else {\n    expl = `两处事件都发生了：<br>\n      第 10 轮<b>超时<\/b> → ssthresh 减半、cwnd <b>= 1<\/b>，重新慢开始（深谷）；<br>\n      第 16 轮<b>3 个重复 ACK<\/b> → ssthresh 再减半、cwnd <b>= 新 ssthresh<\/b>，只掉一半（浅谷）。<br>\n      <b>两种拥塞事件在图上长得完全不一样<\/b>，这是这类题最常考的判断点。`;\n  }\n\n  $('ccOut').innerHTML = stepNote('这条曲线怎么读', expl +\n    `<div class=\"kv\" style=\"margin-top:10px\">\n      <span>初始 ssthresh = <b>${th0}<\/b><\/span>\n      <span>结束轮次 = <b>${last.r}<\/b><\/span>\n      <span>结束 cwnd = <b>${last.cwnd}<\/b><\/span>\n      <span>发送窗口 = min(cwnd, rwnd)<\/span>\n    <\/div>`) +\n    `<div class=\"hint\">规律记牢：<b>每次拥塞后新的 ssthresh 总是「当时 cwnd 的一半」<\/b>，所以曲线会反复在同一个水平线附近触顶回落。\n     <br>改动「初始 ssthresh」看曲线的拐点怎么移动 —— 慢开始段永远是<b>翻倍<\/b>，拥塞避免段永远是<b>每轮 +1<\/b>。<\/div>`;\n}\n$('ccTh').oninput = renderCc;\n$('ccEv').onchange = renderCc;\n$('ccReset').onclick = ()=>{ $('ccTh').value = 16; $('ccEv').value = 'to'; renderCc(); };\nrenderCc();\n\n/* ============================================================\n   动画 14 · DNS 域名解析\n   ============================================================ */\nconst DN_NODES = [\n  { x:56,  y:158, n:'客户机', s:'发起解析' },\n  { x:216, y:158, n:'本地域名服务器', s:'ISP 提供' },\n  { x:370, y:52,  n:'根域名服务器', s:'13 组 · .' },\n  { x:492, y:52,  n:'顶级域名服务器', s:'.com' },\n  { x:604, y:52,  n:'权限域名服务器', s:'example.com' }\n];\nconst DN_ITER = [\n  { a:0, b:1, t:'① 递归请求：www.example.com 的 IP 是？', c:'#d97706',\n    note:'客户机把请求交给本地域名服务器，并<b>要求它给出最终结果<\/b> —— 这就是<b>递归查询<\/b>：委托方不再自己动手。' },\n  { a:1, b:2, t:'② 问根：.com 的服务器地址？', c:'#0891b2',\n    note:'本地服务器不知道答案，去问根。根<b>不替它查<\/b>，只回答「<b>我不知道，你去问 .com 顶级域名服务器（地址是 …）<\/b>」。<br>这就是<b>迭代查询<\/b>：只指路，不代劳。' },\n  { a:1, b:3, t:'③ 问顶级：example.com 的权限服务器？', c:'#0891b2',\n    note:'本地服务器接着去问 .com 顶级服务器。同样地，顶级服务器<b>也不替它查<\/b>，只告诉他「<b>去问 example.com 的权限域名服务器<\/b>」。<br><b>注意：每一步都是本地服务器自己去问的<\/b> —— 这是迭代查询的关键特征。' },\n  { a:1, b:4, t:'④ 问权限：www.example.com 的 IP？', c:'#7c3aed',\n    note:'权限域名服务器是这个域名的<b>权威管理者<\/b>，它手里有真正的记录，直接回答：「<b>93.184.216.34<\/b>」。' },\n  { a:1, b:0, t:'⑤ 返回结果，并写入高速缓存', c:'#15803d',\n    note:'本地服务器把结果返回给客户机，同时<b>写进自己的高速缓存<\/b>（带 TTL）。<br><b>下次别人再问同一个域名，本地服务器直接回答，根本不用再去找根<\/b> —— 这就是 DNS 缓存能把根服务器负载压下来的原因。' }\n];\nconst DN_REC = [\n  { a:0, b:1, t:'① 递归请求', c:'#d97706',\n    note:'客户机 → 本地域名服务器，同样是递归查询。' },\n  { a:1, b:2, t:'② 本地服务器请根\"替我查到底\"', c:'#0891b2',\n    note:'<b>关键区别在这里：<\/b>本地服务器要求根<b>替它把这件事办完<\/b>，而不是只给它指路。' },\n  { a:2, b:3, t:'③ 根继续请顶级代查', c:'#0891b2',\n    note:'根服务器替本地服务器去问 .com 顶级服务器。' },\n  { a:3, b:4, t:'④ 顶级继续请权限代查', c:'#7c3aed',\n    note:'顶级服务器替它去问 example.com 的权限服务器。' },\n  { a:4, b:3, t:'⑤ 权限答：93.184.216.34', c:'#15803d',\n    note:'权限服务器知道答案，返回给顶级服务器。' },\n  { a:3, b:2, t:'⑥ 逐级回传', c:'#15803d',\n    note:'顶级服务器把结果回传给根。' },\n  { a:2, b:1, t:'⑦ 回传到本地服务器', c:'#15803d',\n    note:'根再把结果回传给本地服务器 —— 至此请求才走完全程。' },\n  { a:1, b:0, t:'⑧ 返回给客户机', c:'#15803d',\n    note:'本地服务器把最终结果交给客户机。<br><b>看到代价了吗？<\/b>递归查询让每一级都参与了转发，链路更长、服务器负担更重 —— <b>所以现实中根和顶级服务器通常不提供递归服务<\/b>，本动画是为了对比两种查询方式才这样画。' }\n];\nfunction dnSteps(){ return ($('dnMode').value === 'rec') ? DN_REC : DN_ITER; }\nlet DN_i = 0, DN_timer = null;\nfunction dnSvg(shown){\n  const W = 660, H = 214;\n  let g = '';\n  DN_NODES.forEach(n=>{\n    const active = shown.some(s => s.a === DN_NODES.indexOf(n) || s.b === DN_NODES.indexOf(n));\n    g += `<rect x=\"${n.x-50}\" y=\"${n.y-23}\" width=\"100\" height=\"46\" rx=\"9\"\n            fill=\"${active ? '#fff4e3' : '#fff'}\" stroke=\"${active ? '#d97706' : '#ded8cf'}\" stroke-width=\"${active ? 2 : 1.4}\"/>`;\n    g += `<text x=\"${n.x}\" y=\"${n.y-3}\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"800\" fill=\"${active ? '#8a5209' : '#4b5665'}\">${n.n}<\/text>`;\n    g += `<text x=\"${n.x}\" y=\"${n.y+14}\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#b0a89b\">${n.s}<\/text>`;\n  });\n  g += `<defs><marker id=\"dna\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"3\" orient=\"auto\">\n        <path d=\"M0,0 L7,3 L0,6 z\" fill=\"#7d7890\"/><\/marker><\/defs>`;\n  const yOff = {};\n  shown.forEach((s, k)=>{\n    const A = DN_NODES[s.a], B = DN_NODES[s.b];\n    const key = s.a + '-' + s.b;\n    yOff[key] = (yOff[key] || 0);\n    const dy = yOff[key] * 13;\n    const x1 = A.x + (B.x > A.x ? 50 : -50);\n    const x2 = B.x + (B.x > A.x ? -52 : 52);\n    const y1 = A.y + dy, y2 = B.y + dy;\n    g += `<line x1=\"${x1}\" y1=\"${y1}\" x2=\"${x2}\" y2=\"${y2}\" stroke=\"${s.c}\" stroke-width=\"2\" marker-end=\"url(#dna)\" opacity=\".9\"/>`;\n    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;\n    g += `<text x=\"${mx}\" y=\"${my - 6}\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"${s.c}\">${s.t}<\/text>`;\n  });\n  return `<div class=\"stage\"><svg viewBox=\"0 0 ${W} ${H}\">${g}<\/svg><\/div>\n  <div class=\"legend\">\n    <span><i style=\"background:#d97706\"><\/i>客户机 ↔ 本地服务器（递归）<\/span>\n    <span><i style=\"background:#0891b2\"><\/i>本地服务器逐级询问（迭代）<\/span>\n    <span><i style=\"background:#7c3aed\"><\/i>问到权限服务器<\/span>\n    <span><i style=\"background:#15803d\"><\/i>返回结果<\/span>\n  <\/div>`;\n}\nfunction dnRender(){\n  const steps = dnSteps();\n  const idx = Math.min(DN_i, steps.length - 1);\n  const shown = steps.slice(0, idx + 1);\n  $('dnStage').innerHTML = dnSvg(shown);\n  const s = steps[idx];\n  const mode = ($('dnMode').value === 'rec') ? '递归查询' : '迭代查询';\n  $('dnOut').innerHTML = stepNote(`${mode} · 第 ${idx + 1} / ${steps.length} 步`, s.note) +\n    `<div class=\"hint\">切换上方下拉框对比两种模式：<b>迭代 = 每一步都是本地服务器自己在问<\/b>；<b>递归 = 上一级替下一级问到底<\/b>。<\/div>`;\n}\nfunction dnStop(){ if(DN_timer){ clearInterval(DN_timer); DN_timer = null; } }\n$('dnPlay').onclick = ()=>{\n  dnStop(); DN_i = 0; dnRender();\n  DN_timer = setInterval(()=>{\n    if(DN_i >= dnSteps().length - 1){ dnStop(); return; }\n    DN_i++; dnRender();\n  }, 1200);\n};\n$('dnStep').onclick = ()=>{ dnStop(); if(DN_i < dnSteps().length - 1){ DN_i++; dnRender(); } };\n$('dnReset').onclick = ()=>{ dnStop(); DN_i = 0; dnRender(); };\n$('dnMode').onchange = ()=>{ dnStop(); DN_i = 0; dnRender(); };\ndnRender();\n<\/script>\n<script>\n/* 打包桥接：见 build_四门课合集.py 的说明 */\n(function(){\n  document.addEventListener(\"click\", function(e){\n    var a = e.target && e.target.closest ? e.target.closest(\"a[href]\") : null;\n    if(!a) return;\n    var href = a.getAttribute(\"href\") || \"\";\n    if(href.charAt(0) === \"#\"){\n      var t = document.getElementById(href.slice(1));\n      if(t){ e.preventDefault(); t.scrollIntoView({ block: \"start\" }); }\n      return;\n    }\n    if(!/\\.html$/i.test(href)) return;\n    e.preventDefault();\n    try { parent.postMessage({ __pack: \"goto\", page: href }, \"*\"); } catch(err){}\n  }, true);\n})();\n<\/script>\n<\/body>\n<\/html>\n"
  };
  var ENTRY = "408-全景总览.html";
  var frame = null;

  function show(name){
    if(!Object.prototype.hasOwnProperty.call(PAGES, name)) name = ENTRY;
    if(!frame){
      var boot = document.getElementById("boot");
      frame = document.createElement("iframe");
      frame.id = "frame";
      frame.setAttribute("title", "408 四门课 · 交互式原理全景（离线合集）");
      frame.setAttribute("allow", "fullscreen");
      document.body.insertBefore(frame, boot);
      if(boot) boot.style.display = "none";
    }
    frame.srcdoc = PAGES[name];
    try { document.title = "408 四门课 · 交互式原理全景（离线合集）" + " · " + name.replace(/\.html$/i, ""); } catch(e){}
  }

  window.addEventListener("message", function(e){
    var d = e.data;
    if(d && d.__pack === "goto" && d.page) show(d.page);
  });

  show(ENTRY);
})();
</script>
