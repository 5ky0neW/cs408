   <div class=\"xitem\"><div class=\"xa\">队列 → 分组排队<\/div><div class=\"xb\">路由器接口的发送队列、TCP 的接收缓冲区，都是队列；拥塞控制的窗口本质是滑动窗口结构<\/div><\/div>\n      <div class=\"xitem\"><div class=\"xa\">树 → 组播树<\/div><div class=\"xb\">IP 组播的转发树、STP 的生成树都是树结构的应用<\/div><\/div>\n      <div class=\"xitem\"><div class=\"xa\">查找 → 路由表<\/div><div class=\"xb\">最长前缀匹配的高效实现要用到 Trie（字典树），是本页第 4 章树的变体<\/div><\/div>\n    <\/div>\n    <div class=\"xlink\" style=\"border-left-color:var(--accent)\">\n      <h4><span class=\"tagx\" style=\"background:var(--accent-l);color:#8a5209\">复习路线建议<\/span><\/h4>\n      <div class=\"xitem\"><div class=\"xa\">先修<\/div><div class=\"xb\">第 1 章绪论（复杂度分析）过一遍即可，但<b>渐进复杂度的估算要练熟<\/b>——它贯穿全书<\/div><\/div>\n      <div class=\"xitem\"><div class=\"xa\">攻坚顺序<\/div><div class=\"xb\">第 2 章线性表 → 第 3 章栈队列 → 第 4 章树 → 第 5 章图 → 第 7 章排序<\/div><\/div>\n      <div class=\"xitem\"><div class=\"xa\">最难三处<\/div><div class=\"xb\"><b>AVL 的四种旋转<\/b>、<b>图的最短路径手算<\/b>、<b>各种排序的过程推演<\/b><\/div><\/div>\n      <div class=\"xitem\"><div class=\"xa\">大题分布<\/div><div class=\"xb\">常见形态：树的遍历与性质计算、图的两种遍历与最短路径、排序过程与复杂度对比<\/div><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"sub\">学这一页之前，你需要先知道<\/div>\n  <div class=\"grid g3\">\n    <div class=\"card\">\n      <h4>C 语言的指针<\/h4>\n      <p>链表的插入删除全靠指针操作。如果对「指针指向哪、怎么改」还不熟，<b>先补这块<\/b>——否则链表的动画你会看不懂。<\/p>\n    <\/div>\n    <div class=\"card\">\n      <h4>递归的思想<\/h4>\n      <p>树的遍历、图的 DFS、快速排序、归并排序都是递归。理解「自己调用自己」的执行顺序，是学树和图的前提。<\/p>\n    <\/div>\n    <div class=\"card\">\n      <h4>对数与复杂度<\/h4>\n      <p>log₂n 的含义（折半查找、平衡树的高度）要能心算。第 1 章会讲，但它会贯穿后面每一章。<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- ==================== 第 1 章 ==================== -->\n<section class=\"sec\" id=\"d1\">\n  <div class=\"sec-head\">\n    <span class=\"sec-num\">CHAPTER 01<\/span>\n    <h2>绪论与复杂度<\/h2>\n    <span class=\"weight w1\">基础 · 低频<\/span>\n  <\/div>\n\n  <div class=\"tip i\"><span class=\"ti\">本章定位<\/span><span>纯概念章，单选 1-2 题。但<b>时间复杂度分析不属于本章<\/b>——它是贯穿全书的基本功，每一章的算法都要考复杂度。所以这章别只背定义，<b>把「算复杂度」这个技能练熟<\/b>。<\/span><\/div>\n\n  <div class=\"sub\">考点清单<\/div>\n  <div class=\"grid g2\">\n    <div class=\"card\">\n      <h4>1. 基本概念<\/h4>\n      <table class=\"tb\">\n        <tr><th>术语<\/th><th>含义<\/th><\/tr>\n        <tr><td>数据<\/td><td>信息的载体<\/td><\/tr>\n        <tr><td>数据元素<\/td><td>数据的基本单位，通常整体处理（如一个学生记录）<\/td><\/tr>\n        <tr><td>数据项<\/td><td>构成数据元素的不可分割的最小单位（如学号、姓名）<\/td><\/tr>\n        <tr><td>数据对象<\/td><td>性质相同的数据元素的集合<\/td><\/tr>\n      <\/table>\n      <div class=\"tip m\"><span class=\"ti\">辨析<\/span><span><b>数据元素<\/b>是「基本单位」，<b>数据项<\/b>是「最小单位」。一个数据元素可以由多个数据项组成 —— 这是经典送分题。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>2. 逻辑结构与存储结构 <span class=\"pt\">必考<\/span><\/h4>\n      <div class=\"fm\">逻辑结构（面向问题的，与存储无关）\n  线性结构：线性表、栈、队列、串\n  非线性结构：树、图、集合\n\n存储结构（面向计算机的，也叫物理结构）\n  顺序存储：逻辑相邻 → 物理相邻（数组）\n  链式存储：用指针表示逻辑关系\n  索引存储：附加索引表\n  散列存储：由关键字直接算出地址<\/div>\n      <div class=\"tip s\"><span class=\"ti\">关系<\/span><span><b>存储结构是逻辑结构的实现<\/b>。同一个逻辑结构（如线性表）可以有不同存储结构（顺序表 / 链表），因此操作的效率也不同。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>3. 算法与五个特性<\/h4>\n      <ul>\n        <li><b>有穷性<\/b>：执行有限步后结束（程序可以不满足，算法必须满足）<\/li>\n        <li><b>确定性<\/b>：每条指令含义唯一，无二义性<\/li>\n        <li><b>可行性<\/b>：都能用基本运算实现有限次<\/li>\n        <li><b>输入<\/b>：零个或多个<\/li>\n        <li><b>输出<\/b>：一个或多个（<b>必须有<\/b>）<\/li>\n      <\/ul>\n      <div class=\"tip e\"><span class=\"ti\">易错<\/span><span>「算法必须有输入」是错的 —— <b>输入可以是零个<\/b>，但输出至少一个。另外算法 ≠ 程序：程序可以不满足有穷性（如操作系统一直运行）。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>4. 时间复杂度 <span class=\"pt hot\">贯穿全书<\/span><\/h4>\n      <div class=\"fm g\">只保留最高阶项，去掉系数\n  T(n) = 3n² + 5n + 100  →  O(n²)\n\n常见量级（快 → 慢）\n  O(1) < O(log n) < O(n) < O(n log n)\n       < O(n²) < O(n³) < O(2ⁿ) < O(n!)\n\n两条规则\n  加法规则：T = T₁ + T₂，取较大的\n  乘法规则：嵌套循环，复杂度相乘<\/div>\n      <div class=\"tip s\"><span class=\"ti\">背下来<\/span><span>\n        <b>折半查找 O(log n)<\/b>、<b>快排/归并/堆排 O(n log n)<\/b>、<b>冒泡/插入/选择 O(n²)<\/b>、\n        <b>二叉树遍历 O(n)<\/b>、<b>图的 BFS/DFS O(n+e)<\/b>。这几个是选择题的常客。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>5. 空间复杂度<\/h4>\n      <ul>\n        <li>只算<b>辅助空间<\/b>，不算输入本身占的空间<\/li>\n        <li>O(1)：原地算法（冒泡、插入、选择、堆排）<\/li>\n        <li>O(n)：归并排序（需要等长辅助数组）<\/li>\n        <li>O(log n)：快排的递归栈（平均）<\/li>\n        <li>递归算法的空间复杂度 = <b>递归深度<\/b><\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <h4>6. 常考的几个数<\/h4>\n      <div class=\"fm a\">n 个结点的完全二叉树高度 = ⌊log₂n⌋ + 1\n折半查找最多比较次数 = ⌊log₂n⌋ + 1\n顺序表插入平均移动 n/2 个元素\n顺序表删除平均移动 (n−1)/2 个元素\nn 个元素出栈序列的种数 = C(2n,n)/(n+1)<\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"sub a\">原理动画<\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 01 · 复杂度增长曲线：为什么 O(n log n) 比 O(n²) 快那么多<span class=\"tag\">拖动看变化<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>数据规模 n<\/label><input type=\"range\" id=\"cxN\" min=\"2\" max=\"200\" value=\"50\" style=\"width:200px\">\n        <span id=\"cxNv\" style=\"font-weight:800;color:var(--primary);min-width:46px;display:inline-block\">50<\/span>\n        <button class=\"btn gy sm\" id=\"cxReset\">重置<\/button>\n      <\/div>\n      <div id=\"cxStage\"><\/div>\n      <div id=\"cxOut\" style=\"margin-top:16px\"><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- ==================== 第 2 章 ==================== -->\n<section class=\"sec\" id=\"d2\">\n  <div class=\"sec-head\">\n    <span class=\"sec-num\">CHAPTER 02<\/span>\n    <h2>线性表<\/h2>\n    <span class=\"weight w2\">主力 · 4-6 分<\/span>\n  <\/div>\n\n  <div class=\"tip i\"><span class=\"ti\">本章定位<\/span><span>数据结构的第一块基石。<b>顺序表与链表的对比<\/b>是必考辨析（随机访问 vs 插入删除效率），<b>链表的各种插入删除操作<\/b>是代码题的基础。这章的题分值不算最高，但<b>后面每一章都在用它<\/b>——栈是受限的线性表，队列也是，树的存储也要靠数组或链表。<\/span><\/div>\n\n  <div class=\"sub\">考点清单<\/div>\n  <div class=\"grid g2\">\n    <div class=\"card\">\n      <h4>1. 顺序表 <span class=\"pt hot\">必考<\/span><\/h4>\n      <div class=\"fm\">用一组<b>连续<\/b>的存储单元依次存放\n逻辑相邻 → 物理相邻\n\n优点：<b>随机访问<\/b> O(1)，由下标直接算出地址\n缺点：插入删除要移动大量元素 O(n)\n      长度固定，扩容代价高<\/div>\n      <div class=\"fm g\">插入操作（在第 i 个位置插入）\n先把第 i 到第 n 个元素<b>整体后移一位<\/b>\n再写入新元素\n平均移动次数 = n / 2\n\n删除操作（删除第 i 个元素）\n先把第 i+1 到第 n 个元素<b>整体前移一位<\/b>\n平均移动次数 = (n − 1) / 2<\/div>\n      <div class=\"tip e\"><span class=\"ti\">记忆<\/span><span>插入是<b>从后往前<\/b>移动（否则会覆盖数据），删除是<b>从前往后<\/b>移动。这个方向别记反 —— 下面的操作台可以亲手验证。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>2. 单链表 <span class=\"pt hot\">必考<\/span><\/h4>\n      <div class=\"fm\">结点 = 数据域 + 指针域\n用指针把散落的结点串成逻辑上的线性关系\n\n优点：插入删除只需改指针 O(1)（已知前驱时）\n缺点：<b>不能随机访问<\/b>，查找要 O(n)\n      指针本身占额外空间<\/div>\n      <div class=\"fm b\">插入（在 p 之后插入 s）\n  s->next = p->next;\n  p->next = s;\n★ 顺序不能反！反了就丢掉后面的链\n\n删除（删除 p 的后继 q）\n  q = p->next;\n  p->next = q->next;\n  free(q);<\/div>\n      <div class=\"tip m\"><span class=\"ti\">带头结点<\/span><span>带头结点的单链表能让「第一个位置」和「其他位置」的操作统一，代码更简洁。<b>考试代码题推荐带头结点。<\/b>判空条件是 <span class=\"mono\">L->next == NULL<\/span>。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>3. 双链表<\/h4>\n      <div class=\"fm p\">结点 = prior + data + next\n可以双向遍历，删除时能直接找到前驱\n\n插入（在 p 之后插入 s）四步\n  s->next = p->next;\n  if (p->next) p->next->prior = s;\n  s->prior = p;\n  p->next = s;\n\n删除（删除 p 的后继 q）\n  p->next = q->next;\n  if (q->next) q->next->prior = p;\n  free(q);<\/div>\n      <div class=\"tip s\"><span class=\"ti\">对比<\/span><span>单链表删除某结点需要知道<b>前驱<\/b>；双链表只要知道<b>该结点本身<\/b>就能删除（O(1)）。这是双链表存在的核心理由。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>4. 循环链表与静态链表<\/h4>\n      <ul>\n        <li><b>循环单链表<\/b>：尾结点的 next 指回头结点。判空：<span class=\"mono\">L->next == L<\/span><\/li>\n        <li><b>循环双链表<\/b>：头结点的 prior 指向尾结点<\/li>\n        <li><b>静态链表<\/b>：用数组模拟指针，每个结点存 data + next（游标）。适合不支持指针的语言<\/li>\n      <\/ul>\n      <div class=\"tip m\"><span class=\"ti\">考点<\/span><span>循环链表的优点是<b>从任一结点出发都能遍历整个链表<\/b>。若经常操作表尾，可以只设<b>尾指针<\/b>而不设头指针，此时访问表头和表尾都是 O(1)。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>5. 顺序表 vs 链表 <span class=\"pt hot\">必考辨析<\/span><\/h4>\n      <table class=\"tb\">\n        <tr><th><\/th><th>顺序表<\/th><th>链表<\/th><\/tr>\n        <tr><td>存储方式<\/td><td>连续<\/td><td>离散<\/td><\/tr>\n        <tr><td>随机访问<\/td><td><b>O(1)<\/b><\/td><td>O(n)<\/td><\/tr>\n        <tr><td>插入/删除<\/td><td>O(n)（要搬元素）<\/td><td><b>O(1)<\/b>（改指针）<\/td><\/tr>\n        <tr><td>存储密度<\/td><td><b>= 1<\/b>（无额外开销）<\/td><td>&lt; 1（指针占空间）<\/td><\/tr>\n        <tr><td>容量<\/td><td>固定，需扩容<\/td><td>动态，按需分配<\/td><\/tr>\n        <tr><td>适用<\/td><td>查多改少<\/td><td>改多查少<\/td><\/tr>\n      <\/table>\n      <div class=\"tip e\"><span class=\"ti\">结论<\/span><span><b>存储密度 = 数据本身占的空间 ÷ 结点总空间<\/b>。顺序表为 1，链表小于 1（单链表通常约 50%，取决于数据域大小）。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>6. 常见代码题套路<\/h4>\n      <ul>\n        <li>链表逆置（头插法重建）<\/li>\n        <li>找中间结点（快慢指针）<\/li>\n        <li>判断有环（快慢指针相遇）<\/li>\n        <li>删除倒数第 k 个（双指针间隔 k）<\/li>\n        <li>两个有序链表合并<\/li>\n        <li>找公共结点（先对齐长度）<\/li>\n      <\/ul>\n      <div class=\"tip s\"><span class=\"ti\">通用心法<\/span><span>链表题的绝大多数技巧都是<b>双指针<\/b>（快慢指针 / 前后指针）。遇到「倒数」「中间」「有环」这类词，第一反应就该是双指针。<\/span><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"sub a\">原理动画 · 三种线性结构，都能亲手增删改查<\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 02 · 顺序表操作台：看元素怎么搬<span class=\"tag\">增 · 删 · 查 · 改<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>值<\/label><input type=\"number\" id=\"sqVal\" value=\"25\" style=\"width:76px\">\n        <label>位置<\/label><input type=\"number\" id=\"sqPos\" value=\"3\" style=\"width:64px\">\n        <button class=\"btn\" id=\"sqIns\">插入<\/button>\n        <button class=\"btn rd\" id=\"sqDel\">删除<\/button>\n        <button class=\"btn gh\" id=\"sqFind\">按值查找<\/button>\n        <button class=\"btn gh\" id=\"sqUpd\">修改<\/button>\n        <button class=\"btn gh\" id=\"sqIdx\">按位查找<\/button>\n        <button class=\"btn gy\" id=\"sqReset\">重置<\/button>\n      <\/div>\n      <div id=\"sqStage\"><\/div>\n      <div id=\"sqCode\" style=\"margin-top:14px\"><\/div>\n      <div id=\"sqLog\" style=\"margin-top:12px\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 03 · 单链表操作台：看指针怎么改<span class=\"tag\">增 · 删 · 查 · 改<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>值<\/label><input type=\"number\" id=\"slVal\" value=\"42\" style=\"width:76px\">\n        <label>位置<\/label><input type=\"number\" id=\"slPos\" value=\"3\" style=\"width:64px\">\n        <button class=\"btn\" id=\"slIns\">按位置插入<\/button>\n        <button class=\"btn gh\" id=\"slHead\">头插<\/button>\n        <button class=\"btn rd\" id=\"slDel\">删除<\/button>\n        <button class=\"btn gh\" id=\"slFind\">查找<\/button>\n        <button class=\"btn gh\" id=\"slUpd\">修改<\/button>\n        <button class=\"btn gh\" id=\"slIdx\">按位查找<\/button>\n        <button class=\"btn gy\" id=\"slReset\">重置<\/button>\n      <\/div>\n      <div id=\"slStage\"><\/div>\n      <div id=\"slCode\" style=\"margin-top:14px\"><\/div>\n      <div id=\"slLog\" style=\"margin-top:12px\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 04 · 双链表操作台：为什么删除不用找前驱<span class=\"tag\">增 · 删 · 查 · 改<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>值<\/label><input type=\"number\" id=\"dlVal\" value=\"55\" style=\"width:76px\">\n        <label>位置<\/label><input type=\"number\" id=\"dlPos\" value=\"3\" style=\"width:64px\">\n        <button class=\"btn\" id=\"dlIns\">按位置插入<\/button>\n        <button class=\"btn rd\" id=\"dlDel\">删除<\/button>\n        <button class=\"btn gh\" id=\"dlFind\">查找<\/button>\n        <button class=\"btn gh\" id=\"dlUpd\">修改<\/button>\n        <button class=\"btn gh\" id=\"dlIdx\">按位查找<\/button>\n        <button class=\"btn gy\" id=\"dlReset\">重置<\/button>\n      <\/div>\n      <div id=\"dlStage\"><\/div>\n      <div id=\"dlCode\" style=\"margin-top:14px\"><\/div>\n      <div id=\"dlLog\" style=\"margin-top:12px\"><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- ==================== 第 3 章 ==================== -->\n<section class=\"sec\" id=\"d3\">\n  <div class=\"sec-head\">\n    <span class=\"sec-num\">CHAPTER 03<\/span>\n    <h2>栈、队列和数组<\/h2>\n    <span class=\"weight w2\">主力 · 4-6 分<\/span>\n  <\/div>\n\n  <div class=\"tip i\"><span class=\"ti\">本章定位<\/span><span>栈和队列都是<b>「操作受限的线性表」<\/b>——这是本章最核心的一句话。考点集中在两处：<b>循环队列的队空队满判断<\/b>（公式必背）和<b>出栈序列的合法性判断<\/b>（卡特兰数）。另外特殊矩阵的下标计算是稳定的计算题。<\/span><\/div>\n\n  <div class=\"sub\">考点清单<\/div>\n  <div class=\"grid g2\">\n    <div class=\"card\">\n      <h4>1. 栈（LIFO）<span class=\"pt hot\">必考<\/span><\/h4>\n      <div class=\"fm\">后进先出 · 只在<b>栈顶<\/b>插入和删除\n栈顶 top、栈底 bottom、空栈 top == -1<\/div>\n      <table class=\"tb\">\n        <tr><th>实现<\/th><th>特点<\/th><\/tr>\n        <tr><td>顺序栈<\/td><td>数组 + top 指针。共享栈：两个栈从两端向中间长，<span class=\"mono\">top0+1 == top1<\/span> 时满<\/td><\/tr>\n        <tr><td>链栈<\/td><td>用单链表，只在头部操作。<b>不存在栈满<\/b>，且不用设头结点<\/td><\/tr>\n      <\/table>\n      <div class=\"fm g\">n 个不同元素依次进栈，可能的出栈序列种数\n  = C(2n, n) / (n+1)   ← 卡特兰数\nn=3 时：(6×5×4)/(3×2×1)/4 = 5 种\nn=4 时：14 种<\/div>\n      <div class=\"tip s\"><span class=\"ti\">合法性判断技巧<\/span><span>给定入栈序列，判断某出栈序列是否合法：<b>用栈模拟一遍<\/b>。另外记住一条：出栈序列中<b>不可能出现「后进先出」被违反的情况<\/b>——若某元素先出栈，则它之前进栈且未出栈的元素必须按<b>逆序<\/b>出现在它后面。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>2. 队列与顺序队列 <span class=\"pt\">基础 · 必懂<\/span><\/h4>\n      <div class=\"fm\">队列：先进先出（FIFO）—— 队尾入队、队头出队\n\n  front 指向<b>队头元素<\/b>\n  rear  指向<b>队尾元素的下一个位置<\/b>\n\n顺序队列 = 数组 + front / rear 两个指针\n  入队：data[rear] = x;   rear++\n  出队：x = data[front];  front++\n  队空：front == rear\n  元素个数：rear − front<\/div>\n      <div class=\"tip e\"><span class=\"ti\">顺序队列的致命问题：假溢出<\/span><span>\n        rear 只会一路往右走。当 rear 碰到数组末尾（<span class=\"mono\">rear == M<\/span>）时，\n        <b>哪怕前面已经出队空出很多格子，也再也进不了队<\/b> —— 因为 rear 不能回头。<br>\n        这叫 <b>假溢出<\/b>：<b>不是真的没空间，而是空间用不上<\/b>。<br>\n        例：M = 5 的数组，入队 4 个再出队 4 个 → front = rear = 4，前面 4 格全空着，\n        但 rear 已经到头，下一个元素就是进不来。<b>这就是下一张卡片「循环队列」要解决的问题。<\/b><\/span><\/div>\n      <div class=\"tip m\"><span class=\"ti\">口径提醒<\/span><span>\n        有的教材写「front 指向队头元素的<b>前一个位置<\/b>」，有的写「front 指向队头元素」。\n        <b>两种约定下的入队 / 出队语句是不一样的<\/b>，做题先看题干怎么定义。<br>\n        本页统一用：<b>front 指向队头元素，rear 指向队尾元素的下一个位置<\/b>。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>3. 循环队列 <span class=\"pt hot\">必考公式<\/span><\/h4>\n      <div class=\"fm\">队列：先进先出（FIFO）\nfront 指向队头元素，rear 指向队尾元素的<b>下一个<\/b>位置\n\n顺序队列的「假溢出」：rear 到数组末尾了，\n但前面还有空位 —— 用<b>循环队列<\/b>解决<\/div>\n      <div class=\"fm a\">三种判空判满方案（M 为数组容量）\n\n① 牺牲一个单元（最常考）\n   队空：front == rear\n   队满：(rear + 1) % M == front\n   元素个数：(rear − front + M) % M\n\n② 设 size 计数器\n   队空：size == 0　队满：size == M\n\n③ 设 tag 标志位\n   tag = 0 表示最近一次是删除 → 判空\n   tag = 1 表示最近一次是插入 → 判满\n   即 front == rear 时看 tag 决定是空还是满<\/div>\n      <div class=\"tip e\"><span class=\"ti\">必背<\/span><span>方案①的两个公式<b>每年都在考<\/b>。记法：队满时 rear 再走一步就撞上 front，所以是 <span class=\"mono\">(rear+1)%M == front<\/span>。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>4. 双端队列<\/h4>\n      <ul>\n        <li>允许<b>两端<\/b>都能插入和删除<\/li>\n        <li><b>输入受限<\/b>：只允许一端插入，两端都能删除<\/li>\n        <li><b>输出受限<\/b>：两端都能插入，只允许一端删除<\/li>\n        <li>判断某个序列能否由双端队列得到：同样用<b>模拟法<\/b><\/li>\n      <\/ul>\n      <div class=\"tip m\"><span class=\"ti\">考点<\/span><span>双端队列的题本质上还是「模拟」——在纸上画一个两端开口的管子，逐个试。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>5. 栈的应用 <span class=\"pt\">经典<\/span><\/h4>\n      <table class=\"tb\">\n        <tr><th>场景<\/th><th>怎么用栈<\/th><\/tr>\n        <tr><td>括号匹配<\/td><td>遇左括号入栈，遇右括号看栈顶是否匹配<\/td><\/tr>\n        <tr><td>表达式求值<\/td><td>中缀转后缀用栈；后缀求值也用栈<\/td><\/tr>\n        <tr><td>递归<\/td><td>系统用<b>函数调用栈<\/b>保存返回地址和局部变量<\/td><\/tr>\n        <tr><td>进制转换<\/td><td>除基数取余，余数逆序输出 → 用栈<\/td><\/tr>\n        <tr><td>迷宫求解<\/td><td>保存路径，回退时出栈<\/td><\/tr>\n      <\/table>\n      <div class=\"tip s\"><span class=\"ti\">中缀转后缀<\/span><span>规则：遇操作数直接输出；遇运算符，若优先级不高于栈顶则弹出栈顶直到满足条件再入栈；遇左括号入栈，遇右括号弹出到左括号为止。这是<b>手算题<\/b>的常客。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>6. 队列的应用<\/h4>\n      <ul>\n        <li><b>层次遍历<\/b>（树的 BFS、图的 BFS）—— 最典型的应用<\/li>\n        <li>缓冲区（键盘输入缓冲、打印队列）<\/li>\n        <li>页面置换的 FIFO 算法<\/li>\n        <li>操作系统的各种调度队列（就绪、阻塞）<\/li>\n      <\/ul>\n      <div class=\"tip i\"><span class=\"ti\">与 OS 的接口<\/span><span>OS 里的就绪队列、阻塞队列、多级反馈队列，<b>本质就是本章的队列<\/b>。多级反馈队列是「队列的队列」，属于队列的组合应用。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>7. 数组的存储与地址计算 <span class=\"pt hot\">计算题<\/span><\/h4>\n      <div class=\"fm\">一维数组：LOC(a[i]) = LOC(a[0]) + i × L\n\n二维数组 a[m][n]（m 行 n 列，每个元素占 L 字节）\n\n【行优先】存完一行再存下一行（C / Java / Pascal）\n  LOC(a[i][j]) = LOC(a[0][0]) + (i × n + j) × L\n\n【列优先】存完一列再存下一列（Fortran / MATLAB）\n  LOC(a[i][j]) = LOC(a[0][0]) + (j × m + i) × L\n\n三维数组（行优先）a[m₁][m₂][m₃]\n  LOC(a[i][j][k]) = LOC(a[0][0][0])\n                  + (i × m₂ × m₃ + j × m₃ + k) × L<\/div>\n      <div class=\"tip s\"><span class=\"ti\">怎么记<\/span><span>\n        行优先就是「<b>一行一行数过去<\/b>」：先整行跳过 i 行（每行 n 个元素），再在本行里数到第 j 个\n        → 前面一共 <b>i × n + j<\/b> 个元素。<br>\n        列优先对称着来：先跳过 j 整列（每列 m 个），再数到第 i 个 → <b>j × m + i<\/b>。\n        <b>想不清的时候用 2×3 的小数组在纸上推一遍，比硬记公式稳。<\/b><\/span><\/div>\n      <div class=\"tip e\"><span class=\"ti\">两个最常见的坑<\/span><span>\n        <b>①<\/b> 「m 行 n 列」里，<b>行优先乘的是列数 n<\/b>（因为一行有 n 个元素），\n        <b>列优先乘的是行数 m<\/b>。把两个乘数用反，是这类题最常见的失分点。<br>\n        <b>②<\/b> 下标从 1 开始时公式要跟着变：行优先变成\n        <span class=\"mono\">((i−1) × n + (j−1)) × L<\/span>。<b>先确认题干的下标起点，再代公式。<\/b><\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>8. 特殊矩阵的压缩存储 <span class=\"pt hot\">计算题<\/span><\/h4>\n      <div class=\"fm\">对称矩阵（n×n，只存下三角）\n  元素 a[i][j]（i≥j，下标从 1 开始）\n  在一维数组中的位置 k = i(i−1)/2 + j − 1\n\n上三角元素（i&lt;j）利用对称性：a[i][j] = a[j][i]\n\n三对角矩阵（带状）\n  k = 2i + j − 3  （i、j 从 1 开始）\n\n稀疏矩阵的两种存法\n  三元组表：(行, 列, 值)\n  十字链表：适合非零元个数变化大的场景<\/div>\n      <div class=\"tip e\"><span class=\"ti\">最容易错的<\/span><span>下标<b>从 0 还是从 1 开始<\/b>，公式要跟着变。做题先确认题干约定，然后代入小数据验证（比如取 i=j=1 看结果对不对）。<\/span><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"sub a\">原理动画 · 栈和队列，动手推一遍就懂<\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 05 · 栈操作台：后进先出到底怎么体现<span class=\"tag\">入栈 · 出栈 · 取栈顶<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>值<\/label><input type=\"number\" id=\"stVal\" value=\"7\" style=\"width:76px\">\n        <button class=\"btn\" id=\"stPush\">入栈 push<\/button>\n        <button class=\"btn rd\" id=\"stPop\">出栈 pop<\/button>\n        <button class=\"btn gh\" id=\"stPeek\">取栈顶 top<\/button>\n        <button class=\"btn gy\" id=\"stReset\">重置<\/button>\n      <\/div>\n      <div id=\"stStage\"><\/div>\n      <div id=\"stCode\" style=\"margin-top:14px\"><\/div>\n      <div id=\"stLog\" style=\"margin-top:12px\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 06 · 顺序队列操作台：假溢出到底是怎么发生的<span class=\"tag\">入队 · 出队<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>值<\/label><input type=\"number\" id=\"lqVal\" value=\"9\" style=\"width:76px\">\n        <label>容量 M<\/label><input type=\"number\" id=\"lqCap\" value=\"6\" min=\"3\" max=\"10\" style=\"width:64px\">\n        <button class=\"btn\" id=\"lqEnq\">入队 enqueue<\/button>\n        <button class=\"btn rd\" id=\"lqDeq\">出队 dequeue<\/button>\n        <button class=\"btn gy\" id=\"lqReset\">重置<\/button>\n      <\/div>\n      <div id=\"lqStage\"><\/div>\n      <div id=\"lqCode\" style=\"margin-top:14px\"><\/div>\n      <div id=\"lqLog\" style=\"margin-top:12px\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 07 · 循环队列操作台：front 和 rear 怎么绕圈<span class=\"tag\">入队 · 出队<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>值<\/label><input type=\"number\" id=\"cqVal\" value=\"9\" style=\"width:76px\">\n        <label>容量 M<\/label><input type=\"number\" id=\"cqCap\" value=\"6\" min=\"3\" max=\"10\" style=\"width:64px\">\n        <button class=\"btn\" id=\"cqEnq\">入队 enqueue<\/button>\n        <button class=\"btn rd\" id=\"cqDeq\">出队 dequeue<\/button>\n        <button class=\"btn gy\" id=\"cqReset\">重置<\/button>\n      <\/div>\n      <div id=\"cqStage\"><\/div>\n      <div id=\"cqCode\" style=\"margin-top:14px\"><\/div>\n      <div id=\"cqLog\" style=\"margin-top:12px\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 08 · 出栈序列合法性判断器<span class=\"tag\">输入序列自动验证<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>入栈序列<\/label><input type=\"text\" id=\"seqIn\" value=\"1,2,3,4\" style=\"width:140px\">\n        <label>待判断的出栈序列<\/label><input type=\"text\" id=\"seqTarget\" value=\"3,2,4,1\" style=\"width:140px\">\n        <button class=\"btn\" id=\"seqRun\">判断<\/button>\n        <button class=\"btn gy\" id=\"seqReset\">重置<\/button>\n      <\/div>\n      <div id=\"seqStage\"><\/div>\n      <div id=\"seqRes\" style=\"margin-top:16px\"><\/div>\n    <\/div>\n  <\/div>\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 09 · 数组地址计算器：行优先和列优先到底差在哪<span class=\"tag\">改参数实时算<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>行数 m<\/label><input type=\"number\" id=\"adM\" value=\"3\" min=\"2\" max=\"8\">\n        <label>列数 n<\/label><input type=\"number\" id=\"adN\" value=\"4\" min=\"2\" max=\"8\">\n        <label>元素大小 L<\/label><input type=\"number\" id=\"adL\" value=\"4\" style=\"width:70px\"><span style=\"font-size:12.5px;color:var(--muted)\">字节<\/span>\n        <label>基址 LOC(a[0][0])<\/label><input type=\"number\" id=\"adBase\" value=\"1000\" style=\"width:100px\">\n      <\/div>\n      <div class=\"ctl\">\n        <label>目标元素<\/label>\n        <input type=\"number\" id=\"adI\" value=\"2\" min=\"0\" style=\"width:64px\"><span style=\"font-size:12.5px;color:var(--muted)\">行<\/span>\n        <input type=\"number\" id=\"adJ\" value=\"3\" min=\"0\" style=\"width:64px\"><span style=\"font-size:12.5px;color:var(--muted)\">列<\/span>\n        <label>存储方式<\/label>\n        <select id=\"adMode\">\n          <option value=\"row\" selected>行优先（C / Java）<\/option>\n          <option value=\"col\">列优先（Fortran）<\/option>\n        <\/select>\n      <\/div>\n      <div id=\"adStage\"><\/div>\n      <div id=\"adOut\" style=\"margin-top:14px\"><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- ==================== 第 4 章 ==================== -->\n<section class=\"sec\" id=\"d4\">\n  <div class=\"sec-head\">\n    <span class=\"sec-num\">CHAPTER 04<\/span>\n    <h2>树与二叉树<\/h2>\n    <span class=\"weight w3\">核心 · 10-13 分<\/span>\n  <\/div>\n\n  <div class=\"tip i\"><span class=\"ti\">本章定位<\/span><span>数据结构<b>分值最高的单章<\/b>。考点密度极大：二叉树性质计算、遍历序列互推、BST 的删除、AVL 的四种旋转、哈夫曼树的 WPL，每一条都是独立考点。其中 <b>n₀ = n₂ + 1<\/b> 和 <b>AVL 旋转<\/b>几乎年年出现。这章的动画建议反复点，尤其是 AVL 旋转——画十张图不如亲手转一次。<\/span><\/div>\n\n  <div class=\"sub\">考点清单<\/div>\n  <div class=\"grid g2\">\n    <div class=\"card\">\n      <h4>1. 树的基本性质<\/h4>\n      <div class=\"fm\">结点数 = 所有结点的度数之和 + 1\n        （= 边数 + 1）\n\n树的度 = 各结点度的最大值\n结点的层次从根开始算（根是第 1 层）\n树的高度 = 最大层次数<\/div>\n      <table class=\"tb\">\n        <tr><th>存储方式<\/th><th>做法<\/th><\/tr>\n        <tr><td>双亲表示法<\/td><td>数组，每项存数据和双亲下标。找双亲 O(1)，找孩子 O(n)<\/td><\/tr>\n        <tr><td>孩子表示法<\/td><td>数组 + 每个结点的孩子链表<\/td><\/tr>\n        <tr><td><b>孩子兄弟表示法<\/b><\/td><td>左指针指第一个孩子，右指针指下一个兄弟。<b>可把树转成二叉树<\/b><\/td><\/tr>\n      <\/table>\n    <\/div>\n    <div class=\"card\">\n      <h4>2. 二叉树性质 <span class=\"pt hot\">必背<\/span><\/h4>\n      <div class=\"fm g\">① 第 i 层最多 2^(i−1) 个结点\n② 深度为 k 的二叉树最多 2^k − 1 个结点\n③ <b>n₀ = n₂ + 1<\/b>  ← 叶子数 = 度为 2 的结点数 + 1\n   （所有二叉树都成立，年年考）\n④ n 个结点的完全二叉树高度 = ⌊log₂n⌋ + 1\n⑤ 完全二叉树中，结点 i 的左孩子是 2i、\n   右孩子是 2i+1，双亲是 ⌊i/2⌋<\/div>\n      <div class=\"tip e\"><span class=\"ti\">n₀ = n₂ + 1 怎么推<\/span><span>总度数 = n₁ + 2n₂，总结点数 = n₀ + n₁ + n₂。\n      又因为「结点数 = 度数 + 1」：n₀+n₁+n₂ = n₁+2n₂+1，解得 <b>n₀ = n₂ + 1<\/b>。\n      这个推导过程本身就是一道题，要会写。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>3. 四种遍历 <span class=\"pt hot\">核心<\/span><\/h4>\n      <div class=\"fm\">先序：根 → 左 → 右\n中序：左 → 根 → 右\n后序：左 → 右 → 根\n层序：逐层从左到右（用<b>队列<\/b>实现）<\/div>\n      <div class=\"fm b\">由遍历序列唯一确定一棵二叉树\n  先序 + 中序 → 唯一确定 ✓\n  后序 + 中序 → 唯一确定 ✓\n  层序 + 中序 → 唯一确定 ✓\n  <b>先序 + 后序 → 不能确定 ✗<\/b>\n\n原因：先序的第一个是根，后序的最后一个也是根，\n两者都无法区分左右子树的分界，必须靠中序。<\/div>\n      <div class=\"tip s\"><span class=\"ti\">手算技巧<\/span><span>先序的第一个元素是<b>根<\/b>；在中序里找到这个根，<b>左边就是左子树、右边就是右子树<\/b>；再递归处理。这个套路练熟后，任何组合题都能解。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>4. 线索二叉树<\/h4>\n      <ul>\n        <li>目的：<b>利用 n+1 个空指针域<\/b>（n 个结点的二叉树有 2n 个指针，用掉 n−1 个，剩 n+1 个空的）<\/li>\n        <li>左空指针 → 指向<b>前驱<\/b>；右空指针 → 指向<b>后继<\/b><\/li>\n        <li>需要增加 ltag、rtag 标志位区分「线索」和「真实的子树指针」<\/li>\n        <li>中序线索二叉树最常用（因为中序序列的前驱后继关系最规整）<\/li>\n      <\/ul>\n      <div class=\"tip m\"><span class=\"ti\">考点<\/span><span>线索二叉树<b>便于找前驱后继<\/b>，因此遍历不需要栈（O(1) 空间）。但插入删除结点比较麻烦。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>5. 二叉排序树 BST <span class=\"pt hot\">必考<\/span><\/h4>\n      <div class=\"fm\">要么是空树，要么满足：\n  左子树所有结点 &lt; 根 &lt; 右子树所有结点\n  （左右子树也分别都是 BST）<\/div>\n      <div class=\"fm a\">删除结点 z 的三种情况\n① z 是叶子     → 直接删\n② z 只有一个孩子 → 用孩子替代 z\n③ z 有两个孩子  → 用<b>中序直接前驱（左子树最大值）<\/b>\n                  或<b>中序直接后继（右子树最小值）<\/b>替代 z，\n                  然后递归删除那个替身<\/div>\n      <div class=\"tip e\"><span class=\"ti\">易错<\/span><span>第③种情况<b>不是简单地「把右子树接到左子树上」<\/b>。正确做法是找替身。另外要记住：<b>中序遍历 BST 得到的是升序序列<\/b> —— 这是判断一棵树是不是 BST 的最快方法。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>6. 平衡二叉树 AVL <span class=\"pt hot\">最高频<\/span><\/h4>\n      <div class=\"fm\">平衡因子 = 左子树高度 − 右子树高度\n要求 |平衡因子| ≤ 1，否则失衡要旋转\n\n四种旋转（看失衡结点与插入位置的关系）\n  LL 型 → 右旋          （插在左子树的左子树）\n  RR 型 → 左旋          （插在右子树的右子树）\n  LR 型 → 先左旋后右旋   （插在左子树的右子树）\n  RL 型 → 先右旋后左旋   （插在右子树的左子树）\n\n记忆口诀：<b>看形状，往哪歪就往反方向转<\/b><\/div>\n      <div class=\"tip s\"><span class=\"ti\">关键<\/span><span><b>AVL 树的高度是 O(log n)<\/b>，所以查找、插入、删除都是 O(log n)。旋转只调整局部三个结点，<b>不改变中序遍历序列<\/b>（即仍然是 BST）。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>7. 哈夫曼树<\/h4>\n      <div class=\"fm\">WPL（带权路径长度）= Σ(叶结点权值 × 路径长度)\n哈夫曼树的 WPL <b>最小<\/b>\n\n构造（贪心）\n① 把 n 个权值都当作单结点树，放进集合\n② 每次取<b>最小的两个<\/b>合并，新结点权值 = 两者之和\n③ 重复直到只剩一棵树<\/div>\n      <ul>\n        <li>哈夫曼树<b>没有度为 1 的结点<\/b>（所以 n₀ = n₂ + 1）<\/li>\n        <li>n 个叶结点的哈夫曼树共有 <b>2n − 1<\/b> 个结点<\/li>\n        <li>哈夫曼编码是<b>前缀编码<\/b>（任一编码都不是另一个的前缀），保证解码无歧义<\/li>\n        <li>左分支记 0、右分支记 1（或反之），编码不唯一<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <h4>8. 并查集<\/h4>\n      <ul>\n        <li>用<b>双亲表示法<\/b>的树（数组）实现，每个集合是一棵树<\/li>\n        <li>Find：顺着双亲指针找根，<b>根的标志是 parent[i] == -1（或 i）<\/b><\/li>\n        <li>Union：把一棵树的根挂到另一棵的根上<\/li>\n        <li><b>优化<\/b>：按秩（小树挂大树）合并 + 路径压缩<\/li>\n        <li>应用：判断无向图连通性、Kruskal 算法<\/li>\n      <\/ul>\n      <div class=\"tip i\"><span class=\"ti\">与图的接口<\/span><span>Kruskal 最小生成树算法就靠并查集<b>判断加入一条边会不会成环<\/b>——如果两个端点已经在同一个集合里，加这条边就会成环。见第 5 章。<\/span><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"sub a\">原理动画 · 手推 + 动画核对<\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 10 · 二叉树遍历：四种顺序走一遍<span class=\"tag\">先序 · 中序 · 后序 · 层序<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>选择遍历<\/label>\n        <select id=\"trMode\">\n          <option value=\"pre\">先序遍历（根 → 左 → 右）<\/option>\n          <option value=\"in\" selected>中序遍历（左 → 根 → 右）<\/option>\n          <option value=\"post\">后序遍历（左 → 右 → 根）<\/option>\n          <option value=\"level\">层序遍历（逐层从左到右）<\/option>\n        <\/select>\n        <button class=\"btn\" id=\"trPlay\">自动播放<\/button>\n        <button class=\"btn gh\" id=\"trStep\">下一步 ▸<\/button>\n        <button class=\"btn gy\" id=\"trReset\">重置<\/button>\n      <\/div>\n      <div id=\"trStage\"><\/div>\n      <div id=\"trOut\" style=\"margin-top:16px\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 11 · 二叉排序树操作台：插入、删除、查找<span class=\"tag\">增 · 删 · 查<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>值<\/label><input type=\"number\" id=\"bstVal\" value=\"45\" style=\"width:76px\">\n        <button class=\"btn\" id=\"bstIns\">插入<\/button>\n        <button class=\"btn rd\" id=\"bstDel\">删除<\/button>\n        <button class=\"btn gh\" id=\"bstFind\">查找<\/button>\n        <button class=\"btn gy\" id=\"bstReset\">重置<\/button>\n      <\/div>\n      <div id=\"bstStage\"><\/div>\n      <div id=\"bstCode\" style=\"margin-top:14px\"><\/div>\n      <div id=\"bstLog\" style=\"margin-top:12px\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 12 · 平衡二叉树 AVL：四种旋转亲眼转一遍<span class=\"tag\">重点 · 最高频<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>插入值<\/label><input type=\"number\" id=\"avlVal\" value=\"30\" style=\"width:76px\">\n        <button class=\"btn\" id=\"avlIns\">插入并自动平衡<\/button>\n        <button class=\"btn gh sm\" data-avl=\"ll\">LL 示例（3,2,1）<\/button>\n        <button class=\"btn gh sm\" data-avl=\"rr\">RR 示例（1,2,3）<\/button>\n        <button class=\"btn gh sm\" data-avl=\"lr\">LR 示例（3,1,2）<\/button>\n        <button class=\"btn gh sm\" data-avl=\"rl\">RL 示例（1,3,2）<\/button>\n        <button class=\"btn gy\" id=\"avlReset\">清空<\/button>\n      <\/div>\n      <div id=\"avlStage\"><\/div>\n      <div id=\"avlLog\" style=\"margin-top:12px\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 13 · 大根堆操作台：上浮与下沉<span class=\"tag\">插入 · 删除堆顶 · 建堆<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>值<\/label><input type=\"number\" id=\"hpVal\" value=\"60\" style=\"width:76px\">\n        <button class=\"btn\" id=\"hpIns\">插入（上浮）<\/button>\n        <button class=\"btn rd\" id=\"hpDel\">删除堆顶（下沉）<\/button>\n        <button class=\"btn gh sm\" id=\"hpBuild\">一键建堆（乱序数组）<\/button>\n        <button class=\"btn gy\" id=\"hpReset\">重置<\/button>\n      <\/div>\n      <div id=\"hpStage\"><\/div>\n      <div id=\"hpLog\" style=\"margin-top:12px\"><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- ==================== 第 5 章 ==================== -->\n<section class=\"sec\" id=\"d5\">\n  <div class=\"sec-head\">\n    <span class=\"sec-num\">CHAPTER 05<\/span>\n    <h2>图<\/h2>\n    <span class=\"weight w3\">核心 · 7-10 分<\/span>\n  <\/div>\n\n  <div class=\"tip i\"><span class=\"ti\">本章定位<\/span><span>算法最多、手算量最大的一章。考点分三块：<b>存储结构的选择与度/边数计算<\/b>（送分）、<b>两种遍历<\/b>（常考序列不唯一的判断）、<b>四个经典算法<\/b>（Prim / Kruskal / Dijkstra / Floyd）与<b>拓扑排序、关键路径<\/b>。大题几乎必然要你<b>手写算法执行过程<\/b>，所以下面每个算法都做了逐步演示。<\/span><\/div>\n\n  <div class=\"sub\">考点清单<\/div>\n  <div class=\"grid g2\">\n    <div class=\"card\">\n      <h4>1. 基本概念与几个数 <span class=\"pt\">必背<\/span><\/h4>\n      <div class=\"fm\">无向完全图边数 = n(n−1)/2\n有向完全图边数 = n(n−1)\n连通图最少边数 = n−1（就是树）\n强连通图最少边数 = n（构成环）\n无向图所有顶点度数之和 = 2 × 边数\n有向图：所有顶点入度之和 = 出度之和 = 边数\n\nn 个顶点的无向图，若边数 &gt; (n−1)(n−2)/2 则一定连通<\/div>\n      <div class=\"tip s\"><span class=\"ti\">握手定理<\/span><span>「度数之和 = 2 × 边数」这一条用得最多，几乎每道图的概念题都会用到。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>2. 两种存储结构 <span class=\"pt hot\">必考<\/span><\/h4>\n      <table class=\"tb\">\n        <tr><th><\/th><th>邻接矩阵<\/th><th>邻接表<\/th><\/tr>\n        <tr><td>空间<\/td><td>O(n²)<\/td><td>O(n + e)<\/td><\/tr>\n        <tr><td>适合<\/td><td><b>稠密图<\/b><\/td><td><b>稀疏图<\/b><\/td><\/tr>\n        <tr><td>判断两点相邻<\/td><td>O(1)<\/td><td>O(度)<\/td><\/tr>\n        <tr><td>求某点所有邻接点<\/td><td>O(n)<\/td><td>O(度)<\/td><\/tr>\n        <tr><td>无向图度<\/td><td>该行非零元个数<\/td><td>该行结点个数<\/td><\/tr>\n        <tr><td>有向图出/入度<\/td><td>行和 / 列和<\/td><td>出度看本行；<b>入度要遍历整个表<\/b><\/td><\/tr>\n      <\/table>\n      <div class=\"tip m\"><span class=\"ti\">记忆<\/span><span>邻接矩阵的<b>每一行之和是该顶点的出度<\/b>，<b>每一列之和是入度<\/b>。无向图的邻接矩阵<b>对称<\/b>，第 i 行之和就是顶点 i 的度。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>3. 十字链表与邻接多重表<\/h4>\n      <ul>\n        <li><b>十字链表<\/b>：用于有向图。每个顶点有 firstin / firstout，每条边有 tail/head/hlink/tlink。<b>求入度和出度都方便<\/b><\/li>\n        <li><b>邻接多重表<\/b>：用于无向图。每条边只存一个结点（而不是邻接表里的两个），<b>便于删除边<\/b><\/li>\n        <li>这两个结构考试一般只考概念和适用场景，不要求手写<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <h4>4. 两种遍历 <span class=\"pt hot\">必考<\/span><\/h4>\n      <table class=\"tb\">\n        <tr><th><\/th><th>BFS 广度优先<\/th><th>DFS 深度优先<\/th><\/tr>\n        <tr><td>辅助结构<\/td><td><b>队列<\/b><\/td><td><b>栈<\/b>（或递归）<\/td><\/tr>\n        <tr><td>类比<\/td><td>树的层序遍历<\/td><td>树的先序遍历<\/td><\/tr>\n        <tr><td>应用<\/td><td><b>无权图单源最短路径<\/b><\/td><td>连通性判断、拓扑排序<\/td><\/tr>\n      <\/table>\n      <div class=\"fm a\">复杂度（邻接表）\nBFS / DFS 均为 O(n + e)\n（邻接矩阵则是 O(n²)，因为要找邻接点必须扫一整行）<\/div>\n      <div class=\"tip e\"><span class=\"ti\">高频考点<\/span><span><b>邻接矩阵的遍历序列唯一，邻接表的遍历序列不唯一<\/b>。原因：邻接矩阵的邻接点顺序固定（按顶点编号），而邻接表里结点的次序取决于<b>边的插入顺序<\/b>。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>5. 最小生成树 Prim vs Kruskal <span class=\"pt hot\">必考<\/span><\/h4>\n      <table class=\"tb\">\n        <tr><th><\/th><th>Prim<\/th><th>Kruskal<\/th><\/tr>\n        <tr><td>思路<\/td><td>从<b>顶点<\/b>出发，每次加一条连接「已选集合」与外界的最短边<\/td><td>从<b>边<\/b>出发，每次选权值最小的边，不成环就加入<\/td><\/tr>\n        <tr><td>复杂度<\/td><td>O(n²)<\/td><td>O(e log e)<\/td><\/tr>\n        <tr><td>适合<\/td><td><b>稠密图<\/b><\/td><td><b>稀疏图<\/b><\/td><\/tr>\n        <tr><td>辅助结构<\/td><td>lowcost 数组<\/td><td><b>并查集<\/b>（判环）<\/td><\/tr>\n      <\/table>\n      <div class=\"tip s\"><span class=\"ti\">结论<\/span><span>最小生成树的<b>总权值唯一<\/b>，但<b>树本身可能不唯一<\/b>（当存在相同权值的边时）。这一点常考判断题。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>6. 最短路径 Dijkstra vs Floyd <span class=\"pt hot\">大题常客<\/span><\/h4>\n      <table class=\"tb\">\n        <tr><th><\/th><th>Dijkstra<\/th><th>Floyd<\/th><\/tr>\n        <tr><td>求什么<\/td><td><b>单源<\/b>到其余各点<\/td><td><b>任意两点<\/b>之间<\/td><\/tr>\n        <tr><td>思路<\/td><td>贪心，每次确定一个最近的点<\/td><td>动态规划，三层循环<\/td><\/tr>\n        <tr><td>复杂度<\/td><td>O(n²)<\/td><td>O(n³)<\/td><\/tr>\n        <tr><td>负权<\/td><td><b>不允许<\/b><\/td><td><b>允许<\/b>（不能有负权回路）<\/td><\/tr>\n      <\/table>\n      <div class=\"fm b\">Floyd 的核心三行\nfor (k = 0; k &lt; n; k++)\n  for (i = 0; i &lt; n; i++)\n    for (j = 0; j &lt; n; j++)\n      if (A[i][j] &gt; A[i][k] + A[k][j])\n          A[i][j] = A[i][k] + A[k][j];<\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>7. 拓扑排序（AOV 网）<\/h4>\n      <div class=\"fm g\">AOV 网：顶点表示活动，边表示先后关系\n拓扑排序：排出一个线性序列，使所有边都从前指向后\n\n步骤\n① 找一个入度为 0 的顶点，输出\n② 删除该顶点及它的所有出边\n③ 重复①②直到全部输出\n\n若最后还有顶点没输出 → <b>图中存在环<\/b><\/div>\n      <ul>\n        <li>拓扑序列<b>可能不唯一<\/b><\/li>\n        <li>用<b>栈或队列<\/b>都可以实现<\/li>\n        <li>应用：课程安排、编译依赖、任务调度<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <h4>8. 关键路径（AOE 网）<\/h4>\n      <div class=\"fm p\">AOE 网：边表示活动（带权=持续时间），顶点表示事件\n\n四个量（ve 最早、vl 最迟）\n  ve(j) = max{ ve(i) + w(i,j) }   ← 正向推，取最大\n  vl(i) = min{ vl(j) − w(i,j) }   ← 逆向推，取最小\n\n活动的四个量\n  e(i) = ve(起点)          活动最早开始\n  l(i) = vl(终点) − w      活动最迟开始\n  <b>时间余量 d(i) = l(i) − e(i)<\/b>\n  d(i) = 0 的活动就是<b>关键活动<\/b>\n\n关键路径 = 从源点到汇点的最长路径\n关键路径的长度 = 完成整个工程的最短时间<\/div>\n      <div class=\"tip e\"><span class=\"ti\">易混<\/span><span>关键路径是<b>最长<\/b>路径，但它决定了工程的<b>最短<\/b>完成时间 —— 因为所有活动都得等最慢的那条链走完。另外关键路径<b>可能不唯一<\/b>，缩短关键活动<b>不一定<\/b>能缩短总工期（可能变成新的关键路径）。<\/span><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"sub a\">原理动画<\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 14 · 图的操作台：加边、删边、BFS、DFS<span class=\"tag\">增 · 删 · 查（遍历）<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>起点<\/label><input type=\"number\" id=\"gpA\" value=\"0\" min=\"0\" max=\"5\" style=\"width:56px\">\n        <label>终点<\/label><input type=\"number\" id=\"gpB\" value=\"3\" min=\"0\" max=\"5\" style=\"width:56px\">\n        <button class=\"btn\" id=\"gpAdd\">加边<\/button>\n        <button class=\"btn rd\" id=\"gpDel\">删边<\/button>\n        <label style=\"margin-left:6px\">遍历起点<\/label>\n        <input type=\"number\" id=\"gpStart\" value=\"0\" min=\"0\" max=\"5\" style=\"width:56px\">\n        <button class=\"btn gh\" id=\"gpBFS\">BFS<\/button>\n        <button class=\"btn gh\" id=\"gpDFS\">DFS<\/button>\n        <button class=\"btn gy\" id=\"gpReset\">重置<\/button>\n      <\/div>\n      <div id=\"gpStage\"><\/div>\n      <div id=\"gpOut\" style=\"margin-top:16px\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 15 · 最短路径 Dijkstra：逐步确定最近的顶点<span class=\"tag\">重点 · 可改起点<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>源点<\/label>\n        <select id=\"djStart\"><option value=\"0\" selected>V0<\/option><option value=\"1\">V1<\/option><option value=\"2\">V2<\/option><option value=\"3\">V3<\/option><option value=\"4\">V4<\/option><option value=\"5\">V5<\/option><\/select>\n        <button class=\"btn\" id=\"djRun\">逐步执行<\/button>\n        <button class=\"btn gy\" id=\"djReset\">重置<\/button>\n      <\/div>\n      <div id=\"djStage\"><\/div>\n      <div id=\"djOut\" style=\"margin-top:16px\"><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- ==================== 第 6 章 ==================== -->\n<section class=\"sec\" id=\"d6\">\n  <div class=\"sec-head\">\n    <span class=\"sec-num\">CHAPTER 06<\/span>\n    <h2>查找<\/h2>\n    <span class=\"weight w2\">主力 · 5-7 分<\/span>\n  <\/div>\n\n  <div class=\"tip i\"><span class=\"ti\">本章定位<\/span><span>考点很集中：<b>折半查找的判定树与比较次数<\/b>、<b>B 树的插入删除<\/b>、<b>散列表的 ASL 计算<\/b>。这三块都有固定套路，属于「练熟就拿满」的题。B 树那一块概念多，重点记阶数与结点数上下限。<\/span><\/div>\n\n  <div class=\"sub\">考点清单<\/div>\n  <div class=\"grid g2\">\n    <div class=\"card\">\n      <h4>1. 顺序查找与折半查找 <span class=\"pt hot\">必考<\/span><\/h4>\n      <div class=\"fm\">顺序查找\n  成功 ASL = (n+1)/2\n  优点：对存储结构无要求、不要求有序\n  缺点：慢\n\n折半查找（二分查找）\n  <b>前提：必须是有序表 + 顺序存储<\/b>\n  每次比较中间元素，砍掉一半\n  成功 ASL ≈ log₂(n+1) − 1\n  最多比较 ⌊log₂n⌋ + 1 次\n  时间 O(log n)<\/div>\n      <div class=\"tip e\"><span class=\"ti\">最容易错的<\/span><span><b>折半查找不能用链表<\/b> —— 因为要随机访问中间元素，链表做不到。这是经典送分判断。另外折半查找只适合<b>静态<\/b>查找表（频繁插入删除时维护有序性代价太高）。<\/span><\/div>\n      <div class=\"fm g\">折半查找的判定树\n  是一棵平衡二叉树\n  第 k 层最多 2^(k−1) 个结点\n  n 个元素时树高 = ⌊log₂n⌋ + 1\n  查找失败时的比较次数 = 树高（或树高 −1）<\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>2. 分块查找<\/h4>\n      <ul>\n        <li>把表分成若干块，<b>块内无序、块间有序<\/b>（前一块的最大值小于后一块的最小值）<\/li>\n        <li>先查索引表确定块（折半或顺序），再在块内顺序查找<\/li>\n        <li>平均查找长度 = 索引查找 + 块内查找<\/li>\n        <li>当块数 = 每块元素数 = √n 时，ASL 最小 ≈ √n + 1<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <h4>3. B 树 <span class=\"pt hot\">重难点<\/span><\/h4>\n      <div class=\"fm\">m 阶 B 树的要求\n  每个结点最多有 <b>m<\/b> 棵子树、<b>m−1<\/b> 个关键字\n  根结点至少 <b>2<\/b> 棵子树（除非它本身就是叶子）\n  非根内部结点至少 <b>⌈m/2⌉<\/b> 棵子树\n  所有叶结点都在<b>同一层<\/b>（绝对平衡）\n  结点内关键字<b>有序排列<\/b><\/div>\n      <div class=\"fm a\">插入：可能引发「分裂」\n  先按查找路径插到叶子结点\n  若超出 m−1 个关键字 → 从中间位置分成两半，\n  <b>中间元素上移到双亲<\/b>，可能继续向上分裂\n  若根也分裂 → 树高 +1<\/div>\n      <div class=\"fm p\">删除：分三种情况\n  ① 在非叶结点 → 用直接前驱（左子树最右）或\n     直接后继（右子树最左）替代，转为删叶子\n  ② 删后关键字数 ≥ ⌈m/2⌉−1 → 直接删\n  ③ 不够借 → 先向兄弟「借」（旋转），\n     兄弟也紧张就<b>与兄弟合并<\/b>，可能向上蔓延<\/div>\n      <div class=\"tip s\"><span class=\"ti\">B 树高度<\/span><span>n 个关键字的 m 阶 B 树，高度 h 的范围大约是\n        log<sub>m<\/sub>(n+1) ≤ h ≤ log<sub>⌈m/2⌉<\/sub>((n+1)/2) + 1。<b>把上下限的推导当成公式记<\/b>，考试常给 n 和 m 让你估算高度。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>4. B+ 树 vs B 树<\/h4>\n      <table class=\"tb\">\n        <tr><th><\/th><th>B 树<\/th><th>B+ 树<\/th><\/tr>\n        <tr><td>关键字存放<\/td><td>每个结点都存数据<\/td><td><b>只有叶子存数据<\/b>，内部结点只做索引<\/td><\/tr>\n        <tr><td>关键字个数<\/td><td>n 棵子树有 n−1 个关键字<\/td><td>n 棵子树有 <b>n<\/b> 个关键字<\/td><\/tr>\n        <tr><td>叶子间<\/td><td>无连接<\/td><td><b>用指针串成有序链表<\/b><\/td><\/tr>\n        <tr><td>查找<\/td><td>可能中途命中<\/td><td><b>必须走到叶子<\/b>（稳定）<\/td><\/tr>\n        <tr><td>适用<\/td><td>文件索引<\/td><td><b>数据库索引<\/b>（范围查询快）<\/td><\/tr>\n      <\/table>\n    <\/div>\n    <div class=\"card\">\n      <h4>5. 散列表 <span class=\"pt hot\">计算题<\/span><\/h4>\n      <div class=\"fm\">哈希函数（最常用「除留余数法」）\n  H(key) = key mod p\n  p 一般取<b>不大于表长的最大质数<\/b>\n\n装填因子 α = 表中记录数 n ÷ 表长 m\n<b>α 越大冲突越多<\/b>（ASL 只与 α 有关，与 n、m 绝对值无关）<\/div>\n      <div class=\"fm a\">冲突处理（两种大类）\n\n① 开放地址法\n   线性探测：H+1, H+2, H+3 …（会产生「堆积」）\n   二次探测：H+1², H−1², H+2², H−2² …\n   再散列法：用第二个哈希函数\n   伪随机序列法\n\n② 拉链法（链地址法）\n   每个地址挂一个链表，冲突元素直接链上去\n   优点：<b>不产生堆积、删除方便<\/b>\n   适合表长不确定的情况<\/div>\n      <div class=\"tip e\"><span class=\"ti\">ASL 怎么算<\/span><span>分别统计<b>查找成功<\/b>和<b>查找失败<\/b>的平均比较次数。<b>查找失败时，探测到空位置才算一次失败查找<\/b> —— 所以分母是「哈希函数值域的大小」，不是 n。这是最容易算错的地方，下面的操作台会直接给出结果供你核对。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>6. 四种查找的复杂度对比<\/h4>\n      <table class=\"tb\">\n        <tr><th>结构<\/th><th>查找<\/th><th>插入删除<\/th><th>适用<\/th><\/tr>\n        <tr><td>顺序表<\/td><td>O(n)<\/td><td>O(n)<\/td><td>n 很小或无序<\/td><\/tr>\n        <tr><td>有序表（折半）<\/td><td><b>O(log n)<\/b><\/td><td>O(n)<\/td><td>静态查找<\/td><\/tr>\n        <tr><td>BST / AVL<\/td><td><b>O(log n)<\/b> 平均<br><span style=\"color:#8b95a3\">BST 最坏 O(n)<\/span><\/td><td>O(log n)<\/td><td><b>动态查找<\/b><\/td><\/tr>\n        <tr><td>B 树 / B+ 树<\/td><td>O(log n)<\/td><td>O(log n)<\/td><td><b>外存索引<\/b><\/td><\/tr>\n        <tr><td>散列表<\/td><td><b>O(1)<\/b> 平均<\/td><td>O(1) 平均<\/td><td>等值查找<\/td><\/tr>\n      <\/table>\n      <div class=\"tip i\"><span class=\"ti\">与 OS 的接口<\/span><span>B+ 树是数据库和文件系统索引的主力结构（如 MySQL 的 InnoDB 索引）—— 原因是它<b>叶子链表便于范围查询<\/b>，且树高低、读盘次数少。<\/span><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"sub a\">原理动画<\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 16 · 折半查找：判定树怎么长出来的<span class=\"tag\">查 · 逐个比较<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>查找目标<\/label><input type=\"number\" id=\"bsTarget\" value=\"47\" style=\"width:76px\">\n        <button class=\"btn\" id=\"bsRun\">开始查找<\/button>\n        <button class=\"btn gh sm\" data-bs=\"23\">找 23（在左半）<\/button>\n        <button class=\"btn gh sm\" data-bs=\"88\">找 88（在右半）<\/button>\n        <button class=\"btn gh sm\" data-bs=\"99\">找 99（不存在）<\/button>\n        <button class=\"btn gy\" id=\"bsReset\">重置<\/button>\n      <\/div>\n      <div id=\"bsStage\"><\/div>\n      <div id=\"bsOut\" style=\"margin-top:16px\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 17 · 散列表操作台：冲突怎么解决<span class=\"tag\">增 · 删 · 查<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>关键字<\/label><input type=\"number\" id=\"hsVal\" value=\"25\" style=\"width:76px\">\n        <label>表长 m<\/label><input type=\"number\" id=\"hsM\" value=\"11\" min=\"7\" max=\"19\" style=\"width:60px\">\n        <label>冲突处理<\/label>\n        <select id=\"hsMode\">\n          <option value=\"linear\" selected>线性探测法<\/option>\n          <option value=\"chain\">拉链法<\/option>\n        <\/select>\n      <\/div>\n      <div class=\"ctl\">\n        <button class=\"btn\" id=\"hsIns\">插入<\/button>\n        <button class=\"btn rd\" id=\"hsDel\">删除<\/button>\n        <button class=\"btn gh\" id=\"hsFind\">查找<\/button>\n        <button class=\"btn gh sm\" id=\"hsDemo\">一键插入示例数据<\/button>\n        <button class=\"btn gy\" id=\"hsReset\">重置<\/button>\n      <\/div>\n      <div id=\"hsStage\"><\/div>\n      <div id=\"hsLog\" style=\"margin-top:12px\"><\/div>\n      <div id=\"hsOut\" style=\"margin-top:16px\"><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- ==================== 第 7 章 ==================== -->\n<section class=\"sec\" id=\"d7\">\n  <div class=\"sec-head\">\n    <span class=\"sec-num\">CHAPTER 07<\/span>\n    <h2>排序<\/h2>\n    <span class=\"weight w3\">核心 · 7-9 分<\/span>\n  <\/div>\n\n  <div class=\"tip i\"><span class=\"ti\">本章定位<\/span><span>考点最「标准化」的一章：<b>给定序列，写出某算法第 k 趟的结果<\/b>，以及<b>复杂度与稳定性的对比<\/b>。这些题只要记住了过程就一定能做对，属于必拿分。下面做了可切换算法的排序演示台，建议先用笔算一遍再点动画核对。<\/span><\/div>\n\n  <div class=\"sub\">考点清单<\/div>\n  <div class=\"grid g2\">\n    <div class=\"card\">\n      <h4>1. 五大类排序与过程<\/h4>\n      <div class=\"fm\">插入类\n  直接插入：把第 i 个元素插入前面已排好的序列\n  折半插入：用折半查找找插入位置（移动次数不变）\n  <b>希尔排序<\/b>：按增量分组插入排序，增量逐步减到 1\n\n交换类\n  冒泡排序：相邻两两比较，每趟把最大/最小「冒」到末尾\n  <b>快速排序<\/b>：选枢轴，一趟划分成「小 | 枢轴 | 大」，再递归\n\n选择类\n  简单选择：每趟选最小的放到前面\n  <b>堆排序<\/b>：建大根堆，反复取堆顶与末尾交换再调整\n\n归并类\n  <b>二路归并<\/b>：相邻两两合并成有序段，段长翻倍\n\n基数类\n  <b>基数排序<\/b>：按位从低位到高位分配 + 收集<\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>2. 复杂度与稳定性总表 <span class=\"pt hot\">必背<\/span><\/h4>\n      <table class=\"tb\">\n        <tr><th>算法<\/th><th>平均<\/th><th>最好<\/th><th>最坏<\/th><th>空间<\/th><th>稳定<\/th><\/tr>\n        <tr><td>直接插入<\/td><td>O(n²)<\/td><td>O(n)<\/td><td>O(n²)<\/td><td>O(1)<\/td><td><b>是<\/b><\/td><\/tr>\n        <tr><td>希尔<\/td><td>O(n^1.3)<\/td><td>—<\/td><td>—<\/td><td>O(1)<\/td><td>否<\/td><\/tr>\n        <tr><td>冒泡<\/td><td>O(n²)<\/td><td><b>O(n)<\/b><\/td><td>O(n²)<\/td><td>O(1)<\/td><td><b>是<\/b><\/td><\/tr>\n        <tr><td>快速<\/td><td><b>O(n log n)<\/b><\/td><td>O(n log n)<\/td><td><b>O(n²)<\/b><\/td><td>O(log n)<\/td><td>否<\/td><\/tr>\n        <tr><td>简单选择<\/td><td>O(n²)<\/td><td>O(n²)<\/td><td>O(n²)<\/td><td>O(1)<\/td><td>否<\/td><\/tr>\n        <tr><td>堆排序<\/td><td>O(n log n)<\/td><td>O(n log n)<\/td><td>O(n log n)<\/td><td>O(1)<\/td><td>否<\/td><\/tr>\n        <tr><td>归并<\/td><td>O(n log n)<\/td><td>O(n log n)<\/td><td>O(n log n)<\/td><td><b>O(n)<\/b><\/td><td><b>是<\/b><\/td><\/tr>\n        <tr><td>基数<\/td><td>O(d(n+r))<\/td><td>—<\/td><td>—<\/td><td>O(r)<\/td><td><b>是<\/b><\/td><\/tr>\n      <\/table>\n      <div class=\"tip s\"><span class=\"ti\">记忆口诀<\/span><span>\n        <b>稳定的<\/b>：插入、冒泡、归并、基数（「插冒归基」）。<br>\n        <b>不稳定的<\/b>：希尔、快速、选择、堆（「希快选堆」）。<br>\n        <b>最坏 O(n²) 的<\/b>：插入、冒泡、快速、选择。<br>\n        <b>空间 O(n) 的<\/b>：只有归并（基数排序是 O(r)）。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>3. 几个高频细节<\/h4>\n      <ul>\n        <li><b>快排最坏情况<\/b>：序列<b>基本有序<\/b>时退化为 O(n²)（每次划分只分出一个元素）<\/li>\n        <li><b>快排空间<\/b>：递归栈深度，平均 O(log n)，最坏 O(n)<\/li>\n        <li><b>堆排序<\/b>：建堆 O(n)，每次调整 O(log n)，共 n−1 次 → O(n log n)<\/li>\n        <li><b>冒泡最好 O(n)<\/b>：加了「本趟无交换就结束」的标志<\/li>\n        <li><b>每趟确定一个元素最终位置<\/b>的算法：冒泡、快速、简单选择、堆排序<\/li>\n        <li><b>归并排序<\/b>每趟只是让有序段变长，<b>不能确定某个元素在最终位置<\/b><\/li>\n      <\/ul>\n      <div class=\"tip m\"><span class=\"ti\">秒杀技巧<\/span><span>题目给你一个序列和「第 2 趟排序后的结果」，问用的什么算法 ——\n        就看<b>这趟确定了几个元素的最终位置<\/b>。确定 1 个且已排好的在端部 → 冒泡/选择；在中间 → 快排；一个都没确定、只是段变长 → 归并。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>4. 外部排序<\/h4>\n      <ul>\n        <li>用于数据量太大、内存装不下的场景（数据存在磁盘上）<\/li>\n        <li>时间主要花在<b>磁盘读写（I/O）<\/b>上，而不是比较<\/li>\n        <li>两阶段：<b>内部排序生成初始归并段<\/b> → <b>多趟归并<\/b><\/li>\n        <li><b>多路平衡归并<\/b>：k 路归并减少归并趟数。归并趟数 = ⌈log<sub>k<\/sub>m⌉（m 为初始归并段数）<\/li>\n        <li><b>败者树<\/b>：k 路归并时找最小元素从 O(k) 降到 O(log k)<\/li>\n        <li><b>置换-选择排序<\/b>：生成更长的初始归并段，减少段数<\/li>\n        <li><b>最佳归并树<\/b>：用哈夫曼树思想组织归并顺序，使 I/O 最少<\/li>\n      <\/ul>\n      <div class=\"tip s\"><span class=\"ti\">核心结论<\/span><span>增加归并路数 k 可以减少归并趟数，从而<b>减少磁盘 I/O 次数<\/b>；但 k 太大时内部比较开销上升，所以用<b>败者树<\/b>来平衡。<\/span><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"sub a\">原理动画<\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 18 · 排序演示台：八种算法并排看<span class=\"tag\">可改数据 · 逐步播放<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>待排序列<\/label><input type=\"text\" id=\"soData\" value=\"49,38,65,97,76,13,27,49\" style=\"width:240px\">\n        <button class=\"btn gh sm\" data-so=\"49,38,65,97,76,13,27,49\">经典例题<\/button>\n        <button class=\"btn gh sm\" data-so=\"5,4,3,2,1\">逆序<\/button>\n        <button class=\"btn gh sm\" data-so=\"1,2,3,4,5\">已有序<\/button>\n      <\/div>\n      <div class=\"ctl\">\n        <label>算法<\/label>\n        <select id=\"soAlgo\">\n          <option value=\"insert\" selected>直接插入排序<\/option>\n          <option value=\"shell\">希尔排序<\/option>\n          <option value=\"bubble\">冒泡排序<\/option>\n          <option value=\"quick\">快速排序<\/option>\n          <option value=\"select\">简单选择排序<\/option>\n          <option value=\"heap\">堆排序<\/option>\n          <option value=\"merge\">二路归并排序<\/option>\n          <option value=\"radix\">基数排序<\/option>\n        <\/select>\n        <button class=\"btn\" id=\"soPlay\">播放<\/button>\n        <button class=\"btn gh\" id=\"soNext\">下一步 ▸<\/button>\n        <button class=\"btn gy\" id=\"soReset\">重置<\/button>\n      <\/div>\n      <div id=\"soStage\"><\/div>\n      <div id=\"soOut\" style=\"margin-top:16px\"><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- ##INSERT## -->\n\n<footer>\n  408 数据结构 · 交互式原理全景<br>\n  分值分布按历年统考真题的常见情况估计，用于确定复习优先级，非官方数据。\n<\/footer>\n<\/main>\n<\/div>\n\n<div class=\"totop\" id=\"totop\">↑<\/div>\n\n<script>\n/* ============================================================\n   动画速度总控\n   页面里所有动画的 setTimeout / setInterval 延迟都统一乘这个倍率。\n   只放大 300~2000ms 区间（动画用到的范围），不影响其它短延迟逻辑。\n   ============================================================ */\nlet ANIM_SPEED = 1.7;                    // 1 = 原始速度，越大越慢\n(function(){\n  const _st = window.setTimeout.bind(window);\n  const _si = window.setInterval.bind(window);\n  const scale = ms => (typeof ms === 'number' && ms >= 300 && ms <= 2000)\n    ? Math.round(ms * ANIM_SPEED) : ms;\n  window.setTimeout = function(fn, ms){ return _st(fn, scale(ms)); };\n  window.setInterval = function(fn, ms){ return _si(fn, scale(ms)); };\n})();\n\n/* ============================================================\n   通用工具\n   ============================================================ */\nconst $ = id => document.getElementById(id);\nconst qsa = s => Array.prototype.slice.call(document.querySelectorAll(s));\n\n/* 速度切换 */\nqsa('[data-sp]').forEach(b=>{\n  b.onclick = ()=>{\n    ANIM_SPEED = parseFloat(b.dataset.sp) || 1.7;\n    qsa('[data-sp]').forEach(x=>x.classList.toggle('on', x === b));\n  };\n});\n\nwindow.addEventListener('scroll', ()=>{\n  const h = document.documentElement.scrollHeight - window.innerHeight;\n  $('progress').style.width = (h>0 ? (window.scrollY/h*100) : 0) + '%';\n  $('totop').classList.toggle('on', window.scrollY > 500);\n});\n$('totop').onclick = ()=>window.scrollTo({top:0,behavior:'smooth'});\n\n/* ---------- 小屏抽屉导航 ---------- */\n(function(){\n  const btn = $('navbtn'), side = document.querySelector('.sidebar'), scrim = $('scrim');\n  if(!btn || !side || !scrim) return;\n  function close(){\n    side.classList.remove('open'); scrim.classList.remove('on');\n    btn.classList.remove('on'); btn.setAttribute('aria-expanded','false');\n  }\n  function open(){\n    side.classList.add('open'); scrim.classList.add('on');\n    btn.classList.add('on'); btn.setAttribute('aria-expanded','true');\n  }\n  btn.onclick = ()=>{ side.classList.contains('open') ? close() : open(); };\n  scrim.onclick = close;\n  qsa('.nav-i').forEach(a=>a.addEventListener('click', close));\n  document.addEventListener('keydown', e=>{ if(e.key === 'Escape') close(); });\n  window.addEventListener('resize', ()=>{ if(window.innerWidth > 980) close(); });\n\n  /* 顶部条上的「当前章节」按滚动位置算，跳转后不会滞后 */\n  function syncTitle(){\n    const t = document.querySelector('.mtop-t');\n    if(!t) return;\n    const secs = qsa('section.sec');\n    let cur = secs[0];\n    for(let i = 0; i < secs.length; i++){ if(secs[i].getBoundingClientRect().top <= 96) cur = secs[i]; }\n    const link = qsa('.nav-i').filter(a=>a.getAttribute('href') === '#'+cur.id)[0];\n    if(link) t.textContent = t.dataset.subj + ' · ' + link.querySelector('span').textContent;\n  }\n  window.addEventListener('scroll', syncTitle, {passive:true});\n  syncTitle();\n})();\n\nconst navLinks = qsa('.nav-i');\nconst secs = qsa('.sec');\nconst obs = new IntersectionObserver(es=>{\n  es.forEach(e=>{\n    if(e.isIntersecting){\n      const cur = navLinks.filter(a=>a.getAttribute('href') === '#'+e.target.id)[0];\n      navLinks.forEach(a=>a.classList.toggle('on', a === cur));\n    }\n  });\n},{rootMargin:'-15% 0px -70% 0px'});\nsecs.forEach(s=>obs.observe(s));\n\n/* 分值权重条形入场动画 */\nsetTimeout(()=>{ qsa('.rank-bar i, .rank-sum-bar i').forEach(f=>f.style.width = f.dataset.w + '%'); }, 300);\n\n/* ============================================================\n   通用：渲染一个\"操作台\"的日志与伪代码\n   ============================================================ */\nfunction renderLog(id, lines){\n  const el = $(id);\n  if(!el) return;\n  el.innerHTML = lines.length\n    ? `<div class=\"logbox\">${lines.slice(-14).map(l=>\n        `<span class=\"lg ${l.k||''}\">${l.t}<\/span>`).join('')}<\/div>`\n    : '<div class=\"tip i\"><span class=\"ti\">操作日志<\/span><span>点上方的按钮做一次操作，这里会记录每一步发生了什么。<\/span><\/div>';\n}\nfunction renderCode(id, lines, active){\n  const el = $(id);\n  if(!el) return;\n  el.innerHTML = `<div class=\"code\">${lines.map((l,i)=>\n    `<span class=\"ln${i===active?' on':''}\">${l}<\/span>`).join('')}<\/div>`;\n}\n\n/* ============================================================\n   动画 19 · 复杂度增长曲线\n   ============================================================ */\nconst CX_FUNCS = [\n  { name:'O(1)',      f:()=>1,                 c:'#94a3b8' },\n  { name:'O(log n)',  f:x=>Math.log2(x),       c:'#0891b2' },\n  { name:'O(n)',      f:x=>x,                  c:'#15803d' },\n  { name:'O(n log n)',f:x=>x*Math.log2(x),     c:'#d97706' },\n  { name:'O(n²)',     f:x=>x*x,                c:'#dc2626' }\n];\nconst CX_MAXN = 200, CX_YMAX = 40000;\nfunction renderCx(){\n  const n = +$('cxN').value;\n  $('cxNv').textContent = n;\n  const W=640, H=270, PL=58, PB=30, PT=16, PR=18;\n  const logMin = 0, logMax = Math.log10(CX_YMAX);\n  const X = v => PL + (v - 2) / (CX_MAXN - 2) * (W - PL - PR);\n  const Y = v => H - PB - (Math.log10(Math.max(1, v)) - logMin) / (logMax - logMin) * (H - PB - PT);\n\n  // 网格线（对数刻度）\n  const ticks = [1, 10, 100, 1000, 10000];\n  let grid = ticks.map(t=>`\n    <line x1=\"${PL}\" y1=\"${Y(t)}\" x2=\"${W-PR}\" y2=\"${Y(t)}\" stroke=\"#eeecf5\" stroke-width=\"1\"/>\n    <text x=\"${PL-8}\" y=\"${Y(t)+4}\" text-anchor=\"end\" font-size=\"10\" fill=\"#a49db8\">${t>=1000?(t/1000)+'k':t}<\/text>`).join('');\n\n  let paths = '';\n  CX_FUNCS.forEach(fn=>{\n    let d = '';\n    for(let i=2;i<=CX_MAXN;i++){\n      const v = Math.min(fn.f(i), CX_YMAX);\n      d += (i===2?'M':'L') + X(i).toFixed(1) + ',' + Y(v).toFixed(1) + ' ';\n    }\n    paths += `<path d=\"${d}\" fill=\"none\" stroke=\"${fn.c}\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/>`;\n    const yv = Math.min(fn.f(n), CX_YMAX);\n    paths += `<circle cx=\"${X(n)}\" cy=\"${Y(yv)}\" r=\"4.5\" fill=\"${fn.c}\"/>`;\n  });\n\n  const xTicks = [2,50,100,150,200].map(t=>\n    `<text x=\"${X(t)}\" y=\"${H-PB+18}\" text-anchor=\"middle\" font-size=\"10\" fill=\"#a49db8\">${t}<\/text>`).join('');\n\n  $('cxStage').innerHTML =\n    `<svg viewBox=\"0 0 ${W} ${H}\" style=\"width:100%;height:auto;display:block\">\n      ${grid}\n      <line x1=\"${PL}\" y1=\"${H-PB}\" x2=\"${W-PR}\" y2=\"${H-PB}\" stroke=\"#d8d4e6\" stroke-width=\"1.5\"/>\n      <line x1=\"${PL}\" y1=\"${PT}\" x2=\"${PL}\" y2=\"${H-PB}\" stroke=\"#d8d4e6\" stroke-width=\"1.5\"/>\n      <line x1=\"${X(n)}\" y1=\"${PT}\" x2=\"${X(n)}\" y2=\"${H-PB}\" stroke=\"#7c3aed\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/>\n      ${paths}\n      ${xTicks}\n      <text x=\"${W/2}\" y=\"${H-4}\" text-anchor=\"middle\" font-size=\"11\" fill=\"#a49db8\">数据规模 n<\/text>\n      <text x=\"${PL-46}\" y=\"${PT+8}\" font-size=\"10\" fill=\"#a49db8\">操作次数<\/text>\n    <\/svg>\n    <div class=\"legend\">\n      <span><b style=\"color:#8b95a3\">纵轴是对数刻度<\/b> —— 不然 O(n²) 会把其他曲线压成一条线<\/span>\n    <\/div>`;\n\n  const rows = CX_FUNCS.map(fn=>{\n    const v = fn.f(n);\n    return { name:fn.name, c:fn.c, v, txt: v >= 10000 ? v.toExponential(2).replace('e+','×10^') : Math.round(v).toLocaleString('en-US') };\n  });\n  const times = rows[4].v / rows[3].v;\n  $('cxOut').innerHTML =\n    `<div class=\"res\">\n      ${rows.map(r=>`<div class=\"r\" style=\"margin:5px 0\">\n        <span class=\"lbl\" style=\"color:${r.c};font-weight:750\">${r.name}<\/span>\n        <span style=\"font-size:13px\">n = ${n} 时需要约 <b style=\"color:${r.c};font-size:15px\">${r.txt}<\/b> 次基本操作<\/span>\n      <\/div>`).join('')}\n    <\/div>\n    <div class=\"tip i\" style=\"margin-top:10px\"><span class=\"ti\">看差距<\/span><span>\n      n = ${n} 时，O(n²) 的运算量是 O(n log n) 的 <b>${times.toFixed(1)} 倍<\/b>。\n      把滑块拖到 200 看这个倍数怎么涨 —— <b>复杂度差一个量级，实际耗时差的是天文数字<\/b>。\n      这就是为什么「能把 O(n²) 优化成 O(n log n)」的算法改进这么值钱。<br><br>\n      注意 n 较小时（比如 n ≤ 10）几条曲线几乎重合 —— 小数据量下没必要纠结复杂度，\n      <b>但考试考的就是 n 趋于无穷时的增长趋势<\/b>。\n    <\/span><\/div>`;\n}\n$('cxN').oninput = renderCx;\n$('cxReset').onclick = ()=>{ $('cxN').value = 50; renderCx(); };\nrenderCx();\n\n/* ============================================================\n   动画 20 · 顺序表操作台\n   ============================================================ */\nconst SQ = { arr:[12,25,8,47,33], view:[], hl:{}, log:[], timer:null, busy:false };\nconst SQ_CODE = {\n  ins: ['// 在第 pos 个位置插入 val','if (pos < 1 || pos > n+1) return 越界;',\n        'for (i = n; i >= pos; i--)','    data[i+1] = data[i];   // 整体后移',\n        'data[pos] = val;  n++;','// 平均移动 n/2 个元素'],\n  del: ['// 删除第 pos 个元素','if (pos < 1 || pos > n) return 越界;',\n        'x = data[pos];','for (i = pos; i < n; i++)','    data[i] = data[i+1];   // 整体前移',\n        'n--;  // 平均移动 (n-1)/2 个元素'],\n  find:['// 按值查找 val','for (i = 1; i <= n; i++)','    if (data[i] == val) return i;',\n        'return 0;   // 没找到','// 平均比较 (n+1)/2 次'],\n  upd: ['// 修改第 pos 个元素的值','if (pos < 1 || pos > n) return 越界;',\n        'data[pos] = newVal;','// 定位 O(1)，因为是随机访问'],\n  idx: ['// 按位查找第 pos 个元素','if (pos < 1 || pos > n) return 越界;',\n        'return data[pos-1];      // 直接用公式算地址',\n        '// 地址 = 基址 + (pos-1) × 元素大小','// 一步到位，O(1) —— 这就是「随机访问」']\n};\nfunction sqLog(t, k){ SQ.log.push({t:'> '+t, k:k}); }\nfunction sqRender(codeKey, activeLine){\n  const L = SQ.arr.length;\n  $('sqStage').innerHTML =\n    `<div style=\"font-size:12.5px;font-weight:700;color:#4b5765;margin-bottom:5px\">顺序表 —— 用连续内存存放的数组<\/div>\n     <div style=\"font-size:11.5px;color:#8b8699;margin-bottom:11px;line-height:1.75\">\n       教材说「第 pos 个元素」用的是<b style=\"color:#5b21b6\">位置<\/b>（<b>从 1 开始<\/b>）；写代码访问数组用的是<b>下标<\/b>（<b>从 0 开始<\/b>）。\n       两者相差 1 —— 上面输入框里填的是<b>位置<\/b>。\n     <\/div>\n     <div class=\"arr\"><span class=\"rlbl\"><\/span>${SQ.view.map((v,i)=>{\n       const isNull = (v === null || v === undefined);\n       return `<div class=\"arr-c ${SQ.hl[i]||''}${isNull?' empty':''}\">${isNull?'':v}<\/div>`;\n     }).join('')}<\/div>\n     <div class=\"arrnum\"><span class=\"rlbl\">位置<\/span>${SQ.view.map((v,i)=>\n       `<span class=\"rvl pos${SQ.hl[i]==='act'?' on':(SQ.hl[i]==='new'?' hit':(SQ.hl[i]==='del'?' bad':''))}\">${i+1}<\/span>`).join('')}<\/div>\n     <div class=\"arrnum\"><span class=\"rlbl\">下标<\/span>${SQ.view.map((v,i)=>\n       `<span class=\"rvl idx\">${i}<\/span>`).join('')}<\/div>\n     <div style=\"margin-top:10px\">\n       <div class=\"legend\" style=\"margin-top:0\">\n         <span><i style=\"background:#7c3aed\"><\/i>当前操作位置<\/span>\n         <span><i style=\"background:#f0eefe;border:1px solid #b9a8f0\"><\/i>正在搬移的元素<\/span>\n         <span><i style=\"background:repeating-linear-gradient(45deg,#f8f7fc,#f8f7fc 3px,#f1eefb 3px,#f1eefb 6px);border:1px dashed #d2cee0\"><\/i><b>空位<\/b>（刚腾出来的）<\/span>\n         <span><i style=\"background:#e8f6ec;border:1px solid #15803d\"><\/i>新元素<\/span>\n         <span><i style=\"background:#fdeceb;border:1px solid #dc2626\"><\/i>待删除<\/span>\n         <span><i style=\"background:#fff4e3;border:1px solid #d97706\"><\/i>正在比较<\/span>\n       <\/div>\n     <\/div>\n     <div class=\"res\" style=\"margin-top:12px\">\n       <div class=\"r\"><span class=\"lbl\">当前长度 n<\/span><span class=\"val\">${L}<\/span>\n         <span style=\"font-size:12px;color:#8b95a3\">表长 = ${L}，元素物理位置连续<\/span><\/div>\n     <\/div>`;\n  if(codeKey) renderCode('sqCode', SQ_CODE[codeKey], activeLine);\n  renderLog('sqLog', SQ.log);\n}\nfunction sqStop(){ if(SQ.timer){ clearTimeout(SQ.timer); SQ.timer = null; } SQ.busy = false; }\nfunction sqReset(){\n  sqStop();\n  SQ.arr = [12,25,8,47,33];\n  SQ.view = SQ.arr.slice();\n  SQ.hl = {}; SQ.log = [];\n  SQ.log.push({t:'初始顺序表：[12, 25, 8, 47, 33]，共 5 个元素', k:'mut'});\n  sqRender('ins', -1);\n}\nfunction sqStep(delay, fn){ SQ.timer = setTimeout(()=>{ fn(); }, delay); }\n\nfunction sqInsert(){\n  if(SQ.busy) return; sqStop();\n  const val = parseInt($('sqVal').value,10);\n  const pos = parseInt($('sqPos').value,10);\n  if(isNaN(val)){ sqLog('请输入一个数值', 'err'); sqRender('ins',-1); return; }\n  if(isNaN(pos) || pos < 1 || pos > SQ.arr.length+1){\n    sqLog('位置越界：合法范围 1 ~ ' + (SQ.arr.length+1), 'err'); sqRender('ins',0); return;\n  }\n  SQ.busy = true;\n  const n = SQ.arr.length;\n  sqLog(`在第 ${pos} 个位置插入 ${val}`, 'ok');\n  sqLog(`插入点在第 ${pos} 位，所以<b>第 ${pos} 到第 ${n} 个元素都得向右挪一格<\/b>，把位置腾出来`, 'ok');\n  sqLog('★ 搬移必须<b>从后往前<\/b>做 —— 从前往后会覆盖掉还没搬走的数据', 'warn');\n\n  SQ.view = SQ.arr.concat([null]);          // 末尾先多出一个空位\n  SQ.hl = {}; SQ.hl[pos-1] = 'act';\n  sqRender('ins', 1);\n\n  let i = n;\n  const runShift = ()=>{\n    if(i >= pos){\n      const v = SQ.view[i-1];\n      SQ.view[i] = v;\n      SQ.view[i-1] = null;                  // 元素右移，左边腾出空位\n      SQ.hl = {}; SQ.hl[i] = 'shift'; SQ.hl[i-1] = 'empty';\n      sqLog(`第 ${i} 个元素 ${v} <b>右移到第 ${i+1} 位<\/b>，第 ${i} 位空出来`, 'warn');\n      sqRender('ins', 3);\n      i--;\n      sqStep(580, runShift);\n    } else {\n      SQ.view[pos-1] = val;\n      SQ.arr.splice(pos-1, 0, val);\n      SQ.hl = {}; SQ.hl[pos-1] = 'new';\n      sqLog(`现在把 ${val} 填进腾出来的第 ${pos} 位`, 'ok');\n      sqLog(`插入完成，表长 ${n} → ${SQ.arr.length}。一共搬了 <b>${n-pos+1}<\/b> 个元素（平均 n/2）`, 'ok');\n      sqLog('这就是顺序表插入的代价：<b>位置越靠前，搬得越多<\/b>。对比链表只改两条箭头', 'mut');\n      sqRender('ins', 4);\n      SQ.busy = false;\n    }\n  };\n  sqStep(520, runShift);\n}\nfunction sqDelete(){\n  if(SQ.busy) return; sqStop();\n  const pos = parseInt($('sqPos').value,10);\n  if(isNaN(pos) || pos < 1 || pos > SQ.arr.length){\n    sqLog('位置越界：合法范围 1 ~ ' + SQ.arr.length, 'err'); sqRender('del',0); return;\n  }\n  SQ.busy = true;\n  const n = SQ.arr.length;\n  const removed = SQ.arr[pos-1];\n  sqLog(`删除第 ${pos} 个元素（值是 ${removed}）`, 'ok');\n  sqLog(`删掉后第 ${pos} 位就空了，<b>第 ${pos+1} 到第 ${n} 个元素要整体向左挪一格<\/b>把空位补上`, 'ok');\n  sqLog('★ 搬移是<b>从前往后<\/b>做（和插入正好相反）', 'warn');\n\n  SQ.view = SQ.arr.slice();\n  SQ.view[pos-1] = null;\n  SQ.hl = {}; SQ.hl[pos-1] = 'del';\n  sqRender('del', 2);\n\n  let i = pos;\n  const runMove = ()=>{\n    if(i < n){\n      const v = SQ.view[i];\n      SQ.view[i-1] = v;\n      SQ.view[i] = null;                    // 元素左移，右边腾出空位\n      SQ.hl = {}; SQ.hl[i-1] = 'shift'; SQ.hl[i] = 'empty';\n      sqLog(`第 ${i+1} 个元素 ${v} <b>左移到第 ${i} 位<\/b>，补上空缺`, 'warn');\n      sqRender('del', 4);\n      i++;\n      sqStep(580, runMove);\n    } else {\n      SQ.arr.splice(pos-1, 1);\n      SQ.view = SQ.arr.slice();\n      SQ.hl = {};\n      sqLog(`删除完成，表长 ${n} → ${SQ.arr.length}。一共搬了 <b>${n-pos}<\/b> 个元素（平均 (n−1)/2）`, 'ok');\n      sqLog('和插入一样：<b>位置越靠前，搬得越多<\/b>。这就是「顺序表插入删除是 O(n)」的来历', 'mut');\n      sqRender('del', 5);\n      SQ.busy = false;\n    }\n  };\n  sqStep(620, runMove);\n}\nfunction sqFind(){\n  if(SQ.busy) return; sqStop();\n  const val = parseInt($('sqVal').value,10);\n  if(isNaN(val)){ sqLog('请输入要查找的值', 'err'); sqRender('find',-1); return; }\n  SQ.busy = true;\n  SQ.view = SQ.arr.slice(); SQ.hl = {};\n  sqLog(`按值查找：找 ${val}`, 'ok');\n  let i = 0, cmp = 0;\n  const step = ()=>{\n    if(i >= SQ.arr.length){\n      SQ.hl = {};\n      sqLog(`遍历结束，共比较 ${cmp} 次，没找到 ${val}`, 'err');\n      sqLog('顺序查找失败的平均比较次数是 n+1（含哨兵）或 n', 'mut');\n      sqRender('find', 3);\n      SQ.busy = false; return;\n    }\n    cmp++;\n    SQ.hl = {}; SQ.hl[i] = 'cmp';\n    if(SQ.arr[i] === val){\n      SQ.hl[i] = 'new';\n      sqLog(`第 ${i+1} 个元素就是 ${val}，比较 ${cmp} 次找到`, 'ok');\n      sqLog('顺序查找成功的平均比较次数是 (n+1)/2', 'mut');\n      sqRender('find', 2);\n      SQ.busy = false; return;\n    }\n    sqLog(`比较第 ${i+1} 个元素 ${SQ.arr[i]} ≠ ${val}`, 'warn');\n    sqRender('find', 2);\n    i++;\n    sqStep(400, step);\n  };\n  sqRender('find', 1);\n  sqStep(350, step);\n}\nfunction sqUpdate(){\n  if(SQ.busy) return; sqStop();\n  const val = parseInt($('sqVal').value,10);\n  const pos = parseInt($('sqPos').value,10);\n  if(isNaN(pos) || pos < 1 || pos > SQ.arr.length){\n    sqLog('位置越界：合法范围 1 ~ ' + SQ.arr.length, 'err'); sqRender('upd',1); return;\n  }\n  const old = SQ.arr[pos-1];\n  SQ.arr[pos-1] = isNaN(val) ? SQ.arr[pos-1] : val;\n  SQ.view = SQ.arr.slice();\n  SQ.hl = {}; SQ.hl[pos-1] = 'new';\n  sqLog(`修改第 ${pos} 位：${old} → ${SQ.arr[pos-1]}`, 'ok');\n  sqLog('因为顺序表支持随机访问，定位只要 O(1)——这是顺序表最大的优势', 'mut');\n  sqRender('upd', 2);\n}\nfunction sqByIdx(){\n  if(SQ.busy) return; sqStop();\n  const pos = parseInt($('sqPos').value,10);\n  if(isNaN(pos) || pos < 1 || pos > SQ.arr.length){\n    sqLog('位置越界：合法范围 1 ~ ' + SQ.arr.length, 'err'); sqRender('idx',1); return;\n  }\n  SQ.hl = {}; SQ.hl[pos-1] = 'new';\n  sqLog(`按位查找第 ${pos} 个元素`, 'ok');\n  sqLog(`先把「位置」换算成「下标」：${pos} − 1 = ${pos-1}`, 'warn');\n  sqLog(`地址 = 基址 + ${pos-1} × 元素大小 —— <b>直接用公式算出来，不用查找<\/b>`, 'ok');\n  sqLog(`结果：data[${pos-1}] = ${SQ.arr[pos-1]}。整个操作 <b>O(1)<\/b>，这就是「随机访问」`, 'ok');\n  SQ.hl = { [pos-1]:'new' };\n  sqRender('idx', 3);\n}\n$('sqIdx').onclick = sqByIdx;\n$('sqIns').onclick = sqInsert;\n$('sqDel').onclick = sqDelete;\n$('sqFind').onclick = sqFind;\n$('sqUpd').onclick = sqUpdate;\n$('sqReset').onclick = sqReset;\nsqReset();\n\n/* ---------- 链式结构通用：画一个结点 ---------- */\nfunction chainNode(x, y, w, h, val, cls, sub){\n  const pal = { act:['#7c3aed','#fff'], cmp:['#d97706','#fff'], new:['#15803d','#fff'],\n                del:['#dc2626','#fff'], shift:['#f0eefe','#5b21b6'], null:['#f8f7fc','#a49db8'] };\n  const c = pal[cls] || ['#fff','#403a55'];\n  return `<g>\n    <rect x=\"${x}\" y=\"${y}\" width=\"${w}\" height=\"${h}\" rx=\"9\" fill=\"${c[0]}\" stroke=\"${cls?c[0]:'#d8d4e6'}\" stroke-width=\"${cls?2.6:1.6}\"/>\n    <text x=\"${x+w/2}\" y=\"${y+h/2+5}\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"800\" fill=\"${c[1]}\">${val}<\/text>\n    ${sub?`<text x=\"${x+w/2}\" y=\"${y+h+16}\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#8b7fd4\">${sub}<\/text>`:''}\n  <\/g>`;\n}\nfunction arrowDefs(id){\n  const cols = [['','#b9a8f0'],['b','#8b7fd4'],['g','#15803d'],['o','#d97706'],['r','#dc2626'],['x','#c9c3d6'],['c','#0891b2']];\n  return '<defs>' + cols.map(([k,c])=>\n    `<marker id=\"${id}${k}\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7.5\" refY=\"3\" orient=\"auto\">\n      <path d=\"M0,0 L7.5,3 L0,6 z\" fill=\"${c}\"/><\/marker>`).join('') + '<\/defs>';\n}\n/* 指针箭头的颜色 → marker 后缀 */\nconst AR_MARK = { '#b9a8f0':'', '#8b7fd4':'b', '#15803d':'g', '#d97706':'o', '#dc2626':'r', '#c9c3d6':'x', '#0891b2':'c' };\nfunction arMark(color){ return AR_MARK[color] !== undefined ? AR_MARK[color] : ''; }\n\n/* ============================================================\n   动画 21 · 单链表操作台\n   ============================================================ */\nconst SL = { arr:[12,25,8,47], hl:{h:null}, over:{}, temp:null, tempX:0, hlLink:[], ghost:-1,\n             log:[], timer:null, busy:false };\nconst SL_CODE = {\n  ins: ['// 在单链表第 pos 个位置插入 val（带头结点）','p = head;  j = 0;',\n        'while (p && j < pos-1) { p = p->next; j++; }   // 找到前驱',\n        's = new Node(val);','s->next = p->next;   // ① 先接后面',\n        'p->next = s;         // ② 再改前面','// ★ ①②顺序不能反，反了就丢失后续链'],\n  head:['// 头插法（插入到第 1 个位置）','s = new Node(val);','s->next = head->next;',\n        'head->next = s;','// 头插是 O(1)，不需要找前驱'],\n  del: ['// 删除第 pos 个结点','p = head;  j = 0;',\n        'while (p->next && j < pos-1) { p = p->next; j++; }',\n        'q = p->next;         // q 就是要删的',\n        'p->next = q->next;   // 把 q 摘出去','free(q);'],\n  find:['// 按值查找','p = head->next;  i = 1;','while (p && p->data != val) { p = p->next; i++; }',\n        'if (p) return i;  else return 0;','// 平均比较 (n+1)/2 次'],\n  upd: ['// 修改第 pos 个结点的值','先按位置查找拿到结点 p','p->data = newVal;',\n        '// 查找是 O(n)，改值是 O(1)'],\n  idx: ['// 按位查找第 pos 个结点','p = head->next;  j = 1;',\n        'while (p && j < pos) { p = p->next; j++; }',\n        'return p;','// ★ 必须一个个走，不能跳',\n        '// 这是链表 vs 顺序表最本质的差距：O(n) vs O(1)']\n};\nfunction slLog(t,k){ SL.log.push({t:'> '+t, k:k}); }\n/* 画一个带「指针域」的结点：左半数据、右半指针点 */\nfunction slNodeBox(x, y, w, h, val, cls, sub){\n  const pal = { act:['#7c3aed','#fff'], cmp:['#d97706','#fff'], new:['#15803d','#fff'],\n                del:['#dc2626','#fff'], shift:['#f0eefe','#5b21b6'], ghost:['#f8f7fc','#c9c3d6'] };\n  const c = pal[cls] || ['#fff','#403a55'];\n  const bc = cls ? c[0] : '#d8d4e6';\n  return `<g>\n    <rect x=\"${x}\" y=\"${y}\" width=\"${w}\" height=\"${h}\" rx=\"9\" fill=\"${c[0]}\" stroke=\"${bc}\"\n      stroke-width=\"${cls?2.6:1.6}\" ${cls==='ghost'?'stroke-dasharray=\"5 4\"':''}/>\n    <line x1=\"${x+52}\" y1=\"${y}\" x2=\"${x+52}\" y2=\"${y+h}\" stroke=\"${bc}\" stroke-width=\"1.4\" opacity=\".5\"/>\n    <text x=\"${x+26}\" y=\"${y+h/2+5.5}\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"800\" fill=\"${c[1]}\">${val}<\/text>\n    <circle cx=\"${x+w-12}\" cy=\"${y+h/2}\" r=\"3.6\" fill=\"${cls==='ghost'?'#c9c3d6':'#8b7fd4'}\"/>\n    ${sub?`<text x=\"${x+w/2}\" y=\"${y+h+16}\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#8b7fd4\">${sub}<\/text>`:''}\n  <\/g>`;\n}\nfunction slRender(codeKey, activeLine){\n  const NW = 78, NH = 50, GAP = 58, Y = 34, X0 = 26;\n  const n = SL.arr.length;\n  const items = [{ key:'h', x:X0, val:'H', cls:SL.hl.h, sub:'头结点 · 不计位置' }];\n  SL.arr.forEach((v,i)=>{\n    items.push({ key:i, x:X0 + (i+1)*(NW+GAP), val:v, cls:SL.hl[i],\n                 sub:`第 ${i+1} 个`, ghost: i === SL.ghost });\n  });\n  const posOf = {}; items.forEach(it=>{ posOf[it.key] = it.x; });\n  const TY = Y + NH + 94;\n  const H = SL.temp ? TY + NH + 44 : Y + NH + 70;\n  const W = Math.max(600, X0 + (n+1)*(NW+GAP) + 120);\n\n  let arrows = '';\n  items.forEach((it, idx)=>{\n    const sx = it.x + NW - 12, sy = Y + NH/2;\n    const def = idx < items.length-1 ? items[idx+1].key : 'null';\n    const target = Object.prototype.hasOwnProperty.call(SL.over, it.key) ? SL.over[it.key] : def;\n    const hot = SL.hlLink.indexOf(it.key) >= 0;\n    const color = hot ? '#d97706' : (it.ghost ? '#c9c3d6' : '#b9a8f0');\n    const mk = 'url(#sla' + arMark(color) + ')';\n    if(target === 'null'){\n      arrows += `<line x1=\"${sx}\" y1=\"${sy}\" x2=\"${sx+36}\" y2=\"${sy}\" stroke=\"${color}\" stroke-width=\"2.4\" marker-end=\"${mk}\"/>\n        <text x=\"${sx+44}\" y=\"${sy+5}\" font-size=\"12\" font-weight=\"800\" fill=\"#a49db8\">NULL<\/text>`;\n    } else if(target === 'temp'){\n      const tx = SL.tempX + NW - 12, ty = TY + NH/2;\n      arrows += `<path d=\"M${sx},${sy} C${sx+50},${sy+56} ${tx-56},${ty-46} ${tx-12},${ty}\"\n        fill=\"none\" stroke=\"${color}\" stroke-width=\"2.6\" marker-end=\"${mk}\"/>`;\n    } else {\n      const tx = posOf[target];\n      const jump = (tx - sx) > (NW + GAP - 8);\n      if(jump){\n        const mx = (sx + tx)/2, my = sy + 48;\n        arrows += `<path d=\"M${sx},${sy} Q${mx},${my} ${tx-5},${sy}\" fill=\"none\" stroke=\"${color}\"\n          stroke-width=\"2.4\" marker-end=\"${mk}\"/>`;\n      } else {\n        arrows += `<line x1=\"${sx}\" y1=\"${sy}\" x2=\"${tx-5}\" y2=\"${sy}\" stroke=\"${color}\" stroke-width=\"2.4\" marker-end=\"${mk}\"/>`;\n      }\n    }\n  });\n\n  let tempSvg = '';\n  if(SL.temp){\n    tempSvg += slNodeBox(SL.tempX, TY, NW, NH, SL.temp.val, SL.hl.temp, '新结点 s');\n    const sx = SL.tempX + NW - 12, sy = TY + NH/2;\n    const tgt = SL.over.temp;\n    if(tgt === undefined){\n      tempSvg += `<text x=\"${sx+11}\" y=\"${sy+5}\" font-size=\"11.5\" font-weight=\"700\" fill=\"#c9c3d6\">next = ?<\/text>`;\n    } else if(tgt === 'null'){\n      tempSvg += `<line x1=\"${sx}\" y1=\"${sy}\" x2=\"${sx+34}\" y2=\"${sy}\" stroke=\"#15803d\" stroke-width=\"2.6\" marker-end=\"url(#slag)\"/>\n        <text x=\"${sx+42}\" y=\"${sy+5}\" font-size=\"11.5\" font-weight=\"800\" fill=\"#15803d\">NULL<\/text>`;\n    } else {\n      const tx = posOf[tgt];\n      tempSvg += `<path d=\"M${sx},${sy} C${sx+56},${sy+2} ${tx-56},${sy-10} ${tx-5},${Y+NH/2}\"\n        fill=\"none\" stroke=\"#15803d\" stroke-width=\"2.8\" marker-end=\"url(#slag)\"/>`;\n    }\n  }\n\n  const nodeSvg = items.map(it=> slNodeBox(it.x, Y, NW, NH, it.val, it.ghost ? 'ghost' : it.cls, it.sub)).join('');\n\n  $('slStage').innerHTML =\n    `<div style=\"font-size:12.5px;font-weight:700;color:#4b5765;margin-bottom:5px\">单链表 —— 每个结点由「数据域 + 指针域」组成<\/div>\n     <div style=\"font-size:11.5px;color:#8b8699;margin-bottom:10px;line-height:1.75\">\n       结点右半边那个<b>小圆点就是指针域<\/b>，从它出发的箭头表示 <span class=\"mono\">next<\/span> 指向谁。\n       链表插入删除之所以快，是因为它在<b>改箭头<\/b>而不是搬数据 —— 做操作时盯着箭头看。\n     <\/div>\n     <svg viewBox=\"0 0 ${W} ${H}\" style=\"width:100%;max-width:${Math.min(W,900)}px;height:auto;display:block\">${arrowDefs('sla')}${arrows}${nodeSvg}${tempSvg}<\/svg>\n     <div class=\"legend\">\n       <span><i style=\"background:#b9a8f0\"><\/i>正常的 next 箭头<\/span>\n       <span><i style=\"background:#d97706\"><\/i><b>正在被改的箭头<\/b><\/span>\n       <span><i style=\"background:#15803d\"><\/i>新结点的 next<\/span>\n       <span><i style=\"background:#c9c3d6\"><\/i>已脱离链的结点<\/span>\n     <\/div>\n     <div class=\"res\" style=\"margin-top:12px\">\n       <div class=\"r\"><span class=\"lbl\">表长<\/span><span class=\"val\">${n}<\/span>\n         <span style=\"font-size:12px;color:#8b95a3\">头结点不计入 · 数据结点 ${n} 个<\/span><\/div>\n     <\/div>\n     <div class=\"tip i\" style=\"margin-top:10px\"><span class=\"ti\">对比：两种结构插入的代价<\/span><span>\n       <b>顺序表<\/b>插入要搬动 n/2 个元素；<b>链表<\/b>插入只改<b>两条箭头<\/b>（<span class=\"mono\">s-&gt;next<\/span> 和 <span class=\"mono\">p-&gt;next<\/span>）。\n       但代价是：要找到 p 这个前驱，必须从头一个个走（O(n)）。<br>\n       还有个经典陷阱：<b>必须先把 s-&gt;next 接好，再改 p-&gt;next<\/b>。\n       反过来的话，p 原来的后继就<b>没有人指向了<\/b> —— 整条后半链直接丢失。\n     <\/span><\/div>`;\n  if(codeKey) renderCode('slCode', SL_CODE[codeKey], activeLine);\n  renderLog('slLog', SL.log);\n}\nfunction slStop(){ if(SL.timer){ clearTimeout(SL.timer); SL.timer = null; } SL.busy = false; }\nfunction slReset(){\n  slStop();\n  SL.arr = [12,25,8,47]; SL.hl = {h:null}; SL.over = {}; SL.temp = null;\n  SL.hlLink = []; SL.ghost = -1; SL.log = [];\n  SL.log.push({t:'初始单链表：H → 12 → 25 → 8 → 47 → NULL', k:'mut'});\n  slRender('ins', -1);\n}\nfunction slInsert(pos, val, isHead){\n  if(SL.busy) return; slStop();\n  const n = SL.arr.length;\n  const realPos = isHead ? 1 : pos;\n  if(isNaN(val)){ slLog('请输入一个数值','err'); slRender('ins',-1); return; }\n  if(realPos < 1 || realPos > n+1){\n    slLog('位置越界：合法范围 1 ~ ' + (n+1), 'err'); slRender(isHead?'head':'ins',-1); return;\n  }\n  SL.busy = true;\n  SL.over = {}; SL.temp = null; SL.ghost = -1;\n  const pKey = realPos === 1 ? 'h' : realPos - 2;\n  const pName = pKey === 'h' ? 'head' : 'p';\n\n  // ── 帧 1：找前驱 ──────────────────────────────\n  slLog(`在<b>第 ${realPos} 个位置<\/b>插入 ${val}`, 'ok');\n  slLog(`要找<b>前驱 p<\/b>：在第 ${realPos} 个位置插，前驱就是第 ${realPos-1} 个结点${pKey==='h'?'（这里是头结点）':''}`, 'ok');\n  SL.hl = {}; SL.hl[pKey] = 'act';\n  SL.hlLink = [pKey];\n  slRender(isHead?'head':'ins', 2);\n\n  // ── 帧 2：新结点悬空出现 ──────────────────────\n  SL.timer = setTimeout(()=>{\n    SL.temp = { val }; SL.tempX = 110 + (realPos-1) * 46;\n    SL.hl = {}; SL.hl[pKey] = 'act'; SL.hl.temp = 'new'; SL.hlLink = [pKey];\n    slLog(`<span class=\"mono\">s = new Node(${val})<\/span> —— 先在内存里造一个新结点。`, 'warn');\n    slLog('看图：它现在<b>悬在下面<\/b>，右半边的指针域还不知道该指向谁（next = ?）', 'warn');\n    slRender(isHead?'head':'ins', 3);\n\n    // ── 帧 3：s->next = p->next ─────────────────\n    SL.timer = setTimeout(()=>{\n      SL.over.temp = (realPos - 1 < n) ? (realPos - 1) : 'null';\n      slLog(`<span class=\"mono\">s-&gt;next = p-&gt;next<\/span> —— 让新结点<b>先接住后面那半条链<\/b>` +\n            `（指向 ${realPos-1 < n ? '原来的第 '+realPos+' 个结点' : 'NULL'}）`, 'ok');\n      slLog('★ 这一步必须先做，顺序不能反 —— 否则后面那半条链就<b>再也找不回来了<\/b>', 'warn');\n      slRender(isHead?'head':'ins', 4);\n\n      // ── 帧 4：p->next = s ────────────────────\n      SL.timer = setTimeout(()=>{\n        SL.over[pKey] = 'temp';\n        SL.hlLink = [pKey];\n        slLog(`<span class=\"mono\">${pName}-&gt;next = s<\/span> —— 前驱的 next 改指到新结点`, 'ok');\n        slLog('看图上那条<b>橙色箭头<\/b>，它就是刚刚被改向的那条', 'warn');\n        slRender(isHead?'head':'ins', 5);\n\n        // ── 帧 5：并入链表 ─────────────────────\n        SL.timer = setTimeout(()=>{\n          SL.arr.splice(realPos-1, 0, val);\n          SL.temp = null; SL.over = {}; SL.hlLink = [];\n          SL.hl = {}; SL.hl[realPos-1] = 'new';\n          slLog(`插入完成，链重新串起来，表长变为 ${SL.arr.length}`, 'ok');\n          slLog('整个插入的代价是<b>改两条箭头<\/b>（O(1)）；但要找到前驱 p，平均要走 n/2 步（O(n)）', 'mut');\n          slRender(isHead?'head':'ins', 6);\n          SL.busy = false;\n        }, 880);\n      }, 880);\n    }, 880);\n  }, 880);\n}\nfunction slDelete(){\n  if(SL.busy) return; slStop();\n  const pos = parseInt($('slPos').value,10);\n  const n = SL.arr.length;\n  if(isNaN(pos) || pos < 1 || pos > n){\n    slLog('位置越界：合法范围 1 ~ ' + n, 'err'); slRender('del',0); return;\n  }\n  SL.busy = true;\n  SL.over = {}; SL.temp = null; SL.ghost = -1;\n  const pKey = pos === 1 ? 'h' : pos - 2;\n  const removed = SL.arr[pos-1];\n  slLog(`删除第 ${pos} 个结点（值为 ${removed}）`, 'ok');\n\n  // ── 帧 1：找到前驱 p，标出 q ──────────────────\n  SL.hl = {}; SL.hl[pKey] = 'act'; SL.hl[pos-1] = 'del';\n  SL.hlLink = [pKey];\n  slLog(`<span class=\"mono\">q = ${pKey==='h'?'head':'p'}-&gt;next<\/span> —— 让 q 指向要删的那个结点（图上红色）`, 'ok');\n  slRender('del', 2);\n\n  // ── 帧 2：p->next = q->next ──────────────────\n  SL.timer = setTimeout(()=>{\n    SL.over[pKey] = pos < n ? pos : 'null';\n    SL.hlLink = [pKey];\n    slLog(`<span class=\"mono\">${pKey==='h'?'head':'p'}-&gt;next = q-&gt;next<\/span> —— 前驱<b>直接跨过 q<\/b>，指向 q 的后继`, 'ok');\n    slLog('看图：那条橙色箭头已经<b>绕开了 q<\/b>。这一步一做完，q 就已经不在链上了', 'warn');\n    slRender('del', 3);\n\n    // ── 帧 3：q 被孤立 ──────────────────────────\n    SL.timer = setTimeout(()=>{\n      SL.ghost = pos-1;\n      SL.hl = {}; SL.hl[pKey] = 'act'; SL.hlLink = [];\n      slLog('此刻 q <b>已经脱离链表<\/b> —— 没有任何结点指向它（图上变成灰色虚线框）', 'warn');\n      slLog('但注意：它的内存<b>还没被释放<\/b>，只是「悬空」了。这就是<b>内存泄漏<\/b>的由来', 'err');\n      slRender('del', 4);\n\n      // ── 帧 4：free(q) ────────────────────────\n      SL.timer = setTimeout(()=>{\n        SL.arr.splice(pos-1, 1);\n        SL.ghost = -1; SL.over = {}; SL.hl = {}; SL.hlLink = [];\n        slLog(`<span class=\"mono\">free(q)<\/span> 把它占的空间还给系统，删除完成，表长变为 ${SL.arr.length}`, 'ok');\n        slLog(`对比顺序表：删第 ${pos} 个要搬 <b>${n-pos} 个元素<\/b>；链表只改了<b>一条箭头<\/b>加一次 free`, 'mut');\n        slRender('del', 5);\n        SL.busy = false;\n      }, 950);\n    }, 880);\n  }, 880);\n}\nfunction slFind(){\n  if(SL.busy) return; slStop();\n  const val = parseInt($('slVal').value,10);\n  if(isNaN(val)){ slLog('请输入要查找的值','err'); slRender('find',-1);
