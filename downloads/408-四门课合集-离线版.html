nst f = parseFloat(inp);\n  if(isNaN(f)) { $('f32Out').innerHTML = '<div class=\"tip m\"><span class=\"ti\">提示<\/span><span>请输入一个十进制数。<\/span><\/div>'; return; }\n  const buf = new ArrayBuffer(4), dv = new DataView(buf);\n  dv.setFloat32(0, f, false);\n  let bin = '';\n  for(let i=0;i<4;i++) bin += dv.getUint8(i).toString(2).padStart(8,'0');\n  const S = bin.slice(0,1), E = bin.slice(1,9), M = bin.slice(9,32);\n  const Eint = parseInt(E,2), Mint = parseInt(M,2);\n  const exp = Eint - 127;\n  const sign = S === '1' ? '-' : '+';\n\n  let kind = '', formula = '';\n  if(Eint === 0 && Mint === 0){ kind='零'; formula = sign + '0'; }\n  else if(Eint === 0){ kind='非规格化数'; formula = sign + '0.'+M+' × 2⁻¹²⁶'; }\n  else if(Eint === 255){ kind = Mint === 0 ? '无穷大 ∞' : 'NaN（非数）'; formula = kind; }\n  else { kind='规格化数'; formula = sign + '1.'+M+' × 2^'+exp; }\n\n  const exact = (Eint>0 && Eint<255) ? (f) : null;\n  const mantVal = Eint>0 && Eint<255 ? (1 + Mint/Math.pow(2,23)) : null;\n  const back = mantVal !== null ? (sign==='-'?-1:1) * mantVal * Math.pow(2, exp) : null;\n\n  const seg = (str, cls)=>'<span class=\"bits\" style=\"font-size:14px\">'+str.split('').map((b,i)=>\n      '<i class=\"bit '+cls+(b==='1'?' on':'')+'\" style=\"width:19px;height:26px\">'+b+'<\/i>').join('')+'<\/span>';\n\n  let note = '';\n  if(kind === '规格化数'){\n    note = '<div class=\"tip s\" style=\"margin-top:10px\"><span class=\"ti\">读法<\/span><span>隐含最高位 1，所以尾数实际是 <b class=\"mono\">1.'+M+'<\/b>，共 24 位有效数字。阶码字段 '+Eint+' − 偏置 127 = 真指数 <b>'+exp+'<\/b>。<\/span><\/div>';\n  } else if(kind === '非规格化数'){\n    note = '<div class=\"tip m\" style=\"margin-top:10px\"><span class=\"ti\">非规格化<\/span><span>阶码全 0 表示非规格化数，此时<span class=\"key\">尾数不再隐含 1<\/span>，真指数固定为 −126。这样可以在 0 附近把精度「续」下去，减小下溢的突跳。<\/span><\/div>';\n  } else {\n    note = '<div class=\"tip e\" style=\"margin-top:10px\"><span class=\"ti\">特殊值<\/span><span>阶码全 1：尾数为 0 表示 ∞，尾数非 0 表示 NaN。+∞ 用于溢出，NaN 用于非法运算（0/0、∞−∞）。<\/span><\/div>';\n  }\n\n  let roundNote = '';\n  if(exact !== null && back !== null && Math.abs(back - exact) > 1e-12){\n    roundNote = '<div class=\"tip m\" style=\"margin-top:6px\"><span class=\"ti\">舍入<\/span><span>该数无法用二进制有限表示，按 IEEE 754 就近舍入后实际存储值约为 <b class=\"mono\">'+back+'<\/b>，与输入的 '+exact+' 存在微小误差——这正是 0.1+0.2≠0.3 的根源。<\/span><\/div>';\n  }\n\n  $('f32Out').innerHTML =\n    '<div class=\"res\">'+\n    '<div class=\"r\" style=\"margin:4px 0\"><span class=\"lbl\">输入<\/span><span class=\"val\">'+f+'<\/span>'+\n      '<span style=\"font-size:11.5px;color:#8b95a3\">类型：'+kind+'<\/span><\/div>'+\n    '<div style=\"margin:11px 0 3px\"><span style=\"font-size:11.5px;color:#6b7280;font-weight:650\">32 位存储格式<\/span><\/div>'+\n    '<div style=\"display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;padding:10px 0 4px\">'+\n      '<div><div style=\"font-size:10.5px;color:#dc2626;font-weight:700;margin-bottom:3px\">S 符号 · 1 位<\/div>'+seg(S,'sign')+'<\/div>'+\n      '<div><div style=\"font-size:10.5px;color:#9a5b06;font-weight:700;margin-bottom:3px\">E 阶码 · 8 位（移码）<\/div>'+seg(E,'exp')+'<\/div>'+\n      '<div><div style=\"font-size:10.5px;color:#2563eb;font-weight:700;margin-bottom:3px\">M 尾数 · 23 位<\/div>'+seg(M,'man')+'<\/div>'+\n    '<\/div>'+\n    '<div style=\"border-top:1px dashed #d8dfe9;margin-top:12px;padding-top:10px;font-size:12.5px;line-height:2\">'+\n      '<div>阶码字段 E = <b style=\"color:#9a5b06\">'+Eint+'<\/b>（二进制 '+E+'）&nbsp;·&nbsp; 真指数 = E − 127 = <b>'+exp+'<\/b><\/div>'+\n      '<div>尾数实际值 = 1.'+M+' ≈ <b>'+(mantVal!==null?mantVal.toFixed(9):'—')+'<\/b><\/div>'+\n      '<div style=\"margin-top:6px\">还原真值：<b style=\"color:#0a6b4a\">'+formula+'<\/b>'+\n      (back!==null?' = <b>'+back+'<\/b>':'')+'<\/div>'+\n    '<\/div><\/div>'+ note + roundNote;\n}\n$('f32In').oninput = e=>renderF32(e.target.value);\nqsa('[data-f32]').forEach(b=>b.onclick=()=>{ $('f32In').value=b.dataset.f32; renderF32(b.dataset.f32); });\nrenderF32('12.375');\n\n/* ============================================================\n   动画 05 · 浮点加减五步\n   ============================================================ */\nfunction bin32(f){\n  const dv = new DataView(new ArrayBuffer(4));\n  dv.setFloat32(0,f,false);\n  let b=''; for(let i=0;i<4;i++) b += dv.getUint8(i).toString(2).padStart(8,'0');\n  return b;\n}\nfunction faCompute(){\n  const X = parseFloat($('faX').value), Y = parseFloat($('faY').value);\n  if(isNaN(X)||isNaN(Y)) return null;\n  const bx = bin32(X), by = bin32(Y);\n  const ex = parseInt(bx.slice(1,9),2) - 127, ey = parseInt(by.slice(1,9),2) - 127;\n  const mx = '1' + bx.slice(9), my = '1' + by.slice(9);   // 24 位\n  const big = ex >= ey;\n  const dExp = Math.abs(ex - ey);\n  const es = big ? ex : ey;\n  // 对阶：小阶尾数右移 dExp 位\n  const mSmall = big ? my : mx;\n  const mBig   = big ? mx : my;\n  const shift = dExp > 31 ? '0'.repeat(24) : mSmall.slice(0, 24-dExp) + '0'.repeat(dExp);\n  // 定点值相加（把 24 位尾数视为 2^(-23) 定点小数）\n  const vBig = parseInt(mBig,2), vSh = parseInt(shift,2) || 0;\n  const sgnBig = (big?bx:by)[0]==='1' ? -1 : 1;\n  const sgnSm  = (big?by:bx)[0]==='1' ? -1 : 1;\n  const sum = sgnBig*vBig + sgnSm*vSh;\n\n  return {X,Y,bx,by,ex,ey,mx,my,big,dExp,es,mBig,shift,sgnBig,sgnSm,sum,\n          result: (Math.fround(X)+Math.fround(Y))};\n}\nlet faIdx = -1;\nfunction faRender(){\n  const d = faCompute();\n  if(!d){ $('faSteps').innerHTML = '<div class=\"tip m\"><span class=\"ti\">提示<\/span><span>请输入两个十进制浮点数。<\/span><\/div>'; return; }\n  const exact = (d.sgnBig*(parseInt(d.mBig,2)/Math.pow(2,23)) + d.sgnSm*(parseInt(d.shift,2)/Math.pow(2,23)));\n  const exactVal = exact * Math.pow(2, d.es);\n  const steps = [\n    ['① 对阶', 'X 的阶码 ' + d.ex + '，Y 的阶码 ' + d.ey + '，阶差 ΔE = ' + d.dExp + '，' + (d.big?'X':'Y') + ' 阶码更大。\\n小阶向大阶看齐：' + (d.big?'Y':'X') + ' 的尾数右移 ' + d.dExp + ' 位，阶码加到 ' + d.es,\n      'X 尾数 = ' + d.mx + '\\nY 尾数 = ' + d.my + '\\n移后小阶尾数 = ' + d.shift + '（右移丢低位，会产生误差）'],\n    ['② 尾数求和', '阶码统一为 ' + d.es + ' 后，对 24 位尾数做加减（同号加、异号减）。',\n      '大阶尾数 ' + d.mBig + '\\n小阶尾数 ' + d.shift + '\\n求和结果定点值 = ' + d.sum + '（单位 2⁻²³）'],\n    ['③ 规格化', '若结果最高位与次高位相同则需左规（尾数左移、阶码减 1）；若尾数溢出（需 25 位）则右规（右移 1 位、阶码加 1）。',\n      '规格化要求：1.xxxx 形式，即整数位恰为 1'],\n    ['④ 舍入', '默认采用「就近舍入，偶数优先」，把 24 位尾数截到 23 位存储精度。',\n      '单精度最多保留 23 位尾数，多余位按规则舍入'],\n    ['⑤ 判溢出', '只看阶码：阶码超出 1～254 为溢出（上溢产生 ∞，下溢按 0 或非规格化处理）。尾数进位不算溢出，右规即可修正。',\n      '本例阶码 = ' + d.es + '，在正常范围内']\n  ];\n  $('faSteps').innerHTML = steps.map((s,i)=>{\n    const cls = i < faIdx ? 'dn' : (i === faIdx ? 'act' : '');\n    return '<div class=\"step '+cls+'\"><div class=\"n\">'+(i+1)+'<\/div><div><div class=\"t\">'+s[0]+'<\/div>'+\n      '<div class=\"d\">'+s[1].replace(/\\n/g,'<br>')+'<\/div>'+\n      '<div class=\"d\" style=\"margin-top:5px;color:#8b95a3;font-size:11.5px\">'+s[2].replace(/\\n/g,'<br>')+'<\/div>'+\n      '<\/div><\/div>';\n  }).join('') +\n  (faIdx >= 4 ? '<div class=\"tip s\" style=\"margin-top:10px\"><span class=\"ti\">结果<\/span><span>'+\n    d.X+' + ('+d.Y+') ≈ <b>'+d.result+'<\/b>　（换算成规格化指数形式约为 '+ exactVal.toFixed(6) +'，末尾差异来自尾数截断与舍入）<\/span><\/div>' : '');\n}\n$('faStart').onclick = ()=>{ faIdx = -1; faRender(); };\n$('faNext').onclick = ()=>{ if(faIdx < 4){ faIdx++; faRender(); } };\n$('faX').oninput = ()=>{ faIdx=-1; faRender(); };\n$('faY').oninput = ()=>{ faIdx=-1; faRender(); };\nfaRender();\n\n/* ============================================================\n   动画 06 · 海明码\n   ============================================================ */\nfunction renderHam(str){\n  const data = (str||'').replace(/[^01]/g,'');\n  if(!data.length){ $('hamOut').innerHTML = '<div class=\"tip m\"><span class=\"ti\">提示<\/span><span>请输入只含 0 和 1 的数据位。<\/span><\/div>'; return; }\n  const n = data.length;\n  let k = 0;\n  while(Math.pow(2,k) < n + k + 1) k++;\n  const total = n + k;\n  const code = new Array(total+1).fill('0');   // 下标从 1 开始\n  const isParity = new Array(total+1).fill(false);\n  for(let i=0;i<k;i++){ const p = Math.pow(2,i); isParity[p]=true; }\n  // 填入数据位\n  let di = 0;\n  for(let i=1;i<=total;i++) if(!isParity[i]) code[i] = data[di++];\n  // 计算校验位（偶校验）\n  const groups = [];\n  for(let i=0;i<k;i++){\n    const p = Math.pow(2,i);\n    let xor = 0, members = [];\n    for(let j=1;j<=total;j++){\n      if(j === p) continue;\n      if((j & p) !== 0){ xor ^= (+code[j]); members.push(j); }\n    }\n    code[p] = String(xor);\n    groups.push({p, members, val: xor});\n  }\n\n  const cells = [];\n  for(let i=1;i<=total;i++){\n    const cls = isParity[i] ? 'sign' : 'man';\n    const on = code[i] === '1' ? ' on' : '';\n    let style = 'width:26px;height:34px;position:relative';\n    cells.push('<i class=\"bit '+cls+on+'\" style=\"'+style+'\">'+code[i]+\n      '<span style=\"position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);font-size:9px;color:#9aa4b2;font-weight:600\">'+i+'<\/span><\/i>');\n  }\n\n  const gHtml = groups.map(g=>\n    '<div class=\"r\" style=\"margin:6px 0\"><span class=\"lbl\" style=\"min-width:58px\">P'+Math.log2(g.p)+' (第'+g.p+'位)<\/span>'+\n    '<span style=\"font-size:12.5px\">= 第 ['+g.members.join(', ')+'] 位异或 = <b style=\"color:#2563eb;font-family:Consolas\">'+g.val+'<\/b>'+\n    '　→ 校验位取值 <b>'+code[g.p]+'<\/b><\/span><\/div>').join('');\n\n  $('hamOut').innerHTML =\n    '<div class=\"res\">'+\n      '<div class=\"r\" style=\"margin:4px 0\"><span class=\"lbl\">数据位<\/span><span class=\"val\">'+data+'<\/span>'+\n        '<span style=\"font-size:11.5px;color:#8b95a3\">n = '+n+'，需满足 2ᵏ ≥ n+k+1，解得 k = '+k+'，总长 '+total+' 位<\/span><\/div>'+\n      '<div style=\"margin:16px 0 22px;padding-left:4px\">'+\n        '<div style=\"font-size:11px;color:#6b7280;font-weight:650;margin-bottom:20px\">海明码排列（下方数字为位号，红色为校验位 P，蓝色为数据位 D）<\/div>'+\n        '<div class=\"bits\" style=\"gap:0\">'+cells.join('')+'<\/div>'+\n      '<\/div>'+\n      '<div style=\"border-top:1px dashed #d8dfe9;padding-top:10px\">'+\n        '<div style=\"font-size:11.5px;color:#6b7280;font-weight:650;margin-bottom:6px\">校验位计算（偶校验：使每组 1 的个数为偶数）<\/div>'+\n        gHtml +\n      '<\/div>'+\n    '<\/div>'+\n    '<div class=\"tip i\" style=\"margin-top:10px\"><span class=\"ti\">纠错<\/span><span>接收端重算各校验组的异或，若得到 S = '+groups.map((g,i)=>'S'+i).join('')+\n    ' 组成的二进制数，则 <span class=\"key\">S 的十进制值就是出错位的位号<\/span>（S=0 表示无错）。海明码只能纠 1 位错，检 1 位以上的错需要再加一个全校验位。<\/span><\/div>';\n}\n$('hamIn').oninput = e=>renderHam(e.target.value);\nqsa('[data-ham]').forEach(b=>b.onclick=()=>{ $('hamIn').value=b.dataset.ham; renderHam(b.dataset.ham); });\nrenderHam('1011');\n\n/* ============================================================\n   动画 07 · 存储层次金字塔\n   ============================================================ */\nconst hierInfo = [\n  ['CPU 寄存器','容量：几十字节 ~ 几 KB<br>访问时间：0.2 ~ 1 ns<br>实现：触发器（SRAM 工艺）<br>管理方：编译程序负责分配<br><b>对程序员完全可见<\/b>，需要显式使用',\n   '为什么最快？因为它在 CPU 芯片内部，不需要走总线。数量极少（x86-64 只有 16 个通用寄存器），所以编译器要拼命把热点变量留在寄存器里。'],\n  ['Cache（高速缓存）','容量：几百 KB ~ 几十 MB（分 L1/L2/L3）<br>访问时间：1 ~ 10 ns<br>实现：SRAM<br>管理方：<b>纯硬件自动完成<\/b><br><b>对所有程序员透明<\/b>',\n   'Cache 存在的全部依据是「局部性原理」。它有独立的地址映射、替换算法和写策略逻辑，程序员写代码时完全不需要知道它，也无法直接寻址它——所以叫「透明」。'],\n  ['主存（内存 DRAM）','容量：几 GB ~ 几十 GB<br>访问时间：50 ~ 100 ns<br>实现：DRAM（需周期性刷新）<br>管理方：硬件 + 操作系统<br><b>CPU 可直接按地址访问<\/b>',\n   '主存是「运行中程序」的家。CPU 执行的每条指令、每个操作数都必须先在主存里。外存的东西想被 CPU 用，必须先搬到主存。'],\n  ['辅存（磁盘 / SSD）','容量：TB 级<br>访问时间：微秒（SSD）~ 毫秒（磁盘）<br>实现：磁介质 / 闪存<br>管理方：操作系统<br><b>CPU 不能直接访问<\/b>',\n   '辅存负责「掉电不丢」，是虚拟存储器的物理基础。CPU 要访问它，必须通过 I/O 系统把数据先调入主存——这就是虚拟存储和缺页的由来。']\n];\nqsa('.hl').forEach(g=>{\n  g.onclick = ()=>{\n    const d = hierInfo[+g.dataset.k];\n    qsa('.hl polygon').forEach(p=>p.setAttribute('stroke-width','2'));\n    g.querySelector('polygon').setAttribute('stroke-width','4');\n    $('hierRes').innerHTML =\n      '<div class=\"r\"><span class=\"lbl\">层次<\/span><span class=\"val\">'+d[0]+'<\/span><\/div>'+\n      '<div class=\"r\" style=\"color:#3c4654\"><span class=\"lbl\">参数<\/span><span style=\"font-size:13px\">'+d[1]+'<\/span><\/div>'+\n      '<div class=\"r\" style=\"color:#5c6779\"><span class=\"lbl\">理解<\/span><span style=\"font-size:12.5px\">'+d[2]+'<\/span><\/div>';\n  };\n});\n\n/* ============================================================\n   动画 08 · Cache 三种映射\n   ============================================================ */\n/* 把块号拆成「标记 | 索引」两段显示 —— 取模在硬件上就是「取低 k 位」 */\nfunction bitSplit(B, idxBits, tagName, idxName){\n  let total = Math.max(idxBits + 2, 6);\n  let b = B.toString(2);\n  if(b.length > total) total = b.length;\n  b = b.padStart(total, '0');\n  const tag = b.slice(0, total - idxBits) || '0';\n  const idx = b.slice(total - idxBits);\n  const cell = (txt, color, radius) =>\n    `<span style=\"padding:5px 11px;background:${color}1a;color:${color};border:1px solid ${color};${radius};font-weight:800\">${txt}<\/span>`;\n  return `<div style=\"display:flex;gap:0;align-items:center;flex-wrap:wrap;margin:9px 0 4px\">\n    <span style=\"font-family:Consolas,monospace;font-size:13.5px;display:flex\">\n      ${cell(tag, '#2563eb', 'border-radius:7px 0 0 7px')}${cell(idx, '#d97706', 'border-radius:0 7px 7px 0')}\n    <\/span>\n    <span style=\"margin-left:12px;font-size:11.5px;color:#8b95a3;font-weight:600;line-height:1.6\">\n      ${tagName} = ${parseInt(tag,2) || 0}　·　${idxName} = <b style=\"color:#9a5b06\">${parseInt(idx,2)}<\/b>（十进制）\n    <\/span><\/div>`;\n}\nfunction renderMap(){\n  const mode = $('mapMode').value;\n  const R = +$('mapRows').value;\n  let B = parseInt($('blkNo').value,10);\n  if(isNaN(B)) B = 0;\n  B = Math.max(0, Math.min(63, B));\n\n  let W = 1;\n  if(mode === 'set2') W = 2;\n  if(mode === 'set4') W = Math.min(4, R);\n  if(mode === 'full') W = R;\n\n  const groups = R / W;\n\n  // 主存块列表\n  let blocks = [];\n  for(let i=0;i<16;i++) blocks.push(i);\n  if(B > 15) blocks.unshift(B);\n\n  $('memCol').innerHTML = blocks.map(i=>{\n    const sel = i === B;\n    return '<div class=\"rowbox '+(sel?'sel':'')+'\"><span class=\"idx\">块 '+i+'<\/span>'+\n      (sel?'<span style=\"font-size:11px\">当前访问<\/span>':'')+'<\/div>';\n  }).join('');\n\n  // Cache 行列表 + 高亮\n  let targetRows = [], targetGroup = -1;\n  if(mode === 'direct'){ targetRows = [B % R]; }\n  else if(mode === 'full'){ targetRows = []; }\n  else { targetGroup = B % groups; for(let i=0;i<W;i++) targetRows.push(targetGroup*W + i); }\n\n  let html = '', conflictBlocks = [];\n  for(let i=0;i<R;i++){\n    const g = Math.floor(i/W);\n    let cls = 'rowbox';\n    if(mode !== 'full' && targetRows.indexOf(i) >= 0) cls += ' hit';\n    const groupLabel = W > 1 ? '<span class=\"tagv\">组 '+g+'<\/span>' : '';\n    html += '<div class=\"'+cls+'\"><span class=\"idx\">行 '+i+'<\/span>'+groupLabel+'<\/div>';\n  }\n  $('cacheCol').innerHTML = html;\n\n  // 冲突块\n  if(mode === 'direct'){\n    for(let b = B % R; b < 64; b += R) conflictBlocks.push(b);\n  } else if(mode !== 'full'){\n    for(let b = B % groups; b < 64; b += groups) conflictBlocks.push(b);\n  }\n\n  let calc = '', extra = '';\n  if(mode === 'direct'){\n    calc = `Cache 行号 = 主存块号 mod Cache 总行数 = ${B} mod ${R} = <b style=\"color:#2563eb\">${B%R}<\/b>`;\n    extra = `<div class=\"r\" style=\"margin-top:10px\"><span class=\"lbl\">为什么是这行<\/span>\n        <span style=\"font-size:12.5px\">把块号 <b>${B}<\/b> 写成二进制，<b>低 ${Math.log2(R)} 位<\/b>就是行号 —— 这就是「mod ${R}」在硬件里的样子：<\/span><\/div>\n      ${bitSplit(B, Math.log2(R), '标记', '行号')}\n      <div class=\"r\" style=\"margin-top:6px\"><span class=\"lbl\">地址格式<\/span><span class=\"mono\" style=\"font-size:12.5px\">[ 标记 | 行号 ${Math.log2(R)} 位 | 块内地址 ]<\/span><\/div>\n      <div class=\"r\"><span class=\"lbl\">冲突块<\/span><span style=\"font-size:12.5px\">块 ${conflictBlocks.slice(0,8).join('、')}… <b>全部映射到行 ${B%R}<\/b>（因为它们的低 ${Math.log2(R)} 位相同），互相覆盖 —— 这就是直接映射冲突率高的原因。<\/span><\/div>`;\n  } else if(mode === 'full'){\n    calc = `全相联：主存任意块 <b style=\"color:#2563eb\">${B}<\/b> 可以放入 <b>任意 Cache 行<\/b>（0 ~ ${R-1}）`;\n    extra = `<div class=\"r\" style=\"margin-top:8px\"><span class=\"lbl\">地址格式<\/span><span class=\"mono\" style=\"font-size:12.5px\">[ 标记 | 块内地址 ]（无行号字段）<\/span><\/div>\n      <div class=\"r\"><span class=\"lbl\">代价<\/span><span style=\"font-size:12.5px\">命中时需要与<b>全部 ${R} 行<\/b>的标记并行比较，比较器电路最贵；但冲突率最低。<\/span><\/div>`;\n  } else {\n    calc = `Cache 组号 = 主存块号 mod Cache 组数 = ${B} mod ${groups} = <b style=\"color:#2563eb\">${targetGroup}<\/b>　→ 可放入行 ${targetRows.join(' 或 ')}`;\n    extra = `<div class=\"r\" style=\"margin-top:10px\"><span class=\"lbl\">为什么是这组<\/span>\n        <span style=\"font-size:12.5px\">块号 <b>${B}<\/b> 的低 <b>${Math.log2(groups)} 位<\/b>就是组号，其余位当标记：<\/span><\/div>\n      ${bitSplit(B, Math.log2(groups), '标记', '组号')}\n      <div class=\"r\" style=\"margin-top:6px\"><span class=\"lbl\">地址格式<\/span><span class=\"mono\" style=\"font-size:12.5px\">[ 标记 | 组号 ${Math.log2(groups)} 位 | 块内地址 ]<\/span><\/div>\n      <div class=\"r\"><span class=\"lbl\">冲突块<\/span><span style=\"font-size:12.5px\">块 ${conflictBlocks.slice(0,8).join('、')}… <b>映射到组 ${targetGroup}<\/b>。组内有 ${W} 个位置，比直接映射宽容 ${W} 倍。<\/span><\/div>`;\n  }\n\n  $('mapRes').innerHTML =\n    `<div class=\"r\"><span class=\"lbl\">映射方式<\/span><span class=\"val\">${mode==='direct'?'直接映射':(mode==='full'?'全相联映射':W+' 路组相联')}<\/span>\n     <span style=\"font-size:11.5px;color:#8b95a3\">Cache ${R} 行${W>1&&mode!=='full'?`，共 ${groups} 组，每组 ${W} 行`:''}<\/span><\/div>\n     <div class=\"r\" style=\"margin-top:6px\"><span class=\"lbl\">计算<\/span><span style=\"font-size:13px\">${calc}<\/span><\/div>${extra}`;\n}\n['mapMode','mapRows','blkNo'].forEach(id=>{ $(id).oninput = renderMap; $(id).onchange = renderMap; });\nrenderMap();\n\n/* ============================================================\n   动画 09 · 地址格式划分计算器\n   ============================================================ */\nfunction renderPart(){\n  const a = parseInt($('pMem').value,10);\n  const b = parseInt($('pCache').value,10);\n  const c = parseInt($('pBlk').value,10);\n  const W = parseInt($('pWay').value,10);\n  if([a,b,c,W].some(v=>isNaN(v))) return;\n  if(b < c || a < b){ $('pOut').innerHTML = '<div class=\"tip e\"><span class=\"ti\">参数错误<\/span><span>需满足：主存容量 ≥ Cache 容量 ≥ 块大小。<\/span><\/div>'; return; }\n\n  const blockOff = c;                 // 块内地址位数\n  const mainBlocks = a - c;           // 主存块号位数\n  const cacheRows = b - c;            // Cache 行数\n  const groupBits = Math.max(0, (b - c) - Math.log2(W));\n  const tagBits = a - c - groupBits;\n  const rowsTotal = Math.pow(2, cacheRows);\n  const groupsTotal = Math.pow(2, groupBits);\n\n  const seg = (label, bits, color, bg)=>{\n    if(bits <= 0) return '';\n    const w = Math.max(7, bits / (tagBits + groupBits + blockOff) * 100);\n    return `<div style=\"flex:${bits};min-width:${Math.max(46,w*0.55)}px;background:${bg};border:1px solid ${color};\n      border-radius:8px;padding:9px 6px;text-align:center;overflow:hidden\">\n      <div style=\"font-size:11.5px;font-weight:800;color:${color};white-space:nowrap\">${label}<\/div>\n      <div style=\"font-size:15px;font-weight:800;color:#334155;margin-top:2px\">${bits} 位<\/div>\n      <div style=\"font-size:10px;color:#8b95a3;white-space:nowrap\">${Math.pow(2,bits).toLocaleString('en-US')} 种<\/div>\n    <\/div>`;\n  };\n\n  let wayDesc = W === 1 ? '直接映射（每行即一组）' : (W === rowsTotal ? '全相联（整个 Cache 一组）' : `${W} 路组相联`);\n  if(W === 1) wayDesc = '直接映射';\n  else if(groupsTotal === 1) wayDesc = '全相联';\n\n  $('pOut').innerHTML =\n    `<div class=\"res\">\n      <div class=\"r\"><span class=\"lbl\">块内地址<\/span><span style=\"font-size:12.5px\">= log₂(块大小 2^${c}) = <b>${blockOff}<\/b> 位　<span style=\"color:#8b95a3\">（所有映射方式都一样）<\/span><\/span><\/div>\n      <div class=\"r\"><span class=\"lbl\">主存块数<\/span><span style=\"font-size:12.5px\">= 2^${a} / 2^${c} = 2^${mainBlocks}，块号需 <b>${mainBlocks}<\/b> 位<\/span><\/div>\n      <div class=\"r\"><span class=\"lbl\">Cache<\/span><span style=\"font-size:12.5px\">共 <b>${rowsTotal.toLocaleString('en-US')}<\/b> 行${W>1?`，划分为 <b>${groupsTotal.toLocaleString('en-US')}<\/b> 组（${wayDesc}）`:`，${wayDesc}`}<\/span><\/div>\n    <\/div>\n    <div style=\"font-size:11.5px;color:#6b7280;font-weight:650;margin:16px 0 8px\">主存地址格式（共 ${a} 位）<\/div>\n    <div style=\"display:flex;gap:7px;align-items:stretch\">\n      ${seg('标记 Tag', tagBits, '#2563eb', '#eaf0ff')}\n      ${seg('组号 / 行号', groupBits, '#d97706', '#fff4e3')}\n      ${seg('块内地址', blockOff, '#0f9d6e', '#e5f7f0')}\n    <\/div>\n    <div class=\"tip s\" style=\"margin-top:12px\"><span class=\"ti\">速记<\/span><span>\n      标记位数 = <b>主存地址总位数 − 组号位数 − 块内地址位数<\/b> = ${a} − ${groupBits} − ${blockOff} = <b>${tagBits}<\/b>。\n      也可以这样想：${a} 位主存地址里，被 Cache 直接「用掉」的是 ${groupBits + blockOff} 位，剩下的 ${tagBits} 位就是标记。\n    <\/span><\/div>\n    ${W>1 && groupsTotal>1 ? `<div class=\"tip i\" style=\"margin-top:6px\"><span class=\"ti\">规律<\/span><span>路数从 1 变成 ${W}，组数就减少 ${Math.log2(W)} 倍，<b>组号位数少 ${Math.log2(W)} 位、标记多 ${Math.log2(W)} 位<\/b>。路数越多，标记越长，但冲突越少。<\/span><\/div>` : ''}`;\n}\n['pMem','pCache','pBlk'].forEach(id=>$(id).oninput = renderPart);\n$('pWay').onchange = renderPart;\nrenderPart();\n\n/* ============================================================\n   动画 10 · 虚拟地址 → 物理地址\n   ============================================================ */\nconst PAGE_TABLE = { '1':'A', '2':'7', '3':'B', '4':'C', '5':'3' };\nlet vaTimer = [];\nfunction renderVA(auto){\n  vaTimer.forEach(t=>clearTimeout(t)); vaTimer = [];\n  let raw = ($('vaIn').value || '').trim();\n  let v = parseInt(raw.replace(/^0[xX]/,''), /^0[xX]/.test(raw) ? 16 : 10);\n  if(isNaN(v)) v = 0;\n  v = (v >>> 0) & 0xFFFFFFFF;\n\n  const vpn = (v >>> 12) & 0xFFFFF;      // 20 位虚页号\n  const off = v & 0xFFF;                  // 12 位页内偏移\n  const vpnHex = vpn.toString(16).toUpperCase().padStart(5,'0');\n  const offHex = off.toString(16).toUpperCase().padStart(3,'0');\n  const vHex = '0x' + v.toString(16).toUpperCase().padStart(8,'0');\n  const pfn = PAGE_TABLE[String(vpn)];\n  const missPage = !pfn;\n  const pfnHex = missPage ? '─────' : pfn.padStart(5,'0');\n  const pa = missPage ? null : ((parseInt(pfn,16) << 12) | off);\n  const paHex = pa === null ? '（缺页，需先调入）' : '0x' + pa.toString(16).toUpperCase().padStart(8,'0');\n\n  const steps = [\n    ['① 拆分虚拟地址', `页大小 4 KB = 2¹²，所以低 12 位是页内偏移，高 20 位是虚页号。`,\n     `虚页号 = ${vHex} >> 12 = <b>0x${vpnHex}<\/b>　页内偏移 = ${vHex} & 0xFFF = <b>0x${offHex}<\/b>`],\n    ['② 查 TLB（快表）', `用虚页号 0x${vpnHex} 去 TLB 里并行比对，TLB 在 CPU 内，用的是 SRAM。`,\n     `本例视为 <b>TLB 未命中<\/b>（首次访问该页）→ 需要访问主存中的页表`],\n    ['③ 访问页表', `页表存在主存，用虚页号作为索引取出对应页表项。这一步要访问主存，所以慢。`,\n     `页表项 = 页表[0x${vpnHex}]`],\n    ['④ 有效性检查', `页表项里的有效位（驻留位）告诉硬件这个页面当前是否在主存中。`,\n     missPage ? `<b style=\"color:#dc2626\">有效位为 0 → 触发缺页异常<\/b>，转操作系统处理` : `有效位为 1 → 页面在主存中，继续`],\n    ['⑤ 取出物理页号', `页表项中保存的是物理页号（页框号），它和页内偏移一起构成物理地址。`,\n     `物理页号 = <b>0x${pfnHex}<\/b>`],\n    ['⑥ 拼接物理地址', `物理地址 = 物理页号左移 12 位 + 页内偏移。<b>页内偏移全程不变<\/b>——这是页式存储的关键。`,\n     `PA = (0x${pfnHex} << 12) | 0x${offHex} = <b>${paHex}<\/b>`]\n  ];\n\n  $('vaSteps').innerHTML = steps.map((s,i)=>\n    `<div class=\"step\" id=\"vas${i}\"><div class=\"n\">${i+1}<\/div><div>\n      <div class=\"t\">${s[0]}<\/div>\n      <div class=\"d\">${s[1]}<\/div>\n      <div class=\"d\" style=\"margin-top:5px;color:#2563eb\">${s[2]}<\/div>\n    <\/div><\/div>`).join('');\n\n  $('vaEv').innerHTML =\n    `<span class=\"ev\">虚拟地址 ${vHex}<\/span>\n     <span class=\"ev\">虚页号 0x${vpnHex}<\/span>\n     <span class=\"ev\">页内偏移 0x${offHex}<\/span>\n     <span class=\"ev\">TLB 未命中<\/span>\n     <span class=\"ev\">查页表<\/span>\n     <span class=\"ev\" ${missPage?'style=\"background:#dc2626\"':'style=\"background:#0f9d6e\"'}>物理页号 0x${pfnHex}<\/span>\n     <span class=\"ev\">物理地址 ${paHex}<\/span>`;\n\n  const evs = qsa('#vaEv .ev');\n  if(!auto) return;\n  for(let i=0;i<steps.length;i++){\n    vaTimer.push(setTimeout(()=>{\n      qsa('#vaSteps .step').forEach(e=>e.classList.remove('act'));\n      const el = $('vas'+i);\n      if(el){ el.classList.add('act'); el.scrollIntoView({block:'nearest',behavior:'smooth'}); }\n      if(evs[i]) evs[i].classList.add('on');\n    }, 700*i + 120));\n  }\n}\n$('vaIn').oninput = ()=>renderVA(false);\nqsa('[data-va]').forEach(b=>b.onclick=()=>{ $('vaIn').value=b.dataset.va; renderVA(true); });\n$('vaStart').onclick = ()=>renderVA(true);\nrenderVA(false);   /* 首次只画静态结果；自动播放会 scrollIntoView，把刚打开的页面拽到本章 */\n\n/* ============================================================\n   动画 11 · 扩展操作码\n   ============================================================ */\nfunction renderExt(){\n  const k = Math.max(1, Math.min(8, parseInt($('eK').value,10)||4));\n  const a = Math.max(1, Math.min(8, parseInt($('eA').value,10)||4));\n  const n3 = Math.max(0, parseInt($('e3').value,10)||0);\n  const n2 = Math.max(0, parseInt($('e2').value,10)||0);\n  const n1 = Math.max(0, parseInt($('e1').value,10)||0);\n  const A = Math.pow(2,a), K = Math.pow(2,k);\n\n  const cap3 = K,            left3 = cap3 - n3;\n  const cap2 = left3 * A,    left2 = cap2 - n2;\n  const cap1 = left2 * A,    left1 = cap1 - n1;\n  const cap0 = left1 * A;\n\n  const bad = left3 < 0 || left2 < 0 || left1 < 0;\n\n  const bar = (used, cap, color)=>{\n    const pct = cap > 0 ? Math.min(100, used/cap*100) : 0;\n    return `<div style=\"height:14px;background:#eef2f7;border-radius:7px;overflow:hidden;margin-top:5px\">\n      <div style=\"width:${pct}%;height:100%;background:${color};transition:width .5s\"><\/div><\/div>`;\n  };\n\n  const row = (name, opBits, cap, used, color, note)=>{\n    const left = cap - used;\n    return `<div class=\"card\" style=\"box-shadow:none;border-color:${left<0?'#f5c2c0':'#e3e8ef'}\">\n      <h4>${name} <span class=\"pt\" style=\"background:${color}22;color:${color}\">操作码 ${opBits} 位<\/span><\/h4>\n      <div style=\"font-size:12.5px;color:#3c4654\">\n        编码空间 = 2<sup>${opBits}<\/sup> = <b>${cap.toLocaleString('en-US')}<\/b> 条　·　已用 <b>${used}<\/b> 条　·　剩余\n        <b style=\"color:${left<0?'#dc2626':'#0f9d6e'}\">${left.toLocaleString('en-US')}<\/b> 条\n      <\/div>\n      ${bar(used, cap, color)}\n      <div style=\"font-size:11.5px;color:#8b95a3;margin-top:6px\">${note}<\/div>\n    <\/div>`;\n  };\n\n  $('eOut').innerHTML =\n    `<div class=\"grid g2\" style=\"margin-bottom:4px\">\n      ${row('三地址指令', k, cap3, n3, '#2563eb', `起始编码空间 = 2^${k}，每用掉 1 个，就少 1 个可用于扩展。`)}\n      ${row('二地址指令', k+a, cap2, n2, '#0891b2', `可用空间 = 三地址剩余 ${left3} × 2^${a} = ${cap2.toLocaleString('en-US')}`)}\n      ${row('一地址指令', k+2*a, cap1, n1, '#0f9d6e', `可用空间 = 二地址剩余 ${left2} × 2^${a} = ${cap1.toLocaleString('en-US')}`)}\n      ${row('零地址指令', k+3*a, cap0, 0, '#d97706', `可用空间 = 一地址剩余 ${left1} × 2^${a} = ${cap0.toLocaleString('en-US')}`)}\n    <\/div>\n    ${bad ? '<div class=\"tip e\" style=\"margin-top:12px\"><span class=\"ti\">不合法<\/span><span>某一级指令条数超过了该级编码空间，说明这个指令系统无法按此方案编码，需要增加操作码位数。<\/span><\/div>' : ''}\n    <div class=\"tip s\" style=\"margin-top:12px\"><span class=\"ti\">结论<\/span><span>\n      在「操作码基础 ${k} 位、地址码各 ${a} 位」的前提下，按上述分配，\n      <b>零地址指令最多还可安排 ${cap0.toLocaleString('en-US')} 条<\/b>。\n    <\/span><\/div>\n    <div class=\"tip i\" style=\"margin-top:6px\"><span class=\"ti\">原理<\/span><span>\n      扩展操作码的本质是<b>用地址码字段腾出的位来换操作码位<\/b>。三地址指令因为要留出 3 个地址码，操作码最短；\n      零地址指令不需要地址码，整个指令字都能当操作码，所以短指令（地址少）天然拥有更大的编码空间。\n      关键约束是<span class=\"key\">短操作码不能是长操作码的前缀<\/span>——实现上就是「留出全 1 的编码给更长的格式用」。\n    <\/span><\/div>`;\n}\n['eK','eA','e3','e2','e1'].forEach(id=>$(id).oninput = renderExt);\nrenderExt();\n\n/* ============================================================\n   动画 12 · 寻址方式实验室\n   ============================================================ */\nconst AM = {\n  imm: {n:'立即寻址', ea:'—（操作数就在指令中）', mem:0, formula:'操作数 = A',\n    desc:'地址码字段直接就是操作数本身，取指令时一并取出，不需要再访存。速度最快，但操作数大小受地址码位数限制，且值在程序运行中不可改变。',\n    use:'给常量赋值，如 ADD R1, #100'},\n  reg: {n:'寄存器寻址', ea:'—（操作数在寄存器中）', mem:0, formula:'操作数 = (R)',\n    desc:'地址码给出寄存器编号，操作数存放在该寄存器里。不访存，速度快，但寄存器数量有限。',\n    use:'寄存器之间的运算，如 ADD R1, R2'},\n  dir: {n:'直接寻址', ea:'EA = A', mem:1, formula:'EA = A',\n    desc:'地址码直接就是操作数在主存中的地址。只需一次访存即可取到操作数，但寻址范围受地址码位数限制（A 有多少位，就只能覆盖多大空间）。',\n    use:'访问单个全局变量、数组首元素'},\n  ind: {n:'间接寻址', ea:'EA = (A)', mem:2, formula:'EA = (A)',\n    desc:'地址码给出的是「操作数地址的地址」。第一次访存取到真正的有效地址，第二次访存才取到操作数。<b>扩大了寻址范围<\/b>，但速度慢一倍。',\n    use:'子程序返回时修改返回地址、指针访问'},\n  rind:{n:'寄存器间接寻址', ea:'EA = (R)', mem:1, formula:'EA = (R)',\n    desc:'寄存器里存的是操作数的<b>主存地址<\/b>。只需一次访存，既扩大了寻址范围又比间接寻址快，是指针访问的硬件基础。',\n    use:'指针解引用，如 C 语言中 *p'},\n  rel: {n:'相对寻址', ea:'EA = PC + A', mem:1, formula:'EA = (PC) + A',\n    desc:'以程序计数器 PC 的当前值为基准加上形式地址 A（通常是带符号的偏移量）。因为程序整体浮动时 PC 和目标的差值不变，所以<b>转移指令用它实现位置无关代码<\/b>。',\n    use:'条件转移、循环跳转，如 JMP +8'},\n  base:{n:'基址寻址', ea:'EA = (BR) + A', mem:1, formula:'EA = (BR) + A',\n    desc:'基址寄存器 BR 的内容由<b>操作系统或管理程序<\/b>设定，在程序执行过程中不变；形式地址 A 是偏移量。用户程序不必关心自己装在哪块内存，从而实现<b>程序浮动<\/b>。',\n    use:'多道程序的内存重定位'},\n  index:{n:'变址寻址', ea:'EA = (IX) + A', mem:1, formula:'EA = (IX) + A',\n    desc:'形式地址 A 给出<b>数组首地址<\/b>，变址寄存器 IX 由<b>用户程序<\/b>在循环中自增。这是数组顺序访问的标准实现方式。',\n    use:'for 循环遍历数组 a[i]'}\n};\nfunction parseNum(s){\n  s = (s||'').trim();\n  if(/^0[xX]/.test(s)) return parseInt(s.replace(/^0[xX]/,''),16);\n  return parseInt(s,10);\n}\nfunction renderAM(){\n  const m = AM[$('amMode').value];\n  const A = parseNum($('amA').value), R = parseNum($('amR').value), PC = parseNum($('amPC').value);\n  const ok = v => isNaN(v) ? null : v;\n  let detail = '';\n\n  const f = (x)=> x===null ? '—' : '0x' + x.toString(16).toUpperCase();\n\n  if(m.n === '立即寻址'){\n    detail = `操作数 = A = <b>${isNaN(A)?'—':A}<\/b>（十进制）`;\n  } else if(m.n === '寄存器寻址'){\n    detail = `操作数 = 寄存器内容 = <b>${isNaN(R)?'—':R}<\/b>`;\n  } else if(m.n === '直接寻址'){\n    detail = `EA = A = <b>${f(ok(A))}<\/b>`;\n  } else if(m.n === '间接寻址'){\n    detail = `EA = (A) = 主存单元 [${f(ok(A))}] 中存放的地址。此处演示设为 A 的两倍关系：EA ≈ <b>0x${isNaN(A)?'—':(A*2).toString(16).toUpperCase()}<\/b>`;\n  } else if(m.n === '寄存器间接寻址'){\n    detail = `EA = (R) = <b>${f(ok(R))}<\/b>`;\n  } else if(m.n === '相对寻址'){\n    detail = `EA = PC + A = ${f(ok(PC))} + (${isNaN(A)?'—':A}) = <b>${f(ok(PC))} 的相对偏移 ${isNaN(A)?'—':A} 字节处<\/b>`;\n  } else if(m.n === '基址寻址'){\n    detail = `EA = (BR) + A = ${f(ok(R))} + ${isNaN(A)?'—':A} = <b>0x${(isNaN(R)||isNaN(A))?'—':(R+A).toString(16).toUpperCase()}<\/b>`;\n  } else if(m.n === '变址寻址'){\n    detail = `EA = (IX) + A = ${f(ok(R))} + ${isNaN(A)?'—':A} = <b>0x${(isNaN(R)||isNaN(A))?'—':(R+A).toString(16).toUpperCase()}<\/b>`;\n  }\n\n  const memTag = m.mem === 0\n    ? '<span style=\"color:#0f9d6e;font-weight:800\">0 次<\/span>（最快）'\n    : (m.mem === 1 ? '<span style=\"color:#d97706;font-weight:800\">1 次<\/span>' : '<span style=\"color:#dc2626;font-weight:800\">2 次<\/span>（最慢）');\n\n  // 路径图\n  const p = m.n;\n  const path = [];\n  path.push('<b>指令<\/b>');\n  if(p === '立即寻址') path.push('操作数直接嵌在地址码字段', '<b style=\"color:#0f9d6e\">拿到操作数<\/b>');\n  else if(p === '寄存器寻址') path.push('地址码 = 寄存器号 R', '<b style=\"color:#0f9d6e\">读 R 得到操作数<\/b>');\n  else if(p === '直接寻址') path.push('EA = A', '访存 [EA]', '<b style=\"color:#0f9d6e\">拿到操作数<\/b>');\n  else if(p === '间接寻址') path.push('访存 [A] 得 EA', '访存 [EA] 得操作数', '<b style=\"color:#0f9d6e\">拿到操作数<\/b>');\n  else if(p === '寄存器间接寻址') path.push('读 R 得 EA', '访存 [EA]', '<b style=\"color:#0f9d6e\">拿到操作数<\/b>');\n  else if(p === '相对寻址') path.push('EA = (PC) + A', '访存 [EA]', '<b style=\"color:#0f9d6e\">拿到操作数 / 转移目标<\/b>');\n  else if(p === '基址寻址') path.push('EA = (BR) + A', '访存 [EA]', '<b style=\"color:#0f9d6e\">拿到操作数<\/b>');\n  else path.push('EA = (IX) + A', '访存 [EA]', '<b style=\"color:#0f9d6e\">拿到操作数<\/b>');\n\n  $('amOut').innerHTML =\n    `<div class=\"res\">\n      <div class=\"r\"><span class=\"lbl\">寻址方式<\/span><span class=\"val\">${m.n}<\/span>\n        <span style=\"font-size:11.5px;color:#8b95a3\">取操作数需访存 ${memTag}<\/span><\/div>\n      <div class=\"r\" style=\"margin-top:6px\"><span class=\"lbl\">公式<\/span><span class=\"mono\" style=\"font-size:13px;color:#1e293b\">${m.formula}<\/span><\/div>\n      <div class=\"r\" style=\"margin-top:6px\"><span class=\"lbl\">本例<\/span><span style=\"font-size:13px\">${detail}<\/span><\/div>\n    <\/div>\n    <div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;padding:12px 14px;background:#f7f9fc;border:1px solid #e3e8ef;border-radius:10px\">\n      ${path.map((t,i)=>`<span style=\"font-size:12px;padding:5px 11px;border-radius:8px;background:#fff;border:1px solid #e3e8ef\">${t}<\/span>${i<path.length-1?'<span style=\"color:#c3cbd7\">→<\/span>':''}`).join('')}\n    <\/div>\n    <div class=\"tip i\" style=\"margin-top:12px\"><span class=\"ti\">理解<\/span><span>${m.desc}<\/span><\/div>\n    <div class=\"tip s\" style=\"margin-top:6px\"><span class=\"ti\">典型用途<\/span><span>${m.use}<\/span><\/div>`;\n}\n$('amMode').onchange = renderAM;\n['amA','amR','amPC'].forEach(id=>$(id).oninput = renderAM);\nrenderAM();\n\n/* ============================================================\n   动画 13 · 指令周期 × 单总线数据通路\n   ============================================================ */\nconst DP = {\n  add: {\n    name:'ADD R1, (R0)',\n    init:{PC:'1000', MAR:'—', MDR:'—', IR:'—', R0:'2000', R1:'5', ACC:'—'},\n    mem:{'1000':'ADD R1,(R0)','2000':'12'},\n    ops:[\n      {ph:'取指周期', t:'(PC) → MAR', f:'PC', to:'MAR', set:{MAR:'1000'}, v:'1000',\n       why:'PC 里的指令地址被送上总线，MAR 接收。这一步只占用总线一次。'},\n      {ph:'取指周期', t:'M(MAR) → MDR', f:'MEM', to:'MDR', set:{MDR:'ADD R1,(R0)'}, v:'指令',\n       why:'存储器按 MAR 指出的地址读出内容，送到 MDR。<b>注意方向是从存储器\"流出来\"的<\/b>——此时读出来的是<b>指令<\/b>，还不是数据。'},\n      {ph:'取指周期', t:'(MDR) → IR', f:'MDR', to:'IR', set:{IR:'ADD R1,(R0)'}, v:'指令',\n       why:'指令进入 IR，接下来控制器开始译码。取指阶段到此结束，IR 里已是当前指令。'},\n      {ph:'取指周期', t:'(PC) + 1 → PC', f:'PC', to:'PC', set:{PC:'1001'}, v:'1001', self:true,\n       why:'<b>关键考点<\/b>：PC 自增发生在取指阶段末尾，不是执行阶段。加 1 是因为按字编址且一条指令占一个存储字。<br><b>注意这一步没有连线<\/b>——它是 PC 内部完成的，<b>不占用总线<\/b>。'},\n      {ph:'执行周期', t:'(R0) → MAR', f:'REG', to:'MAR', set:{MAR:'2000'}, v:'2000',\n       why:'这是一条间接寻址指令。R0 中保存的是<b>操作数的地址<\/b>，把它送到 MAR，准备再次访存。'},\n      {ph:'执行周期', t:'M(MAR) → MDR', f:'MEM', to:'MDR', set:{MDR:'12'}, v:'12',\n       why:'第二次访存，这次取出的是真正要参与运算的<b>数据<\/b>——12。'},\n      {ph:'执行周期', t:'(MDR) + (R1) → R1', f:'MDR', to:'REG', set:{R1:'17'}, v:'17',\n       why:'ALU 做加法，结果写回 R1。单总线结构下这一步实际上要拆成两次总线传送，所以需要额外时钟周期。'}\n    ]\n  },\n  load: {\n    name:'LOAD R1, [2000]',\n    init:{PC:'1000', MAR:'—', MDR:'—', IR:'—', R0:'2000', R1:'5', ACC:'—'},\n    mem:{'1000':'LOAD R1,[2000]','2000':'12'},\n    ops:[\n      {ph:'取指周期', t:'(PC) → MAR', f:'PC', to:'MAR', set:{MAR:'1000'}, v:'1000', why:'把指令地址送上总线。'},\n      {ph:'取指周期', t:'M(MAR) → MDR', f:'MEM', to:'MDR', set:{MDR:'LOAD R1,[2000]'}, v:'指令', why:'读出指令。'},\n      {ph:'取指周期', t:'(MDR) → IR', f:'MDR', to:'IR', set:{IR:'LOAD R1,[2000]'}, v:'指令', why:'指令送入 IR。'},\n      {ph:'取指周期', t:'(PC) + 1 → PC', f:'PC', to:'PC', set:{PC:'1001'}, v:'1001', self:true,\n       why:'PC 自增。<b>这一步也不占用总线。<\/b>'},\n      {ph:'执行周期', t:'A → MAR', f:'IR', to:'MAR', set:{MAR:'2000'}, v:'2000',\n       why:'直接寻址：指令中的形式地址 2000 直接就是有效地址（存在 IR 的地址字段里），送到 MAR。'},\n      {ph:'执行周期', t:'M(MAR) → MDR', f:'MEM', to:'MDR', set:{MDR:'12'}, v:'12', why:'访存取出数据 12。'},\n      {ph:'执行周期', t:'(MDR) → R1', f:'MDR', to:'REG', set:{R1:'12'}, v:'12', why:'数据写入目标寄存器 R1。'}\n    ]\n  },\n  store: {\n    name:'STORE R1, [2000]',\n    init:{PC:'1000', MAR:'—', MDR:'—', IR:'—', R0:'2000', R1:'5', ACC:'—'},\n    mem:{'1000':'STORE R1,[2000]','2000':'12'},\n    ops:[\n      {ph:'取指周期', t:'(PC) → MAR', f:'PC', to:'MAR', set:{MAR:'1000'}, v:'1000', why:'取指令地址。'},\n      {ph:'取指周期', t:'M(MAR) → MDR', f:'MEM', to:'MDR', set:{MDR:'STORE R1,[2000]'}, v:'指令', why:'读出指令。'},\n      {ph:'取指周期', t:'(MDR) → IR', f:'MDR', to:'IR', set:{IR:'STORE R1,[2000]'}, v:'指令', why:'指令送入 IR。'},\n      {ph:'取指周期', t:'(PC) + 1 → PC', f:'PC', to:'PC', set:{PC:'1001'}, v:'1001', self:true,\n       why:'PC 自增，不占用总线。'},\n      {ph:'执行周期', t:'A → MAR', f:'IR', to:'MAR', set:{MAR:'2000'}, v:'2000', why:'形成有效地址，准备写入。'},\n      {ph:'执行周期', t:'(R1) → MDR', f:'REG', to:'MDR', set:{MDR:'5'}, v:'5',\n       why:'要被写出的数据先送进 MDR。'},\n      {ph:'执行周期', t:'(MDR) → M(MAR)', f:'MDR', to:'MEM', set:{}, v:'5',\n       why:'数据写入主存单元 2000。<b>看流向：这一步是从 CPU\"流回\"存储器，方向与读操作刚好相反。<\/b>'}\n    ]\n  }\n};\nlet dpKey = 'add', dpIdx = -1, dpTimer = null;\n\n/* 部件在总线上的挂载位置：x = 部件中心，y = 与总线相接的那条边 */\nconst DP_BUS_Y = 190;\nconst DP_POS = {\n  PC:{x:108, y:122}, MAR:{x:234, y:122}, MDR:{x:360, y:122}, IR:{x:486, y:122},\n  MEM:{x:160, y:272}, ALU:{x:355, y:272}, REG:{x:540, y:272}, ACC:{x:720, y:272}\n};\nfunction dpClip(s, n){\n  s = String(s == null ? '' : s);\n  return s.length > n ? s.slice(0, n - 1) + '…' : s;\n}\nfunction dpBox(id, x, y, w, h, label, sub, role){\n  // role: 'from' = 本步发出数据的部件 / 'to' = 本步接收数据的部件\n  const isMem = (id === 'MEM');\n  let stroke = isMem ? '#d97706' : '#2563eb';\n  let fill   = isMem ? '#fff4e3' : '#eaf0ff';\n  let tc     = isMem ? '#9a5b06' : '#1e40af';\n  let sw = 1.8;\n  if(role === 'from'){ stroke = '#7c3aed'; fill = '#f2ecfe'; tc = '#5b21b6'; sw = 3.4; }\n  if(role === 'to'){ stroke = '#dc2626'; fill = '#fdeceb'; tc = '#8d2020'; sw = 3.4; }\n  return `<g>\n    <rect x=\"${x}\" y=\"${y}\" width=\"${w}\" height=\"${h}\" rx=\"11\" fill=\"${fill}\" stroke=\"${stroke}\" stroke-width=\"${sw}\" style=\"transition:.3s\"/>\n    <text x=\"${x+w/2}\" y=\"${y+(sub?h/2-5:h/2+5)}\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"800\" fill=\"${tc}\">${label}<\/text>\n    ${sub?`<text x=\"${x+w/2}\" y=\"${y+h/2+14}\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#8b95a3\">${sub}<\/text>`:''}\n  <\/g>`;\n}\n\nfunction dpRender(){\n  const d = DP[dpKey];\n  const regs = Object.assign({}, d.init);\n  const mem = Object.assign({}, d.mem);\n  for(let i=0;i<=dpIdx;i++){\n    const s = d.ops[i].set;\n    if(s) for(const k in s) regs[k] = s[k];\n    if(dpKey === 'store' && i === d.ops.length-1) mem['2000'] = '5';\n  }\n  const cur = dpIdx >= 0 ? d.ops[dpIdx] : null;\n  const selfLoop = !!(cur && (cur.f === cur.to));\n\n  /* ★ 数据流向：源部件 → 总线 → 目标部件 */\n  let flowPath = null;\n  if(cur && !selfLoop){\n    const A = DP_POS[cur.f], B = DP_POS[cur.to];\n    if(A && B) flowPath = `M${A.x},${A.y} L${A.x},${DP_BUS_Y} L${B.x},${DP_BUS_Y} L${B.x},${B.y}`;\n  }\n  const roleOf = id => {\n    if(!cur) return '';\n    if(id === cur.f) return 'from';\n    if(id === cur.to) return 'to';\n    return '';\n  };\n  const spd = (typeof ANIM_SPEED === 'number' && ANIM_SPEED > 0) ? ANIM_SPEED : 1.7;\n\n  $('dpStage').innerHTML =\n    `<svg viewBox=\"0 0 900 400\" style=\"width:100%;height:auto;display:block\">\n      <defs>\n        <marker id=\"dpAh\" markerWidth=\"10\" markerHeight=\"10\" refX=\"7.5\" refY=\"3.2\" orient=\"auto\">\n          <path d=\"M0,0 L7.5,3.2 L0,6.4 z\" fill=\"#dc2626\"/>\n        <\/marker>\n      <\/defs>\n\n      <line x1=\"56\" y1=\"${DP_BUS_Y}\" x2=\"852\" y2=\"${DP_BUS_Y}\" stroke=\"#cbd5e1\" stroke-width=\"3\"/>\n      <text x=\"60\" y=\"${DP_BUS_Y+24}\" font-size=\"11.5\" fill=\"#94a3b8\">内部总线 · 单总线结构：同一时刻只能有一个部件向上送数据<\/text>\n\n      ${[108,234,360,486].map(x=>`<line x1=\"${x}\" y1=\"122\" x2=\"${x}\" y2=\"${DP_BUS_Y}\" stroke=\"#dbe3ee\" stroke-width=\"1.6\"/>`).join('')}\n      ${[160,355,540,720].map(x=>`<line x1=\"${x}\" y1=\"${DP_BUS_Y}\" x2=\"${x}\" y2=\"272\" stroke=\"#dbe3ee\" stroke-width=\"1.6\"/>`).join('')}\n\n      ${dpBox('PC', 60, 70, 96, 52, 'PC', dpClip(regs.PC, 10), roleOf('PC'))}\n      ${dpBox('MAR',186, 70, 96, 52, 'MAR', dpClip(regs.MAR, 10), roleOf('MAR'))}\n      ${dpBox('MDR',312, 70, 96, 52, 'MDR', dpClip(regs.MDR, 10), roleOf('MDR'))}\n      ${dpBox('IR', 438, 70, 96, 52, 'IR', dpClip(regs.IR, 10), roleOf('IR'))}\n      ${dpBox('MEM',60, 272, 200, 72, '主存储器', 'M[2000] = ' + mem['2000'], roleOf('MEM'))}\n      ${dpBox('ALU',290,272, 130, 72, 'ALU', '算术逻辑单元', '')}\n      ${dpBox('REG',450,272, 180, 72, '通用寄存器组', 'R0 = ' + regs.R0 + '　R1 = ' + regs.R1, roleOf('REG'))}\n      ${dpBox('ACC',660,272, 120, 72, 'ACC', '累加器', '')}\n\n      <text x=\"152\" y=\"264\" text-anchor=\"end\" font-size=\"10.5\" fill=\"#9a5b06\">M[1000] = ${dpClip(mem['1000'], 14)}<\/text>\n\n      ${flowPath ? `\n        <path d=\"${flowPath}\" fill=\"none\" stroke=\"#fdeceb\" stroke-width=\"11\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n        <path d=\"${flowPath}\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"\n          stroke-dasharray=\"14 8\" marker-end=\"url(#dpAh)\">\n          <animate attributeName=\"stroke-dashoffset\" from=\"44\" to=\"0\" dur=\"${(0.85*spd).toFixed(2)}s\" repeatCount=\"indefinite\"/>\n        <\/path>\n        <g>\n          <circle r=\"9.5\" fill=\"#dc2626\" opacity=\".95\"/>\n          <text y=\"-15\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#dc2626\"\n            stroke=\"#fff\" stroke-width=\"3.5\" paint-order=\"stroke\">${cur.v}<\/text>\n          <animateMotion dur=\"${(1.6*spd).toFixed(2)}s\" repeatCount=\"indefinite\" rotate=\"0\" path=\"${flowPath}\"/>\n        <\/g>\n      ` : ''}\n\n      ${selfLoop ? `\n        <text x=\"${DP_POS[cur.f].x}\" y=\"30\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#dc2626\">↻ ${cur.t}<\/text>\n        <text x=\"${DP_POS[cur.f].x}\" y=\"47\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#dc2626\">在 ${cur.f} 内部完成 · 不占用总线<\/text>\n      ` : ''}\n\n      ${cur && !flowPath && !selfLoop ? `<text x=\"450\" y=\"360\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#b6c0cc\">本步没有部件间的数据传送<\/text>` : ''}\n    <\/svg>`;\n\n  /* 阶段条 + 本步的总线占用情况 */\n  const phs = ['取指周期','间址周期','执行周期','中断周期'];\n  const activePh = cur ? cur.ph : '';\n  let busNote;\n  if(!cur) busNote = '<span style=\"color:#94a3b8\">点「下一步」开始，看数据每一拍从哪个部件流向哪个部件。<\/span>';\n  else if(selfLoop) busNote = `<span style=\"color:#7c3aed;font-weight:700\">本步不占用总线<\/b><\/span> —— ${cur.f} 在自己内部完成 +1，总线空着。`;\n  else busNote = `<span style=\"color:#dc2626;font-weight:700\">本步占用总线 1 拍<\/span> —— 数据从 <b>${cur.f}<\/b> 经内部总线送到 <b>${cur.to}<\/b>（源部件 → 总线 → 目标部件，图中红色路径就是它走的路）。`;\n  $('dpPhase').innerHTML =\n    `<div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-top:12px\">` +\n    phs.map(p=>{\n      const isOn = p === activePh;\n      const isIdle = p === '间址周期' || p === '中断周期';\n      const bg = isOn ? '#2563eb' : '#eef2f7';\n      const col = isOn ? '#fff' : (isIdle ? '#b6c0cc' : '#6b7280');\n      return `<div style=\"flex:1;min-width:88px;text-align:center;padding:8px 6px;border-radius:9px;background:${bg};\n        color:${col};font-size:12.5px;font-weight:700;transition:.3s\">${p}${isIdle?'<span style=\"font-size:9.5px;font-weight:500\">（本例无）<\/span>':''}<\/div>`;\n    }).join('') + `<\/div>\n    <div style=\"margin-top:10px;font-size:12.5px;color:#4b5665;background:#f8f7fc;border:1px solid #e8e5e0;\n      border-left:3px solid #dc2626;border-radius:8px;padding:9px 13px;line-height:1.7\">${busNote}<\/div>`;\n\n  /* 微操作列表 */\n  let html = '', n = 0, lastPh = '';\n  d.ops.forEach((o,i)=>{\n    if(o.ph !== lastPh){ html += `<div style=\"font-size:11.5px;font-weight:750;color:#6b7280;margin:12px 0 6px\">${o.ph}<\/div>`; lastPh = o.ph; }\n    const cls = i < dpIdx ? 'dn' : (i === dpIdx ? 'act' : '');\n    n++;\n    html += `<div class=\"step ${cls}\"><div class=\"n\">${n}<\/div><div style=\"flex:1\">\n      <div class=\"t\" style=\"font-family:Consolas,monospace;font-size:13px\">${o.t}<\/div>\n      <div class=\"d\">${o.why}<\/div><\/div><\/div>`;\n  });\n  $('dpUop').innerHTML = html;\n\n  $('dpNext').disabled = dpIdx >= d.ops.length - 1;\n}\nfunction dpStep(){ if(dpIdx < DP[dpKey].ops.length - 1){ dpIdx++; dpRender(); } else { clearInterval(dpTimer); dpTimer = null; } }\n$('dpNext').onclick = ()=>{ clearInterval(dpTimer); dpTimer=null; dpStep(); };\n$('dpReset').onclick = ()=>{ clearInterval(dpTimer); dpTimer=null; dpIdx=-1; dpRender(); };\n$('dpPlay').onclick = ()=>{\n  clearInterval(dpTimer);\n  dpIdx = -1; dpRender();\n  dpTimer = setInterval(dpStep, 1500);\n};\n$('dpInstr').onchange = e=>{ clearInterval(dpTimer); dpTimer=null; dpKey = e.target.value; dpIdx = -1; dpRender(); };\nON_SPEED_CHANGE.push(dpRender);\ndpRender();\n\n/* ============================================================\n   动画 14 · 微程序控制器：换指令看微程序岔路\n   ============================================================ */\nconst MCP_FETCH = [\n  {addr:0, uop:'(PC)→MAR', cmds:['PCout','MARin'],\n   note:'<b>取指微程序第 1 条 —— 所有指令公用<\/b>。CMAR=0，从 CM 按这个地址取出微指令存入 μIR；μIR 中的微命令生效：PC 里的指令地址送上内部总线，送进 MAR。'},\n  {addr:1, uop:'M(MAR)→MDR', cmds:['MemR','MDRin'],\n   note:'发出主存读命令，主存按 MAR 中的地址读出<b>指令<\/b>送入 MDR。注意此刻读到的还是指令，不是数据。'},\n  {addr:2, uop:'(MDR)→IR', cmds:['MDRout','IRin'],\n   note:'指令送入 IR —— 控制器至此「拿到并锁定」了当前指令，下一步就要译码了。'},\n  {addr:3, uop:'(PC)+1→PC', cmds:['PC+1'],\n   note:'PC 自增，为取下一条指令做准备。取指微程序至此执行完毕 —— 接下来就是微程序控制器特有的「岔路」。'}\n];\nconst MCP_EXEC = {\n  add: { label:'ADD R1, (R0)', entry:8, steps:[\n    {addr:8, uop:'(R0)→MAR', cmds:['R0out','MARin'],\n     note:'进入 ADD 自己的执行微程序。间接寻址：R0 中存的是操作数地址，送往 MAR，准备再次访存。'},\n    {addr:9, uop:'M(MAR)→MDR', cmds:['MemR','MDRin'],\n     note:'访存取数：主存把要参与运算的操作数送入 MDR。'},\n    {addr:10, uop:'(MDR)+(R1)→R1', cmds:['MDRout','ALU(+)','R1in'],\n     note:'μIR 发出加法与寄存器写入命令：ALU 完成 (MDR)+(R1)，结果写回 R1。ADD 的执行微程序结束。'}\n  ]},\n  load: { label:'LOAD R1, [2000]', entry:12, steps:[\n    {addr:12, uop:'A→MAR', cmds:['Ad(IR)out','MARin'],\n     note:'进入 LOAD 自己的执行微程序。直接寻址：把指令中地址字段 A 的内容送往 MAR。'},\n    {addr:13, uop:'M(MAR)→MDR', cmds:['MemR','MDRin'],\n     note:'按地址读出数据，送入 MDR。'},\n    {addr:14, uop:'(MDR)→R1', cmds:['MDRout','R1in'],\n     note:'把数据写进目标寄存器 R1。LOAD 的执行微程序结束。'}\n  ]},\n  store: { label:'STORE R1, [2000]', entry:16, steps:[\n    {addr:16, uop:'A→MAR', cmds:['Ad(IR)out','MARin'],\n     note:'进入 STORE 自己的执行微程序。先形成写入地址，送往 MAR。'},\n    {addr:17, uop:'(R1)→MDR', cmds:['R1out','MDRin'],\n     note:'把要写出的数据从 R1 送进 MDR 缓冲。'},\n    {addr:18, uop:'M(MAR)←(MDR)', cmds:['MemW','MDRout'],\n     note:'发出主存写命令，MDR 中的数据写入主存。STORE 的执行微程序结束。'}\n  ]}\n};\nlet mcpKey = 'add', mcpIdx = -1, mcpTimer = null, mcpSeq = [];\n\nfunction mcpBuildSeq(){\n  const exe = MCP_EXEC[mcpKey];\n  const seq = [];\n  MCP_FETCH.forEach(mi=>seq.push({k:'fetch', addr:mi.addr, uop:mi.uop, cmds:mi.cmds,\n    title:'(CMAR)=' + mi.addr + ' · ' + mi.uop, note:mi.note}));\n  seq.push({k:'decode',\n    title:'操作码 → 执行微程序入口 ' + exe.entry,\n    note:'取指结束，微地址形成部件读出 IR 中的操作码，得到 <b>' + exe.label + '<\/b> 执行微程序的入口地址 <b>' + exe.entry + '<\/b>，送入 CMAR。<br>这就是岔路口：前面 4 条取指微指令所有指令共用，从这里开始才各走各的路。'});\n  exe.steps.forEach(mi=>seq.push({k:'exec', addr:mi.addr, uop:mi.uop, cmds:mi.cmds,\n    title:'(CMAR)=' + mi.addr + ' · ' + mi.uop, note:mi.note}));\n  seq.push({k:'loop',\n    title:'(CMAR) ← 0 · 取下一条指令',\n    note:'执行微程序走完，控制部分把 CMAR 置回 0，开始取下一条指令 —— 又回到那段公用的取指微程序。周而复始。这就是「微程序」名字的由来：<b>它是一段存放在 CM 里的程序，控制器靠「跑程序」来指挥 CPU<\/b>。'});\n  return seq;\n}\n\nfunction mcpRender(){\n  const cur = mcpIdx >= 0 ? mcpSeq[mcpIdx] : null;\n  const exe = MCP_EXEC[mcpKey];\n  const done = {};\n  for(let i = 0; i < mcpIdx; i++) if(mcpSeq[i].addr !== undefined) done[mcpSeq[i].addr] = true;\n\n  /* ---- 左侧：控制存储器 CM 格子 ---- */\n  const regions = [\n    {key:'fetch', name:'公用取指段', hint:'所有指令共用', items:MCP_FETCH},\n    {key:'add', name:'ADD 专用段', hint:'入口 ' + MCP_EXEC.add.entry, items:MCP_EXEC.add.steps},\n    {key:'load', name:'LOAD 专用段', hint:'入口 ' + MCP_EXEC.load.entry, items:MCP_EXEC.load.steps},\n    {key:'store', name:'STORE 专用段', hint:'入口 ' + MCP_EXEC.store.entry, items:MCP_EXEC.store.steps}\n  ];\n  let cmHtml = '';\n  regions.forEach(rg=>{\n    const active = rg.key === 'fetch' || rg.key === mcpKey;\n    cmHtml += '<div style=\"display:flex;gap:7px;align-items:baseline;margin:9px 0 3px;font-size:11px;font-weight:750;color:' + (active ? '#2b3542' : '#c3cbd7') + '\">'\n      + rg.name + '<span style=\"font-weight:500;font-size:10px;color:#9aa4b2\">' + rg.hint + '<\/span><\/div>';\n    rg.items.forEach(mi=>{\n      const isDone = !!done[mi.addr];\n      const isCur = !!(cur && cur.addr === mi.addr);\n      const isTarget = !!(cur && cur.k === 'decode' && mi.addr === exe.entry);\n      let bg = '#fbfcfe', bd = '#eef1f6', col = '#5c6779', mk = '', fw = 600;\n      if(active){ bg = '#f7f9fc'; bd = '#e3e8ef'; col = '#4b5665'; }\n      if(isDone){ bg = '#e9f8f1'; bd = '#bfe8d6'; col = '#0a6b4a'; mk = '✓'; }\n      if(isTarget){ bg = '#fff4e3'; bd = '#f3cf9b'; col = '#8a5209'; mk = '◀ 即将进入'; }\n      if(isCur){ bg = '#eaf0ff'; bd = '#2563eb'; col = '#1e40af'; mk = '▶'; fw = 800; }\n      cmHtml += '<div style=\"display:flex;align-items:center;gap:8px;padding:3px 9px;border-radius:7px;background:' + bg + ';border:1px solid ' + bd + ';margin:2px 0;transition:.25s\">'\n        + '<span style=\"font-family:Consolas,monospace;font-size:10.5px;color:#9aa4b2;width:20px;text-align:right\">' + mi.addr + '<\/span>'\n        + '<span style=\"flex:1;font-family:Consolas,monospace;font-size:11.5px;font-weight:' + fw + ';color:' + col + '\">' + mi.uop + '<\/span>'\n        + '<span style=\"font-size:10px;font-weight:800;color:' + (isCur ? '#2563eb' : (isTarget ? '#d97706' : '#0f9d6e')) + '\">' + mk + '<\/span>'\n        + '<\/div>';\n    });\n  });\n\n  /* ---- 右侧：CMAR / μIR / 微命令 / 说明 ---- */\n  const badge = (c, tone) => '<span style=\"display:inline-block;padding:2px 9px;border-radius:6px;font-family:Consolas,monospace;font-size:11px;font-weight:700;margin:2px 5px 2px 0;background:' + tone[0] + ';color:' + tone[1] + ';border:1px solid ' + tone[2] + '\">' + c + '<\/span>';\n  const TONE_BLUE = ['#eef4ff', '#1e40af', '#d4e2fc'], TONE_GREEN = ['#e9f9f2', '#0a6b4a', '#bfe8d6'], TONE_ORANGE = ['#fff4e3', '#8a5209', '#f3cf9b'];\n  let cmar = '—', uir = '—', uirSub = '等待取微指令', cmdHtml = '<span style=\"font-size:12px;color:#b6c0cc\">—<\/span>', note;\n  if(!cur){\n    note = '<b>点「下一步」开始<\/b> —— 看一条指令的微程序，怎么从公用的取指段走到自己的专用段。';\n  } else if(cur.k === 'fetch' || cur.k === 'exec'){\n    cmar = String(cur.addr);\n    uir = cur.uop;\n    uirSub = '从 CM[' + cur.addr + '] 取出';\n    cmdHtml = cur.cmds.map(c=>badge(c, cur.k === 'exec' ? TONE_GREEN : TONE_BLUE)).join('');\n    note = cur.note;\n  } else if(cur.k === 'decode'){\n    cmar = '3 → ' + exe.entry;\n    uir = '（微地址形成部件跳转）';\n    uirSub = '按操作码形成入口';\n    cmdHtml = badge('操作码译码', TONE_ORANGE) + '<span style=\"color:#d97706;font-weight:800;font-size:12px;margin-right:5px\">⇒<\/span>' + badge('CMAR = ' + exe.entry, TONE_BLUE);\n    note = cur.note;\n  } else {\n    cmar = '← 0';\n    uir = '（控制转移）';\n    uirSub = '回到取指入口';\n    cmdHtml = badge('CMAR ← 0', TONE_BLUE);\n    note = cur.note;\n  }\n  const prog = mcpIdx < 0 ? '尚未开始' : '第 ' + (mcpIdx + 1) + ' / ' + mcpSeq.length + ' 步';\n\n  $('mcpStage').innerHTML =\n    '<div style=\"display:flex;gap:16px;flex-wrap:wrap;align-items:stretch\">'\n    + '<div style=\"flex:1.15;min-width:292px;background:#fbfcfe;border:1px solid #e3e8ef;border-radius:12px;padding:12px 13px\">'\n    +   '<div style=\"font-size:12.5px;font-weight:800;color:#2b3542\">控制存储器 CM<span style=\"font-weight:500;font-size:10.5px;color:#9aa4b2;margin-left:7px\">ROM · 每格一条微指令（存的是微命令代码）<\/span><\/div>'\n    +   cmHtml\n    + '<\/div>'\n    + '<div style=\"flex:1;min-width:250px;display:flex;flex-direction:column;gap:9px\">'\n    +   '<div style=\"display:flex;gap:9px\">'\n    +     '<div style=\"flex:1;background:#fff;border:1px solid #e3e8ef;border-radius:10px;padding:9px 12px\">'\n    +       '<div style=\"font-size:10px;font-weight:750;color:#9aa4b2;letter-spacing:.4px\">CMAR · 微地址<\/div>'\n    +       '<div style=\"font-size:20px;font-weight:800;color:#2563eb;font-family:Consolas,monospace;line-height:1.4\">' + cmar + '<\/div>'\n    +     '<\/div>'\n    +     '<div style=\"flex:1.6;background:#fff;border:1px solid #e3e8ef;border-radius:10px;padding:9px 12px\">'\n    +       '<div style=\"font-size:10px;font-weight:750;color:#9aa4b2;letter-spacing:.4px\">μIR · 微指令寄存器<\/div>'\n    +       '<div style=\"font-size:14px;font-weight:800;color:' + (cur && (cur.k === 'fetch' || cur.k === 'exec') ? '#1e40af' : '#9aa4b2') + ';font-family:Consolas,monospace;line-height:1.5\">' + uir + '<\/div>'\n    +       '<div style=\"font-size:10px;color:#a9b2bf\">' + uirSub + '<\/div>'\n    +     '<\/div>'\n    +   '<\/div>'\n    +   '<div style=\"background:#fff;border:1px solid #e3e8ef;border-radius:10px;padding:9px 12px\">'\n    +     '<div style=\"font-size:10px;font-weight:750;color:#9aa4b2;letter-spacing:.4px;margin-bottom:4px\">微命令 · 发往各执行部件<\/div>'\n    +     '<div style=\"min-height:24px\">' + cmdHtml + '<\/div>'\n    +   '<\/div>'\n    +   '<div style=\"background:#f8fafd;border:1px solid #e8eef6;border-left:3px solid #2563eb;border-radius:9px;padding:9px 12px;flex:1\">'\n    +     '<div style=\"display:flex;justify-content:space-between;font-size:10px;font-weight:750;color:#9aa4b2;margin-bottom:3px\"><span>当前步说明<\/span><span>' + prog + '<\/span><\/div>'\n    +     '<div style=\"font-size:12px;color:#3c4654;line-height:1.7\">' + note + '<\/div>'\n    +   '<\/div>'\n    + '<\/div>'\n    + '<\/div>';\n\n  /* ---- 底部：步骤条 ---- */\n  const KCOL = {fetch:'#2563eb', decode:'#d97706', exec:'#0f9d6e', loop:'#7c3aed'};\n  const KNAME = {fetch:'取指', decode:'译码', exec:'执行', loop:'回环'};\n  $('mcpSteps').innerHTML = mcpSeq.map((s, i)=>{\n    const cls = i < mcpIdx ? 'dn' : (i === mcpIdx ? 'act' : '');\n    return '<div class=\"step ' + cls + '\" style=\"padding:6px 12px\">'\n      + '<div class=\"n\" style=\"width:18px;height:18px;font-size:10px\">' + (i + 1) + '<\/div>'\n      + '<div style=\"flex:1;display:flex;align-items:center;gap:8px;min-width:0\">'\n      + '<span style=\"flex-shrink:0;font-size:9.5px;font-weight:800;padding:1px 7px;border-radius:4px;background:' + KCOL[s.k] + '1a;color:' + KCOL[s.k] + '\">' + KNAME[s.k] + '<\/span>'\n      + '<span style=\"font-family:Consolas,monospace;font-size:12px;font-weight:' + (i === mcpIdx ? 800 : 600) + ';color:#3c4654;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">' + s.title + '<\/span>'\n      + '<\/div><\/div>';\n  }).join('');\n}\n\nfunction mcpStep(){ if(mcpIdx < mcpSeq.length - 1){ mcpIdx++; mcpRender(); } else { clearInterval(mcpTimer); mcpTimer = null; } }\n$('mcpNext').onclick = ()=>{ clearInterval(mcpTimer); mcpTimer = null; mcpStep(); };\n$('mcpReset').onclick = ()=>{ clearInterval(mcpTimer); mcpTimer = null; mcpIdx = -1; mcpRender(); };\n$('mcpPlay').onclick = ()=>{\n  clearInterval(mcpTimer);\n  mcpIdx = -1; mcpRender();\n  mcpTimer = setInterval(mcpStep, 1300);\n};\n$('mcpInstr').onchange = e=>{ clearInterval(mcpTimer); mcpTimer = null; mcpKey = e.target.value; mcpSeq = mcpBuildSeq(); mcpIdx = -1; mcpRender(); };\nmcpSeq = mcpBuildSeq();\nmcpRender();\n\n/* ============================================================\n   动画 15 · 五级流水线时空图\n   ============================================================ */\nlet plTimer = null, plRevealed = 0;\nfunction plBuild(){\n  const mode = $('plMode').value, n = +$('plN').value;\n  const D = (mode === 'raw') ? 2 : 0;\n  const rows = [];\n  for(let i=0;i<n;i++){\n    const start = (i === 0) ? 1 : (i + 1 + D);\n    const cells = [];\n    for(let c=0;c<start-1;c++) cells.push({s:'', blank:true});\n    cells.push({s:'IF'}); cells.push({s:'ID'});\n    for(let d=0;d<D;d++) cells.push({s:'stall'});\n    cells.push({s:'EX'}); cells.push({s:'MEM'}); cells.push({s:'WB'});\n    // 转发标记\n    if(mode === 'fwd' && i === 1){\n      cells.forEach(c=>{ if(c.s === 'EX') c.fw = true; });\n    }\n    rows.push(cells);\n  }\n  const maxCol = Math.max.apply(null, rows.map(r=>r.length));\n  return {rows, maxCol, mode, n};\n}\nfunction plRender(reveal){\n  const {rows, maxCol, mode, n} = plBuild();\n  const cols = [];\n  for(let c=0;c<maxCol;c++) cols.push(c);\n\n  let head = `<div class=\"plabel\" style=\"font-size:10.5px;color:#9aa4b2\">周期<\/div>` +\n    cols.map(c=>`<div style=\"text-align:center;font-size:10.5px;color:${c<reveal?'#2563eb':'#b6c0cc'};font-weight:700;transition:.3s\">${c+1}<\/div>`).join('');\n\n  let body = '';\n  rows.forEach((r,i)=>{\n    body += `<div class=\"plabel\" style=\"font-size:11.5px\">I${i+1}<\/div>`;\n    for(let c=0;c<maxCol;c++){\n      const cell = r[c];\n      if(!cell || cell.blank){ body += `<div class=\"pcell\" style=\"background:transparent\"><\/div>`; continue; }\n      const show = c < reveal;\n      const cls = show ? (cell.s === 'stall' ? 'stall' : (cell.fw ? 'fw' : cell.s)) : '';\n      const txt = show ? (cell.s === 'stall' ? '停顿' : (cell.fw ? 'EX·转发' : cell.s)) : '';\n      body += `<div class=\"pcell ${cls}\" style=\"opacity:${show?1:.16};font-size:${cell.s==='stall'||cell.fw?'9.5':'11'}px\">${txt}<\/div>`;\n    }\n  });\n\n  $('plChart').innerHTML =\n    `<div class=\"pipegrid\" style=\"grid-template-columns:96px repeat(${maxCol},minmax(38px,1fr))\">${head}${body}<\/div>`;\n\n  // 统计\n  const T = maxCol;\n  const k = 5;\n  const idealT = k + n - 1;\n  const S = (n * k) / T;\n  const TP = n / T;\n  const extra = T - idealT;\n\n  $('plStat').innerHTML =\n    `<div class=\"res\" style=\"margin-top:16px\">\n      <div class=\"r\"><span class=\"lbl\">总周期数<\/span><span class=\"val\">${T}<\/span>\n        <span style=\"font-size:12px;color:#8b95a3\">理想值为 k + n − 1 = ${k} + ${n} − 1 = ${idealT}${extra>0?`，本例因冒险多花 <b style=\"color:#dc2626\">${extra}<\/b> 个周期`:''}<\/span><\/div>\n      <div class=\"r\"><span class=\"lbl\">吞吐率 TP<\/span><span class=\"val\">${TP.toFixed(3)}<\/span>\n        <span style=\"font-size:12px;color:#8b95a3\">条/周期 = n / T = ${n} / ${T}<\/span><\/div>\n      <div class=\"r\"><span class=\"lbl\">加速比 S<\/span><span class=\"val\">${S.toFixed(2)}<\/span>\n        <span style=\"font-size:12px;color:#8b95a3\">= n·k / T = ${n}×${k} / ${T}<\/span><\/div>\n    <\/div>` +\n    (mode === 'raw'\n      ? `<div class=\"tip e\" style=\"margin-top:10px\"><span class=\"ti\">数据冒险<\/span><span>I2 要用 I1 的计算结果，而 I1 的 EX 要到第 3 周期才产出、WB 到第 5 周期才写回。不做任何处理的话，I2 只能<b>插入 2 个气泡（停顿）<\/b>干等，后续指令全部顺延，加速比明显下降。<\/span><\/div>`\n      : (mode === 'fwd'\n      ? `<div class=\"tip s\" style=\"margin-top:10px\"><span class=\"ti\">转发解决<\/span><span>把 I1 在 EX 阶段<b>刚算出来的结果直接旁路<\/b>给 I2 的 ALU 输入端，不必等它写回寄存器。于是停顿消失，总周期数回到理想值。橙色格子表示这一步的输入来自转发而非寄存器读。<\/span><\/div>`\n      : `<div class=\"tip i\" style=\"margin-top:10px\"><span class=\"ti\">理想情形<\/span><span>指令之间无任何相关，流水线全速推进：第 1 条指令用 ${k} 个周期走完，之后<b>每个周期都有一条指令完成<\/b>，这是流水线的理论最优。<\/span><\/div>`));\n}\n$('plMode').onchange = ()=>{ plRevealed = 999; plRender(plRevealed); };\n$('plN').onchange = ()=>{ plRevealed = 999; plRender(plRevealed); };\n$('plPlay').onclick = ()=>{\n  clearInterval(plTimer);\n  const {maxCol} = plBuild();\n  plRevealed = 0; plRender(0);\n  plTimer = setInterval(()=>{\n    plRevealed++;\n    plRender(plRevealed);\n    if(plRevealed >= maxCol){ clearInterval(plTimer); plTimer = null; }\n  }, 420);\n};\n$('plReset').onclick = ()=>{ clearInterval(plTimer); plTimer=null; plRevealed = 999; plRender(999); };\nplRevealed = 999;\nplRender(999);\n\n/* ============================================================\n   动画 16 · 总线带宽计算器\n   ============================================================ */\nfunction fmtB(b){\n  if(b >= 1e9) return (b/1e9).toFixed(2) + ' GB/s';\n  if(b >= 1e6) return (b/1e6).toFixed(2) + ' MB/s';\n  if(b >= 1e3) return (b/1e3).toFixed(2) + ' KB/s';\n  return b.toFixed(2) + ' B/s';\n}\nfunction renderBW(){\n  const f = parseFloat($('bwFreq').value) || 0;\n  const w = parseFloat($('bwW').value) || 0;\n  const c = Math.max(1, Math.round(parseFloat($('bwC').value) || 1));\n  const bytesPerTx = w / 8;\n  const txPerSec = f * 1e6 / c;\n  const bw = txPerSec * bytesPerTx;\n\n  $('bwOut').innerHTML =\n    `<div class=\"res\">\n      <div class=\"r\"><span class=\"lbl\">一次传<\/span><span style=\"font-size:13px\">总线宽度 ${w} 位 = <b>${bytesPerTx}<\/b> 字节<\/span><\/div>\n      <div class=\"r\"><span class=\"lbl\">总线周期<\/span><span style=\"font-size:13px\">占 ${c} 个时钟 → 每秒 <b>${(txPerSec/1e6).toFixed(2)} M<\/b> 个总线周期<\/span><\/div>\n      <div class=\"r\" style=\"border-top:1px dashed #d8dfe9;padding-top:9px;margin-top:5px\">\n        <span class=\"lbl\">总线带宽<\/span><span class=\"val\" style=\"font-size:16px\">${fmtB(bw)}<\/span><\/div>\n    <\/div>\n    <div class=\"tip s\" style=\"margin-top:10px\"><span class=\"ti\">公式<\/span><span>\n      带宽 = 频率 × 位宽 ÷ 8 ÷ 每个总线周期占用的时钟数 = ${f}×10⁶ × ${w} ÷ 8 ÷ ${c} = <b>${fmtB(bw)}<\/b>。\n      ${c>1?`注意这里不能直接把频率乘位宽——因为每个总线周期要花 ${c} 个时钟，这是最容易漏掉的一步。`:`本题每个总线周期只占 1 个时钟，所以可以直接乘。`}\n    <\/span><\/div>`;\n}\n['bwFreq','bwW','bwC'].forEach(id=>$(id).oninput = renderBW);\nrenderBW();\n\n/* ============================================================\n   动画 17 · 三种集中式仲裁\n   ============================================================ */\nlet arbReq = -1;\nconst DEV = [['设备 1',320],['设备 2',520],['设备 3',720]];\nfunction renderArb(){\n  const mode = $('arbMode').value;\n  const bx = 40, by = 100, bw = 140, bh = 70;\n  let extra = '', grant = -1, note = '';\n\n  const devBox = (i, x)=>{\n    const req = arbReq === i;\n    const got = grant === i;\n    const fill = got ? '#e5f7f0' : (req ? '#fff4e3' : '#fff');\n    const stroke = got ? '#0f9d6e' : (req ? '#d97706' : '#cdd5e0');\n    const tc = got ? '#0a6b4a' : (req ? '#9a5b06' : '#5c6779');\n    return `<g style=\"cursor:pointer\" data-dev=\"${i}\">\n      <rect x=\"${x}\" y=\"${by}\" width=\"${bw}\" height=\"${bh}\" rx=\"12\" fill=\"${fill}\" stroke=\"${stroke}\" stroke-width=\"${(req||got)?3:2}\" style=\"transition:.25s\"/>\n      <text x=\"${x+bw/2}\" y=\"${by+30}\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"800\" fill=\"${tc}\">${DEV[i][0]}<\/text>\n      <text x=\"${x+bw/2}\" y=\"${by+50}\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#8b95a3\">${req?'请求中…':(got?'已获得总线':'点击发起请求')}<\/text>\n    <\/g>`;\n  };\n\n  // 优先级判定\n  if(arbReq >= 0){\n    if(mode === 'chain'){\n      grant = 0; // 链式：离控制器最近者优先；这里简化为“更靠前的设备会截获”\n      note = `链式查询中，总线允许信号 BG 像接力棒一样从控制器依次向后传。设备 ${ arbReq+1 } 发出请求后，要先等排在它前面的设备都不请求，BG 才会传到它手上。`;\n      const higher = [];\n      for(let i=0;i<arbReq;i++) higher.push('设备 '+(i+1));\n      if(higher.length) note += ` 本题中 ${higher.join('、')} 的位置更靠近控制器，<b>优先级更高<\/b>，只要它们也请求，就会先截获 BG。`;\n      else note += ` 该设备离控制器最近，<b>优先级最高<\/b>，只要它请求就一定能拿到总线。`;\n    } else if(mode === 'counter'){\n      grant = arbReq;\n      note = `计数器定时查询中，控制器用一个计数器依次广播设备地址。设备被「点到」且正好有请求时才能获得总线。计数起点可以设定，所以优先级<b>不固定<\/b>——可以轮转保证公平，也可以编程指定。`;\n    } else {\n      grant = arbReq;\n      note = `独立请求中，每个设备都有自己独立的请求线 BR 和允许线 BG，直接连到仲裁器。仲裁器内部按优先级表判定，<b>响应速度最快<\/b>，优先级也可以灵活编程。代价是控制线数量随设备数成倍增长。`;\n    }\n  }\n\n  // 连线\n  if(mode === 'chain'){\n    extra =\n      `<line x1=\"180\" y1=\"68\" x2=\"860\" y2=\"68\" stroke=\"#8fb4f5\" stroke-width=\"2\"/>\n       <text x=\"190\" y=\"60\" font-size=\"10.5\" fill=\"#5b7fc7\">BR 总线请求（共用一根）<\/text>\n       <path d=\"M180,212 L860,212\" stroke=\"#f0b775\" stroke-width=\"2\" stroke-dasharray=\"7 4\" fill=\"none\"/>\n       ${DEV.map(d=>`<line x1=\"${d[1]+70}\" y1=\"${by+bh}\" x2=\"${d[1]+70}\" y2=\"212\" stroke=\"#f0b775\" stroke-width=\"1.6\" stroke-dasharray=\"7 4\"/>`).join('')}\n       <text x=\"190\" y=\"234\" font-size=\"10.5\" fill=\"#b8802f\">BG 总线允许（串行穿过每一级，不能跳跃）<\/text>`;\n  } else if(mode === 'counter'){\n    extra =\n      `<line x1=\"180\" y1=\"68\" x2=\"860\" y2=\"68\" stroke=\"#8fb4f5\" stroke-width=\"2\"/>\n       <text x=\"190\" y=\"60\" font-size=\"10.5\" fill=\"#5b7fc7\">BR 总线请求（共用一根）<\/text>\n       ${[0,1,2].map(k=>`<line x1=\"180\" y1=\"${196+k*13}\" x2=\"860\" y2=\"${196+k*13}\" stroke=\"#a78bfa\" stroke-width=\"1.6\"/>`).join('')}\n       <text x=\"190\" y=\"252\" font-size=\"10.5\" fill=\"#7c3aed\">设备地址线（一组线，广播计数器值）<\/text>`;\n  } else {\n    extra = DEV.map((d,i)=>{\n      const y1 = 190 + i*24;\n      return `<line x1=\"180\" y1=\"68\" x2=\"${d[1]}\" y2=\"68\" stroke=\"#8fb4f5\" stroke-width=\"2\"/>\n        <text x=\"${d[1]-8}\" y=\"62\" font-size=\"10\" fill=\"#5b7fc7\" text-anchor=\"end\">BR${i}<\/text>\n        <line x1=\"180\" y1=\"${y1}\" x2=\"${d[1]}\" y2=\"${y1}\" stroke=\"#6ee7b7\" stroke-width=\"2\"/>\n        <text x=\"${d[1]-8}\" y=\"${y1+4}\" font-size=\"10\" fill=\"#0f9d6e\" text-anchor=\"end\">BG${i}<\/text>`;\n    }).join('') + `<text x=\"190\" y=\"86\" font-size=\"10.5\" fill=\"#5b7fc7\">每个设备一对独立的请求 / 允许线<\/text>`;\n  }\n\n  $('arbStage').innerHTML =\n    `<svg viewBox=\"0 0 900 280\" style=\"width:100%;height:auto;display:block\">\n      ${extra}\n      <g>\n        <rect x=\"${bx}\" y=\"${by}\" width=\"${bw}\" height=\"${bh}\" rx=\"12\" fill=\"#eaf0ff\" stroke=\"#2563eb\" stroke-width=\"2.4\"/>\n        <text x=\"${bx+bw/2}\" y=\"${by+32}\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"800\" fill=\"#1e40af\">总线控制器<\/text>\n        <text x=\"${bx+bw/2}\" y=\"${by+52}\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#5b7fc7\">（仲裁器）<\/text>\n      <\/g>\n      ${DEV.map((d,i)=>devBox(i, d[1])).join('')}\n    <\/svg>`;\n\n  qsa('#arbStage [data-dev]').forEach(g=>{\n    g.onclick = ()=>{ const i = +g.dataset.dev; arbReq = (arbReq === i) ? -1 : i; renderArb(); };\n  });\n\n  const modeName = {chain:'链式查询', counter:'计数器定时查询', indep:'独立请求'}[mode];\n  $('arbOut').innerHTML =\n    `<div class=\"res\">\n      <div class=\"r\"><span class=\"lbl\">仲裁方式<\/span><span class=\"val\">${modeName}<\/span><\/div>\n      <div class=\"r\" style=\"margin-top:5px\"><span class=\"lbl\">当前状态<\/span><span style=\"font-size:13px\">${\n        arbReq < 0 ? '暂无设备请求总线' : (grant >= 0 ? `<b style=\"color:#0f9d6e\">设备 ${grant+1}<\/b> 获得总线使用权` : '正在仲裁…')\n      }<\/span><\/div>\n    <\/div>\n    ${note ? `<div class=\"tip i\" style=\"margin-top:10px\"><span class=\"ti\">为什么<\/span><span>${note}<\/span><\/div>` : ''}\n    <div class=\"tip s\" style=\"margin-top:6px\"><span class=\"ti\">对比<\/span><span>\n      控制线数量：链式查询 <b>最少<\/b> → 计数器定时查询 <b>中等<\/b> → 独立请求 <b>最多<\/b>；\n      响应速度：独立请求 <b>最快<\/b> → 计数器定时查询 → 链式查询 <b>最慢<\/b>；\n      可靠性：链式查询<b>最差<\/b>（链上任一环节故障会导致后续设备全部失效）。\n    <\/span><\/div>`;\n}\n$('arbMode').onchange = ()=>{ arbReq = -1; renderArb(); };\nrenderArb();\n\n/* ============================================================\n   动画 18 · 三种 I/O 方式时间线\n   ============================================================ */\nconst IO_STYLE = {\n  wait:{bg:'#e6eaf1',c:'#6b7280',t:'轮询'},\n  xfer:{bg:'#fbd9b0',c:'#8a5209',t:'搬数据'},\n  calc:{bg:'#c7dbff',c:'#1e40af',t:'计算'},\n  intr:{bg:'#f7b98a',c:'#8a3d09',t:'中断处理'},\n  idle:{bg:'#f3f5f9',c:'#aab3c0',t:'空闲'},\n  prep:{bg:'#eef2f8',c:'#8b95a3',t:'准备中'},\n  ready:{bg:'#fde68a',c:'#8a6109',t:'就绪·请求'},\n  dxfer:{bg:'#a7e8cd',c:'#0a6b4a',t:'设备传输'},\n  dma:{bg:'#d8c8fb',c:'#5b21b6',t:'DMA 搬运'},\n  end:{bg:'#f7b98a',c:'#8a3d09',t:'结束中断'}\n};\nconst IO_MODES = [\n  { name:'程序查询方式', cost:'CPU 几乎 100% 耗在轮询上',\n    cpu:['wait','wait','wait','xfer','wait','wait','xfer','wait','wait','xfer','wait','wait'],\n    dev:['idle','idle','ready','dxfer','idle','idle','ready','dxfer','idle','idle','ready','dxfer'],\n    note:'CPU 不停地读取状态寄存器问「好了没有」，直到设备就绪才亲自搬运数据。CPU 与 I/O 完全<b>串行<\/b>，期间无法做任何有用的计算。' },\n  { name:'程序中断方式', cost:'CPU 利用率大幅提升',\n    cpu:['calc','calc','calc','intr','calc','calc','calc','intr','calc','calc','calc','calc'],\n    dev:['prep','prep','ready','dxfer','prep','prep','ready','dxfer','prep','prep','prep','prep'],\n    note:'CPU 一直忙自己的计算，设备准备好后<b>主动发中断请求<\/b>，CPU 才暂停当前程序去处理。数据搬运仍然由 CPU 执行，因此还有现场保护和返回开销。' },\n  { name:'DMA 方式', cost:'CPU 只被打断一次',\n    cpu:['calc','calc','calc','calc','calc','calc','calc','calc','calc','calc','end','calc'],\n    dev:['dma','dma','dma','dma','dma','dma','dma','dma','dma','dma','dma','idle'],\n    note:'CPU 只需在开始前给 DMA 控制器设好起始地址、字数和方向，之后<b>整块数据的搬运全部由硬件完成<\/b>，CPU 全程照常计算。只在整块传完后被打断一次做收尾。' }\n];\nlet ioRevealed = 0, ioTimer = null;\nfunction ioRender(reveal){\n  const N = 12;\n  let html = '';\n  IO_MODES.forEach((m, mi)=>{\n    const cpuCells = m.cpu.map((k,i)=>{\n      const s = IO_STYLE[k], on = i < reveal;\n      return `<div style=\"height:26px;border-radius:6px;background:${on?s.bg:'#f7f9fc'};color:${on?s.c:'#c8cfd8'};\n        display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:650;transition:.4s;overflow:hidden;white-space:nowrap\">${on?s.t:''}<\/div>`;\n    }).join('');\n    const devCells = m.dev.map((k,i)=>{\n      const s = IO_STYLE[k], on = i < reveal;\n      return `<div style=\"height:26px;border-radius:6px;background:${on?s.bg:'#f7f9fc'};color:${on?s.c:'#c8cfd8'};\n        display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:650;transition:.4s;overflow:hidden;white-space:nowrap\">${on?s.t:''}<\/div>`;\n    }).join('');\n    html += `<div style=\"margin-bottom:18px\">\n      <div style=\"font-size:13px;font-weight:750;margin-bottom:7px;color:#2b3542\">${m.name}\n        <span style=\"font-size:11.5px;font-weight:500;color:#8b95a3;margin-left:8px\">${m.cost}<\/span><\/div>\n      <div style=\"display:grid;grid-template-columns:52px repeat(${N},minmax(30px,1fr));gap:3px;align-items:center\">\n        <div style=\"font-size:11px;color:#6b7280;font-weight:650\">CPU<\/div>${cpuCells}\n        <div style=\"font-size:11px;color:#6b7280;font-weight:650\">设备<\/div>${devCells}\n      <\/div>\n    <\/div>`;\n  });\n  $('ioStage').innerHTML = `<div style=\"display:grid;grid-template-columns:52px repeat(12,minmax(30px,1fr));gap:3px;margin-bottom:8px\">\n      <div><\/div>${Array.from({length:12},(_,i)=>`<div style=\"text-align:center;font-size:10px;color:#b6c0cc\">${i+1}<\/div>`).join('')}<\/div>` + html;\n\n  // 统计\n  const stat = (m)=>{\n    const total = m.cpu.length;\n    const eff = m.cpu.filter(k=>k==='calc').length;\n    return Math.round(eff/total*100);\n  };\n  $('ioOut').innerHTML =\n    `<div class=\"res\">\n      <div class=\"r\"><span class=\"lbl\">CPU 有效计算占比<\/span>\n        <span style=\"font-size:13px\">程序查询 <b style=\"color:#dc2626\">${stat(IO_MODES[0])}%<\/b>　·　\n        程序中断 <b style=\"color:#d97706\">${stat(IO_MODES[1])}%<\/b>　·　\n        DMA <b style=\"color:#0f9d6e\">${stat(IO_MODES[2])}%<\/b><\/span><\/div>\n    <\/div>\n    ${IO_MODES.map(m=>`<div class=\"tip ${m.name.indexOf('DMA')>=0?'s':(m.name.indexOf('中断')>=0?'m':'e')}\" style=\"margin-top:8px\">\n      <span class=\"ti\">${m.name}<\/span><span>${m.note}<\/span><\/div>`).join('')}`;\n}\n$('ioPlay').onclick = ()=>{\n  clearInterval(ioTimer);\n  ioRevealed = 0; ioRender(0);\n  ioTimer = setInterval(()=>{\n    ioRevealed++; ioRender(ioRevealed);\n    if(ioRevealed >= 12){ clearInterval(ioTimer); ioTimer = null; }\n  }, 260);\n};\n$('ioReset').onclick = ()=>{ clearInterval(ioTimer); ioTimer=null; ioRevealed = 12; ioRender(12); };\nioRevealed = 12;\nioRender(12);\n\n/* ============================================================\n   动画 19 · 中断响应与处理十二步\n   ============================================================ */\nconst IR_STEPS = [\n  ['设备发出中断请求','外设完成一次工作后，把接口中的中断请求触发器置 1，向 CPU 发出 IRQ 信号。','这一步是<b>设备主动<\/b>完成的，不需要 CPU 参与。'],\n  ['硬件判优','多个设备同时请求时，由硬件排队器（或软件查询程序）选出优先级最高的那一个。','中断判优保证了高优先级设备先被服务。'],\n  ['检查响应条件','CPU 判断能否响应：① 有未屏蔽的请求；② 当前指令已执行完毕；③ 处于开中断状态。','三个条件缺一不可。这也是为什么中断响应总是发生在<b>指令边界<\/b>。'],\n  ['进入中断隐指令','CPU 响应中断，硬件自动执行一串操作——它没有对应的指令码，也不需要程序编写，所以叫「隐指令」。','这是最容易被问的顺序题，下面三步要背牢。'],\n  ['隐指令 ① · 关中断','把中断允许触发器 EINT 清 0。','先关中断，是为了防止接下来的保护动作被打断，造成现场错乱。'],\n  ['隐指令 ② · 保存断点','把当前 PC（即被打断处下一条指令的地址）压入栈中。','保存的是<b>PC<\/b>而不是 IR。很多题在这里设陷阱。'],\n  ['隐指令 ③ · 取入口地址','根据中断类型号去中断向量表（或由硬件直接给出）取出中断服务程序的入口地址，送入 PC。','至此隐指令结束，CPU 已经跳到服务程序的第一条指令。'],\n  ['保存现场','进入服务程序后，用软件把通用寄存器、PSW 等压栈保存。','这一步属于软件操作，与隐指令里的「保存断点」是两回事。'],\n  ['开中断','设置 EINT 为 1，允许更高级的中断打断当前服务程序。','<b>这是实现多重中断（中断嵌套）的必要条件<\/b>。若不开中断，就只能等本次处理完才能响应下一次。'],\n  ['执行设备服务程序','真正干活：从接口读数据、处理、写回内存或图形缓冲区。','这是中断存在的意义所在——真正的数据传输和处理在这里发生。'],\n  ['恢复现场','关中断，把之前压栈的通用寄存器和 PSW 出栈还原。','先关中断再恢复，避免恢复一半被打断。'],\n  ['执行 iret 返回','开中断，执行中断返回指令 iret，从栈中弹出断点地址送回 PC。','程序从被打断的地方继续执行，就好像什么都没发生过——这就是「透明」的含义。']\n];\nlet irIdx = -1, irTimer2 = null;\nfunction irRender(){\n  $('irSteps').innerHTML = IR_STEPS.map((s,i)=>{\n    const cls = i < irIdx ? 'dn' : (i === irIdx ? 'act' : '');\n    const kind = i >= 4 && i <= 6 ? '隐指令' : (i >= 7 && i <= 10 ? '软件' : (i < 4 ? '硬件' : '返回'));\n    const kc = i>=4&&i<=6 ? '#7c3aed' : (i>=7&&i<=10 ? '#0f9d6e' : '#2563eb');\n    return `<div class=\"step ${cls}\"><div class=\"n\">${i+1}<\/div><div style=\"flex:1\">\n      <div class=\"t\">${s[0]}\n        <span style=\"font-size:10px;font-weight:700;padding:1px 7px;border-radius:4px;background:${kc}18;color:${kc};margin-left:6px\">${kind}<\/span><\/div>\n      <div class=\"d\">${s[1]}<\/div>\n      ${i === irIdx ? `<div class=\"d\" style=\"margin-top:6px;color:#2563eb\">▸ ${s[2]}<\/div>` : ''}\n    <\/div><\/div>`;\n  }).join('');\n  if(irIdx >= IR_STEPS.length-1){\n    $('irNote').innerHTML = `<div class=\"tip s\"><span class=\"ti\">完整链路<\/span><span>\n      请求 → 判优 → 响应条件 → 隐指令（关中断 · 保存断点 · 取入口）→ 保存现场 → 开中断 → 处理 → 恢复现场 → 开中断 → iret 返回。\n      其中<b>只有「隐指令」三步是硬件自动完成的<\/b>，其余都需要程序（或操作系统）指令来执行。<\/span><\/div>`;\n  } else if(irIdx < 0){\n    $('irNote').innerHTML = `<div class=\"tip i\"><span class=\"ti\">怎么看<\/span><span>\n      点「重新播放」自动走一遍，或用「下一步」自己控制节奏。\n      注意第 <b>5～7<\/b> 步（紫色标签）是<b>硬件自动完成<\/b>的中断隐指令，其余各步都要靠程序指令来做——\n      这是这一章最爱考的分界点。<\/span><\/div>`;\n  } else { $('irNote').innerHTML = ''; }\n}\n$('irNext').onclick = ()=>{ clearInterval(irTimer2); irTimer2=null; if(irIdx < IR_STEPS.length-1){ irIdx++; irRender(); } };\n$('irPlay').onclick = ()=>{\n  clearInterval(irTimer2); irIdx = -1; irRender();\n  irTimer2 = setInterval(()=>{\n    if(irIdx < IR_STEPS.length-1){ irIdx++; irRender(); }\n    else { clearInterval(irTimer2); irTimer2 = null; }\n  }, 1400);\n};\nirRender();\n<\/script>\n<script>\n/* 打包桥接：见 build_四门课合集.py 的说明 */\n(function(){\n  document.addEventListener(\"click\", function(e){\n    var a = e.target && e.target.closest ? e.target.closest(\"a[href]\") : null;\n    if(!a) return;\n    var href = a.getAttribute(\"href\") || \"\";\n    if(href.charAt(0) ===
