ms:center;font-size:18px;color:${inKernel?'var(--primary)':'#cbd5e1'}\">⇄<\/div>\n      <div style=\"flex:1;min-width:120px;padding:10px 14px;border-radius:10px;text-align:center;font-size:13px;font-weight:750;\n        background:${inKernel?'var(--primary-l)':'#f4f7fb'};color:${inKernel?'var(--primary)':'#aab3c0'};\n        border:1px solid ${inKernel?'var(--primary)':'#e3e8ef'};transition:.3s\">\n        内核态<span style=\"display:block;font-size:10.5px;font-weight:500\">可执行全部指令<\/span><\/div>\n    <\/div>\n    <div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;padding:14px;background:#f7f9fc;border:1px solid var(--line);border-radius:10px\">\n      ${['用户程序','库函数','trap 陷入','内核服务例程','返回用户态'].map((t,i)=>{\n        const act = cur && i <= scIdx;\n        return `<span style=\"font-size:12px;padding:6px 12px;border-radius:8px;font-weight:650;transition:.3s;\n          background:${act?'var(--primary)':'#fff'};color:${act?'#fff':'#8b95a3'};\n          border:1px solid ${act?'var(--primary)':'#e3e8ef'}\">${t}<\/span>` +\n          (i<4?'<span style=\"color:#c3cbd7\">→<\/span>':'');\n      }).join('')}\n    <\/div>`;\n\n  $('scSteps').innerHTML = d.steps.map((s,i)=>{\n    const cls = i < scIdx ? 'dn' : (i === scIdx ? 'act' : '');\n    return `<div class=\"step ${cls}\"><div class=\"n\">${i+1}<\/div><div style=\"flex:1\">\n      <div class=\"t\">${s[0]}\n        <span style=\"font-size:10px;font-weight:700;padding:1px 7px;border-radius:4px;background:#eef2f7;color:#6b7280;margin-left:6px\">${s[2]}<\/span><\/div>\n      <div class=\"d\">${s[1]}<\/div><\/div><\/div>`;\n  }).join('');\n\n  $('scNote').innerHTML = (scIdx >= d.steps.length-1) ? d.note\n    : (scIdx < 0 ? '<div class=\"tip i\"><span class=\"ti\">怎么看<\/span><span>点「自动播放」或「下一步」，逐步看这次调用的完整过程。注意顶部两个状态框哪个是亮的 —— 那就是 CPU 当前所处的状态。把选择器切到第三个（特权指令），看用户程序硬来会发生什么。<\/span><\/div>' : '');\n}\n$('scNext').onclick = ()=>{ clearInterval(scTimer); scTimer=null; if(scIdx < SC[$('scPick').value].steps.length-1){ scIdx++; renderSC(); } };\n$('scReset').onclick = ()=>{ clearInterval(scTimer); scTimer=null; scIdx=-1; renderSC(); };\n$('scPlay').onclick = ()=>{\n  clearInterval(scTimer); scIdx = -1; renderSC();\n  scTimer = setInterval(()=>{\n    const n = SC[$('scPick').value].steps.length;\n    if(scIdx < n-1){ scIdx++; renderSC(); } else { clearInterval(scTimer); scTimer=null; }\n  }, 1400);\n};\n$('scPick').onchange = ()=>{ clearInterval(scTimer); scTimer=null; scIdx=-1; renderSC(); };\nrenderSC();\n\n/* ============================================================\n   动画 02 · 进程状态转换机\n   ============================================================ */\nconst FSM = {\n  3: {\n    nodes: [\n      {k:'new', t:'创建'},\n      {k:'ready', t:'就绪'},\n      {k:'run', t:'运行'},\n      {k:'block', t:'阻塞'},\n      {k:'exit', t:'终止'}\n    ],\n    edges: [\n      ['创建','就绪','创建完成',1],\n      ['就绪','运行','被调度程序选中',1],\n      ['运行','就绪','时间片用完 / 被抢占',1],\n      ['运行','阻塞','主动请求资源（如等 I/O）',1],\n      ['阻塞','就绪','等待的事件发生了',1],\n      ['运行','终止','进程结束',1]\n    ],\n    illegal: [['阻塞','运行','必须先进就绪队列，不能直接运行']]\n  }\n};\nconst FSM_INFO = {\n  '创建': '进程正在被创建：申请 PCB、分配资源、初始化。此时还不能被调度。',\n  '就绪': '万事俱备，只差 CPU。已经获得除处理机之外的所有资源，排在就绪队列里等调度。',\n  '运行': '正在 CPU 上执行。单核系统中，同一时刻最多只有一个进程处于运行态。',\n  '阻塞': '因为等待某个事件（I/O 完成、信号量、消息）而暂停。<b>此时就算给它 CPU 也没用<\/b>，所以它不在就绪队列里。',\n  '终止': '进程正常结束或被强制杀死，正在回收资源。'\n};\nfunction renderFSM(){\n  const mode = $('fsmMode').value;\n  let nodes = ['创建','就绪','运行','阻塞','终止'];\n  let edges = FSM[3].edges;\n  if(mode === '7'){\n    nodes = ['创建','就绪','运行','阻塞','终止','就绪挂起','阻塞挂起'];\n    edges = edges.concat([\n      ['就绪','就绪挂起','挂起（内存不够）',1],\n      ['阻塞','阻塞挂起','挂起',1],\n      ['就绪挂起','就绪','激活（调入内存）',1],\n      ['阻塞挂起','阻塞','激活',1],\n      ['阻塞挂起','就绪挂起','等待的事件发生了',1]\n    ]);\n  } else if(mode === '5'){\n    nodes = ['创建','就绪','运行','阻塞','终止'];\n  } else {\n    nodes = ['就绪','运行','阻塞'];\n    edges = edges.filter(e => ['就绪','运行','阻塞'].indexOf(e[0])>=0 && ['就绪','运行','阻塞'].indexOf(e[1])>=0);\n  }\n\n  const color = { '创建':'#94a3b8', '就绪':'#d97706', '运行':'#0f766e', '阻塞':'#dc2626', '终止':'#94a3b8', '就绪挂起':'#7c3aed', '阻塞挂起':'#7c3aed' };\n  const bg = { '创建':'#f4f7fb', '就绪':'#fff4e3', '运行':'#e4f5f2', '阻塞':'#fdeceb', '终止':'#f4f7fb', '就绪挂起':'#f2ecfe', '阻塞挂起':'#f2ecfe' };\n\n  $('fsmStage').innerHTML =\n    `<div class=\"fsm\">\n      ${nodes.map(n=>`<div class=\"nodex\" data-st=\"${n}\" style=\"border-color:${color[n]};background:${bg[n]};color:${color[n]}\">${n}<\/div>`).join('')}\n    <\/div>\n    <div class=\"legend\">\n      ${['运行','就绪','阻塞'].map(n=>`<span><i style=\"background:${color[n]}\"><\/i>${n}态<\/span>`).join('')}\n      ${mode==='7'?'<span><i style=\"background:#7c3aed\"><\/i>挂起态（进程被换出到外存）<\/span>':''}\n    <\/div>`;\n\n  qsa('#fsmStage [data-st]').forEach(el=>{\n    el.onclick = ()=>{\n      const st = el.dataset.st;\n      const outs = edges.filter(e=>e[0]===st);\n      const ins = edges.filter(e=>e[1]===st);\n      $('fsmOut').innerHTML =\n        `<div class=\"res\">\n          <div class=\"r\"><span class=\"lbl\">当前状态<\/span><span class=\"val\" style=\"color:${color[st]}\">${st}<\/span><\/div>\n          <div class=\"r\" style=\"margin-top:5px\"><span class=\"lbl\">含义<\/span><span style=\"font-size:13px\">${FSM_INFO[st]||'（挂起态：进程被换出到外存，不占用内存）'}<\/span><\/div>\n          <div class=\"r\" style=\"margin-top:5px\"><span class=\"lbl\">能转出到<\/span><span style=\"font-size:13px\">${\n            outs.length ? outs.map(e=>`<b>${e[1]}<\/b>（${e[2]}）`).join('　·　') : '无（终态或不可能）'}<\/span><\/div>\n          <div class=\"r\" style=\"margin-top:5px\"><span class=\"lbl\">能从哪来<\/span><span style=\"font-size:13px\">${\n            ins.length ? ins.map(e=>`<b>${e[0]}<\/b>`).join('、') : '无'}<\/span><\/div>\n        <\/div>`;\n    };\n  });\n  $('fsmOut').innerHTML = '<div class=\"tip i\"><span class=\"ti\">点一下<\/span><span>上方任意状态，看它的含义和进出条件。注意<b>挂起态<\/b>和阻塞态的区别：阻塞是「等事件」，挂起是「被换出内存」—— 一个进程可以同时是「阻塞且挂起」。<\/span><\/div>';\n}\n$('fsmMode').onchange = renderFSM;\n$('fsmTry').onclick = ()=>{\n  $('fsmOut').innerHTML =\n    `<div class=\"tip e\"><span class=\"ti\">不可能<\/span><span>\n      被唤醒的进程只是从「阻塞」回到「<b>就绪<\/b>」队列，<b>不会直接变成「运行」<\/b>。\n      它还要再被调度程序选中才能上 CPU —— 因为可能有好几个进程同时被唤醒，而 CPU 只有一个。<br><br>\n      所以「阻塞 → 运行」这个转换在任何状态模型里都<b>不存在<\/b>。这是选择题的高频陷阱。<br><br>\n      顺带记：<b>运行 → 阻塞<\/b>是进程<b>主动<\/b>的（自己去等 I/O）；<b>运行 → 就绪<\/b>是<b>被动<\/b>的（被时间片或高优先级进程剥夺）。<\/span><\/div>`;\n};\nrenderFSM();\n\n/* ============================================================\n   动画 03 · 调度算法对比器\n   ============================================================ */\nfunction parseProcs(str){\n  return str.split(';').map(s=>s.trim()).filter(Boolean).map((s,i)=>{\n    const p = s.split(',').map(x=>parseInt(x.trim(),10));\n    return { id:'P'+(i+1), arr:p[0]||0, svc:p[1]||1 };\n  });\n}\nfunction runSched(procs, algo, q){\n  const P = procs.map(p=>({...p, left:p.svc, done:false, start:null, end:null}));\n  const segs = [];\n  let t = Math.min.apply(null, P.map(p=>p.arr));\n  let guard = 0;\n  if(algo === 'rr'){\n    const qq = Math.max(1, q||1);\n    const queue = [];\n    let arrived = new Set();\n    P.filter(p=>p.arr <= t).sort((a,b)=>a.arr-b.arr).forEach(p=>{ queue.push(p.id); arrived.add(p.id); });\n    let cur = null, used = 0;\n    while((queue.length || P.some(p=>!p.done)) && guard++ < 3000){\n      if(!cur){\n        if(!queue.length){ t++; P.filter(p=>p.arr<=t && !arrived.has(p.id)).forEach(p=>{queue.push(p.id);arrived.add(p.id);}); continue; }\n        const nid = queue.shift();          // 必须先取出，不能写在 find 回调里 —— 回调会对每个元素执行一次，导致重复 shift\n        cur = P.find(p=>p.id===nid);\n        used = 0;\n        if(cur.start === null) cur.start = t;\n      }\n      segs.push({ id:cur.id, from:t, to:t+1 });\n      cur.left--; used++; t++;\n      P.filter(p=>p.arr<=t && !arrived.has(p.id)).forEach(p=>{queue.push(p.id);arrived.add(p.id);});\n      if(cur.left === 0){ cur.done = true; cur.end = t; cur = null; }\n      else if(used >= qq){ queue.push(cur.id); cur = null; }\n    }\n    return { segs: merge(segs), procs:P };\n  }\n  while(P.some(p=>!p.done) && guard++ < 3000){\n    const ready = P.filter(p=>!p.done && p.arr <= t);\n    if(!ready.length){ t = Math.min.apply(null, P.filter(p=>!p.done).map(p=>p.arr)); continue; }\n    let pick;\n    if(algo === 'fcfs') pick = ready.sort((a,b)=>a.arr-b.arr || a.id.localeCompare(b.id))[0];\n    else if(algo === 'sjf') pick = ready.sort((a,b)=>a.svc-b.svc || a.arr-b.arr)[0];\n    else if(algo === 'prio') pick = ready.sort((a,b)=>a.id.localeCompare(b.id))[0];\n    else if(algo === 'hrrn'){\n      pick = ready.map(p=>{\n        const wait = t - p.arr;\n        return { p, r:(wait + p.svc) / p.svc };\n      }).sort((a,b)=>b.r-a.r)[0].p;\n    } else pick = ready[0];\n    pick.start = pick.start===null ? t : pick.start;\n    segs.push({ id:pick.id, from:t, to:t+pick.svc });\n    t += pick.svc;\n    pick.end = t; pick.done = true;\n  }\n  return { segs: merge(segs), procs:P };\n}\nfunction merge(segs){\n  const out = [];\n  segs.forEach(s=>{\n    const last = out[out.length-1];\n    if(last && last.id === s.id && last.to === s.from) last.to = s.to;\n    else out.push({...s});\n  });\n  return out;\n}\nconst ALGO_NAME = { fcfs:'FCFS 先来先服务', sjf:'SJF 短作业优先', hrrn:'HRRN 高响应比优先', rr:'RR 时间片轮转', prio:'优先级调度' };\n/* 每种调度算法「怎么调」—— 光有甘特图和周转时间不够，得先说清它在挑谁 */\nconst SCH_DESC = {\n  fcfs:'按<b>到达顺序<\/b>排队，谁先来谁先上 CPU。最简单也最公平，但<b>一个长作业会把后面所有短作业全挡住<\/b>（护航效应），所以平均等待时间往往很难看。',\n  sjf: '从<b>已经到达<\/b>的进程里挑<b>运行时间最短<\/b>的那个。可以严格证明它的<b>平均等待时间最短<\/b>；代价是长作业可能一直排不上（<b>饥饿<\/b>）。',\n  hrrn:'每次算一遍 <b>响应比 =（等待时间 + 要求服务时间）÷ 要求服务时间<\/b>，选最大的那个。等待越久响应比越大、需要时间越短响应比也越大 —— 是 FCFS 和 SJF 的折中，<b>不会饥饿<\/b>。',\n  rr:  '所有就绪进程排成一个队列，每个轮流用一个<b>时间片<\/b>，用完就自动排到队尾。响应快，适合分时系统。时间片太小切换开销大，太大会退化成 FCFS。',\n  prio:'按<b>优先级<\/b>挑最高（本例编号越小优先级越高）。优先级可以是静态设定的，也可以动态调整；低优先级进程可能饥饿，用「老化」可以缓解。'\n};\n/* 页面置换：每种算法在挑谁换出去 */\nconst PG_DESC = {\n  opt: '淘汰<b>未来最久都不会被访问<\/b>的那一页。它是理论最优（缺页最少），但需要预知未来，<b>现实中无法实现<\/b> —— 只用来当标尺衡量其它算法。',\n  fifo:'淘汰<b>最早进入内存<\/b>的那一页（先进先出）。实现最简单（一个队列就够），但会出现 <b>Belady 异常<\/b>：增加页框数，缺页次数反而变多。',\n  lru: '淘汰<b>过去最久没有被访问<\/b>的那一页。思路是「用最近的过去预测最近的未来」，性能接近 OPT，但需要硬件支持（栈或计数器）来记录访问时间，开销较大。'\n};\n/* 磁盘调度：每种算法怎么决定下一个服务谁 */\nconst DK_DESC = {\n  fcfs:'按<b>请求到达的顺序<\/b>依次服务。最公平，但磁头来回大跨度移动，平均寻道时间最长。',\n  sstf:'每次挑<b>离当前磁头位置最近<\/b>的那条请求。平均寻道时间最短，但远处磁道的请求可能永远排不上（<b>饥饿<\/b>）。',\n  scan:'像电梯一样<b>朝一个方向一直扫到磁盘尽头<\/b>，再折返往回扫。不会饥饿；不过中间磁道经过两次、两端只经过一次，所以中间磁道更占便宜。',\n  cscan:'朝一个方向扫到尽头后，<b>直接跳回起点<\/b>重新开始扫（回程不做服务）。比 SCAN 更公平，代价是回程的空跑 —— 所以移臂总量通常比 SCAN 大。',\n  look:'SCAN 的改进版：<b>扫到最远的那条请求就折返<\/b>，不用走到物理尽头。本题没有走到磁盘两端，所以移臂量更小。',\n  clook:'C-SCAN 的改进版：扫到最远请求就<b>跳回最小的那条请求<\/b>，同样省掉了走到尽头的空跑。'\n};\nconst ALGO_COLOR = ['#0f766e','#2563eb','#d97706','#7c3aed','#dc2626','#0891b2','#15803d','#be185d'];\nfunction renderSched(algo){\n  const procs = parseProcs($('schData').value);\n  if(!procs.length){ $('schStage').innerHTML = '<div class=\"tip m\"><span class=\"ti\">提示<\/span><span>请输入进程数据，格式：到达时间,服务时间，多组用分号隔开。<\/span><\/div>'; $('schStat').innerHTML=''; return; }\n  const q = parseInt($('schQ').value,10) || 2;\n  const list = (algo === 'all') ? ['fcfs','sjf','hrrn','rr'] : [algo];\n  const colorMap = {};\n  procs.forEach((p,i)=> colorMap[p.id] = ALGO_COLOR[i % ALGO_COLOR.length]);\n\n  let html = '', stats = '';\n  list.forEach(a=>{\n    const r = runSched(procs, a, q);\n    const T = Math.max.apply(null, r.segs.map(s=>s.to));\n    const total = T || 1;\n    html += `<div style=\"margin-bottom:20px\">\n      <div style=\"font-size:13px;font-weight:750;margin-bottom:6px\">${ALGO_NAME[a]}${a==='rr'?'　<span style=\"font-weight:500;font-size:11.5px;color:#8b95a3\">时间片 = '+q+'<\/span>':''}<\/div>\n      <div style=\"font-size:12px;color:#5c6773;line-height:1.75;margin-bottom:10px;padding:9px 13px;\n        background:#f7f9fc;border-radius:8px;border-left:3px solid var(--primary)\"><b>怎么调度：<\/b>${SCH_DESC[a]}<\/div>\n      <div class=\"gantt\">\n        <div class=\"grow\"><div class=\"glabel\">CPU<\/div>\n          <div class=\"gtrack\">\n            ${r.segs.map(s=>`<div class=\"gbar\" style=\"left:${s.from/total*100}%;width:${(s.to-s.from)/total*100}%;background:${colorMap[s.id]}\">${s.id}<\/div>`).join('')}\n          <\/div>\n        <\/div>\n        <div class=\"gaxis\"><div><\/div><div class=\"gticks\">\n          ${Array.from({length:Math.min(total,20)+1},(_,i)=>`<span style=\"left:${i/total*100}%\">${i}<\/span>`).join('')}\n        <\/div><\/div>\n      <\/div>\n    <\/div>`;\n\n    const rows = r.procs.map(p=>{\n      const tat = p.end - p.arr;\n      const wtat = tat / p.svc;\n      return { p, tat, wtat };\n    }).sort((a,b)=>a.p.id.localeCompare(b.p.id));\n    const avgTat = rows.reduce((s,x)=>s+x.tat,0)/rows.length;\n    const avgW = rows.reduce((s,x)=>s+x.wtat,0)/rows.length;\n\n    stats += `<div style=\"margin-bottom:16px\">\n      <div style=\"font-size:12.5px;font-weight:750;margin-bottom:6px\">${ALGO_NAME[a]}<\/div>\n      <table class=\"tb\">\n        <tr><th>进程<\/th><th>到达<\/th><th>服务<\/th><th>开始<\/th><th>完成<\/th><th>周转时间<\/th><th>带权周转<\/th><\/tr>\n        ${rows.map(x=>`<tr><td><b>${x.p.id}<\/b><\/td><td class=\"mono\">${x.p.arr}<\/td><td class=\"mono\">${x.p.svc}<\/td>\n          <td class=\"mono\">${x.p.start}<\/td><td class=\"mono\">${x.p.end}<\/td>\n          <td class=\"mono\"><b>${x.tat}<\/b><\/td><td class=\"mono\"><b>${x.wtat.toFixed(2)}<\/b><\/td><\/tr>`).join('')}\n        <tr style=\"background:#f7f9fc\"><td colspan=\"5\"><b>平均值<\/b><\/td>\n          <td class=\"mono\"><b style=\"color:var(--primary)\">${avgTat.toFixed(2)}<\/b><\/td>\n          <td class=\"mono\"><b style=\"color:var(--primary)\">${avgW.toFixed(2)}<\/b><\/td><\/tr>\n      <\/table>\n    <\/div>`;\n  });\n\n  $('schStage').innerHTML = html;\n  $('schStat').innerHTML = stats +\n    `<div class=\"tip s\"><span class=\"ti\">看结果<\/span><span>对比各算法的<b>平均周转时间<\/b>：SJF 通常最小（这是可以证明的），FCFS 对短作业不公平，RR 的平均周转时间一般较长但<b>响应时间最好<\/b>。做题时别只看平均周转，要看清题目问的是哪个指标。<\/span><\/div>`;\n}\n$('schAlgo').onchange = ()=>renderSched($('schAlgo').value);\n$('schData').oninput = ()=>renderSched($('schAlgo').value);\n$('schQ').oninput = ()=>renderSched($('schAlgo').value);\n$('schAll').onclick = ()=>renderSched('all');\nqsa('[data-sch]').forEach(b=>b.onclick=()=>{ $('schData').value = b.dataset.sch; renderSched($('schAlgo').value); });\nrenderSched('fcfs');\n\n/* ============================================================\n   动画 04 · PV 操作模拟器（生产者-消费者）\n   ============================================================ */\nlet PC = null;\nfunction pcInit(){\n  const n = Math.max(1, Math.min(6, parseInt($('pcBuf').value,10) || 3));\n  PC = { n, buf:new Array(n).fill(null), empty:n, full:0, mutex:1, prodWait:0, consWait:0, log:[], pid:1 };\n  $('pcNote').innerHTML = '';\n  pcRender();\n}\nfunction pcRender(){\n  const cells = PC.buf.map((v,i)=>\n    `<div class=\"cellx ${v!==null?'on':'free'}\" style=\"width:48px;height:40px;font-size:11px\">${v!==null?'P'+v:'空'}<\/div>`).join('');\n  $('pcStage').innerHTML =\n    `<div style=\"font-size:12px;font-weight:700;color:#4b5665;margin-bottom:8px\">缓冲区（容量 ${PC.n}）<\/div>\n     <div class=\"cells\">${cells}<\/div>\n     <div style=\"display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:#5c6779\">\n       <span>产品编号 P1、P2… 表示先后放入的产品<\/span>\n     <\/div>`;\n\n  const sem = (name, val, init, desc)=>{\n    const ok = val >= 0;\n    return `<div class=\"card\" style=\"box-shadow:none;padding:12px 14px\">\n      <div style=\"font-family:Consolas,monospace;font-size:13px;font-weight:800;color:${ok?'var(--primary)':'var(--red)'}\">${name} = ${val}<\/div>\n      <div style=\"font-size:11.5px;color:#8b95a3;margin-top:4px\">初值 ${init}　${desc}<\/div>\n    <\/div>`;\n  };\n  $('pcSems').innerHTML =\n    `<div class=\"grid g3\">\n      ${sem('empty', PC.empty, PC.n, '空槽位数')}\n      ${sem('full', PC.full, 0, '已放产品数')}\n      ${sem('mutex', PC.mutex, 1, '互斥访问缓冲区')}\n    <\/div>` +\n    (PC.prodWait || PC.consWait ? `<div class=\"tip m\" style=\"margin-top:10px\"><span class=\"ti\">等待<\/span><span>\n      生产者队列 ${PC.prodWait} 个　消费者队列 ${PC.consWait} 个　（负值的绝对值就是队列长度）<\/span><\/div>` : '');\n\n  if(PC.log.length){\n    $('pcNote').innerHTML = `<div class=\"res\" style=\"max-height:200px;overflow-y:auto\">\n      ${PC.log.slice(-9).map(l=>`<div class=\"r\" style=\"margin:2px 0\"><span style=\"font-size:12.5px\">${l}<\/span><\/div>`).join('')}\n    <\/div>`;\n  } else {\n    $('pcNote').innerHTML = '<div class=\"tip i\"><span class=\"ti\">怎么看<\/span><span>点「生产者投递一次」，看它依次走 P(empty) → P(mutex) → 放入 → V(mutex) → V(full)；点「消费者取走一次」看反向过程。把缓冲区填满再点投递，就能看到生产者被 P(empty) 阻塞 —— 注意此时 <b>empty 变成负数，其绝对值就是等待队列长度<\/b>。<\/span><\/div>';\n  }\n}\nfunction pcProduce(){\n  const L = [];\n  if(PC.empty <= 0){\n    PC.prodWait++;\n    PC.log.push(`<b style=\"color:#dc2626\">生产者：P(empty) 失败，empty=${PC.empty-1} → 阻塞，进入等待队列<\/b>`);\n    PC.empty--;\n    pcRender(); return;\n  }\n  L.push(`生产者：P(empty) → empty = ${--PC.empty}`);\n  if(PC.mutex <= 0){\n    L.push(`生产者：P(mutex) 失败 → 阻塞（缓冲区正被占用）`);\n    PC.prodWait++; PC.mutex--;\n    PC.log.push(...L); pcRender(); return;\n  }\n  L.push(`生产者：P(mutex) → mutex = ${--PC.mutex}`);\n  const i = PC.buf.indexOf(null);\n  PC.buf[i] = PC.pid++;\n  L.push(`生产者：把产品 P${PC.pid-1} 放入第 ${i+1} 个槽位`);\n  L.push(`生产者：V(mutex) → mutex = ${++PC.mutex}`);\n  PC.full++;\n  L.push(`生产者：V(full) → full = ${PC.full}`);\n  PC.log.push(...L);\n  pcRender();\n}\nfunction pcConsume(){\n  const L = [];\n  if(PC.full <= 0){\n    PC.consWait++;\n    PC.full--;\n    PC.log.push(`<b style=\"color:#dc2626\">消费者：P(full) 失败，full=${PC.full} → 阻塞，进入等待队列<\/b>`);\n    pcRender(); return;\n  }\n  L.push(`消费者：P(full) → full = ${--PC.full}`);\n  if(PC.mutex <= 0){\n    L.push(`消费者：P(mutex) 失败 → 阻塞`);\n    PC.consWait++; PC.mutex--;\n    PC.log.push(...L); pcRender(); return;\n  }\n  L.push(`消费者：P(mutex) → mutex = ${--PC.mutex}`);\n  const i = PC.buf.findIndex(v=>v!==null);\n  const item = PC.buf[i];\n  PC.buf[i] = null;\n  L.push(`消费者：取走第 ${i+1} 个槽位的产品 P${item}`);\n  L.push(`消费者：V(mutex) → mutex = ${++PC.mutex}`);\n  PC.empty++;\n  L.push(`消费者：V(empty) → empty = ${PC.empty}`);\n  PC.log.push(...L);\n  pcRender();\n}\n$('pcReset').onclick = pcInit;\n$('pcBuf').oninput = pcInit;\n$('pcProd').onclick = pcProduce;\n$('pcCons').onclick = pcConsume;\n$('pcAuto').onclick = ()=>{\n  clearInterval(pcTimer); let k = 0;\n  pcTimer = setInterval(()=>{\n    if(k % 3 === 2) pcConsume(); else pcProduce();\n    if(++k >= 9){ clearInterval(pcTimer); pcTimer = null; }\n  }, 620);\n};\nlet pcTimer = null;\npcInit();\n\n/* ============================================================\n   动画 05 · 两个 P 操作写反了会死锁\n   ============================================================ */\nconst ORD = [\n  { t:'初始状态', d:'缓冲区已满（empty = 0，full = n），mutex = 1。现在来一个生产者，一个消费者。',\n    boxes:[['生产者','P(empty) 阻塞','bad'],['消费者','P(full) 成功，想拿锁','ok'],['mutex','1 → 被生产者持有','bad']] },\n  { t:'生产者先执行 P(empty)', d:'empty = 0，减 1 后变成 −1 < 0，生产者<b>阻塞<\/b>，进入 empty 的等待队列。<b>注意：它还没进临界区，也不持有锁。<\/b>',\n    boxes:[['生产者','阻塞在 P(empty)','bad'],['消费者','继续执行','ok'],['mutex','1（空闲）','ok']] },\n  { t:'消费者继续', d:'消费者执行 P(full) 成功（full = n > 0），接着 P(mutex) 也成功（mutex = 1 → 0），顺利进入临界区取走产品。',\n    boxes:[['生产者','仍然阻塞','bad'],['消费者','进入临界区，取走一个产品','ok'],['mutex','1 → 0（消费者持有）','ok']] },\n  { t:'消费者退出，唤醒生产者', d:'消费者 V(empty) → empty 从 −1 变成 0，因为 ≤ 0，<b>唤醒<\/b>了等待队列里的生产者。生产者被移到就绪队列。',\n    boxes:[['生产者','被唤醒，等待调度','ok'],['消费者','退出临界区','ok'],['mutex','0 → 1（已释放）','ok']] },\n  { t:'结论', d:'<b>顺序正确，系统顺利推进。<\/b>生产者阻塞时不持有锁，所以消费者能正常进出临界区、腾出空间、再唤醒它。这就是「先 P 资源信号量，后 P 互斥信号量」的原因。',\n    boxes:[['生产者','继续执行','ok'],['消费者','继续执行','ok'],['mutex','1','ok']] }\n];\n\n/* 写反的情形 */\nconst ORD_BAD = [\n  { t:'初始状态', d:'同样的场景：缓冲区已满，empty = 0，mutex = 1。生产者、消费者各一个。',\n    boxes:[['生产者','准备进入',''],['消费者','准备进入',''],['mutex','1','ok']] },\n  { t:'生产者先执行 P(mutex)', d:'mutex = 1 → 0，<b>生产者拿到了锁<\/b>。这时代的它已经进入了临界区的前半段。',\n    boxes:[['生产者','持有互斥锁','bad'],['消费者','被挡在 P(mutex) 外','bad'],['mutex','1 → 0（生产者持有）','bad']] },\n  { t:'生产者接着执行 P(empty)', d:'empty = 0，减 1 变成 −1 < 0，生产者<b>阻塞<\/b>。<b>但它手里还攥着 mutex 不放手！<\/b>',\n    boxes:[['生产者','阻塞，且持有锁','bad'],['消费者','阻塞在 P(mutex)','bad'],['mutex','0（被死锁进程占着）','bad']] },\n  { t:'消费者永远拿不到锁', d:'消费者要进临界区必须先 P(mutex)，但 mutex = 0 被生产者占着；生产者要往下走必须先等 empty > 0，而 empty 只有消费者取走产品才会增加。<br><br><b>两边互相等待，谁也动不了 —— 死锁。<\/b>',\n    boxes:[['生产者','死锁','bad'],['消费者','死锁','bad'],['mutex','0（永久）','bad']] },\n  { t:'结论', d:'<b>P 操作的顺序不能反。<\/b>规则：<span class=\"key\">先申请资源信号量，再申请互斥信号量<\/span>；释放时顺序相反（先 V mutex，再 V 资源信号量）。<br><br>道理很简单：互斥锁应该<b>在确认有资源可用之后再拿<\/b>，否则就是「拿着钥匙却进不了门，还堵着别人」。<\/b>',\n    boxes:[['生产者','死锁','bad'],['消费者','死锁','bad'],['mutex','0（永久）','bad']] }\n];\n\nlet ordIdx = -1, ordMode = 'good', ordTimer2 = null;\nfunction renderOrd(){\n  const data = ordMode === 'good' ? ORD : ORD_BAD;\n  const cur = ordIdx >= 0 ? data[ordIdx] : null;\n  const boxes = cur ? cur.boxes : [['生产者','待运行',''],['消费者','待运行',''],['mutex','1','ok']];\n  const col = c => c === 'ok' ? ['#e8f6ec','#15803d','#8fd6a6'] : (c === 'bad' ? ['#fdeceb','#dc2626','#f3b8b6'] : ['#f4f7fb','#8b95a3','#dfe6ef']);\n\n  $('ordStage').innerHTML =\n    `<div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px\">\n      <button class=\"btn ${ordMode==='good'?'':'gh'} sm\" data-ord=\"good\">顺序正确：P(empty) → P(mutex)<\/button>\n      <button class=\"btn ${ordMode==='bad'?'':'gh'} sm\" data-ord=\"bad\">顺序写反：P(mutex) → P(empty)<\/button>\n    <\/div>\n    <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px\">\n      ${boxes.map(b=>{ const [bg,fg,bd] = col(b[2]);\n        return `<div style=\"padding:12px;border-radius:10px;background:${bg};border:1px solid ${bd};text-align:center;transition:.3s\">\n          <div style=\"font-size:12px;font-weight:750;color:${fg}\">${b[0]}<\/div>\n          <div style=\"font-size:11.5px;color:${fg};opacity:.85;margin-top:4px;line-height:1.5\">${b[1]}<\/div><\/div>`;\n      }).join('')}\n    <\/div>\n    <div class=\"steps\">\n      ${data.map((s,i)=>{\n        const cls = i < ordIdx ? 'dn' : (i === ordIdx ? 'act' : '');\n        return `<div class=\"step ${cls}\"><div class=\"n\">${i+1}<\/div><div style=\"flex:1\">\n          <div class=\"t\">${s.t}<\/div><div class=\"d\">${s.d}<\/div><\/div><\/div>`;\n      }).join('')}\n    <\/div>`;\n  qsa('#ordStage [data-ord]').forEach(b=>b.onclick=()=>{\n    clearInterval(ordTimer2); ordTimer2=null; ordMode = b.dataset.ord; ordIdx = -1; renderOrd();\n  });\n}\n$('ordPlay').onclick = ()=>{\n  clearInterval(ordTimer2); ordIdx = -1; renderOrd();\n  ordTimer2 = setInterval(()=>{\n    const n = (ordMode === 'good' ? ORD : ORD_BAD).length;\n    if(ordIdx < n-1){ ordIdx++; renderOrd(); } else { clearInterval(ordTimer2); ordTimer2=null; }\n  }, 1600);\n};\n$('ordReset').onclick = ()=>{ clearInterval(ordTimer2); ordTimer2=null; ordIdx=-1; renderOrd(); };\nrenderOrd();\n\n/* ============================================================\n   动画 06 · 银行家算法\n   ============================================================ */\nconst BK_MAX = [[7,5,3],[3,2,2],[9,0,2],[2,2,2],[4,3,3]];\nconst BK_ALLOC = [[0,1,0],[2,0,0],[3,0,2],[2,1,1],[0,0,2]];\nfunction bkData(){\n  const avail = ($('bkAvail').value||'3,3,2').split(',').map(x=>parseInt(x.trim(),10)||0);\n  return {\n    avail: avail.slice(0,3),\n    need: BK_MAX.map((m,i)=> m.map((v,j)=> v - BK_ALLOC[i][j]))\n  };\n}\nfunction renderBK(){\n  const d = bkData();\n  const rows = d.need.map((nd,i)=>({ i, nd, alloc:BK_ALLOC[i], max:BK_MAX[i] }));\n  $('bkStage').innerHTML =\n    `<table class=\"tb\">\n      <tr><th>进程<\/th><th>Max (A B C)<\/th><th>Allocation<\/th><th>Need = Max − Alloc<\/th><\/tr>\n      ${rows.map(r=>`<tr>\n        <td><b>P${r.i}<\/b><\/td>\n        <td class=\"mono\">${r.max.join(' ')}<\/td>\n        <td class=\"mono\">${r.alloc.join(' ')}<\/td>\n        <td class=\"mono\"><b style=\"color:var(--accent)\">${r.nd.join(' ')}<\/b><\/td>\n      <\/tr>`).join('')}\n      <tr style=\"background:#f7f9fc\"><td colspan=\"3\"><b>Available（当前可用）<\/b><\/td>\n        <td class=\"mono\"><b style=\"color:var(--primary)\">${d.avail.join(' ')}<\/b><\/td><\/tr>\n    <\/table>`;\n\n  // 安全性算法\n  let avail = d.avail.slice();\n  const done = new Array(5).fill(false);\n  const seq = [];\n  const trace = [];\n  let guard = 0;\n  while(seq.length < 5 && guard++ < 50){\n    let found = -1;\n    for(let i=0;i<5;i++){\n      if(done[i]) continue;\n      if(d.need[i].every((v,j)=> v <= avail[j])){ found = i; break; }\n    }\n    if(found < 0) break;\n    const before = avail.slice();\n    avail = avail.map((v,j)=> v + BK_ALLOC[found][j]);\n    done[found] = true;\n    seq.push(found);\n    trace.push({ p:found, need:d.need[found], before, after:avail.slice(), alloc:BK_ALLOC[found] });\n  }\n  const safe = seq.length === 5;\n\n  $('bkOut').innerHTML =\n    `<div class=\"res\" style=\"margin-bottom:12px\">\n      ${trace.map((t,i)=>`<div class=\"r\" style=\"margin:5px 0\">\n        <span style=\"font-size:12.5px\">第 ${i+1} 步：Need[P${t.p}] = (${t.need.join(' ')}) ≤ Available (${t.before.join(' ')})　\n        <b style=\"color:#15803d\">✓ 可满足<\/b>　→　Available = (${t.before.join(' ')}) + (${t.alloc.join(' ')}) = <b style=\"color:var(--primary)\">(${t.after.join(' ')})<\/b><\/span>\n      <\/div>`).join('')}\n      ${!safe ? '<div class=\"r\" style=\"color:#dc2626\"><b>已经没有进程的 Need 能被满足了 —— 算法在此中止。<\/b><\/div>' : ''}\n    <\/div>` +\n    (safe\n      ? `<div class=\"tip s\"><span class=\"ti\">安全<\/span><span>系统处于<b>安全状态<\/b>，存在安全序列：<b style=\"font-size:14px\">P${seq.join(' → P')}<\/b><br>\n          安全序列可能不唯一，只要<b>存在一条<\/b>就说明系统安全。此时可以按任意请求分配资源（只要分配后仍安全）。<\/span><\/div>`\n      : `<div class=\"tip e\"><span class=\"ti\">不安全<\/span><span>系统<b>处于不安全状态<\/b>。注意：不安全 ≠ 一定会死锁，但<b>不安全状态下不能保证不死锁<\/b>，所以银行家算法在不安全时会拒绝分配。<\/span><\/div>`) +\n    `<div class=\"tip i\" style=\"margin-top:6px\"><span class=\"ti\">怎么考<\/span><span>\n      题目通常问「P1 请求 (1,0,2)，能否分配」。做法是三步：<br>\n      ① 检查 <span class=\"mono\">Request ≤ Need<\/span>（不能超出它声明的最大需求）<br>\n      ② 检查 <span class=\"mono\">Request ≤ Available<\/span>（系统得真拿得出来）<br>\n      ③ <b>试分配<\/b>：改 Available / Allocation / Need，再跑一遍上面的安全性算法，安全才真的分配。\n    <\/span><\/div>`;\n}\n$('bkAvail').oninput = renderBK;\n$('bkRun').onclick = renderBK;\n$('bkReset').onclick = ()=>{ $('bkAvail').value = '3,3,2'; renderBK(); };\nrenderBK();\n\n/* ============================================================\n   动画 07 · 资源分配图\n   ============================================================ */\nfunction renderRAG(){\n  const multi = $('ragMode').value === '2';\n  const inst = multi ? 1 : 0;   // R1 空闲实例索引（multi 时有 2 个实例）\n  // 简化场景：P1 申请 R1（R1 有 1 个被 P2 占用 + multi 时 1 个空闲）\n  //           P2 申请 R2（R2 被 P1 占用）\n  const p1Need = multi ? 'Need[P1] 申请 R1 → R1 还有 1 个空闲实例，<b>可以满足<\/b>' : 'Need[P1] 申请 R1 → R1 唯一实例被 P2 占着，<b>必须等<\/b>';\n  const step1 = multi\n    ? '找「申请能被满足」的进程：<b>P1<\/b> 申请 R1，R1 有 2 个实例，1 个在 P2 手里、1 个空闲 → P1 的需求能满足。'\n    : '找「申请能被满足」的进程：<b>P1<\/b> 申请 R1，但 R1 只有 1 个实例且已被 P2 持有 → 不可满足。<b>P2<\/b> 申请 R2，R2 被 P1 持有 → 也不可满足。';\n  const step2 = multi\n    ? '假设 P1 拿到资源并跑完，它释放 R1、R2 → R2 空闲出来 → P2 的申请也能满足了 → P2 也跑完。'\n    : '两个进程都不可化简，图中剩下的边无法消去。';\n  const step3 = multi\n    ? '<b style=\"color:#15803d\">全部进程都能消去 → 系统无死锁。<\/b>虽然图里有环路 P1→R1→P2→R2→P1，但多实例资源让它活了下来。'\n    : '<b style=\"color:#dc2626\">无法消去全部边 → 系统处于死锁状态。<\/b>环路 P1→R1→P2→R2→P1 就是死锁环。';\n\n  $('ragStage').innerHTML =\n    `<svg viewBox=\"0 0 620 300\" style=\"width:100%;max-width:560px;height:auto;display:block;margin:0 auto\">\n      <defs><marker id=\"ragah\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"3\" orient=\"auto\">\n        <path d=\"M0,0 L7,3 L0,6 z\" fill=\"#64748b\"/><\/marker><\/defs>\n\n      <\!-- P1 -->\n      <circle cx=\"140\" cy=\"80\" r=\"40\" fill=\"#e4f5f2\" stroke=\"#0f766e\" stroke-width=\"2.4\"/>\n      <text x=\"140\" y=\"78\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"800\" fill=\"#0f766e\">P1<\/text>\n      <text x=\"140\" y=\"96\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#4a9d92\">进程<\/text>\n      <\!-- P2 -->\n      <circle cx=\"140\" cy=\"230\" r=\"40\" fill=\"#e4f5f2\" stroke=\"#0f766e\" stroke-width=\"2.4\"/>\n      <text x=\"140\" y=\"228\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"800\" fill=\"#0f766e\">P2<\/text>\n      <text x=\"140\" y=\"246\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#4a9d92\">进程<\/text>\n\n      <\!-- R1 -->\n      <rect x=\"410\" y=\"42\" width=\"150\" height=\"76\" rx=\"12\" fill=\"#fff4e3\" stroke=\"#d97706\" stroke-width=\"2.4\"/>\n      <text x=\"485\" y=\"66\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#9a5b06\">R1<\/text>\n      <circle cx=\"${multi?455:485}\" cy=\"94\" r=\"9\" fill=\"#d97706\"/>\n      ${multi?'<circle cx=\"515\" cy=\"94\" r=\"9\" fill=\"#fff\" stroke=\"#d97706\" stroke-width=\"2.4\"/>':''}\n      <text x=\"485\" y=\"138\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#c08a3a\">${multi?'2 个实例（1 占用 + 1 空闲）':'1 个实例'}<\/text>\n\n      <\!-- R2 -->\n      <rect x=\"410\" y=\"192\" width=\"150\" height=\"76\" rx=\"12\" fill=\"#fff4e3\" stroke=\"#d97706\" stroke-width=\"2.4\"/>\n      <text x=\"485\" y=\"216\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#9a5b06\">R2<\/text>\n      <circle cx=\"485\" cy=\"244\" r=\"9\" fill=\"#d97706\"/>\n      <text x=\"485\" y=\"288\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#c08a3a\">1 个实例<\/text>\n\n      <\!-- 申请边 P1 -> R1 -->\n      <path d=\"M178,62 L406,62\" stroke=\"#2563eb\" stroke-width=\"2.2\" marker-end=\"url(#ragah)\"/>\n      <text x=\"290\" y=\"54\" text-anchor=\"middle\" font-size=\"11\" fill=\"#2563eb\">申请（P1 → R1）<\/text>\n      <\!-- 申请边 P2 -> R2 -->\n      <path d=\"M178,248 L406,248\" stroke=\"#2563eb\" stroke-width=\"2.2\" marker-end=\"url(#ragah)\"/>\n      <text x=\"290\" y=\"268\" text-anchor=\"middle\" font-size=\"11\" fill=\"#2563eb\">申请（P2 → R2）<\/text>\n      <\!-- 分配边 R1 -> P2 -->\n      <path d=\"M430,118 C 400,170 300,200 182,222\" stroke=\"#dc2626\" stroke-width=\"2.2\" stroke-dasharray=\"6 4\" marker-end=\"url(#ragah)\"/>\n      <\!-- 分配边 R2 -> P1 -->\n      <path d=\"M470,192 C 380,140 300,80 182,72\" stroke=\"#dc2626\" stroke-width=\"2.2\" stroke-dasharray=\"6 4\" marker-end=\"url(#ragah)\"/>\n      <text x=\"46\" y=\"160\" font-size=\"11\" fill=\"#dc2626\" transform=\"rotate(-90 46,160)\">分配边（虚线）<\/text>\n    <\/svg>\n    <div class=\"legend\">\n      <span><i style=\"background:#2563eb\"><\/i>申请边 P → R<\/span>\n      <span><i style=\"background:#dc2626\"><\/i>分配边 R → P<\/span>\n      <span><i style=\"background:#d97706\"><\/i>实心圆点 = 已被占用的实例<\/span>\n      <span><i style=\"background:#fff;border:1px solid #d97706\"><\/i>空心圆点 = 空闲实例<\/span>\n    <\/div>\n    <div class=\"steps\" style=\"margin-top:16px\">\n      <div class=\"step act\"><div class=\"n\">1<\/div><div><div class=\"t\">找出可以直接满足的进程<\/div><div class=\"d\">${step1}<\/div><\/div><\/div>\n      <div class=\"step act\"><div class=\"n\">2<\/div><div><div class=\"t\">化简<\/div><div class=\"d\">${step2}<\/div><\/div><\/div>\n      <div class=\"step act\"><div class=\"n\">3<\/div><div><div class=\"t\">判断<\/div><div class=\"d\">${step3}<\/div><\/div><\/div>\n    <\/div>`;\n\n  $('ragOut').innerHTML = multi\n    ? `<div class=\"tip s\"><span class=\"ti\">关键结论<\/span><span><b>每类资源有多个实例时，图中有环 ≠ 死锁。<\/b>必须做化简才能判断。这题的环 P1→R1→P2→R2→P1 看起来吓人，但因为 R1 还有空闲实例，P1 能先跑完，环就解开了。<\/span><\/div>`\n    : `<div class=\"tip e\"><span class=\"ti\">关键结论<\/span><span><b>每类资源只有 1 个实例时，图中有环 ⟺ 死锁<\/b>。这是一个充要条件，可以直接用来判断，不需要化简。把上面的实例数切到「R1 有 2 个」看看区别。<\/span><\/div>`;\n}\n$('ragMode').onchange = renderRAG;\n$('ragRun').onclick = renderRAG;\nrenderRAG();\n\n/* ============================================================\n   动画 08 · 分页地址转换\n   ============================================================ */\nconst PAGE_TABLE_MAP = {0:5, 1:2, 2:8, 3:1, 4:9, 5:3, 6:7, 7:4, 8:6, 9:0};\nlet VM_STEP = -1, VM_TIMER = null;\nconst VM_STEPS = [\n  ['① 拆开逻辑地址', '页面大小是 2 的整数次幂，所以逻辑地址可以<b>直接从中间切开<\/b>：低位是页内偏移，高位是页号。'],\n  ['② 拿页号去查页表', '页表存在<b>主存<\/b>里，是个数组。用页号当索引，取出对应的那一条页表项。'],\n  ['③ 读出物理页框号', '页表项里存的是这个页在物理内存中的<b>页框号<\/b>（也叫物理页号）。'],\n  ['④ 拼出物理地址', '页框号放回高位、<b>原来的偏移原封不动放回低位<\/b>，就得到物理地址了。']\n];\nfunction vmData(){\n  const size = parseInt($('vmPage').value,10);\n  let addr = parseInt($('vmAddr').value,10);\n  if(isNaN(addr) || addr < 0) addr = 0;\n  const pno = Math.floor(addr / size);\n  const off = addr % size;\n  const bits = Math.log2(size);\n  const frame = PAGE_TABLE_MAP[pno % 10];\n  const phys = frame * size + off;\n  return { size, addr, pno, off, bits, frame, phys };\n}\nfunction vmRender(){\n  const d = vmData();\n  const bin = (v,n)=> v.toString(2).padStart(n,'0');\n  const showTable = VM_STEP >= 1;\n  const showPhys = VM_STEP >= 3;\n  const totalBits = d.bits + 4;\n  const addrBin = bin(d.addr % (1 << totalBits), totalBits);\n  const pnoBin = addrBin.slice(0, 4);\n  const offBin = addrBin.slice(4);\n  let html = '';\n\n  if(VM_STEP < 0){\n    html = `<div class=\"tip i\" style=\"margin:0\"><span class=\"ti\">怎么用<\/span><span>\n      点「逐步演示」自动播放，或用「下一步」自己掌握节奏。盯着看三件事：逻辑地址怎么被切开、\n      页号怎么换成页框号、以及<b>偏移为什么全程不变<\/b>。<\/span><\/div>`;\n  } else {\n    html +=\n      `<div style=\"font-size:11.5px;color:#8b8699;margin-bottom:10px;line-height:1.7\">\n        <b>步骤 ①<\/b>　把逻辑地址 <b>${d.addr}<\/b> 拆成两段 —— 页面大小 ${d.size} B = 2<sup>${d.bits}<\/sup>，所以低 <b>${d.bits}<\/b> 位是偏移：\n      <\/div>\n      <div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap\">\n        <div style=\"display:flex;font-family:Consolas,monospace;font-size:14px;font-weight:800\">\n          <div style=\"padding:9px 15px;background:var(--accent-l);color:#9a5b06;border:1px solid #f6d9ab;border-radius:8px 0 0 8px;text-align:center\">\n            ${pnoBin}<div style=\"font-size:9.5px;font-weight:600;margin-top:2px\">页号 P<\/div><\/div>\n          <div style=\"padding:9px 15px;background:var(--primary-l);color:var(--primary);border:1px solid #a7d4ce;border-left:0;border-radius:0 8px 8px 0;text-align:center\">\n            ${offBin}<div style=\"font-size:9.5px;font-weight:600;margin-top:2px\">页内偏移 W<\/div><\/div>\n        <\/div>\n        <div style=\"font-size:12.5px;line-height:1.85;color:#5c6773\">\n          页号 P = ${d.addr} ÷ ${d.size} = <b>${d.pno}<\/b><br>\n          偏移 W = ${d.addr} mod ${d.size} = <b>${d.off}<\/b>\n        <\/div>\n      <\/div>`;\n  }\n\n  if(showTable){\n    html +=\n      `<div style=\"font-size:11.5px;color:#8b8699;margin:18px 0 10px;line-height:1.7\">\n        <b>步骤 ${showPhys?'②③':'②'}<\/b>　拿页号 <b>${d.pno}<\/b> 去查页表：\n      <\/div>\n      <div style=\"display:flex;gap:7px;flex-wrap:wrap\">\n        ${Object.keys(PAGE_TABLE_MAP).map(k=>{\n          const on = +k === (d.pno % 10);\n          return `<div style=\"min-width:64px;padding:9px 10px;border-radius:9px;text-align:center;\n            font-family:Consolas,monospace;transition:.3s;\n            background:${on?'var(--primary)':'#f8f7fc'};border:1px solid ${on?'var(--primary)':'var(--line)'};\n            color:${on?'#fff':'#a49db8'};font-weight:700\">\n            <div style=\"font-size:10px;opacity:.85\">页号 ${k}<\/div>\n            <div style=\"font-size:13.5px\">${PAGE_TABLE_MAP[k]}<\/div>\n          <\/div>`;\n        }).join('')}\n      <\/div>\n      ${showPhys\n        ? `<div class=\"tip s\" style=\"margin-top:10px\"><span class=\"ti\">步骤 ③<\/span><span>\n             找到页号 ${d.pno} 那一项，读出<b>页框号 = ${d.frame}<\/b> —— 这就完成了「虚页号 → 物理页框号」的映射。<\/span><\/div>`\n        : `<div class=\"tip i\" style=\"margin-top:10px\"><span class=\"ti\">说明<\/span><span>\n             表格里每个格子就是一条<b>页表项<\/b>，高亮的那条就是我们要找的。<\/span><\/div>`}`;\n  }\n\n  if(showPhys){\n    html +=\n      `<div style=\"font-size:11.5px;color:#8b8699;margin:18px 0 10px;line-height:1.7\">\n        <b>步骤 ④<\/b>　页框号放高位、偏移原样放低位：\n      <\/div>\n      <div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap\">\n        <div style=\"display:flex;font-family:Consolas,monospace;font-size:14px;font-weight:800\">\n          <div style=\"padding:9px 15px;background:var(--accent-l);color:#9a5b06;border:1px solid #f6d9ab;border-radius:8px 0 0 8px;text-align:center\">\n            ${d.frame}<div style=\"font-size:9.5px;font-weight:600;margin-top:2px\">页框号 F<\/div><\/div>\n          <div style=\"padding:9px 15px;background:var(--primary-l);color:var(--primary);border:1px solid #a7d4ce;border-left:0;border-radius:0 8px 8px 0;text-align:center\">\n            ${offBin}<div style=\"font-size:9.5px;font-weight:600;margin-top:2px\">偏移 W（没变）<\/div><\/div>\n        <\/div>\n        <div style=\"font-size:13px;color:#5c6773\">\n          物理地址 = ${d.frame} × ${d.size} + ${d.off} = <b style=\"color:var(--primary);font-size:16px\">${d.phys}<\/b>\n        <\/div>\n      <\/div>`;\n  }\n\n  $('vmStage').innerHTML = html;\n\n  $('vmOut').innerHTML =\n    `<div class=\"steps\">\n      ${VM_STEPS.map((s,i)=>{\n        const cls = i < VM_STEP ? 'dn' : (i === VM_STEP ? 'act' : '');\n        return `<div class=\"step ${cls}\"><div class=\"n\">${i+1}<\/div><div style=\"flex:1\">\n          <div class=\"t\">${s[0]}<\/div><div class=\"d\">${s[1]}<\/div><\/div><\/div>`;\n      }).join('')}\n    <\/div>` +\n    (VM_STEP >= 3\n      ? `<div class=\"tip i\" style=\"margin-top:10px\"><span class=\"ti\">关键<\/span><span>\n          <b>页内偏移全程不变<\/b> —— 这是分页存储最重要的性质。地址转换只换掉了高位（页号 → 页框号），低位的偏移原封不动。\n          正因为如此，页的大小必须是 2 的整数次幂，才能用「移位 + 掩码」高效拆地址。<br><br>\n          另外注意：无 TLB 时这一步要<b>访存 2 次<\/b>（查页表 1 次 + 取数据 1 次）；TLB 命中时只要 <b>1 次<\/b>。\n        <\/span><\/div>`\n      : '');\n}\nfunction vmStop(){ if(VM_TIMER){ clearInterval(VM_TIMER); VM_TIMER = null; } }\n$('vmPlay').onclick = ()=>{\n  vmStop(); VM_STEP = -1; vmRender();\n  VM_TIMER = setInterval(()=>{\n    if(VM_STEP < 3){ VM_STEP++; vmRender(); } else { vmStop(); }\n  }, 1500);\n};\n$('vmNext').onclick = ()=>{ vmStop(); if(VM_STEP < 3){ VM_STEP++; vmRender(); } };\n$('vmReset').onclick = ()=>{ vmStop(); VM_STEP = -1; vmRender(); };\n$('vmAddr').oninput = ()=>{ vmStop(); VM_STEP = -1; vmRender(); };\n$('vmPage').onchange = ()=>{ vmStop(); VM_STEP = -1; vmRender(); };\nqsa('[data-vm]').forEach(b=>b.onclick=()=>{\n  vmStop(); $('vmAddr').value = b.dataset.vm; VM_STEP = -1; vmRender();\n});\nvmRender();\n\n/* ============================================================\n   动画 09 · 页面置换算法对比\n   ============================================================ */\nfunction runPage(refs, frames, algo){\n  let mem = [], fifoQ = [], faults = 0;\n  const steps = [];\n  refs.forEach((p, i)=>{\n    const hit = mem.indexOf(p) >= 0;\n    let evicted = null, slot = -1;\n    if(!hit){\n      faults++;\n      if(mem.length < frames){\n        mem.push(p); slot = mem.length - 1; fifoQ.push(p);\n      } else {\n        let idx = 0;\n        if(algo === 'fifo'){\n          const victim = fifoQ.shift();\n          idx = mem.indexOf(victim);\n          fifoQ.push(p);\n        } else if(algo === 'opt'){\n          let far = -2;\n          mem.forEach((m,mi)=>{\n            let nx = refs.slice(i+1).indexOf(m);\n            if(nx === -1) nx = Infinity;\n            if(nx > far){ far = nx; idx = mi; }\n          });\n        } else {\n          let oldest = Infinity;\n          mem.forEach((m,mi)=>{\n            const last = refs.slice(0,i).lastIndexOf(m);\n            if(last < oldest){ oldest = last; idx = mi; }\n          });\n        }\n        evicted = mem[idx];\n        mem[idx] = p;\n        slot = idx;\n      }\n    }\n    steps.push({ p, hit, mem: mem.slice(), evicted, slot, no:faults });\n  });\n  return { steps, faults };\n}\nconst PNAME = { opt:'OPT 最佳置换', fifo:'FIFO 先进先出', lru:'LRU 最近最久未使用' };\nconst PCOLOR = { opt:'#15803d', fifo:'#d97706', lru:'#2563eb' };\nfunction renderPage(){\n  const refs = ($('pgRef').value||'').split(/[,，\\s]+/).map(x=>parseInt(x,10)).filter(x=>!isNaN(x));\n  const frames = Math.max(1, Math.min(5, parseInt($('pgFrames').value,10) || 3));\n  if(!refs.length){ $('pgStage').innerHTML = '<div class=\"tip m\"><span class=\"ti\">提示<\/span><span>请输入页面访问串，用逗号分隔。<\/span><\/div>'; $('pgStat').innerHTML=''; return; }\n  if(refs.length > 24){ refs.length = 24; }\n\n  const sel = $('pgAlgo').value;\n  const algos = sel === 'all' ? ['opt','fifo','lru'] : [sel];\n  let html = '', stat = '';\n\n  algos.forEach(a=>{\n    const r = runPage(refs, frames, a);\n    const rate = (r.faults / refs.length * 100).toFixed(1);\n\n    html += `<div style=\"margin-bottom:22px;overflow-x:auto\">\n      <div style=\"font-size:13px;font-weight:750;margin-bottom:6px;color:${PCOLOR[a]}\">${PNAME[a]}\n        <span style=\"font-weight:500;font-size:11.5px;color:#8b95a3\">页框数 = ${frames}<\/span><\/div>\n      <div style=\"font-size:12px;color:#5c6773;line-height:1.75;margin-bottom:10px;padding:9px 13px;\n        background:#f7f9fc;border-radius:8px;border-left:3px solid ${PCOLOR[a]}\"><b>怎么挑淘汰页：<\/b>${PG_DESC[a]}<\/div>\n      <table style=\"border-collapse:collapse;font-family:Consolas,monospace;font-size:11.5px;min-width:100%\">\n        <tr>\n          <td style=\"padding:4px 8px;color:#8b95a3;font-weight:700;white-space:nowrap\">访问<\/td>\n          ${refs.map(p=>`<td style=\"padding:4px 0;text-align:center;min-width:26px;background:#f4f7fb;border:1px solid #e3e8ef;font-weight:800\">${p}<\/td>`).join('')}\n        <\/tr>\n        ${Array.from({length:frames},(_,fi)=>`<tr>\n          <td style=\"padding:4px 8px;color:#8b95a3;white-space:nowrap\">框 ${fi+1}<\/td>\n          ${r.steps.map(s=>{\n            const v = s.mem[fi];\n            const isNew = !s.hit && s.slot === fi;\n            return `<td style=\"padding:5px 0;text-align:center;border:1px solid #e3e8ef;font-weight:700;\n              background:${isNew?'#e8f6ec':'#fff'};color:${v===undefined?'#d8dfe9':(isNew?'#15803d':'#3c4654')}\">${v===undefined?'—':v}<\/td>`;\n          }).join('')}\n        <\/tr>`).join('')}\n        <tr>\n          <td style=\"padding:4px 8px;color:#8b95a3;white-space:nowrap\">缺页<\/td>\n          ${r.steps.map(s=>`<td style=\"padding:5px 0;text-align:center;border:1px solid #e3e8ef;font-weight:800;\n            background:${s.hit?'#f7f9fc':'#fdeceb'};color:${s.hit?'#c3cbd7':'#dc2626'}\">${s.hit?'':'✗'}<\/td>`).join('')}\n        <\/tr>\n      <\/table>\n    <\/div>`;\n\n    stat += `<div class=\"r\" style=\"margin:5px 0\"><span class=\"lbl\" style=\"color:${PCOLOR[a]};font-weight:750\">${PNAME[a]}<\/span>\n      <span style=\"font-size:13px\">缺页 <b style=\"color:${PCOLOR[a]};font-size:15px\">${r.faults}<\/b> 次　·　命中 ${refs.length - r.faults} 次　·　缺页率 ${rate}%<\/span><\/div>`;\n  });\n\n  $('pgStage').innerHTML = html;\n  $('pgStat').innerHTML = `<div class=\"res\">${stat}<\/div>\n    <div class=\"tip i\" style=\"margin-top:10px\"><span class=\"ti\">读懂表格<\/span><span>\n      绿色格子 = 本次缺页新调入的页；红色 ✗ = 这一列发生了缺页。把三种算法的缺页数对比一下：<b>OPT 一定最少<\/b>（它是理论最优），LRU 通常接近 OPT，FIFO 一般最差。\n    <\/span><\/div>\n    <div class=\"tip m\" style=\"margin-top:6px\"><span class=\"ti\">Belady 异常<\/span><span>\n      把数据换成「FIFO 异常例」并把页框数从 3 改成 4 —— 你会看到 <b>FIFO 的缺页次数反而增加了<\/b>。这叫 Belady 异常，<b>只有 FIFO 会犯这个毛病<\/b>，OPT 和 LRU 不会（它们属于堆栈类算法）。\n    <\/span><\/div>`;\n}\n$('pgRef').oninput = renderPage;\n$('pgFrames').oninput = renderPage;\n$('pgAlgo').onchange = renderPage;\nqsa('[data-pg]').forEach(b=>b.onclick=()=>{ $('pgRef').value = b.dataset.pg; renderPage(); });\nrenderPage();\n\n/* ============================================================\n   动画 10 · 动态分区分配\n   ============================================================ */\nfunction renderFF(){\n  const raw = ($('ffFree').value||'').split(/[,，\\s]+/).map(x=>parseInt(x,10)).filter(x=>!isNaN(x) && x>0);\n  const req = Math.max(1, parseInt($('ffReq').value,10) || 1);\n  const algo = $('ffAlgo').value;\n  if(!raw.length){ $('ffStage').innerHTML=''; $('ffOut').innerHTML = '<div class=\"tip m\"><span class=\"ti\">提示<\/span><span>请输入空闲分区大小，用逗号分隔。<\/span><\/div>'; return; }\n\n  const parts = raw.map((s,i)=>({ id:i, size:s, from:0, to:0 }));\n  let acc = 0; parts.forEach(p=>{ p.from = acc; acc += p.size; p.to = acc; });\n  const total = acc;\n\n  // 选块\n  let pick = -1;\n  const cands = parts.map((p,i)=>({i, size:p.size})).filter(x=>x.size >= req);\n  let reason = '';\n  if(!cands.length){\n    pick = -1; reason = '没有任何空闲分区能满足这个请求 → <b>分配失败<\/b>（可能需要紧凑或等待回收）。';\n  } else if(algo === 'ff'){\n    pick = cands[0].i;\n    reason = '从<b>低地址<\/b>开始找，第一个满足的分区就是它（分区 ' + (cands[0].i+1) + '，' + cands[0].size + ' KB）。';\n  } else if(algo === 'bf'){\n    const best = cands.slice().sort((a,b)=>a.size-b.size)[0];\n    pick = best.i;\n    reason = '在所有够用的分区里选<b>最小<\/b>的那个（分区 ' + (best.i+1) + '，' + best.size + ' KB），只剩 ' + (best.size-req) + ' KB 碎片。';\n  } else if(algo === 'wf'){\n    const worst = cands.slice().sort((a,b)=>b.size-a.size)[0];\n    pick = worst.i;\n    reason = '在所有够用的分区里选<b>最大<\/b>的那个（分区 ' + (worst.i+1) + '，' + worst.size + ' KB），尽量不留下小碎片。';\n  } else {\n    pick = cands[cands.length-1].i;\n    reason = '从<b>上次分配结束的位置<\/b>继续往后找（分区 ' + (cands[cands.length-1].i+1) + '），找到就分配，找不到再从头绕一圈。';\n  }\n\n  const ALGO_TXT = { ff:'首次适应 FF', bf:'最佳适应 BF', wf:'最坏适应 WF', nf:'邻近适应 NF' };\n  const ALGO_NOTE = {\n    ff:'从低地址开始找第一个够用的。实现简单、<b>综合性能通常最好<\/b>，但低地址区容易被反复切割，留下很多小碎片。',\n    bf:'找最小的够用分区。名字叫「最佳」，实际上<b>最容易产生大量极小碎片<\/b>（外部碎片最多），通常是最差的方案。',\n    wf:'找最大的分区。避免留下小碎片，但<b>大分区很快被切光<\/b>，后面来大请求就分配不了了。',\n    nf:'从上次结束处继续找，形成「循环」扫描。好处是各分区被均匀使用，但<b>会把高地址的大块也切碎<\/b>，反而比首次适应更差。'\n  };\n\n  $('ffStage').innerHTML =\n    `<div style=\"font-size:12px;font-weight:700;color:#4b5665;margin-bottom:8px\">空闲分区表（按地址顺序，共 ${total} KB）<\/div>\n     <div style=\"display:flex;gap:4px;flex-wrap:wrap\">\n      ${parts.map((p,i)=>{\n        const sel = i === pick;\n        const fail = !sel && p.size >= req && pick >= 0;\n        return `<div style=\"flex:0 0 auto;min-width:74px;padding:10px 12px;border-radius:9px;text-align:center;transition:.3s;\n          background:${sel?'var(--primary)':(p.size>=req?'#e8f6ec':'#f4f7fb')};\n          color:${sel?'#fff':(p.size>=req?'#15803d':'#8b95a3')};\n          border:1px solid ${sel?'var(--primary)':(p.size>=req?'#8fd6a6':'#e3e8ef')}\">\n          <div style=\"font-size:10.5px;opacity:.85\">分区 ${i+1}<\/div>\n          <div style=\"font-size:14px;font-weight:800\">${p.size} KB<\/div>\n          <div style=\"font-size:10px;opacity:.8;margin-top:2px\">${p.from}~${p.to}<\/div>\n        <\/div>`;\n      }).join('')}\n     <\/div>`;\n\n  $('ffOut').innerHTML =\n    `<div class=\"res\">\n      <div class=\"r\"><span class=\"lbl\">算法<\/span><span class=\"val\">${ALGO_TXT[algo]}<\/span><\/div>\n      <div class=\"r\" style=\"margin-top:5px\"><span class=\"lbl\">请求大小<\/span><span style=\"font-size:13px\">${req} KB<\/span><\/div>\n      <div class=\"r\" style=\"margin-top:5px\"><span class=\"lbl\">结果<\/span><span style=\"font-size:13px\">${reason}<\/span><\/div>\n      ${pick >= 0 ? `<div class=\"r\" style=\"margin-top:5px\"><span class=\"lbl\">分配后<\/span><span style=\"font-size:13px\">\n        分区 ${pick+1} 剩余 <b>${parts[pick].size - req}<\/b> KB${parts[pick].size-req === 0 ? '（正好用光，该分区消失）' : '（成为新的小碎片）'}<\/span><\/div>` : ''}\n    <\/div>\n    <div class=\"tip i\" style=\"margin-top:10px\"><span class=\"ti\">算法特点<\/span><span>${ALGO_NOTE[algo]}<\/span><\/div>\n    <div class=\"tip m\" style=\"margin-top:6px\"><span class=\"ti\">碎片问题<\/span><span>\n      动态分区产生的是<b>外部碎片<\/b>（分区之间零零散散的小空闲区）。解决办法是<b>紧凑（拼接）<\/b>：把进程挪到一起，把空闲区合并成大块。\n      但紧凑需要<b>动态重定位<\/b>支持（进程运行时能改物理地址），而且开销很大。\n    <\/span><\/div>`;\n}\n$('ffFree').oninput = renderFF;\n$('ffReq').oninput = renderFF;\n$('ffAlgo').onchange = renderFF;\nrenderFF();\n\n/* ============================================================\n   动画 11 · 混合索引寻址\n   ============================================================ */\nfunction renderIX(){\n  const blk = Math.max(0, parseInt($('ixBlk').value,10) || 0);\n  const size = Math.max(64, parseInt($('ixSize').value,10) || 4096);\n  const ptr = Math.max(1, parseInt($('ixPtr').value,10) || 4);\n  const per = Math.floor(size / ptr);   // 每个索引块能放的地址项数\n\n  const D = 10;\n  const L1 = per, L2 = per*per, L3 = per*per*per;\n  const r1 = D;              // [0, 10)\n  const r2 = D + L1;         // [10, 10+1024)\n  const r3 = r2 + L2;\n  const r4 = r3 + L3;\n\n  let level, visits, path, rangeTxt;\n  if(blk < r1){ level = '直接地址项'; visits = 1; path = `索引结点第 ${blk+1} 个直接地址项`; }\n  else if(blk < r2){ level = '一级间接'; visits = 2; path = `直接项已用 10 个，第 ${blk-10+1} 个落在一级间接块里`; }\n  else if(blk < r3){ level = '二级间接'; visits = 3; path = `落在二级间接里，第 ${blk-r2+1} 个`; }\n  else if(blk < r4){ level = '三级间接'; visits = 4; path = `落在三级间接里，第 ${blk-r3+1} 个`; }\n  else { level = '超出范围'; visits = 0; path = '超出该索引结点能寻址的最大文件范围'; }\n\n  const maxBytes = r4 * size;\n  const fmt = b => b >= 1099511627776 ? (b/1099511627776).toFixed(2)+' TB'\n    : b >= 1073741824 ? (b/1073741824).toFixed(2)+' GB'\n    : b >= 1048576 ? (b/1048576).toFixed(2)+' MB'\n    : b >= 1024 ? (b/1024).toFixed(2)+' KB' : b+' B';\n\n  const seg = (name, cnt, color, bg)=>{\n    const active = (name==='直接' && blk < r1) || (name==='一级间接' && blk>=r1 && blk<r2)\n      || (name==='二级间接' && blk>=r2 && blk<r3) || (name==='三级间接' && blk>=r3 && blk<r4);\n    return `<div style=\"padding:11px 12px;border-radius:9px;text-align:center;transition:.3s;\n      background:${active?color:bg};color:${active?'#fff':color};\n      border:1px solid ${color};flex:1;min-width:96px\">\n      <div style=\"font-size:11.5px;font-weight:800\">${name}<\/div>\n      <div style=\"font-size:12px;margin-top:3px\">${cnt.toLocaleString('en-US')} 块<\/div>\n      <div style=\"font-size:10px;opacity:.85;margin-top:2px\">${active?'← 当前在此':''}<\/div>\n    <\/div>`;\n  };\n\n  $('ixStage').innerHTML =\n    `<div style=\"font-size:12px;font-weight:700;color:#4b5665;margin-bottom:8px\">\n      索引结点结构（块大小 ${size} B ÷ 地址项 ${ptr} B = 每块可放 <b>${per}<\/b> 个地址项）<\/div>\n     <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n       ${seg('直接', D, '#15803d', '#e8f6ec')}\n       ${seg('一级间接', L1, '#0891b2', '#e2f7fb')}\n       ${seg('二级间接', L2, '#d97706', '#fff4e3')}\n       ${seg('三级间接', L3, '#7c3aed', '#f2ecfe')}\n     <\/div>\n     <div style=\"margin-top:14px;font-size:11.5px;color:#6b7280;font-family:Consolas,monospace\">\n       逻辑块号范围：直接 [0, ${r1})　一级 [${r1}, ${r2})　二级 [${r2}, ${r3.toLocaleString('en-US')})　三级 [${r3.toLocaleString('en-US')}, ${r4.toLocaleString('en-US')})\n     <\/div>`;\n\n  $('ixOut').innerHTML =\n    `<div class=\"res\">\n      <div class=\"r\"><span class=\"lbl\">逻辑块号<\/span><span class=\"val\">${blk}<\/span>\n        <span style=\"font-size:12px;color:#8b95a3\">落在 <b>${level}<\/b><\/span><\/div>\n      <div class=\"r\" style=\"margin-top:6px\"><span class=\"lbl\">定位路径<\/span><span style=\"font-size:13px\">${path}<\/span><\/div>\n      <div class=\"r\" style=\"margin-top:6px\"><span class=\"lbl\">访盘次数<\/span><span style=\"font-size:13px\">\n        ${visits ? `<b style=\"color:var(--primary);font-size:15px\">${visits}<\/b> 次　=　${visits-1} 次读索引块 + 1 次读数据块` : '—'}<\/span><\/div>\n    <\/div>\n    <div class=\"tip s\" style=\"margin-top:10px\"><span class=\"ti\">最大文件<\/span><span>\n      这个索引结点能寻址的最大文件大小为 <b>${fmt(maxBytes)}<\/b>\n      （= (${D} + ${per} + ${per}² + ${per}³) × ${size} B）。<br>\n      考试常给一组具体数字（如 4 KB 块、4 B 地址项、10 个直接项），让你算最大文件大小或某个块号要访盘几次。<b>公式记牢：每块地址项数 = 块大小 ÷ 地址项大小。<\/b>\n    <\/span><\/div>\n    <div class=\"tip i\" style=\"margin-top:6px\"><span class=\"ti\">为什么这样设计<\/span><span>\n      小文件（大多数）只用直接项，一次访盘就够；大文件才动用多级间接。<b>用最少的访盘次数照顾大多数文件<\/b>，这就是混合索引的设计意图。\n    <\/span><\/div>`;\n}\n$('ixBlk').oninput = renderIX;\n$('ixSize').oninput = renderIX;\n$('ixPtr').oninput = renderIX;\nrenderIX();\n\n/* ============================================================\n   动画 12 · 位示图\n   ============================================================ */\nfunction renderBM(){\n  const w = Math.max(4, Math.min(64, parseInt($('bmW').value,10) || 32));\n  const base = parseInt($('bmBase').value,10);\n  let b = Math.max(0, parseInt($('bmBlk').value,10) || 0);\n\n  let wordNo, bitNo, formula;\n  if(base === 1){\n    wordNo = Math.floor((b - 1) / w);\n    bitNo = ((b - 1) % w);\n    formula = `字号 = (盘块号 − 1) ÷ ${w} + 1 = (${b} − 1) ÷ ${w} + 1 = <b>${wordNo + 1}<\/b>（第 ${wordNo+1} 个字）<br>\n               位号 = (盘块号 − 1) mod ${w} + 1 = (${b} − 1) mod ${w} + 1 = <b>${bitNo + 1}<\/b>（这个字的第 ${bitNo+1} 位）`;\n  } else {\n    wordNo = Math.floor(b / w);\n    bitNo = b % w;\n    formula = `字号 = 盘块号 ÷ ${w} = ${b} ÷ ${w} = <b>${wordNo}<\/b>（第 ${wordNo} 个字，从 0 计）<br>\n               位号 = 盘块号 mod ${w} = ${b} mod ${w} = <b>${bitNo}<\/b>（从 0 计）`;\n  }\n\n  // 可视化：显示目标字所在的行\n  const rowStart = wordNo;\n  let cells = '';\n  for(let wi = Math.max(0, rowStart-1); wi <= rowStart+1; wi++){\n    let line = '';\n    for(let bi = 0; bi < Math.min(w, 32); bi++){\n      const isTarget = (wi === wordNo && bi === bitNo);\n      line += `<div class=\"cellx ${isTarget?'on':''}\" style=\"width:22px;height:26px;font-size:10px\">${isTarget?'1':'0'}<\/div>`;\n    }\n    cells += `<div style=\"display:flex;gap:3px;align-items:center;margin-bottom:5px\">\n      <span style=\"font-size:10.5px;color:#8b95a3;width:52px;flex-shrink:0\">字 ${wi+1}<\/span>\n      <div class=\"cells\" style=\"gap:3px\">${line}<\/div><\/div>`;\n  }\n\n  $('bmStage').innerHTML =\n    `<div style=\"font-size:12px;font-weight:700;color:#4b5665;margin-bottom:9px\">位示图（节选，每个格子 = 一个盘块，1 表示占用）<\/div>\n     ${cells}\n     <div class=\"legend\"><span><i style=\"background:var(--primary)\"><\/i>当前盘块号 ${b} 对应的位<\/span><\/div>`;\n\n  $('bmOut').innerHTML =\n    `<div class=\"res\">\n      <div class=\"r\"><span class=\"lbl\">盘块号<\/span><span class=\"val\">${b}<\/span>\n        <span style=\"font-size:12px;color:#8b95a3\">字长 ${w} 位，编号从 ${base} 开始<\/span><\/div>\n      <div class=\"r\" style=\"margin-top:6px\"><span class=\"lbl\">换算<\/span><span style=\"font-size:13px;line-height:2\">${formula}<\/span><\/div>\n    <\/div>\n    <div class=\"tip e\" style=\"margin-top:10px\"><span class=\"ti\">最容易错的地方<\/span><span>\n      <b>编号起点不同，公式差 1<\/b>。做题一定先看清题干说的是「盘块号从 1 开始」还是「从 0 开始」，\n      以及位示图里 <b>1 表示占用还是空闲<\/b>（多数教材约定 1 = 占用，但也有例外）。这三处约定任何一个看错，整道题就废了。<br><br>\n      反过来，如果给的是字号和位号求盘块号：<span class=\"mono\">盘块号 = (字号 − 1) × 字长 + 位号<\/span>（从 1 开始编号时）。\n    <\/span><\/div>`;\n}\n$('bmW').oninput = renderBM;\n$('bmBase').onchange = renderBM;\n$('bmBlk').oninput = renderBM;\nrenderBM();\n\n/* ============================================================\n   动画 13 · 磁盘调度\n   ============================================================ */\nfunction runDisk(seq, head, maxT, algo){\n  const req = seq.slice().sort((a,b)=>a-b);\n  let order = [];\n  if(algo === 'fcfs') order = seq.slice();\n  else if(algo === 'sstf'){\n    const rem = seq.slice(); let pos = head;\n    while(rem.length){\n      let bi = 0, bd = Infinity;\n      rem.forEach((r,i)=>{ const d = Math.abs(r - pos); if(d < bd){ bd = d; bi = i; } });\n      const p = rem.splice(bi,1)[0];\n      order.push(p); pos = p;\n    }\n  } else if(algo === 'scan'){\n    order = req.filter(r=>r >= head).concat([maxT-1], req.filter(r=>r < head).slice().reverse());\n  } else if(algo === 'cscan'){\n    order = req.filter(r=>r >= head).concat([maxT-1, 0], req.filter(r=>r < head));\n  } else if(algo === 'look'){\n    order = req.filter(r=>r >= head).concat(req.filter(r=>r < head).slice().reverse());\n  } else {\n    order = req.filter(r=>r >= head).concat(req.filter(r=>r < head));\n  }\n  let cur = head, dist = 0;\n  const path = [{ t:head, d:0 }];\n  order.forEach(p=>{ dist += Math.abs(p - cur); path.push({ t:p, d:dist }); cur = p; });\n  return { order, dist, path };\n}\nconst DK_NAME = { fcfs:'FCFS 先来先服务', sstf:'SSTF 最短寻道优先', scan:'SCAN 电梯（先向大号）', cscan:'C-SCAN 循环扫描', look:'LOOK', clook:'C-LOOK' };\nfunction renderDK(){\n  const seq = ($('dkSeq').value||'').split(/[,，\\s]+/).map(x=>parseInt(x,10)).filter(x=>!isNaN(x));\n  const head = parseInt($('dkHead').value,10) || 0;\n  const maxT = Math.max(10, parseInt($('dkMax').value,10) || 200);\n  if(!seq.length){ $('dkStage').innerHTML=''; $('dkStat').innerHTML = '<div class=\"tip m\"><span class=\"ti\">提示<\/span><span>请输入磁道请求序列。<\/span><\/div>'; return; }\n\n  const sel = $('dkAlgo').value;\n  const algos = sel === 'all' ? ['fcfs','sstf','scan','cscan','look'] : [sel];\n  let html = '', stat = '';\n  const results = [];\n\n  algos.forEach(a=>{\n    const r = runDisk(seq, head, maxT, a);\n    results.push({ a, r });\n    // 轨迹图：纵向排列\n    html += `<div style=\"margin-bottom:18px\">\n      <div style=\"font-size:13px;font-weight:750;margin-bottom:6px\">${DK_NAME[a]}\n        <span style=\"font-weight:500;font-size:11.5px;color:#8b95a3\">移臂总量 = <b>${r.dist}<\/b> 个磁道<\/span><\/div>\n      <div style=\"font-size:12px;color:#5c6773;line-height:1.75;margin-bottom:9px;padding:9px 13px;\n        background:#f7f9fc;border-radius:8px;border-left:3px solid var(--primary)\"><b>怎么选下一个：<\/b>${DK_DESC[a]}<\/div>\n      <div style=\"font-size:11.5px;font-family:Consolas,monospace;color:#5c6779;line-height:1.9;word-break:break-all\">\n        ${head} ${r.order.map(p=>`→ ${p}`).join(' ')}\n      <\/div>\n      <div style=\"position:relative;height:34px;background:#f4f7fb;border-radius:7px;margin-top:6px;overflow:hidden\">\n        <svg viewBox=\"0 0 ${maxT} 34\" preserveAspectRatio=\"none\" style=\"width:100%;height:100%;display:block\">\n          <polyline points=\"${r.path.map(p=>`${p.t},${34 - 6 - (p.d/Math.max(1,r.dist))*22}`).join(' ')}\"\n            fill=\"none\" stroke=\"var(--primary)\" stroke-width=\"1.6\" vector-effect=\"non-scaling-stroke\"/>\n        <\/svg>\n        <div style=\"position:absolute;left:0;top:1px;font-size:9px;color:#b6c0cc;padding-left:3px\">0<\/div>\n        <div style=\"position:absolute;right:0;top:1px;font-size:9px;color:#b6c0cc;padding-right:3px\">${maxT}<\/div>\n      <\/div>\n    <\/div>`;\n  });\n\n  const sorted = results.slice().sort((x,y)=>x.r.dist - y.r.dist);\n  const best = sorted[0];\n  stat = `<div class=\"res\">\n    ${results.map(x=>`<div class=\"r\" style=\"margin:5px 0\">\n      <span class=\"lbl\">${DK_NAME[x.a]}<\/span>\n      <span style=\"font-size:13px\">移臂总量 <b style=\"color:${x===best?'#15803d':'#3c4654'};font-size:15px\">${x.r.dist}<\/b>\n      ${x===best?'　<b style=\"color:#15803d\">← 本例最优<\/b>':''}<\/span><\/div>`).join('')}\n  <\/div>`;\n\n  $('dkStage').innerHTML = html;\n  $('dkStat').innerHTML = stat +\n    `<div class=\"tip i\" style=\"margin-top:10px\"><span class=\"ti\">看门道<\/span><span>\n      <b>FCFS<\/b> 完全按请求顺序，看着公平但移臂量通常最大；<b>SSTF<\/b> 每次找最近的，平均寻道最短，但<b>可能导致远处的请求永远得不到服务（饥饿）<\/b>；\n      <b>SCAN<\/b> 像电梯一样来回扫，不会饥饿，但中间磁道比两端更占便宜；<b>C-SCAN<\/b> 扫到头直接回起点，把回程的无效移动也算了进去（所以移臂量往往比 SCAN 大，但更公平）。\n    <\/span><\/div>\n    <div class=\"tip m\" style=\"margin-top:6px\"><span class=\"ti\">别搞混<\/span><span>\n      <b>SCAN / C-SCAN 要扫到磁盘物理末端<\/b>（0 或最大磁道号），<b>LOOK / C-LOOK 扫到最远的那条请求就返回<\/b>。\n      题目如果给了「磁道总数」这个参数，基本就是在考 SCAN 系列要不要走到头。\n    <\/span><\/div>`;\n}\n$('dkSeq').oninput = renderDK;\n$('dkHead').oninput = renderDK;\n$('dkMax').oninput = renderDK;\n$('dkAlgo').onchange = renderDK;\nqsa('[data-dk]').forEach(b=>b.onclick=()=>{ $('dkSeq').value = b.dataset.dk; renderDK(); });\nrenderDK();\n\n/* ============================================================\n   动画 14 · 单缓冲 vs 双缓冲\n   ============================================================ */\nfunction renderBF(){\n  const T = Math.max(1, parseInt($('bfT').value,10) || 100);\n  const C = Math.max(1, parseInt($('bfC').value,10) || 50);\n  const M = Math.max(0, parseInt($('bfM').value,10) || 20);\n  const n = Math.max(1, parseInt($('bfN').value,10) || 10);\n\n  const singlePer = Math.max(C, T) + M;\n  const singleTotal = n * singlePer;\n  const doublePer = Math.max(C + M, T);\n  const doubleTotal = n * doublePer;\n  const speedup = (singleTotal / doubleTotal).toFixed(2);\n  const maxT = Math.max(singleTotal, doubleTotal);\n\n  const bar = (label, per, total, color)=>{\n    return `<div style=\"margin-bottom:12px\">\n      <div style=\"font-size:12.5px;font-weight:750;margin-bottom:5px\">${label}\n        <span style=\"font-weight:500;font-size:11.5px;color:#8b95a3\">每块 ${per} μs · ${n} 块共 <b>${total}<\/b> μs<\/span><\/div>\n      <div style=\"height:22px;background:#f4f7fb;border-radius:6px;overflow:hidden\">\n        <div style=\"height:100%;width:${total/maxT*100}%;background:${color};border-radius:6px;transition:.4s\"><\/div>\n      <\/div>\n    <\/div>`;\n  };\n\n  $('bfStage').innerHTML =\n    bar('单缓冲', singlePer, singleTotal, 'linear-gradient(90deg,#f5b97a,#d97706)') +\n    bar('双缓冲', doublePer, doubleTotal, 'linear-gradient(90deg,#5eead4,#0f766e)') +\n    `<div style=\"font-size:11.5px;color:#8b95a3;margin-top:4px\">横条长度按总时间等比绘制<\/div>`;\n\n  $('bfOut').innerHTML =\n    `<div class=\"res\">\n      <div class=\"r\"><span class=\"lbl\">单缓冲<\/span><span style=\"font-size:13px\">\n        每块耗时 = max(C, T) + M = max(${C}, ${T}) + ${M} = <b>${singlePer}<\/b> μs<br>\n        <span style=\"color:#8b95a3\">总计 ${n} × ${singlePer} = <b>${singleTotal}<\/b> μs<\/span><\/span><\/div>\n      <div class=\"r\" style=\"margin-top:6px\"><span class=\"lbl\">双缓冲<\/span><span style=\"font-size:13px\">\n        每块耗时 = max(C + M, T) = max(${C}+${M}, ${T}) = max(${C+M}, ${T}) = <b>${doublePer}<\/b> μs<br>\n        <span style=\"color:#8b95a3\">总计 ${n} × ${doublePer} = <b>${doubleTotal}<\/b> μs<\/span><\/span><\/div>\n      <div class=\"r\" style=\"margin-top:6px\"><span class=\"lbl\">提速<\/span><span class=\"val\">${speedup} ×<\/span><\/div>\n    <\/div>\n    <div class=\"tip e\" style=\"margin-top:10px\"><span class=\"ti\">公式怎么记<\/span><span>\n      <b>单缓冲：max(C, T) + M<\/b> —— 那个 M 加在 <b>max 外面<\/b>。<br>\n      <b>双缓冲：max(C + M, T)<\/b> —— M 和 C 一起放进 max <b>里面<\/b>。<br><br>\n      为什么？单缓冲只有一个缓冲区：设备往缓冲区写（T）和 CPU 处理（C）互相排斥，取较大者；但处理完还要把数据<b>搬到用户区（M）<\/b>，\n      这一步设备也闲着 —— 所以 M 是纯串行开销，加在外面。<br>\n      双缓冲有两个缓冲区：设备写 A 的同时 CPU 可以处理 B，而且处理完 B 后还能继续装下一块 —— 所以 M 和设备传输能重叠，放进里面。<br><br>\n      <b>这就是最容易记反的地方<\/b>，做题时先在纸上写下这两个式子再代数字。\n    <\/span><\/div>`;\n}\n$('bfT').oninput = renderBF;\n$('bfC').oninput = renderBF;\n$('bfM').oninput = renderBF;\n$('bfN').oninput = renderBF;\nrenderBF();\n<\/script>\n<script>\n/* 打包桥接：见 build_四门课合集.py 的说明 */\n(function(){\n  document.addEventListener(\"click\", function(e){\n    var a = e.target && e.target.closest ? e.target.closest(\"a[href]\") : null;\n    if(!a) return;\n    var href = a.getAttribute(\"href\") || \"\";\n    if(href.charAt(0) === \"#\"){\n      var t = document.getElementById(href.slice(1));\n      if(t){ e.preventDefault(); t.scrollIntoView({ block: \"start\" }); }\n      return;\n    }\n    if(!/\\.html$/i.test(href)) return;\n    e.preventDefault();\n    try { parent.postMessage({ __pack: \"goto\", page: href }, \"*\"); } catch(err){}\n  }, true);\n})();\n<\/script>\n<\/body>\n<\/html>\n",
  "数据结构-交互式全景.html": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>408 数据结构 · 交互式全景<\/title>\n<style>\n:root{\n  --bg:#f5f4fa; --panel:#fff; --text:#171a21; --muted:#6b7280; --line:#e5e3ef;\n  --primary:#7c3aed; --primary-l:#f3ecfe;\n  --accent:#d97706; --accent-l:#fff4e3;\n  --green:#15803d; --green-l:#e8f6ec;\n  --red:#dc2626; --red-l:#fdeceb;\n  --purple:#6d28d9; --purple-l:#f2ecfe;\n  --blue:#2563eb; --blue-l:#eaf0ff;\n  --cyan:#0891b2; --cyan-l:#e2f7fb;\n  --radius:12px;\n  --shadow:0 1px 2px rgba(16,24,40,.035),0 8px 22px -14px rgba(16,24,40,.15);\n}\n*{box-sizing:border-box}\nhtml{scroll-behavior:smooth}\nbody{\n  margin:0;background:var(--bg);color:var(--text);font-size:15px;line-height:1.8;\n  font-family:system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",\"PingFang SC\",sans-serif;\n  -webkit-font-smoothing:antialiased;\n}\n::-webkit-scrollbar{width:10px;height:10px}\n::-webkit-scrollbar-thumb{background:#d2cee0;border-radius:6px;border:2px solid var(--bg)}\n::-webkit-scrollbar-thumb:hover{background:#bab4cc}\n\n.progress{position:fixed;top:0;left:0;height:3px;width:0;z-index:99;\n  background:linear-gradient(90deg,var(--primary),var(--cyan));transition:width .1s linear}\n\n/* ---------- 布局 ---------- */\n.app{display:flex;align-items:flex-start}\n.sidebar{position:fixed;top:0;left:0;width:256px;height:100vh;background:var(--panel);\n  border-right:1px solid var(--line);padding:20px 14px;overflow-y:auto;z-index:50}\n.brand{padding:4px 10px 16px;border-bottom:1px dashed var(--line);margin-bottom:14px}\n.brand-t{font-size:15px;font-weight:800;letter-spacing:.2px}\n.brand-s{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.5}\n.nav{display:flex;flex-direction:column;gap:2px}\n.nav-sep{font-size:10.5px;font-weight:800;letter-spacing:1.2px;color:#bcb6cc;padding:12px 10px 5px}\n.speed{margin-top:20px;padding:13px 10px 2px;border-top:1px dashed var(--line)}\n.speed-t{font-size:10.5px;font-weight:800;letter-spacing:1.2px;color:#bcb6cc;margin-bottom:8px}\n.speed-b{display:flex;gap:5px}\n.speed-b button{flex:1;font-family:inherit;font-size:12px;font-weight:650;padding:6px 0;border-radius:7px;\n  border:1px solid var(--line);background:#fff;color:#6b6580;cursor:pointer;transition:.16s}\n.speed-b button:hover{border-color:var(--primary);color:var(--primary)}\n.speed-b button.on{background:var(--primary);border-color:var(--primary);color:#fff}\n.speed-note{font-size:10.5px;color:#bcb6cc;margin-top:7px;line-height:1.6}\n.nav-i{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;\n  text-decoration:none;color:#48435c;font-size:13px;transition:.18s;border-left:2px solid transparent}\n.nav-i b{font-size:11px;font-weight:700;color:#a49db8;font-variant-numeric:tabular-nums;min-width:16px}\n.nav-i:hover{background:#f4f2fa;color:var(--text)}\n.nav-i.on{background:var(--primary-l);color:var(--primary);font-weight:650;border-left-color:var(--primary)}\n.nav-i.on b{color:var(--primary)}\n.nav-tag{font-size:10px;padding:1px 5px;border-radius:4px;margin-left:auto;font-weight:600}\n.t3{background:var(--red-l);color:var(--red)}\n.t2{background:var(--accent-l);color:var(--accent)}\n.t1{background:#eeecf5;color:#7d7890}\n\n.content{margin-left:256px;flex:1;min-width:0;max-width:1100px;padding:0 34px 90px}\n/* ---------- 小屏：顶部条 + 抽屉式章节导航 ---------- */\n.mtop{display:none}\n.navbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;\n  width:38px;height:38px;flex-shrink:0;padding:0;border-radius:10px;cursor:pointer;\n  border:1px solid var(--line);background:#fff}\n.navbtn i{display:block;width:16px;height:2px;border-radius:2px;background:#5c5773;transition:.2s}\n.navbtn.on i:nth-child(1){transform:translateY(6px) rotate(45deg)}\n.navbtn.on i:nth-child(2){opacity:0}\n.navbtn.on i:nth-child(3){transform:translateY(-6px) rotate(-45deg)}\n.mtop-t{font-size:13.5px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.scrim{position:fixed;inset:0;z-index:70;background:rgba(18,23,33,.45);\n  opacity:0;pointer-events:none;transition:opacity .22s}\n\n@media(max-width:980px){\n  .mtop{display:flex;align-items:center;gap:11px;position:fixed;top:0;left:0;right:0;z-index:90;\n    height:56px;padding:0 14px;background:rgba(255,255,255,.94);\n    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);\n    border-bottom:1px solid var(--line);box-shadow:0 8px 20px -16px rgba(16,24,40,.6)}\n  .sidebar{top:56px;height:calc(100vh - 56px);transform:translateX(-100%);\n    transition:transform .22s ease;z-index:80;box-shadow:none}\n  .sidebar.open{transform:none;box-shadow:0 20px 60px -18px rgba(16,24,40,.5)}\n  .scrim.on{opacity:1;pointer-events:auto}\n  .content{margin-left:0;padding:58px 16px 60px}\n  .hero{padding-top:20px}\n}\n\n/* ---------- Hero ---------- */\n.hero{padding:58px 0 34px;border-bottom:1px solid var(--line);margin-bottom:44px}\n.hero-k{font-size:11.5px;letter-spacing:2.6px;color:var(--primary);font-weight:700;text-transform:uppercase}\n.hero h1{font-size:32px;margin:14px 0 12px;font-weight:800;letter-spacing:-.4px;line-height:1.32}\n.hero p{color:var(--muted);margin:0 0 28px;max-width:620px;font-size:14px;line-height:1.9}\n.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:660px}\n@media(max-width:820px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}\n.stat{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 16px;box-shadow:var(--shadow)}\n.stat b{display:block;font-size:21px;font-weight:800;color:var(--primary);font-variant-numeric:tabular-nums;line-height:1.35}\n.stat span{display:block;font-size:11px;color:var(--muted);line-height:1.45}\n\n/* ---------- 四门课地图 ---------- */\n.subj{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:24px 0 0}\n@media(max-width:980px){.subj{grid-template-columns n  font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}\n.step.act .n{background:var(--primary);color:#fff}\n.step.dn .n{background:var(--green);color:#fff}\n.step .t{font-size:13px;font-weight:700;margin-bottom:2px}\n.step .d{font-size:12px;color:#5c5773;font-family:\"Cascadia Mono\",Consolas,monospace;line-height:1.7}\n\n.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.8px;color:#5c5773;margin-top:12px}\n.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}\n\nfooter{margin-top:60px;padding-top:22px;border-top:1px solid var(--line);\n  font-size:12px;color:var(--muted);text-align:center;line-height:2}\n.totop{position:fixed;right:24px;bottom:24px;width:40px;height:40px;border-radius:50%;\n  background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;\n  display:flex;align-items:center;justify-content:center;color:#6b6580;font-size:15px;\n  opacity:0;pointer-events:none;transition:.25s;z-index:60}\n.totop.on{opacity:1;pointer-events:auto}\n.totop:hover{color:var(--primary);border-color:var(--primary)}\n/* ##CSS## */\n<\/style>\n<\/head>\n<body>\n<div class=\"progress\" id=\"progress\"><\/div>\n\n<div class=\"app\">\n<aside class=\"sidebar\">\n  <div class=\"brand\">\n    <div class=\"brand-t\">408 数据结构<\/div>\n    <div class=\"brand-s\">交互式原理全景 · 考点 / 原理 / 动画<\/div>\n  <\/div>\n  <nav class=\"nav\" id=\"nav\">\n    <div class=\"nav-sep\">408 全局<\/div>\n    <a href=\"#g0\" class=\"nav-i\"><b>00<\/b><span>四门课全景定位<\/span><em class=\"nav-tag t3\">先看<\/em><\/a>\n    <div class=\"nav-sep\">数据结构<\/div>\n    <a href=\"#d1\" class=\"nav-i\"><b>01<\/b><span>绪论与复杂度<\/span><em class=\"nav-tag t1\">低<\/em><\/a>\n    <a href=\"#d2\" class=\"nav-i\"><b>02<\/b><span>线性表<\/span><em class=\"nav-tag t2\">中<\/em><\/a>\n    <a href=\"#d3\" class=\"nav-i\"><b>03<\/b><span>栈、队列和数组<\/span><em class=\"nav-tag t2\">中<\/em><\/a>\n    <a href=\"#d4\ 全景.html\">\n      <div class=\"sj-n\">02<\/div>\n      <div class=\"sj-t\">计算机组成原理<\/div>\n      <div class=\"sj-s\">数据表示 / 存储 / 指令 / CPU<br>位图、队列、栈都源于此<\/div>\n      <div class=\"sj-bar\"><i style=\"width:100%\"><\/i><\/div>\n    <\/a>\n    <a class=\"sj mut\" href=\"操作系统-交互式全景.html\">\n      <div class=\"sj-n\">03<\/div>\n      <div class=\"sj-t\">操作系统<\/div>\n      <div class=\"sj-s\">进程 / 内存 / 文件 / I-O 管理<br>调度队列、目录树、位示图<\/div>\n      <div class=\"sj-bar\"><i style=\"width:78%\"><\/i><\/div>\n    <\/a>\n    <a class=\"sj mut\" href=\"计算机网络-交互式全景.html\">\n      <div class=\"sj-n\">04<\/div>\n      <div class=\"sj-t\">计算机网络<\/div>\n      <div class=\"sj-s\">体系结构 / TCP-IP / 应用层<br>路由表、拥塞窗口<\/div>\n      <div class=\"sj-bar\"><i style=\"width:56%\"><\/i><\/div>\n    <\/a>\n  <\/div>\n\n  <div class=\"rank\">\n    <div class=\"rank-h\">\n      <div class=\"rank-t\">各章分值权重与复习优先级<\/div>\n      <div class=\"rank-s\">按历年统考真题中的<b>大致分值降序<\/b>排列 —— 排在前面的章节，复习投入应当明显更多。分值区间为估计值，用于确定复习顺序，<b>非官方数据<\/b>。<\/div>\n    <\/div>\n\n    <div class=\"rank-r\"><div class=\"rank-n\">04 树与二叉树<\/div><div class=\"rank-bar\"><i data-w=\"100\" style=\"background:linear-gradient(90deg,#fca5a5,#dc2626)\"><\/i><\/div><div class=\"rank-v\">10-13<\/div><div class=\"rank-b tier1\">核心<\/div><\/div>\n    <div class=\"rank-r\"><div class=\"rank-n\">05 图<\/div><div class=\"rank-bar\"><i data-w=\"74\" style=\"background:linear-gradient(90deg,#fca5a5,#dc2626)\"><\/i><\/div><div class=\"rank-v\">7-10<\/div><div class=\"rank-b tier1\">核心<\/div><\/div>\n    <div class=\"rank-r\"><div class=\"rank-n\">07 排序<\/div><div class=\"rank-bar\"><i data-w=\"70\" style=\"background:linear-gradient(90deg,#fca5a5,#dc2626)\"><\/i><\/div><div class=\"rank-v\">7-9<\/div><div class=\"rank-b tier1\">核心<\/div><\/div>\n    <div class=\"rank-r\"><div class=\"rank-n\">06 查找<\/div><div class=\"rank-bar\"><i data-w=\"52\" style=\"background:linear-gradient(90deg,#c4b0f5,#7c3aed)\"><\/i><\/div><div class=\"rank-v\">5-7<\/div><div class=\"rank-b tier2\">主力<\/div><\/div>\n    <div class=\"rank-r\"><div class=\"rank-n\">02 线性表<\/div><div class=\"rank-bar\"><i data-w=\"43\" style=\"background:linear-gradient(90deg,#c4b0f5,#7c3aed)\"><\/i><\/div><div class=\"rank-v\">4-6<\/div><div class=\"rank-b tier2\">主力<\/div><\/div>\n    <div class=\"rank-r\"><div class=\"rank-n\">03 栈、队列和数组<\/div><div class=\"rank-bar\"><i data-w=\"43\" style=\"background:linear-gradient(90deg,#c4b0f5,#7c3aed)\"><\/i><\/div><div class=\"rank-v\">4-6<\/div><div class=\"rank-b tier2\">主力<\/div><\/div>\n    <div class=\"rank-r\"><div class=\"rank-n\">01 绪论与复杂度<\/div><div class=\"rank-bar\"><i data-w=\"22\" style=\"background:linear-gradient(90deg,#e0dcea,#bcb6cc)\"><\/i><\/div><div class=\"rank-v\">2-3<\/div><div class=\"rank-b tier3\">补充<\/div><\/div>\n\n    <div class=\"rank-sum\">\n      <div class=\"rank-legend\">\n        <span><i style=\"background:#dc2626\"><\/i>核心章（≥7 分）—— 必出大题，要反复练<\/span>\n        <span><i style=\"background:#7c3aed\"><\/i>主力章（4-6 分）—— 吃透考点，稳定拿分<\/span>\n        <span><i style=\"background:#bcb6cc\"><\/i>补充章（&lt;4 分）—— 单选为主，快速过<\/span>\n      <\/div>\n      <div class=\"rank-sum-r\"><div>核心 3 章<\/div><div class=\"rank-sum-bar\"><i data-w=\"60\" style=\"background:linear-gradient(90deg,#fca5a5,#dc2626)\"><\/i><\/div><div class=\"rank-sum-v\">60%<\/div><\/div>\n      <div class=\"rank-sum-r\"><div>主力 3 章<\/div><div class=\"rank-sum-bar\"><i data-w=\"35\" style=\"background:linear-gradient(90deg,#c4b0f5,#7c3aed)\"><\/i><\/div><div class=\"rank-sum-v\">35%<\/div><\/div>\n      <div class=\"rank-sum-r\"><div>补充 1 章<\/div><div class=\"rank-sum-bar\"><i data-w=\"5\" style=\"background:linear-gradient(90deg,#e0dcea,#bcb6cc)\"><\/i><\/div><div class=\"rank-sum-v\">5%<\/div><\/div>\n      <div class=\"rank-note\">\n        <b>怎么用这张表：<\/b>核心 3 章（树、图、排序）占了本科约 <b>60%<\/b> 的分值，而且这三章的大题形态非常固定 ——\n        树的遍历/性质计算、图的两种遍历与最短路径、排序的过程与复杂度对比，都是练熟就能拿满的题。<br>\n        <b>数据结构最大的特点是「能画出来」：<\/b>几乎所有考点都可以落成一张图。这一页每个结构都做了可操作的演示，\n        <b>建议先自己手推一遍，再用动画核对<\/b> —— 顺序反过来才有效。<br>\n        <b>与其它科目的联动：<\/b>树和图的算法是 OS 的基础（目录树、资源分配图），\n        排序与查找的效率分析是「算法复杂度」这条主线的延伸，会反复出现在计组和 OS 的性能计算里。\n      <\/div>\n    <\/div>\n  <\/div>\n<\/header>\n\n<\!-- ==================== 408 全局定位 ==================== -->\n<section class=\"sec\" id=\"g0\">\n  <div class=\"sec-head\">\n    <span class=\"sec-num\">SECTION 00<\/span>\n    <h2>四门课全景定位<\/h2>\n    <span class=\"weight w3\">先看这一节<\/span>\n  <\/div>\n\n  <div class=\"tip i\"><span class=\"ti\">为什么先看这个<\/span><span>数据结构是 408 里<b>最基础、也最「通用」<\/b>的一门——它提供的是思维工具，而不是某台具体机器的知识。你在这一科学会的队列、树、图、位图，会原样出现在 OS 的调度器里、计组的译码电路里、计网的路由算法里。<b>这一科学得扎实，另外三门都跟着轻松。<\/b><\/span><\/div>\n\n  <div class=\"sub\">数据结构在 408 里的位置<\/div>\n  <div class=\"grid g2\">\n    <div class=\"card\">\n      <h4>分值分布（共 150 分）<\/h4>\n      <table class=\"tb\">\n        <tr><th>科目<\/th><th>分值<\/th><th>占比<\/th><\/tr>\n        <tr><td><b>数据结构<\/b><\/td><td class=\"mono\"><b>45<\/b><\/td><td>30%<\/td><\/tr>\n        <tr><td>计算机组成原理<\/td><td class=\"mono\">45<\/td><td>30%<\/td><\/tr>\n        <tr><td>操作系统<\/td><td class=\"mono\">35<\/td><td>约 23%<\/td><\/tr>\n        <tr><td>计算机网络<\/td><td class=\"mono\">25<\/td><td>约 17%<\/td><\/tr>\n      <\/table>\n      <div class=\"fm\">数据结构与计组并列第一（各 45 分）\n但与计组不同：<b>数据结构的题几乎都能画出来<\/b>\n画得出来 = 能自己验证 = 不容易被忽悠<\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>本页的核心设计：每个结构都能动手<\/h4>\n      <p>与其他章节不同，数据结构最怕「看懂但不会做」。所以这一页的每个数据结构都配了<b>可操作的增删改查演示<\/b>：<\/p>\n      <table class=\"tb\">\n        <tr><th>你能做什么<\/th><th>你能看到什么<\/th><\/tr>\n        <tr><td>插入元素<\/td><td>元素怎么搬、指针怎么改、树怎么转<\/td><\/tr>\n        <tr><td>删除元素<\/td><td>被删节点怎么摘、前驱后继怎么接<\/td><\/tr>\n        <tr><td>查找元素<\/td><td>比较了几次、路径是什么<\/td><\/tr>\n        <tr><td>修改元素<\/td><td>定位过程 + 改动的局部影响<\/td><\/tr>\n      <\/table>\n      <div class=\"tip s\"><span class=\"ti\">怎么用<\/span><span><b>先自己在纸上推一遍，再用动画核对。<\/b>顺序反过来没效果 —— 看动画只能给你「原来是这样的」的错觉，手推才能暴露「我到底哪步不会」。<\/span><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"sub p\">跨科目接口图：数据结构与另外三门的连接点<\/div>\n  <div class=\"grid g2\">\n    <div class=\"xlink\">\n      <h4><span class=\"tagx\">数据结构 × 操作系统<\/span>交叉最多，OS 里到处是本页的结构<\/h4>\n      <div class=\"xitem\"><div class=\"xa\">队列 → 调度队列<\/div><div class=\"xb\">就绪队列、阻塞队列、多级反馈队列，本质都是本页第 3 章的队列<\/div><\/div>\n      <div class=\"xitem\"><div class=\"xa\">树 → 目录结构<\/div><div class=\"xb\">树形目录就是树；无环图目录是有向无环图；文件路径查找就是树的遍历<\/div><\/div>\n      <div class=\"xitem\"><div class=\"xa\">图 → 死锁检测<\/div><div class=\"xb\">资源分配图化简 = 图的消解遍历；判断环路用的是本页第 5 章的方法<\/div><\/div>\n      <div class=\"xitem\"><div class=\"xa\">位图 → 位示图<\/div><div class=\"xb\">空闲空间管理里的位示图，就是本页讲的位图；字号位号换算考过多次<\/div><\/div>\n      <div class=\"xitem\"><div class=\"xa\">栈 → 调用栈<\/div><div class=\"xb\">函数调用、中断嵌套、递归转非递归，全靠栈；这也是「栈」最实用的场景<\/div><\/div>\n      <div class=\"xitem\"><div class=\"xa\">链表 → LRU 实现<\/div><div class=\"xb\">页面置换的 LRU 要用链表或栈实现；空闲分区链、成组链接也是链表<\/div><\/div>\n    <\/div>\n    <div class=\"xlink\" style=\"border-left-color:var(--blue)\">\n      <h4><span class=\"tagx\" style=\"background:var(--blue-l);color:var(--blue)\">数据结构 × 计算机组成原理<\/span>底层的数据表示<\/h4>\n      <div class=\"xitem\"><div class=\"xa\">数组 → 地址计算<\/div><div class=\"xb\">二维数组的行优先/列优先存储，本质是「用下标算出地址」——这直接对应主存的按地址访问<\/div><\/div>\n      <div class=\"xitem\"><div class=\"xa\">位运算 → 校验码<\/div><div class=\"xb\">海明码、CRC 全靠位运算；位图、掩码、移位在计组里到处都是<\/div><\/div>\n      <div class=\"xitem\"><div class=\"xa\">队列 → I/O 缓冲<\/div><div class=\"xb\">缓冲池的空白缓冲队列、输入队列、输出队列都是队列结构<\/div><\/div>\n      <div class=\"xitem\"><div class=\"xa\">链表 vs 数组<\/div><div class=\"xb\">这个对比就是 OS 里「连续分配 vs 链接分配」的原型：随机访问 vs 插入删除效率<\/div><\/div>\n    <\/div>\n    <div class=\"xlink\" style=\"border-left-color:var(--cyan)\">\n      <h4><span class=\"tagx\" style=\"background:var(--cyan-l);color:#0b5d70\">数据结构 × 计算机网络<\/span>算法直接复用<\/h4>\n      <div class=\"xitem\"><div class=\"xa\">图 → 路由算法<\/div><div class=\"xb\">OSPF 用的 Dijkstra 最短路径算法，就是本页第 5 章讲的那个；生成树协议用最小生成树<\/div><\/div>\n
