s=\"stat\"><b>7<\/b><span>章节全覆盖<\/span><\/div>\n    <div class=\"stat\"><b>18<\/b><span>交互动画<\/span><\/div>\n    <div class=\"stat\"><b>100%<\/b><span>可离线打开<\/span><\/div>\n  <\/div>\n\n  <div class=\"subj\">\n    <a class=\"sj mut\" href=\"数据结构-交互式全景.html\">\n      <div class=\"sj-n\">01<\/div>\n      <div class=\"sj-t\">数据结构<\/div>\n      <div class=\"sj-s\">线性表 / 树 / 图 / 查找排序<br>计组的队列、栈、位图都源于此<\/div>\n      <div class=\"sj-bar\"><i style=\"width:100%\"><\/i><\/div>\n    <\/a>\n    <div class=\"sj cur\">\n      <div class=\"sj-n\">02<\/div>\n      <div class=\"sj-t\">计算机组成原理<\/div>\n      <div class=\"sj-s\">数据表示 / 存储 / 指令 / CPU<br>本页<\/div>\n      <div class=\"sj-bar\"><i style=\"width:100%\"><\/i><\/div>\n    <\/div>\n    <a class=\"sj mut\" href=\"操作系统-交互式全景.html\">\n      <div class=\"sj-n\">03<\/div>\n      <div class=\"sj-t\">操作系统<\/div>\n      <div class=\"sj-s\">进程 / 内存 / 文件 / I-O 管理<br>与计组交叉最深<\/div>\n      <div class=\"sj-bar\"><i style=\"width:78%\"><\/i><\/div>\n    <\/a>\n    <a class=\"sj mut\" href=\"计算机网络-交互式全景.html\">\n      <div class=\"sj-n\">04<\/div>\n      <div class=\"sj-t\">计算机网络<\/div>\n      <div class=\"sj-s\">体系结构 / TCP-IP / 应用层<br>计组是它最底层的硬件支撑<\/div>\n      <div class=\"sj-bar\"><i style=\"width:56%\"><\/i><\/div>\n    <\/a>\n  <\/div>\n\n  <div class=\"rank\">\n    <div class=\"rank-h\">\n      <div class=\"rank-t\">各章分值权重与复习优先级<\/div>\n      <div class=\"rank-s\">按历年统考真题中的<b>大致分值降序<\/b>排列 —— 排在前面的章节，复习投入应当明显更多。分值区间为估计值，用于确定复习顺序，<b>非官方数据<\/b>。<\/div>\n    <\/div>\n\n    <div class=\"rank-r\"><div class=\"rank-n\">03 存储系统<\/div><div class=\"rank-bar\"><i data-w=\"100\" style=\"background:linear-gradient(90deg,#fca5a5,#dc2626)\"><\/i><\/div><div class=\"rank-v\">11-14<\/div><div class=\"rank-b tier1\">核心<\/div><\/div>\n    <div class=\"rank-r\"><div class=\"rank-n\">05 中央处理器<\/div><div class=\"rank-bar\"><i data-w=\"100\" style=\"background:linear-gradient(90deg,#fca5a5,#dc2626)\"><\/i><\/div><div class=\"rank-v\">11-14<\/div><div class=\"rank-b tier1\">核心<\/div><\/div>\n    <div class=\"rank-r\"><div class=\"rank-n\">02 数据的表示和运算<\/div><div class=\"rank-bar\"><i data-w=\"68\" style=\"background:linear-gradient(90deg,#fca5a5,#dc2626)\"><\/i><\/div><div class=\"rank-v\">7-10<\/div><div class=\"rank-b tier1\">核心<\/div><\/div>\n    <div class=\"rank-r\"><div class=\"rank-n\">04 指令系统<\/div><div class=\"rank-bar\"><i data-w=\"40\" style=\"background:linear-gradient(90deg,#93c5fd,#2563eb)\"><\/i><\/div><div class=\"rank-v\">4-6<\/div><div class=\"rank-b tier2\">主力<\/div><\/div>\n    <div class=\"rank-r\"><div class=\"rank-n\">07 输入/输出系统<\/div><div class=\"rank-bar\"><i data-w=\"36\" style=\"background:linear-gradient(90deg,#93c5fd,#2563eb)\"><\/i><\/div><div class=\"rank-v\">3-6<\/div><div class=\"rank-b tier2\">主力<\/div><\/div>\n    <div class=\"rank-r\"><div class=\"rank-n\">01 计算机系统概述<\/div><div class=\"rank-bar\"><i data-w=\"22\" style=\"background:linear-gradient(90deg,#dde3ec,#b6c0cc)\"><\/i><\/div><div class=\"rank-v\">2-4<\/div><div class=\"rank-b tier3\">补充<\/div><\/div>\n    <div class=\"rank-r\"><div class=\"rank-n\">06 总线<\/div><div class=\"rank-bar\"><i data-w=\"20\" style=\"background:linear-gradient(90deg,#dde3ec,#b6c0cc)\"><\/i><\/div><div class=\"rank-v\">2-3<\/div><div class=\"rank-b tier3\">补充<\/div><\/div>\n\n    <div class=\"rank-sum\">\n      <div class=\"rank-legend\">\n        <span><i style=\"background:#dc2626\"><\/i>核心章（≥7 分）—— 必出大题，要反复练<\/span>\n        <span><i style=\"background:#2563eb\"><\/i>主力章（4-6 分）—— 吃透考点，稳定拿分<\/span>\n        <span><i style=\"background:#b6c0cc\"><\/i>补充章（&lt;4 分）—— 单选为主，快速过<\/span>\n      <\/div>\n      <div class=\"rank-sum-r\"><div>核心 3 章<\/div><div class=\"rank-sum-bar\"><i data-w=\"70\" style=\"background:linear-gradient(90deg,#fca5a5,#dc2626)\"><\/i><\/div><div class=\"rank-sum-v\">70%<\/div><\/div>\n      <div class=\"rank-sum-r\"><div>主力 2 章<\/div><div class=\"rank-sum-bar\"><i data-w=\"20\" style=\"background:linear-gradient(90deg,#93c5fd,#2563eb)\"><\/i><\/div><div class=\"rank-sum-v\">20%<\/div><\/div>\n      <div class=\"rank-sum-r\"><div>补充 2 章<\/div><div class=\"rank-sum-bar\"><i data-w=\"10\" style=\"background:linear-gradient(90deg,#dde3ec,#b6c0cc)\"><\/i><\/div><div class=\"rank-sum-v\">10%<\/div><\/div>\n      <div class=\"rank-note\">\n        <b>怎么用这张表：<\/b>核心 3 章占了本科约 <b>70%<\/b> 的分值，这三章要做到「看到题型就知道该套哪套算法」；主力 2 章稳定出题，考点吃透就能拿分；\n        补充 2 章基本只出单选，花半天过一遍概念即可，别在这里耗时间。<br>\n        <b>与其它科目的联动：<\/b>第 3 章（存储系统）与 OS 的「内存管理」、第 7 章（I/O）与 OS 的「I/O 管理」是两对孪生章节，\n        <b>建议同步学<\/b>，它们合起来是 80 分里的重头。\n      <\/div>\n    <\/div>\n  <\/div>\n<\/header>\n\n<\!-- ==================== 408 全局定位 ==================== -->\n<section class=\"sec\" id=\"g0\">\n  <div class=\"sec-head\">\n    <span class=\"sec-num\">SECTION 00<\/span>\n    <h2>四门课全景定位<\/h2>\n    <span class=\"weight w3\">先看这一节<\/span>\n  <\/div>\n\n  <div class=\"tip i\"><span class=\"ti\">为什么先看这个<\/span><span>408 的四门课不是四条平行线。命题人偏爱出的题，往往<b>落在两门课的交界处<\/b>——「虚拟地址怎么变成物理地址」既考计组的地址转换硬件也考 OS 的页表；「DMA 怎么搬数据」计组讲硬件发起、OS 讲软件层次。把交界处想明白，四门课才是通的。<\/span><\/div>\n\n  <div class=\"sub\">计组在 408 里的位置<\/div>\n  <div class=\"grid g2\">\n    <div class=\"card\">\n      <h4>分值分布（共 150 分）<\/h4>\n      <table class=\"tb\">\n        <tr><th>科目<\/th><th>分值<\/th><th>占比<\/th><\/tr>\n        <tr><td>数据结构<\/td><td class=\"mono\">45<\/td><td>30%<\/td><\/tr>\n        <tr><td><b>计算机组成原理<\/b><\/td><td class=\"mono\"><b>45<\/b><\/td><td>30%<\/td><\/tr>\n        <tr><td>操作系统<\/td><td class=\"mono\">35<\/td><td>约 23%<\/td><\/tr>\n        <tr><td>计算机网络<\/td><td class=\"mono\">25<\/td><td>约 17%<\/td><\/tr>\n      <\/table>\n      <div class=\"fm\">计组 + 操作系统 = 80 分，占 53%\n两门课共享「存储管理」与「I/O」两条主线\n<b>建议并行学<\/b>，不要学完一门再碰另一门<\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>计组内部结构（45 分怎么分布）<\/h4>\n      <table class=\"tb\">\n        <tr><th>章节<\/th><th>权重<\/th><th>典型题<\/th><\/tr>\n        <tr><td>存储系统<\/td><td>高<\/td><td>Cache 映射、地址划分、平均访问时间<\/td><\/tr>\n        <tr><td>中央处理器<\/td><td>高<\/td><td>数据通路、流水线、控制器与微程序<\/td><\/tr>\n        <tr><td>数据的表示和运算<\/td><td>高<\/td><td>IEEE 754、补码运算、溢出判断<\/td><\/tr>\n        <tr><td>指令系统<\/td><td>中<\/td><td>扩展操作码、寻址方式<\/td><\/tr>\n        <tr><td>输入/输出系统<\/td><td>中<\/td><td>中断流程、DMA 传送方式<\/td><\/tr>\n        <tr><td>系统概述 / 总线<\/td><td>低<\/td><td>概念辨析（单选为主）<\/td><\/tr>\n      <\/table>\n    <\/div>\n  <\/div>\n\n  <div class=\"sub p\">跨科目接口图：计组与另外三门的连接点<\/div>\n  <div class=\"grid g2\">\n    <div class=\"xlink\">\n      <h4><span class=\"tagx\">计组 × 操作系统<\/span>交叉最深，80 分里大半在这里<\/h4>\n      <div class=\"xitem\"><div class=\"xa\">虚拟存储<\/div><div class=\"xb\">计组讲地址转换硬件与 TLB，OS 讲页表由谁维护、缺页怎么处理<\/div><\/div>\n      <div class=\"xitem\"><div class=\"xa\">中断机制<\/div><div class=\"xb\">计组讲中断响应与隐指令（关中断/保存断点/取入口），OS 讲中断处理程序里做什么<\/div><\/div>\n      <div class=\"xitem\"><div class=\"xa\">I/O 方式<\/div><div class=\"xb\">程序查询 / 中断 / DMA / 通道 —— 计组讲硬件原理，OS 讲软件层次与设备管理<\/div><\/div>\n      <div class=\"xitem\"><div class=\"xa\">进程上下文<\/div><div class=\"xb\">进程切换要保存的 PC、PSW、通用寄存器，正是本页第 5 章讲的那些 CPU 内部寄存器<\/div><\/div>\n      <div class=\"xitem\"><div class=\"xa\">存储层次<\/div><div class=\"xb\">寄存器—Cache—主存—辅存：计组管上两层（硬件自动），OS 管下两层（软件调度）<\/div><\/div>\n      <div class=\"xitem\"><div class=\"xa\">磁盘与 RAID<\/div><div class=\"xb\">计组讲磁盘结构、存取时间与 RAID 等级，OS 讲磁盘调度算法<\/div><\/div>\n    <\/div>\n    <div class=\"xlink\" style=\"border-left-color:var(--accent)\">\n      <h4><span class=\"tagx\" style=\"background:var(--accent-l);color:#8a5209\">计组 × 数据结构<\/span>算法与结构的直接来源<\/h4>\n      <div class=\"xitem\"><div class=\"xa\">指令流水线<\/div><div class=\"xb\">时空图的分析方法与任务调度模型同构；流水线的「吞吐率/加速比」也是效率分析的通用工具<\/div><\/div>\n      <div class=\"xitem\"><div class=\"xa\">Cache 替换<\/div><div class=\"xb\">LRU 要用栈或链表实现，LFU 要用计数表 —— 都在数据结构里学过<\/div><\/div>\n      <div class=\"xitem\"><div class=\"xa\">存储器扩展<\/div><div class=\"xb\">片选译码本质是地址空间的分段映射<\/div><\/div>\n      <div class=\"xitem\"><div class=\"xa\">海明码 / CRC<\/div><div class=\"xb\">模 2 除法与生成多项式，是位运算的直接应用<\/div><\/div>\n    <\/div>\n    <div class=\"xlink\" style=\"border-left-color:var(--cyan)\">\n      <h4><span class=\"tagx\" style=\"background:var(--cyan-l);color:#0b5d70\">计组 × 计算机网络<\/span>它是计网最底层的硬件支撑<\/h4>\n      <div class=\"xitem\"><div class=\"xa\">网卡与 DMA<\/div><div class=\"xb\">网卡收包靠 DMA 把数据搬进内存，再发中断通知 CPU —— 计网的高性能收包就建立在这套机制上<\/div><\/div>\n      <div class=\"xitem\"><div class=\"xa\">数据校验<\/div><div class=\"xb\">CRC 循环冗余校验，计组讲它怎么算，计网讲它怎么用在帧校验里<\/div><\/div>\n      <div class=\"xitem\"><div class=\"xa\">字节序<\/div><div class=\"xb\">大小端问题在计组第 2 章出现，在计网的协议字段里会再次遇到<\/div><\/div>\n    <\/div>\n    <div class=\"xlink\" style=\"border-left-color:#0f9d6e\">\n      <h4><span class=\"tagx\" style=\"background:#e5f7f0;color:#0a6b4a\">复习路线建议<\/span><\/h4>\n      <div class=\"xitem\"><div class=\"xa\">先修<\/div><div class=\"xb\">第 1 章系统概述快速过（2-4 分），重点记性能指标与单位换算<\/div><\/div>\n      <div class=\"xitem\"><div class=\"xa\">攻坚顺序<\/div><div class=\"xb\">第 3 章存储系统 → 第 5 章 CPU → 第 2 章数据表示，这三章占了大半分值<\/div><\/div>\n      <div class=\"xitem\"><div class=\"xa\">并行推进<\/div><div class=\"xb\">第 3 章与 OS 的「内存管理」同步学；第 7 章与 OS 的「I/O 管理」同步学<\/div><\/div>\n      <div class=\"xitem\"><div class=\"xa\">大题分布<\/div><div class=\"xb\">常见形态：Cache 地址划分 + 命中率 + 平均访问时间；或数据通路的微操作序列<\/div><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"sub\">学这一页之前，你需要先知道<\/div>\n  <div class=\"grid g3\">\n    <div class=\"card\">\n      <h4>二进制与补码<\/h4>\n      <p>整个计组建立在二进制之上。第 2 章会把补码、IEEE 754 讲透，但如果对这些还生疏，先过一遍再往下走。<\/p>\n    <\/div>\n    <div class=\"card\">\n      <h4>冯·诺依曼结构<\/h4>\n      <p>「存储程序」这个前提贯穿全书：指令和数据同存主存，CPU 按地址自动取指执行。第 1 章会展开。<\/p>\n    <\/div>\n    <div class=\"card\">\n      <h4>它和 OS 的分工<\/h4>\n      <p>计组回答「硬件<b>怎么做到<\/b>」，OS 回答「软件<b>怎么管<\/b>」。同一个机制从两个角度看，是这两门课的常态。<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- ==================== 第 1 章 ==================== -->\n<section class=\"sec\" id=\"ch1\">\n  <div class=\"sec-head\">\n    <span class=\"sec-num\">CHAPTER 01<\/span>\n    <h2>计算机系统概述<\/h2>\n    <span class=\"weight w1\">低频 · 2-4 分<\/span>\n  <\/div>\n\n  <div class=\"tip i\"><span class=\"ti\">本章定位<\/span><span>纯记忆型章节，几乎没有大题。集中考 2-3 道单选：冯诺依曼结构特征、性能指标计算（CPI / MIPS / CPU 时间）、存储容量与带宽的单位换算。花半天过一遍就够，别在这章耗时间。<\/span><\/div>\n\n  <div class=\"sub\">考点清单<\/div>\n  <div class=\"grid g2\">\n    <div class=\"card\">\n      <h4>1. 冯·诺依曼结构 <span class=\"pt\">必考<\/span><\/h4>\n      <ul>\n        <li>五大部件：<span class=\"key\">运算器、控制器、存储器、输入设备、输出设备<\/span><\/li>\n        <li>核心思想：<span class=\"key\">存储程序<\/span>——程序和数据一样，先存入主存，再按地址顺序自动取出执行<\/li>\n        <li>指令和数据<span class=\"key\">都以二进制形式存放<\/span>，形式上无差别，靠执行阶段区分<\/li>\n        <li>指令 = 操作码 + 地址码<\/li>\n        <li>以运算器为中心 → 现代计算机改为<span class=\"key\">以存储器为中心<\/span>，且 CPU 与主存间加了 Cache<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <h4>2. CPU = 运算器 + 控制器 <span class=\"pt\">必考<\/span><\/h4>\n      <table class=\"tb\">\n        <tr><th>部件<\/th><th>组成<\/th><th>职责<\/th><\/tr>\n        <tr><td>运算器<\/td><td><b>ALU<\/b> + ACC / MQ / X + PSW<\/td><td>数据加工：算术运算、逻辑运算<\/td><\/tr>\n        <tr><td>控制器<\/td><td><b>PC<\/b> + <b>IR<\/b> + <b>CU<\/b><\/td><td>指挥：取指令 → 分析指令 → 执行指令<\/td><\/tr>\n      <\/table>\n      <ul>\n        <li>ACC 累加器（存操作数/结果）、MQ 乘商寄存器（乘除专用）、X 通用操作数寄存器——<span class=\"key\">前三个必须具备<\/span><\/li>\n        <li>PSW 标志寄存器：存放运算结果特征（ZF 零 / CF 进位 / OF 溢出 / SF 符号），条件转移要用它<\/li>\n        <li><b>PC<\/b>：存<b>下一条<\/b>指令的地址，可自动 +1；与主存的 MAR 之间有一条直接通路<\/li>\n        <li><b>IR<\/b>：存<b>当前<\/b>指令，内容来自 MDR；操作码送 CU 分析，地址码送 MAR<\/li>\n        <li>辨析（高频）：<span class=\"key\">PC、IR 属于控制器；ACC、MQ、X、PSW 属于运算器<\/span>；MAR、MDR 现代机器也集成在 CPU 内，<span class=\"key\">对用户透明<\/span><\/li>\n      <\/ul>\n      <div class=\"tip m\"><span class=\"ti\">口径<\/span><span>第一章只要求 <b>PC / IR / CU<\/b> 三件；第 5 章会把 CU 展开为「指令译码器 + 时序系统 + 微操作信号发生器」。两种说法都对——问「谁属于控制器」答 PC、IR、CU，问「控制器内部结构」再展开。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>3. 层次结构<\/h4>\n      <ul>\n        <li>硬件层 → 系统软件层 → 应用软件层<\/li>\n        <li>系统软件：OS、编译程序、数据库管理系统（DBMS）<\/li>\n        <li>数据库管理系统属于<span class=\"key\">系统软件<\/span>，不是应用软件（爱考）<\/li>\n        <li>各层之间的界面由<span class=\"key\">指令系统（ISA）<\/span>连接：硬件与软件的分界面<\/li>\n        <li>ISA 是软硬件接口，属于<span class=\"key\">软件可见<\/span>的部分<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <h4>4. 性能指标 <span class=\"pt\">计算<\/span><\/h4>\n      <div class=\"fm\">CPU 时间 = 指令条数 × CPI × 时钟周期\n         = 指令条数 × CPI ÷ 主频<\/div>\n      <div class=\"fm\">MIPS = 主频 ÷ (CPI × 10⁶)\n     = 指令条数 ÷ (执行时间 × 10⁶)<\/div>\n      <ul>\n        <li>CPI = 程序总时钟周期数 ÷ 指令条数<\/li>\n        <li>主频 f = 1 / 时钟周期 T<\/li>\n        <li>CPU 时间 = 用户 CPU 时间 + 系统 CPU 时间<\/li>\n        <li><span class=\"key\">MIPS 不能跨指令系统比较<\/span>（不同 ISA 一条指令干的活不同）<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <h4>5. 易混单位换算 <span class=\"pt\">坑点<\/span><\/h4>\n      <table class=\"tb\">\n        <tr><th>量<\/th><th>进制<\/th><th>示例<\/th><\/tr>\n        <tr><td>存储容量<\/td><td class=\"mono\">2¹⁰<\/td><td class=\"mono\">1 KB = 1024 B<\/td><\/tr>\n        <tr><td>速率 / 带宽<\/td><td class=\"mono\">10³<\/td><td class=\"mono\">1 KB/s = 1000 B/s<\/td><\/tr>\n        <tr><td>频率<\/td><td class=\"mono\">10³<\/td><td class=\"mono\">1 GHz = 10⁹ Hz<\/td><\/tr>\n      <\/table>\n      <div class=\"tip e\"><span class=\"ti\">易错<\/span><span>容量用 2 的幂，传输速率用 10 的幂，二者混考是常见失分点。<\/span><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"sub a\">原理动画<\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 01 · 冯·诺依曼结构：一条指令的完整旅程<span class=\"tag\">点击部件看职责<\/span><\/div>\n    <div class=\"demo-b\">\n      <svg id=\"vnSvg\" viewBox=\"0 0 880 388\" style=\"width:100%;max-width:700px;height:auto;display:block;margin:0 auto\">\n        <defs>\n          <marker id=\"ah\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"3\" orient=\"auto\">\n            <path d=\"M0,0 L7,3 L0,6 z\" fill=\"#94a3b8\"/>\n          <\/marker>\n        <\/defs>\n\n        <\!-- ===== CPU 大框，把控制器与运算器包在一起 ===== -->\n        <rect x=\"70\" y=\"22\" width=\"740\" height=\"122\" rx=\"16\" fill=\"#f8fafc\" stroke=\"#cbd5e1\" stroke-width=\"1.6\" stroke-dasharray=\"7 5\"/>\n        <text x=\"90\" y=\"44\" font-size=\"11.5\" font-weight=\"800\" fill=\"#a9b3c0\" letter-spacing=\"1.4\">CPU 中央处理器<\/text>\n\n        <\!-- 控制器 -->\n        <g class=\"vnbox\" data-k=\"cu\" style=\"cursor:pointer\">\n          <rect x=\"180\" y=\"56\" width=\"220\" height=\"70\" rx=\"12\" fill=\"#e5f7f0\" stroke=\"#0f9d6e\" stroke-width=\"2\"/>\n          <text x=\"290\" y=\"86\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#0a6b4a\">控制器<\/text>\n          <text x=\"290\" y=\"108\" text-anchor=\"middle\" font-size=\"11\" fill=\"#3f9d7c\">取指 · 译码 · 发控制信号<\/text>\n        <\/g>\n        <\!-- 控制信号箭头 -->\n        <line x1=\"404\" y1=\"91\" x2=\"474\" y2=\"91\" stroke=\"#94a3b8\" stroke-width=\"1.8\" marker-end=\"url(#ah)\"/>\n        <\!-- 运算器 -->\n        <g class=\"vnbox\" data-k=\"alu\" style=\"cursor:pointer\">\n          <rect x=\"480\" y=\"56\" width=\"220\" height=\"70\" rx=\"12\" fill=\"#fff4e3\" stroke=\"#d97706\" stroke-width=\"2\"/>\n          <text x=\"590\" y=\"86\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#9a5b06\">运算器<\/text>\n          <text x=\"590\" y=\"108\" text-anchor=\"middle\" font-size=\"11\" fill=\"#c08a3a\">ALU · 算术与逻辑运算<\/text>\n        <\/g>\n\n        <\!-- ===== 系统总线 ===== -->\n        <line x1=\"70\" y1=\"222\" x2=\"810\" y2=\"222\" stroke=\"#cbd5e1\" stroke-width=\"3\"/>\n        <text x=\"578\" y=\"212\" text-anchor=\"middle\" font-size=\"11\" fill=\"#a9b3c0\">系统总线（数据 / 地址 / 控制）<\/text>\n\n        <\!-- 部件与总线的连线（五条竖线互不重合） -->\n        <line x1=\"290\" y1=\"126\" x2=\"290\" y2=\"222\" stroke=\"#0f9d6e\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\"/>\n        <line x1=\"590\" y1=\"126\" x2=\"590\" y2=\"222\" stroke=\"#d97706\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\"/>\n        <line x1=\"160\" y1=\"222\" x2=\"160\" y2=\"292\" stroke=\"#0891b2\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\"/>\n        <line x1=\"440\" y1=\"222\" x2=\"440\" y2=\"292\" stroke=\"#2563eb\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\"/>\n        <line x1=\"720\" y1=\"222\" x2=\"720\" y2=\"292\" stroke=\"#7c3aed\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\"/>\n\n        <\!-- 数据流动点：每个球都带跟随标签，方向 = 先送地址（去）再取回内容（回） -->\n        <g opacity=\".95\">\n          <circle r=\"6.5\" fill=\"#2563eb\"/>\n          <text x=\"10\" y=\"-8\" font-size=\"10.5\" font-weight=\"800\" fill=\"#2563eb\">指令<\/text>\n          <animateMotion dur=\"6s\" repeatCount=\"indefinite\"\n            path=\"M290,126 L290,222 L440,222 L440,296 L440,222 L290,222 L290,126\"/>\n        <\/g>\n        <g opacity=\".9\">\n          <circle r=\"6\" fill=\"#d97706\"/>\n          <text x=\"10\" y=\"-8\" font-size=\"10.5\" font-weight=\"800\" fill=\"#d97706\">数据<\/text>\n          <animateMotion dur=\"6s\" begin=\"3s\" repeatCount=\"indefinite\"\n            path=\"M590,126 L590,222 L440,222 L440,296 L440,222 L590,222 L590,126\"/>\n        <\/g>\n\n        <\!-- ===== 下排：输入 / 存储 / 输出，与上方对齐 ===== -->\n        <g class=\"vnbox\" data-k=\"in\" style=\"cursor:pointer\">\n          <rect x=\"70\" y=\"292\" width=\"180\" height=\"76\" rx=\"12\" fill=\"#e2f7fb\" stroke=\"#0891b2\" stroke-width=\"2\"/>\n          <text x=\"160\" y=\"324\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"800\" fill=\"#0b5d70\">输入设备<\/text>\n          <text x=\"160\" y=\"346\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#4aa6bb\">键盘 · 鼠标 · 扫描仪<\/text>\n        <\/g>\n        <g class=\"vnbox\" data-k=\"mem\" style=\"cursor:pointer\">\n          <rect x=\"330\" y=\"292\" width=\"220\" height=\"76\" rx=\"12\" fill=\"#eaf0ff\" stroke=\"#2563eb\" stroke-width=\"2\"/>\n          <text x=\"440\" y=\"324\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#1e40af\">存储器<\/text>\n          <text x=\"440\" y=\"346\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#5b7fc7\">存放指令 + 数据（按地址存取）<\/text>\n        <\/g>\n        <g class=\"vnbox\" data-k=\"out\" style=\"cursor:pointer\">\n          <rect x=\"630\" y=\"292\" width=\"180\" height=\"76\" rx=\"12\" fill=\"#f2ecfe\" stroke=\"#7c3aed\" stroke-width=\"2\"/>\n          <text x=\"720\" y=\"324\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"800\" fill=\"#5b21b6\">输出设备<\/text>\n          <text x=\"720\" y=\"346\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#8b6bd0\">显示器 · 打印机<\/text>\n        <\/g>\n      <\/svg>\n\n      <div class=\"res\" id=\"vnRes\" style=\"margin-top:14px\">\n        <div class=\"r\"><span class=\"lbl\">点一下<\/span><span class=\"val\">上面图里的任意部件<\/span><\/div>\n        <div class=\"r\" style=\"color:#5c6779\"><span class=\"lbl\">说明<\/span>五个部件各司其职。点一下看它具体负责什么。<\/div>\n      <\/div>\n\n      <\!-- 图例：把两个球的含义标出来 -->\n      <div style=\"display:grid;gap:9px;margin-top:16px;padding:13px 15px;background:#f7f9fc;border:1px solid var(--line);border-radius:10px\">\n        <div style=\"font-size:12.3px;display:flex;align-items:flex-start;gap:9px\">\n          <span style=\"width:12px;height:12px;border-radius:50%;background:#2563eb;flex-shrink:0;margin-top:5px\"><\/span>\n          <span><b style=\"color:#2563eb\">蓝球 · 指令流<\/b>　控制器把<b>地址<\/b>送上总线到存储器 → 存储器按这个地址把<b>指令<\/b>送回来。\n            <span style=\"color:#8b95a3\">（这一步叫「取指」）<\/span><\/span>\n        <\/div>\n        <div style=\"font-size:12.3px;display:flex;align-items:flex-start;gap:9px\">\n          <span style=\"width:12px;height:12px;border-radius:50%;background:#d97706;flex-shrink:0;margin-top:5px\"><\/span>\n          <span><b style=\"color:#d97706\">橙球 · 数据流<\/b>　运算器把<b>地址<\/b>送上总线到存储器 → 存储器把<b>操作数<\/b>送回来；算完之后，结果再沿原路写回去。\n            <span style=\"color:#8b95a3\">（这一步叫「取数」与「写回」）<\/span><\/span>\n        <\/div>\n        <div style=\"font-size:12.3px;display:flex;align-items:flex-start;gap:9px\">\n          <span style=\"width:22px;height:0;border-top:2px dashed #cbd5e1;flex-shrink:0;margin-top:9px\"><\/span>\n          <span><b style=\"color:#8b95a3\">灰色虚线<\/b>　每个部件都挂在这同一条<b>系统总线<\/b>上 —— 同一时刻只允许一个部件往上送数据。<\/span>\n        <\/div>\n      <\/div>\n\n      <div class=\"tip s\" style=\"margin-top:12px\"><span class=\"ti\">关键<\/span><span>\n        盯住两个球看：它们<b>走的是同一条总线、访问的是同一个存储器<\/b>。\n        这不是画得偷懒，而是冯·诺依曼结构最核心的一点 ——\n        <b>指令和数据在硬件层面没有任何区别<\/b>，都是二进制、都存在主存里、都靠地址来定位。\n        CPU 之所以分得清谁是「指令」谁是「数据」，只是因为它在不同的时机、按不同的用途去取罢了。\n      <\/span><\/div>\n\n      <div style=\"font-size:13px;font-weight:750;margin:20px 0 10px;display:flex;align-items:center;gap:9px;flex-wrap:wrap\">\n        <span style=\"width:4px;height:16px;border-radius:2px;background:var(--accent)\"><\/span>\n        一条指令的完整旅程\n        <span style=\"font-size:11.5px;font-weight:500;color:#8b95a3\">跟着走一遍，整个架构就通了<\/span>\n        <button class=\"btn gh sm\" id=\"vnPlay\" style=\"margin-left:auto\">播放<\/button>\n        <button class=\"btn gy sm\" id=\"vnReset\">重置<\/button>\n      <\/div>\n      <div class=\"steps\" id=\"vnSteps\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"sub a\">自测速答<\/div>\n  <div class=\"grid g2\">\n    <div class=\"card\">\n      <h4>Q1 · 判断<\/h4>\n      <p>CPU 可以直接访问硬盘上保存的指令。<\/p>\n      <div class=\"tip s\"><span class=\"ti\">答<\/span><span>错。CPU 只能直接访问<span class=\"key\">主存和寄存器<\/span>，外存必须通过 I/O 先调入主存。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>Q2 · 计算<\/h4>\n      <p>主频 2 GHz，程序共 10⁸ 条指令，平均 CPI = 2.5，求 CPU 时间与 MIPS。<\/p>\n      <div class=\"tip s\"><span class=\"ti\">答<\/span><span>CPU 时间 = 10⁸ × 2.5 ÷ 2×10⁹ = <span class=\"key\">0.125 s<\/span>；MIPS = 2000 ÷ 2.5 = <span class=\"key\">800<\/span>。<\/span><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- ==================== 第 2 章 ==================== -->\n<section class=\"sec\" id=\"ch2\">\n  <div class=\"sec-head\">\n    <span class=\"sec-num\">CHAPTER 02<\/span>\n    <h2>数据的表示和运算<\/h2>\n    <span class=\"weight w3\">高频 · 8-11 分<\/span>\n  <\/div>\n\n  <div class=\"tip i\"><span class=\"ti\">本章定位<\/span><span>「必考 + 易错」双标签。单选里补码、移码、溢出判断、海明码各占 1 题；大题常和第三章合考（如给出浮点格式求表示范围、手算浮点加减步骤）。核心心法：<span class=\"key\">把每个二进制位当成有地址的格子<\/span>，所有公式都从「位数」推出来，别死背。<\/span><\/div>\n\n  <div class=\"tip i\"><span class=\"ti\">跨科目<\/span><span>本章的<b>海明码与 CRC<\/b> 在计网的帧校验里会再遇到；<b>大小端<\/b>问题在协议字段解析时也会用到。而位运算本身是数据结构里<b>位图、哈希<\/b>的基础。至于补码与浮点 —— 它们是后面所有章节的算术基础，这章不牢，存储和 CPU 都没法算。<\/span><\/div>\n\n  <div class=\"sub\">考点清单<\/div>\n  <div class=\"grid g2\">\n    <div class=\"card\">\n      <h4>1. 四种机器数 <span class=\"pt\">必考<\/span><\/h4>\n      <table class=\"tb\">\n        <tr><th>编码<\/th><th>正数<\/th><th>负数<\/th><\/tr>\n        <tr><td>原码<\/td><td>符号 0 + 数值<\/td><td>符号 1 + 数值<\/td><\/tr>\n        <tr><td>反码<\/td><td>同原码<\/td><td>数值位取反<\/td><\/tr>\n        <tr><td>补码<\/td><td>同原码<\/td><td>反码 + 1<\/td><\/tr>\n        <tr><td>移码<\/td><td colspan=\"2\">补码的符号位取反<\/td><\/tr>\n      <\/table>\n      <div class=\"fm\">n 位补码范围：−2⁽ⁿ⁻¹⁾ ～ 2⁽ⁿ⁻¹⁾−1\n3 位补码：  100 ~ 011  (−4 ~ +3)<\/div>\n      <ul>\n        <li>原码、反码的 0 <span class=\"key\">有两种表示<\/span>（±0）；补码、移码的 0 唯一<\/li>\n        <li>移码只用于<span class=\"key\">浮点数的阶码<\/span>，好处是能直接按无符号数比较大小<\/li>\n        <li>负数补码 → 原码：<span class=\"key\">符号位不动，其余取反加 1<\/span>（和原码转补码同一套操作，可逆）<\/li>\n        <li>补码比原码多表示一个负数：−2⁽ⁿ⁻¹⁾<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <h4>2. 八/十六进制速记<\/h4>\n      <ul>\n        <li>1 位十六进制 = <span class=\"key\">4 位<\/span>二进制；1 位八进制 = <span class=\"key\">3 位<\/span>二进制<\/li>\n        <li>十六进制转二进制直接查表，不用过十进制<\/li>\n        <li>十进制小数转二进制：<span class=\"key\">乘 2 取整，正向排<\/span><\/li>\n        <li>0.375 = 0.011B（0.375×2=0.75→0，0.75×2=1.5→1，0.5×2=1→1）<\/li>\n      <\/ul>\n      <div class=\"fm\">A₍₁₆₎ = 1010    F₍₁₆₎ = 1111\n7₍₈₎ = 111       5₍₈₎ = 101<\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>3. 移位运算<\/h4>\n      <ul>\n        <li>算术左移 = ×2，右移 = ÷2（符号位不参与移动）<\/li>\n        <li>逻辑移位：<span class=\"key\">无符号数<\/span>，空位一律补 0<\/li>\n        <li>循环移位：带进位 CF 或不带进位<\/li>\n        <li>左移可能<span class=\"key\">溢出<\/span>（符号位变化即溢出）；右移是舍去低位，可能损失精度<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <h4>4. 加减运算与溢出 <span class=\"pt\">必考<\/span><\/h4>\n      <div class=\"fm\">对补码：A − B = A + (−B)₍补₎\n−B 的补码 = B 连同符号位一起取反加 1<\/div>\n      <ul>\n        <li>单符号位判溢出：<span class=\"key\">最高位进位 ⊕ 次高位进位 = 1 则溢出<\/span><\/li>\n        <li>双符号位（变形补码）：结果为 <span class=\"mono\">01<\/span> 正溢，<span class=\"mono\">10<\/span> 负溢，<span class=\"mono\">00 / 11<\/span> 正常<\/li>\n        <li>双符号位判溢时<span class=\"key\">高符号位才是真正的符号<\/span><\/li>\n        <li>只有<span class=\"key\">同号相加<\/span>或异号相减才可能溢出；异号相加绝不溢出<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <h4>5. IEEE 754 浮点 <span class=\"pt\">重难点<\/span><\/h4>\n      <div class=\"fm\">单精度 (32 位)：1 阶符 + 8 阶码 + 23 尾数\n  偏置值 127，真值 = (−1)ˢ × 1.M × 2^(E−127)\n双精度 (64 位)：1 + 11（偏置 1023）+ 52<\/div>\n      <ul>\n        <li>规格化尾数<span class=\"key\">隐含最高位 1<\/span>，所以尾数实际精度是 24 位（23 存 + 1 隐藏）<\/li>\n        <li>阶码全 0：非规格化数（尾数不隐含 1）；阶码全 1：∞（尾数 0）或 NaN（尾数非 0）<\/li>\n        <li>单精度规格化数阶码 E 范围 1～254，对应真指数 −126～+127<\/li>\n        <li>规格化数最小绝对值 2⁻¹²⁶，最大 2¹²⁸×(1−2⁻²⁴)<\/li>\n        <li>IEEE 754 <span class=\"key\">尾数用原码表示<\/span>，阶码用移码（偏置形式）表示<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <h4>6. 浮点加减五步 <span class=\"pt\">必背<\/span><\/h4>\n      <div class=\"fm\">① 对阶：小阶向大阶看齐（尾数右移，阶差几位移几位）\n② 尾数求和（用补码或原码加减）\n③ 规格化：左规 / 右规\n④ 舍入：就近舍入(默认) / 朝零 / 朝 +∞ / 朝 −∞\n⑤ 溢出判断：看阶码是否溢出（尾数溢出可用右规修正）<\/div>\n      <div class=\"tip e\"><span class=\"ti\">易错<\/span><span><span class=\"key\">对阶一定用小阶向大阶看齐<\/span>。反了会丢掉高位有效数字。判溢出只看<span class=\"key\">阶码<\/span>，尾数溢出不算真溢出。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>7. 校验码<\/h4>\n      <ul>\n        <li>奇偶校验：<span class=\"key\">只能检 1 位错，不能纠错<\/span>，且检不出偶数个错误<\/li>\n        <li>海明码：<span class=\"key\">2ᵏ ≥ n + k + 1<\/span>，能检 2 位错、纠 1 位错<\/li>\n        <li>海明码校验位放在 <span class=\"mono\">2⁰,2¹,2²…<\/span> 位置（1,2,4,8…），参与「位号二进制含该位」的所有分组的异或<\/li>\n        <li>CRC 循环冗余校验：模 2 除法求余数，余数作为校验码<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <h4>8. 大小端与对齐<\/h4>\n      <ul>\n        <li>大端（Big-Endian）：<span class=\"key\">低地址放高字节<\/span>；小端相反（x86 是小端）<\/li>\n        <li>边界对齐：int（4B）起始地址必须是 4 的倍数，不足则填充<\/li>\n        <li>对齐会<span class=\"key\">浪费空间但提高访存效率<\/span>；不对齐需多次访存拼接<\/li>\n        <li>C 语言中 int 一般 4B、short 2B、char 1B、long 依平台（64 位 Linux 为 8B）<\/li>\n      <\/ul>\n    <\/div>\n  <\/div>\n\n  <div class=\"sub a\">原理动画<\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 02 · 四种机器数联动：真值 ⇄ 原码 / 反码 / 补码 / 移码<span class=\"tag\">输入真值即变<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>真值（−128 ~ 127）<\/label>\n        <input type=\"number\" id=\"codeIn\" value=\"-45\" min=\"-128\" max=\"127\">\n        <button class=\"btn gh sm\" data-code=\"-45\">−45<\/button>\n        <button class=\"btn gh sm\" data-code=\"-1\">−1<\/button>\n        <button class=\"btn gh sm\" data-code=\"127\">+127<\/button>\n        <button class=\"btn gh sm\" data-code=\"-128\">−128<\/button>\n      <\/div>\n      <div id=\"codeOut\"><\/div>\n      <div class=\"legend\">\n        <span><i style=\"background:#fdeceb;border:1px solid #f5c2c0\"><\/i>符号位<\/span>\n        <span><i style=\"background:#eaf0ff;border:1px solid #c3d5fb\"><\/i>数值位<\/span>\n        <span><i class=\"bit on\" style=\"width:10px;height:10px\"><\/i>当前为 1<\/span>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 03 · 补码加法器：进位与溢出的真相<span class=\"tag\">可改操作数<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>A =<\/label><input type=\"number\" id=\"ovA\" value=\"105\" min=\"-128\" max=\"127\">\n        <label>B =<\/label><input type=\"number\" id=\"ovB\" value=\"70\" min=\"-128\" max=\"127\">\n        <button class=\"btn gh sm\" id=\"ovSwap\">交换<\/button>\n        <span style=\"font-size:12px;color:#8b95a3\">试试 105 + 70，再看 −105 + 70<\/span>\n      <\/div>\n      <div id=\"ovOut\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 04 · IEEE 754 单精度拆解器<span class=\"tag\">重点 · 动手输入<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>十进制浮点数<\/label><input type=\"number\" id=\"f32In\" value=\"12.375\" step=\"any\" style=\"width:150px\">\n        <button class=\"btn gh sm\" data-f32=\"12.375\">12.375<\/button>\n        <button class=\"btn gh sm\" data-f32=\"-0.15625\">−0.15625<\/button>\n        <button class=\"btn gh sm\" data-f32=\"0.1\">0.1<\/button>\n        <button class=\"btn gh sm\" data-f32=\"3.14159\">π<\/button>\n        <button class=\"btn gh sm\" data-f32=\"100000000\">10⁸<\/button>\n      <\/div>\n      <div id=\"f32Out\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 05 · 浮点加减五步：逐步播放对阶过程<span class=\"tag\">点「下一步」<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>X =<\/label><input type=\"number\" id=\"faX\" value=\"0.5\" step=\"any\" style=\"width:110px\">\n        <label>Y =<\/label><input type=\"number\" id=\"faY\" value=\"-0.4375\" step=\"any\" style=\"width:110px\">\n        <button class=\"btn\" id=\"faStart\">重新开始<\/button>\n        <button class=\"btn gh\" id=\"faNext\">下一步 ▸<\/button>\n      <\/div>\n      <div class=\"steps\" id=\"faSteps\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 06 · 海明码生成器：校验位如何插入与计算<span class=\"tag\">输入数据位<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>数据位（二进制串）<\/label><input type=\"text\" id=\"hamIn\" value=\"1011\" maxlength=\"16\">\n        <button class=\"btn gh sm\" data-ham=\"1011\">1011<\/button>\n        <button class=\"btn gh sm\" data-ham=\"10110110\">10110110<\/button>\n      <\/div>\n      <div id=\"hamOut\"><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- ==================== 第 3 章 ==================== -->\n<section class=\"sec\" id=\"ch3\">\n  <div class=\"sec-head\">\n    <span class=\"sec-num\">CHAPTER 03<\/span>\n    <h2>存储系统<\/h2>\n    <span class=\"weight w3\">核心 · 12-14 分<\/span>\n  <\/div>\n\n  <div class=\"tip i\"><span class=\"ti\">本章定位<\/span><span>408 计组<b>分值最高、也最容易拉开差距<\/b>的一章。三种 Cache 映射的地址划分几乎年年考，大题常以「给出主存/Cache 参数 → 求地址格式 → 分析命中情况 → 算平均访问时间」的链条出现。核心心法：<span class=\"key\">一切从「块内地址位数」开始往下推<\/span>，别记公式结论，记推导顺序。<\/span><\/div>\n\n  <div class=\"tip i\"><span class=\"ti\">跨科目<\/span><span>本章的「虚拟存储」与 OS 的「内存管理」讲的是<b>同一套机制的两面<\/b>：这里讲<b>硬件怎么做到<\/b>（页表基址寄存器、TLB、地址转换、缺页中断的产生），OS 讲<b>软件怎么管<\/b>（页表由谁维护、缺页怎么处理、页面置换选谁换出）。<span class=\"key\">强烈建议两门课对照着学<\/span> —— 计组和 OS 合计 80 分，很大一块就在这里。<\/span><\/div>\n\n  <div class=\"sub\">考点清单<\/div>\n  <div class=\"grid g2\">\n    <div class=\"card\">\n      <h4>1. 存储层次与两个「局部性」<\/h4>\n      <div class=\"fm\">CPU → 寄存器 → Cache → 主存 → 辅存\n   快、小、贵  ←———————→  慢、大、便宜<\/div>\n      <ul>\n        <li><b>Cache—主存<\/b>层：解决<span class=\"key\">速度<\/span>不匹配，由<b>硬件<\/b>实现，对<b>所有程序员透明<\/b><\/li>\n        <li><b>主存—辅存<\/b>层：解决<span class=\"key\">容量<\/span>不足，由<b>硬件 + 操作系统<\/b>共同实现，对<b>应用程序员透明<\/b><\/li>\n        <li>局部性原理：<span class=\"key\">时间局部性<\/span>（刚访问的还会再访问）+ <span class=\"key\">空间局部性<\/span>（邻近的会被访问）<\/li>\n        <li>Cache 命中率 H，平均访问时间 <b class=\"mono\">Ta = H·Tc + (1−H)·Tm<\/b><\/li>\n        <li><span class=\"key\">口径<\/span>：上式是「Cache 与主存<b>同时访问<\/b>」（命中用 Tc，不命中用 Tm）；若题干说「<b>先查 Cache，未命中再访主存<\/b>」（串行），则 <b class=\"mono\">Ta = Tc + (1−H)·Tm<\/b>。两种口径答案不同，看清题干怎么描述<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <h4>2. SRAM vs DRAM <span class=\"pt\">必考<\/span><\/h4>\n      <table class=\"tb\">\n        <tr><th>对比<\/th><th>SRAM<\/th><th>DRAM<\/th><\/tr>\n        <tr><td>存储元<\/td><td>触发器<\/td><td>电容<\/td><\/tr>\n        <tr><td>速度<\/td><td>快<\/td><td>慢<\/td><\/tr>\n        <tr><td>集成度<\/td><td>低<\/td><td>高<\/td><\/tr>\n        <tr><td>刷新<\/td><td>不需要<\/td><td>需要<\/td><\/tr>\n        <tr><td>破坏性读出<\/td><td>否<\/td><td>是（需重写）<\/td><\/tr>\n        <tr><td>用途<\/td><td>Cache<\/td><td>主存<\/td><\/tr>\n      <\/table>\n      <div class=\"fm\">DRAM 刷新方式\n集中刷新：集中一段死时间刷新，存在访问死区\n分散刷新：每个存取周期后跟一个刷新周期，无死区但周期翻倍\n异步刷新：刷新周期 ÷ 行数 = 每隔多久刷一行（最常用）<\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>3. 存储器扩展<\/h4>\n      <ul>\n        <li><b>位扩展<\/b>：增加字长。芯片地址线、片选全部并联，数据线分别接不同位<\/li>\n        <li><b>字扩展<\/b>：增加字数。数据线并联，用<b>片选信号<\/b>区分不同芯片<\/li>\n        <li><b>字位同时扩展<\/b>：先位扩展成组，再字扩展成整体<\/li>\n        <li>地址译码有两种：<span class=\"key\">线选法<\/span>（简单、地址不连续、不能扩展）与<span class=\"key\">译码片选法<\/span>（用译码器，地址连续）<\/li>\n        <li>所需芯片数 = 总容量 ÷ 单片容量<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <h4>4. Cache 三种映射 <span class=\"pt\">重中之重<\/span><\/h4>\n      <div class=\"fm\">块内地址位数 = log₂(块大小)\n\n直接映射：Cache行号 = 主存块号 mod Cache总行数\n  地址 = [ 标记 | 行号 | 块内地址 ]\n\n全相联映射：可放任意行\n  地址 = [ 标记 | 块内地址 ]\n\n组相联映射（n 路）：\n  Cache组号 = 主存块号 mod Cache组数\n  地址 = [ 标记 | 组号 | 块内地址 ]<\/div>\n      <ul>\n        <li>直接映射：硬件最简单、冲突最多；全相联：冲突最少、比较器最贵<\/li>\n        <li>组相联是折中，路数 = 每组行数<\/li>\n        <li><span class=\"key\">标记位数 = 主存地址位数 − 行号/组号位数 − 块内地址位数<\/span><\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <h4>5. 替换算法与写策略<\/h4>\n      <ul>\n        <li>替换算法：<b>随机 RAND<\/b>、<b>先进先出 FIFO<\/b>、<b>近期最少使用 LRU<\/b>、<b>最不经常使用 LFU<\/b><\/li>\n        <li>直接映射<span class=\"key\">不需要替换算法<\/span>（位置唯一）<\/li>\n        <li>LRU 用计数器实现，命中时被访问行计数器清零、其余加一；比 FIFO 更符合局部性，命中率通常更高<\/li>\n      <\/ul>\n      <table class=\"tb\">\n        <tr><th>写策略<\/th><th>特点<\/th><\/tr>\n        <tr><td>写直达 write-through<\/td><td>同时写 Cache 与主存，一致性好、开销大<\/td><\/tr>\n        <tr><td>写回 write-back<\/td><td>只写 Cache，需<b>脏位<\/b>，替换时若脏才写回<\/td><\/tr>\n        <tr><td>写分配<\/td><td>写缺失时先调入该块再写<\/td><\/tr>\n        <tr><td>非写分配<\/td><td>写缺失时直接写主存，不调入<\/td><\/tr>\n      <\/table>\n      <div class=\"tip m\"><span class=\"ti\">搭配<\/span><span>常见组合：<span class=\"key\">写直达 + 非写分配<\/span>、<span class=\"key\">写回 + 写分配<\/span>。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>6. 虚拟存储<\/h4>\n      <ul>\n        <li>页式：虚拟地址 = <b>虚页号 + 页内偏移<\/b>；页表项含物理页号、有效位、修改位、访问位<\/li>\n        <li>页大小固定 → 页内偏移位数固定，虚页号映射到物理页号<\/li>\n        <li><b>TLB（快表）<\/b>：存放常用页表项，SRAM，命中则不必访问主存中的页表<\/li>\n        <li>地址转换顺序：<span class=\"key\">VA → TLB（命中直接得物理页号）→ 未命中查页表 → 得物理页号 → 拼偏移得 PA<\/span><\/li>\n        <li>缺页时触发<b>缺页异常<\/b>，由操作系统调入页面，若内存满则按置换算法换出<\/li>\n        <li>段式按逻辑划分、便于共享保护但会产生外部碎片；段页式结合两者<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <h4>7. 磁盘与 RAID<\/h4>\n      <ul>\n        <li>磁盘容量 = 面数 × 磁道数/面 × 扇区数/道 × 扇区容量<\/li>\n        <li>存取时间 = <span class=\"key\">寻道时间 + 旋转延迟 + 传输时间<\/span><\/li>\n        <li>平均旋转延迟 = 转一圈时间 ÷ 2，转一圈 = 60 ÷ 转速(r/min) 秒<\/li>\n        <li>RAID0 条带化（无冗余、快）、RAID1 镜像（可靠、利用率 50%）、RAID5 分布式奇偶校验（允许坏 1 盘）<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <h4>8. 计算例题模板<\/h4>\n      <div class=\"fm\">已知：主存 4 GB，Cache 256 KB，块大小 64 B，2 路组相联\n\nStep1 块内地址 = log₂64 = 6 位\nStep2 主存地址总位数 = log₂4G = 32 位\nStep3 Cache 行数 = 256KB / 64B = 2¹²，组数 = 2¹² / 2 = 2¹¹\nStep4 组号 = 11 位\nStep5 标记 = 32 − 11 − 6 = 15 位\n\n⇒ 地址格式：[ 标记 15 | 组号 11 | 块内 6 ]<\/div>\n      <div class=\"tip e\"><span class=\"ti\">易错<\/span><span>先把所有容量换成 <b>2 的幂<\/b>再算，千万别用十进制硬除。另外「块」和「行」在 Cache 里等价，只有虚拟存储才叫「页」。<\/span><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"sub a\">原理动画<\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 07 · 存储层次金字塔：越靠上越快越贵<span class=\"tag\">点击每一层<\/span><\/div>\n    <div class=\"demo-b\">\n      <svg id=\"hierSvg\" viewBox=\"0 0 680 330\" style=\"width:100%;max-width:560px;height:auto;display:block;margin:0 auto\">\n        <g class=\"hl\" data-k=\"0\" style=\"cursor:pointer\">\n          <polygon points=\"220,16 460,16 490,78 190,78\" fill=\"#eaf0ff\" stroke=\"#2563eb\" stroke-width=\"2\"/>\n          <text x=\"340\" y=\"44\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"800\" fill=\"#1e40af\">CPU 寄存器<\/text>\n          <text x=\"340\" y=\"63\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#5b7fc7\">几 KB · 亚纳秒 · 由编译器分配<\/text>\n        <\/g>\n        <g class=\"hl\" data-k=\"1\" style=\"cursor:pointer\">\n          <polygon points=\"190,86 490,86 520,148 160,148\" fill=\"#e5f7f0\" stroke=\"#0f9d6e\" stroke-width=\"2\"/>\n          <text x=\"340\" y=\"114\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"800\" fill=\"#0a6b4a\">Cache（高速缓存）<\/text>\n          <text x=\"340\" y=\"133\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#3f9d7c\">几 MB · 几纳秒 · 纯硬件管理 · 全透明<\/text>\n        <\/g>\n        <g class=\"hl\" data-k=\"2\" style=\"cursor:pointer\">\n          <polygon points=\"160,156 520,156 550,218 130,218\" fill=\"#fff4e3\" stroke=\"#d97706\" stroke-width=\"2\"/>\n          <text x=\"340\" y=\"184\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"800\" fill=\"#9a5b06\">主存（内存 DRAM）<\/text>\n          <text x=\"340\" y=\"203\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#c08a3a\">几 GB～几十 GB · 几十纳秒 · CPU 可直接访问<\/text>\n        <\/g>\n        <g class=\"hl\" data-k=\"3\" style=\"cursor:pointer\">\n          <polygon points=\"130,226 550,226 580,288 100,288\" fill=\"#f2ecfe\" stroke=\"#7c3aed\" stroke-width=\"2\"/>\n          <text x=\"340\" y=\"254\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"800\" fill=\"#5b21b6\">辅存（磁盘 / SSD）<\/text>\n          <text x=\"340\" y=\"273\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#8b6bd0\">TB 级 · 微秒～毫秒 · 需 OS 管理 · 掉电不丢<\/text>\n        <\/g>\n      <\/svg>\n      <div class=\"res\" id=\"hierRes\" style=\"margin-top:14px\">\n        <div class=\"r\"><span class=\"lbl\">点一下<\/span><span class=\"val\">上方任意层<\/span><\/div>\n        <div class=\"r\" style=\"color:#5c6779\"><span class=\"lbl\">提示<\/span>整个层次结构靠「局部性原理」才成立：程序在一段时间内只访问很小一部分地址。<\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 08 · Cache 三种映射：主存块到底放到哪一行<span class=\"tag\">重点 · 改参数看变化<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>映射方式<\/label>\n        <select id=\"mapMode\">\n          <option value=\"direct\">直接映射<\/option>\n          <option value=\"set2\">2 路组相联<\/option>\n          <option value=\"set4\">4 路组相联<\/option>\n          <option value=\"full\">全相联<\/option>\n        <\/select>\n        <label>Cache 总行数<\/label>\n        <select id=\"mapRows\"><option>4<\/option><option selected>8<\/option><option>16<\/option><\/select>\n        <label>主存块号<\/label>\n        <input type=\"number\" id=\"blkNo\" value=\"13\" min=\"0\" max=\"31\">\n      <\/div>\n      <div class=\"mapwrap\">\n        <div>\n          <div style=\"font-size:11.5px;color:#6b7280;font-weight:650;margin-bottom:6px\">主存块（节选）<\/div>\n          <div class=\"mem-col\" id=\"memCol\"><\/div>\n        <\/div>\n        <div class=\"arrowcol\" style=\"padding-top:26px\">\n          <div style=\"font-size:22px\">→<\/div>\n        <\/div>\n        <div>\n          <div style=\"font-size:11.5px;color:#6b7280;font-weight:650;margin-bottom:6px\">Cache 行<\/div>\n          <div class=\"cache-col\" id=\"cacheCol\"><\/div>\n        <\/div>\n      <\/div>\n      <div class=\"legend\" style=\"margin-top:14px\">\n        <span><i style=\"background:#2563eb\"><\/i><b>蓝色<\/b> = 当前正在访问的主存块<\/span>\n        <span><i style=\"background:#e5f7f0;border:1px solid #8fdcc4\"><\/i><b>绿色<\/b> = 这个块被放进哪一行（组相联时是整个组）<\/span>\n      <\/div>\n      <div class=\"res\" id=\"mapRes\" style=\"margin-top:16px\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 09 · 地址格式划分计算器<span class=\"tag\">输入 2 的幂次<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>主存容量 2^<\/label><input type=\"number\" id=\"pMem\" value=\"32\" style=\"width:64px\"><span style=\"font-size:12px\">B<\/span>\n        <label>Cache 容量 2^<\/label><input type=\"number\" id=\"pCache\" value=\"18\" style=\"width:64px\"><span style=\"font-size:12px\">B<\/span>\n        <label>块大小 2^<\/label><input type=\"number\" id=\"pBlk\" value=\"6\" style=\"width:64px\"><span style=\"font-size:12px\">B<\/span>\n        <label>路数<\/label>\n        <select id=\"pWay\"><option>1<\/option><option selected>2<\/option><option>4<\/option><option>8<\/option><\/select>\n      <\/div>\n      <div id=\"pOut\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 10 · 虚拟地址 → 物理地址：TLB 与页表<span class=\"tag\">逐步播放<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>虚拟地址（十六进制）<\/label><input type=\"text\" id=\"vaIn\" value=\"0x00003A7C\" style=\"width:140px\">\n        <button class=\"btn gh sm\" data-va=\"0x00003A7C\">0x00003A7C<\/button>\n        <button class=\"btn gh sm\" data-va=\"0x00001004\">0x00001004<\/button>\n        <button class=\"btn gh sm\" data-va=\"0x00002108\">0x00002108<\/button>\n        <button class=\"btn\" id=\"vaStart\">重新播放<\/button>\n      <\/div>\n      <div class=\"steps\" id=\"vaSteps\"><\/div>\n      <div class=\"evbar\" id=\"vaEv\"><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- ==================== 第 4 章 ==================== -->\n<section class=\"sec\" id=\"ch4\">\n  <div class=\"sec-head\">\n    <span class=\"sec-num\">CHAPTER 04<\/span>\n    <h2>指令系统<\/h2>\n    <span class=\"weight w2\">中频 · 4-7 分<\/span>\n  <\/div>\n\n  <div class=\"tip i\"><span class=\"ti\">本章定位<\/span><span>理解性章节，单选为主。两个稳定考点：<b>扩展操作码编码容量的计算<\/b>和<b>各种寻址方式的有效地址与访存次数<\/b>。另外 CISC/RISC 对比、指令格式设计偶尔出大题。这章跟第 5 章的数据通路是连着的，学的时候一起想。<\/span><\/div>\n\n  <div class=\"sub\">考点清单<\/div>\n  <div class=\"grid g2\">\n    <div class=\"card\">\n      <h4>1. 指令格式<\/h4>\n      <div class=\"fm\">指令 = 操作码 OP + 地址码 A1 A2 A3 …\n指令字长 = 操作码位数 + Σ 各地址码位数<\/div>\n      <ul>\n        <li>按地址码个数分：零 / 一 / 二 / 三 / 四地址指令<\/li>\n        <li><b>定长操作码<\/b>：译码简单，但编码空间浪费<\/li>\n        <li><b>扩展操作码<\/b>：短码不占用长码的编码空间，靠<span class=\"key\">「短操作码不能是长操作码的前缀」<\/span>实现——即短码必须留出全 1 等标志位给长码用<\/li>\n        <li>指令字长固定时，<span class=\"key\">增加地址码 → 寻址范围变小<\/span>，二者此消彼长<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <h4>2. 九种寻址方式与访存次数 <span class=\"pt\">必考<\/span><\/h4>\n      <table class=\"tb\">\n        <tr><th>寻址方式<\/th><th>有效地址 EA<\/th><th>访存<\/th><\/tr>\n        <tr><td>立即寻址<\/td><td>无（数在指令里）<\/td><td class=\"mono\">0<\/td><\/tr>\n        <tr><td>寄存器寻址<\/td><td>无（数在寄存器）<\/td><td class=\"mono\">0<\/td><\/tr>\n        <tr><td>直接寻址<\/td><td class=\"mono\">EA = A<\/td><td class=\"mono\">1<\/td><\/tr>\n        <tr><td>寄存器间接<\/td><td class=\"mono\">EA = (R)<\/td><td class=\"mono\">1<\/td><\/tr>\n        <tr><td>间接寻址<\/td><td class=\"mono\">EA = (A)<\/td><td class=\"mono\">2<\/td><\/tr>\n        <tr><td>相对寻址<\/td><td class=\"mono\">EA = PC + A<\/td><td class=\"mono\">1<\/td><\/tr>\n        <tr><td>基址寻址<\/td><td class=\"mono\">EA = (BR) + A<\/td><td class=\"mono\">1<\/td><\/tr>\n        <tr><td>变址寻址<\/td><td class=\"mono\">EA = (IX) + A<\/td><td class=\"mono\">1<\/td><\/tr>\n        <tr><td>堆栈寻址<\/td><td class=\"mono\">隐含 SP<\/td><td class=\"mono\">1<\/td><\/tr>\n      <\/table>\n      <div class=\"tip m\"><span class=\"ti\">口径提示<\/span><span>「访存次数」的计数口径是<b>取操作数<\/b>所需次数，<b>不含取指令<\/b>。不同教材表述略有差异，做题时看清题干是否强调「取指之外」。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>3. 基址 vs 变址 <span class=\"pt\">高频陷阱<\/span><\/h4>\n      <table class=\"tb\">\n        <tr><th><\/th><th>基址寻址<\/th><th>变址寻址<\/th><\/tr>\n        <tr><td>内容由谁改<\/td><td>操作系统 / 管理程序<\/td><td>用户程序<\/td><\/tr>\n        <tr><td>面向<\/td><td>系统，实现<b>程序浮动<\/b><\/td><td>用户，实现<b>数组遍历<\/b><\/td><\/tr>\n        <tr><td>形式地址 A<\/td><td>位数较长，作为偏移<\/td><td>位数较短，作为初值<\/td><\/tr>\n        <tr><td>寄存器内容<\/td><td>执行中不变<\/td><td>执行中可变<\/td><\/tr>\n      <\/table>\n      <div class=\"tip e\"><span class=\"ti\">易错<\/span><span>「程序浮动」选基址，「数组/循环」选变址——这是单选题的标准区分点。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>4. CISC vs RISC<\/h4>\n      <table class=\"tb\">\n        <tr><th><\/th><th>CISC<\/th><th>RISC<\/th><\/tr>\n        <tr><td>指令数量<\/td><td>多（几百条）<\/td><td>少（精简）<\/td><\/tr>\n        <tr><td>指令长度<\/td><td>变长<\/td><td>定长<\/td><\/tr>\n        <tr><td>寻址方式<\/td><td>多、复杂<\/td><td>少、简单<\/td><\/tr>\n        <tr><td>访存指令<\/td><td>多数指令可访存<\/td><td>只有 load/store<\/td><\/tr>\n        <tr><td>控制器<\/td><td>多为微程序<\/td><td>多为硬布线<\/td><\/tr>\n        <tr><td>寄存器数<\/td><td>少<\/td><td>多<\/td><\/tr>\n        <tr><td>流水线<\/td><td>难<\/td><td>易（利于指令流水）<\/td><\/tr>\n      <\/table>\n    <\/div>\n    <div class=\"card\">\n      <h4>5. 程序的机器级表示<\/h4>\n      <ul>\n        <li>x86 常用寄存器：EAX/EBX/ECX/EDX（通用）、ESP（栈指针）、EBP（帧指针）、EIP（指令指针）<\/li>\n        <li>call 指令自动<b>压入返回地址<\/b>（下一条指令地址）并跳转；ret 从栈顶弹出返回地址<\/li>\n        <li>栈从<b>高地址向低地址<\/b>增长，因此「压栈」是 SP 减<\/li>\n        <li>局部变量在栈帧内分配，参数传递次序依调用约定（C 语言常见从右向左入栈）<\/li>\n        <li>选择结构用条件转移实现；循环结构用条件转移 + 无条件转移回跳实现<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <h4>6. 扩展操作码编码规则<\/h4>\n      <div class=\"fm\">设操作码基础长度 k 位，每个地址码占 a 位\n\n三地址指令最多 2ᵏ 条\n若三地址用了 n₃ 条，剩 (2ᵏ − n₃) 个编码可扩展\n二地址可用 = (2ᵏ − n₃) × 2ᵃ\n若二地址用了 n₂ 条，剩到一地址的编码再 × 2ᵃ\n以此类推……<\/div>\n      <div class=\"tip s\"><span class=\"ti\">技巧<\/span><span>本质是<b>进制进位<\/b>：把每一级「没用完的编码」当高位，乘以 2ᵃ 变成下一级的可用空间。做题时画成树状就很清楚。<\/span><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"sub a\">原理动画<\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 11 · 扩展操作码：编码空间是怎么「省」出来的<span class=\"tag\">可见剩余空间<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>操作码基础位数<\/label><input type=\"number\" id=\"eK\" value=\"4\" min=\"2\" max=\"8\" style=\"width:60px\">\n        <label>每个地址码位数<\/label><input type=\"number\" id=\"eA\" value=\"4\" min=\"2\" max=\"8\" style=\"width:60px\">\n        <label>三地址指令条数<\/label><input type=\"number\" id=\"e3\" value=\"15\" min=\"0\" style=\"width:70px\">\n        <label>二地址指令条数<\/label><input type=\"number\" id=\"e2\" value=\"12\" min=\"0\" style=\"width:70px\">\n        <label>一地址指令条数<\/label><input type=\"number\" id=\"e1\" value=\"0\" min=\"0\" style=\"width:70px\">\n      <\/div>\n      <div id=\"eOut\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 12 · 寻址方式实验室：有效地址怎么算出来<span class=\"tag\">切换方式看路径<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>寻址方式<\/label>\n        <select id=\"amMode\">\n          <option value=\"imm\">立即寻址<\/option>\n          <option value=\"reg\">寄存器寻址<\/option>\n          <option value=\"dir\" selected>直接寻址<\/option>\n          <option value=\"ind\">间接寻址<\/option>\n          <option value=\"rind\">寄存器间接寻址<\/option>\n          <option value=\"rel\">相对寻址<\/option>\n          <option value=\"base\">基址寻址<\/option>\n          <option value=\"index\">变址寻址<\/option>\n        <\/select>\n        <label>形式地址 A<\/label><input type=\"text\" id=\"amA\" value=\"1000\" style=\"width:100px\">\n        <label>寄存器内容<\/label><input type=\"text\" id=\"amR\" value=\"2000\" style=\"width:100px\">\n        <label>PC 当前值<\/label><input type=\"text\" id=\"amPC\" value=\"3000\" style=\"width:100px\">\n      <\/div>\n      <div id=\"amOut\"><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- ==================== 第 5 章 ==================== -->\n<section class=\"sec\" id=\"ch5\">\n  <div class=\"sec-head\">\n    <span class=\"sec-num\">CHAPTER 05<\/span>\n    <h2>中央处理器<\/h2>\n    <span class=\"weight w3\">核心 · 12-14 分<\/span>\n  <\/div>\n\n  <div class=\"tip i\"><span class=\"ti\">本章定位<\/span><span>与第三章并列的最高分值章。四大硬骨头：<b>指令周期的微操作序列<\/b>、<b>数据通路的控制信号<\/b>、<b>控制器与微程序<\/b>、<b>流水线性能与冒险<\/b>。这章最忌死背——建议把「指令周期动画」反复拖几遍，把每个微操作和寄存器对应上；控制器那段再用「微程序动画」把 CM、CMAR、μIR 三者的配合走一遍，题目自然就通了。<\/span><\/div>\n\n  <div class=\"tip i\"><span class=\"ti\">跨科目<\/span><span>本章讲的 <b>PC、PSW、通用寄存器<\/b>，正是 OS 里<b>进程上下文切换<\/b>要保存和恢复的那批寄存器 —— 计组告诉你它们是什么、放在哪，OS 告诉你为什么要存、什么时候存。本章的中断与异常机制，同时也是 OS 调度器的驱动源（时钟中断）和系统调用的入口。<\/span><\/div>\n\n  <div class=\"sub\">考点清单<\/div>\n  <div class=\"grid g2\">\n    <div class=\"card\">\n      <h4>1. CPU 内部寄存器 <span class=\"pt\">必考<\/span><\/h4>\n      <table class=\"tb\">\n        <tr><th>寄存器<\/th><th>作用<\/th><th>用户可见<\/th><\/tr>\n        <tr><td class=\"mono\">PC<\/td><td>下一条指令的地址，具自增功能<\/td><td>可见<\/td><\/tr>\n        <tr><td class=\"mono\">IR<\/td><td>当前正在执行的指令<\/td><td><b>不可见<\/b><\/td><\/tr>\n        <tr><td class=\"mono\">MAR<\/td><td>欲访问的主存地址<\/td><td><b>不可见<\/b><\/td><\/tr>\n        <tr><td class=\"mono\">MDR<\/td><td>与主存交换的数据<\/td><td><b>不可见<\/b><\/td><\/tr>\n        <tr><td class=\"mono\">PSW<\/td><td>标志位：ZF/CF/OF/SF<\/td><td>可见<\/td><\/tr>\n        <tr><td class=\"mono\">ACC<\/td><td>累加器，暂存运算结果<\/td><td>可见<\/td><\/tr>\n      <\/table>\n      <div class=\"tip m\"><span class=\"ti\">细节<\/span><span>MAR 的位数 = 主存地址线根数；MDR 的位数 = 存储字长。两者都在 CPU 内部。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>2. 指令周期四阶段 <span class=\"pt\">必背<\/span><\/h4>\n      <div class=\"fm\">取指周期 → 间址周期 → 执行周期 → 中断周期\n（间址周期只在间接寻址时才有）<\/div>\n      <div class=\"fm g\">取指周期微操作（背下来）\n(PC) → MAR\nM(MAR) → MDR\n(MDR) → IR\n(PC) + 1 → PC<\/div>\n      <ul>\n        <li>取指周期结束时，IR 里已经是当前指令<\/li>\n        <li>「<b>(PC)+1 → PC<\/b>」在取指阶段就完成了，这点常考<\/li>\n        <li>中断周期由硬件自动完成：关中断、保存断点、送中断服务程序入口<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <h4>3. 数据通路三种结构<\/h4>\n      <table class=\"tb\">\n        <tr><th>结构<\/th><th>特点<\/th><\/tr>\n        <tr><td>单总线<\/td><td>所有部件挂一条总线，<b>一次只能传一个数据<\/b>，微操作需分多步<\/td><\/tr>\n        <tr><td>多总线<\/td><td>如双总线、三总线，一条总线传结果、另一条传操作数，可一步完成加法<\/td><\/tr>\n        <tr><td>专用通路<\/td><td>寄存器间点对点直连，速度最快，但结构复杂、成本高<\/td><\/tr>\n      <\/table>\n      <div class=\"tip m\"><span class=\"ti\">关键<\/span><span>单总线结构下一次<b>只能有一个部件把数据送上总线<\/b>，所以「(MDR) + R1 → R1」这种运算必须分两步：先把 MDR 送上总线暂存到 ALU 输入锁存器，再加 R1。这是大题里问「需要几个时钟周期」的根源。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>4. 控制器（CU）：功能与结构 <span class=\"pt\">必考<\/span><\/h4>\n      <ul>\n        <li>控制器是 CPU 的「<b>指挥中心<\/b>」：只负责<b>发命令<\/b>，不参与运算、不存放运算数据<\/li>\n        <li>核心动作：<b>取指令<\/b> → <b>分析指令<\/b>（译码）→ <b>执行指令<\/b>（按节拍发出微操作命令序列）<\/li>\n      <\/ul>\n      <div class=\"fm\">「CPU 的五大功能」选择题高频，背五个词：\n指令控制 · 操作控制 · 时间控制 · 数据加工 · 中断处理\n其中「数据加工」由运算器执行，其余四条都由控制器主导<\/div>\n      <div class=\"fm\">控制器的五大部件（背下来）：\n① PC 程序计数器 —— 给出指令地址\n② IR 指令寄存器 —— 存放当前指令\n③ ID 指令译码器 —— 把操作码翻译成控制信号\n④ 时序系统 —— 产生节拍电位与节拍脉冲\n⑤ 微操作信号发生器 —— 产生全部微操作命令（控制单元 CU 本体）<\/div>\n      <div class=\"tip m\"><span class=\"ti\">考点<\/span><span><b>PC、IR 属于控制器<\/b>——高频判断点。控制器管「指挥」，运算器管「干活」，两者合起来才是 CPU。<\/span><\/div>\n      <div class=\"tip i\"><span class=\"ti\">时间控制<\/span><span>时序系统按三级划分：<span class=\"key\">指令周期 ⊇ 机器周期 ⊇ 时钟周期（节拍）<\/span>。一个机器周期完成一个基本操作（取指、读一次主存等），含若干节拍；<b>不同指令所需的机器周期数可以不同<\/b>——这是「各指令执行时间不同」的根源。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>5. 硬布线控制器 <span class=\"pt\">辨析常考<\/span><\/h4>\n      <ul>\n        <li>本质：微操作命令用<b>组合逻辑电路<\/b>直接「算」出来，又称组合逻辑控制器<\/li>\n        <li>三组输入信号决定全部输出：<\/li>\n      <\/ul>\n      <div class=\"fm\">微操作命令 = f( ① 指令译码信号 , ② 时序信号 , ③ 状态标志 )\n                      ↑ 当前是什么指令　↑ 第几个节拍　↑ ZF / CF 等<\/div>\n      <ul>\n        <li>设计思路（了解）：列<b>微操作时间表<\/b> → 写出各微命令逻辑表达式 → 化简 → 画门电路<\/li>\n        <li>特点：<b>速度快<\/b>（无需读存储器）、电路繁琐不规整、<b>修改扩充极难<\/b> → RISC 多采用<\/li>\n      <\/ul>\n      <table class=\"tb\">\n        <tr><th><\/th><th>硬布线<\/th><th>微程序<\/th><\/tr>\n        <tr><td>实现<\/td><td>组合逻辑电路<\/td><td>控制存储器存微程序<\/td><\/tr>\n        <tr><td>速度<\/td><td><b>快<\/b><\/td><td>慢（需先读 CM）<\/td><\/tr>\n        <tr><td>修改扩充<\/td><td>难，要改电路<\/td><td>易，改微程序即可<\/td><\/tr>\n        <tr><td>规整性<\/td><td>差<\/td><td>好<\/td><\/tr>\n        <tr><td>适用<\/td><td>RISC<\/td><td>CISC<\/td><\/tr>\n      <\/table>\n    <\/div>\n    <div class=\"card\">\n      <h4>6. 微程序控制器 · 原理与结构 <span class=\"pt\">必考<\/span><\/h4>\n      <div class=\"fm\">四层概念链（由大到小，背）：\n程序 → 机器指令 → 微程序 → 微指令 → 微命令\n· 微命令：最小控制信号，如 PCout、MARin\n· 微指令：若干微命令的组合，一条可并行发出多个命令\n· 微程序：完成一条机器指令的全部微指令序列<\/div>\n      <ul>\n        <li>核心思想：把「要发哪些命令」<b>代码化<\/b>写进微指令、存进控制存储器——用「查表」代替「硬连线」<\/li>\n        <li>一条机器指令对应<b>一段微程序<\/b>（一对多）；<span class=\"key\">微指令条数远多于机器指令条数<\/span><\/li>\n        <li><span class=\"key\">取指微程序为所有指令公用<\/span>：所以微程序个数 = 机器指令个数 + 1<\/li>\n        <li>控制存储器 CM 在 CPU 内、用 ROM 实现，存放<b>全部微程序<\/b><\/li>\n      <\/ul>\n      <div class=\"fm g\">四大部件与工作流程（记成：取 → 存 → 发 → 找下一条）：\nCMAR 微地址寄存器：指向当前微指令在 CM 中的位置\nCM　控制存储器：按 CMAR 取出微指令 → 送入 μIR\nμIR 微指令寄存器：其中的微命令生效，控制部件完成微操作\n微地址形成部件：按 操作码 / 下地址字段 / 增量 算出下一条微地址<\/div>\n      <div class=\"tip m\"><span class=\"ti\">易考<\/span><span>「机器指令与微指令」的关系是选择题常客：<b>一条机器指令由一段微程序解释执行<\/b>，取指那条路所有指令都共用。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>7. 微指令：格式 · 编码 · 下地址 <span class=\"pt\">可出计算<\/span><\/h4>\n      <table class=\"tb\">\n        <tr><th><\/th><th>水平型<\/th><th>垂直型<\/th><\/tr>\n        <tr><td>并行能力<\/td><td><b>强<\/b>（一条并发多个微命令）<\/td><td>弱（一条做一个微操作）<\/td><\/tr>\n        <tr><td>微指令字长<\/td><td>长<\/td><td>短（类似机器指令）<\/td><\/tr>\n        <tr><td>微程序条数<\/td><td>少（程序短）<\/td><td>多（程序长）<\/td><\/tr>\n      <\/table>\n      <div class=\"tip s\" style=\"margin-top:8px\"><span class=\"ti\">补充<\/span><span>混合型 = 水平型 + 垂直型的折中，实际机器常用。真题多考<b>水平型与垂直型的两组反比关系<\/b>（并行能力 ↔ 字长 ↔ 条数）。<\/span><\/div>\n      <div class=\"fm\">编码方式（三种，越往后越省位也越慢）：\n直接编码：1 位管 1 个微命令，最快、最长\n字段直接编码：互斥的微命令放同一字段、字段内译码\n字段间接编码：字段的含义还取决于另一字段（更省位、更慢）<\/div>\n      <div class=\"fm a\">计算题核心公式：字段位数 = ⌈log₂(互斥微命令数 + 1)⌉\n「+1」是给「本段不操作」留的全 0 编码——漏掉必错<\/div>\n      <ul>\n        <li>下地址形成 3 种：① <b>操作码 → 入口<\/b>（取指末，操作码给出执行微程序首地址，这是各指令分岔的路口）② <b>增量法<\/b>：(CMAR)+1 顺序执行 ③ <b>断定法<\/b>：下地址字段直接给出目标地址<\/li>\n        <li>执行方式：<b>串行<\/b>——执行完本条全部微操作再取下一条；<b>并行<\/b>——执行本条的同时取下一条（需双端口 CM，硬件更复杂、速度更快）<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <h4>8. 指令流水线性能 <span class=\"pt\">大题常客<\/span><\/h4>\n      <div class=\"fm\">流水线周期 Δt = 最长一个阶段的耗时\nk 段流水线执行 n 条指令：\n  总时间 T = (k + n − 1) × Δt\n  吞吐率 TP = n / T，最大 = 1 / Δt\n  加速比 S = n·k·Δt / T = nk / (k + n − 1)\n  效率 E = S / k<\/div>\n      <ul>\n        <li>流水线<b>不能缩短单条指令的执行时间<\/b>，只能提高吞吐率<\/li>\n        <li>理想情况：<b>第 1 条指令耗时 k·Δt，此后每 Δt 完成一条<\/b><\/li>\n        <li>流水段数越多，单条指令反而越慢（多了寄存器延迟）<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <h4>9. 三种冒险与解决 <span class=\"pt\">必考<\/span><\/h4>\n      <table class=\"tb\">\n        <tr><th>冒险<\/th><th>成因<\/th><th>解决<\/th><\/tr>\n        <tr><td>结构冒险<\/td><td>硬件资源冲突（如同时取指和取数）<\/td><td>指令Cache与数据Cache分离、停顿<\/td><\/tr>\n        <tr><td>数据冒险<\/td><td>后继指令用到前指令还没写回的结果<\/td><td><b>转发/旁路<\/b>、停顿、编译调度<\/td><\/tr>\n        <tr><td>控制冒险<\/td><td>转移指令改变了下一条指令地址<\/td><td>分支预测、延迟槽、停顿<\/td><\/tr>\n      <\/table>\n      <ul>\n        <li>数据冒险三类：<span class=\"key\">RAW（先写后读）<\/span>最常见、WAR、WAW（后两者只在乱序执行中出现）<\/li>\n        <li><b>转发（旁路）<\/b>：直接把 ALU 的输出送给下一条指令的 ALU 输入端，不必等写回寄存器<\/li>\n        <li>load-use 冒险<b>无法只靠转发解决<\/b>，必须插入一个气泡<\/li>\n        <li>分支预测：静态（总预测不跳转/总跳转）、动态（BTB + 历史记录）<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <h4>10. 多处理器与并行<\/h4>\n      <ul>\n        <li>Flynn 分类：SISD、SIMD、MISD、MIMD（多核属于 MIMD）<\/li>\n        <li>超标量：一个时钟周期发射<b>多条<\/b>指令（多套执行部件）<\/li>\n        <li>超流水：把流水段进一步细分，一个周期<b>发射多次<\/b><\/li>\n        <li>超长指令字 VLIW：由编译器把多个操作打包成一条长指令<\/li>\n        <li>硬件多线程：细粒度、粗粒度、同时多线程 SMT<\/li>\n      <\/ul>\n    <\/div>\n  <\/div>\n\n  <div class=\"sub a\">原理动画<\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 13 · 指令周期 × 单总线数据通路<span class=\"tag\">重点 · 逐步播放<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>选择指令<\/label>\n        <select id=\"dpInstr\">\n          <option value=\"add\">ADD R1, (R0)　R1 ← R1 + M[R0]<\/option>\n          <option value=\"load\">LOAD R1, [1000]　R1 ← M[1000]<\/option>\n          <option value=\"store\">STORE R1, [1000]　M[1000] ← R1<\/option>\n        <\/select>\n        <button class=\"btn\" id=\"dpPlay\">自动播放<\/button>\n        <button class=\"btn gh\" id=\"dpNext\">下一步 ▸<\/button>\n        <button class=\"btn gy\" id=\"dpReset\">重置<\/button>\n      <\/div>\n      <div id=\"dpStage\"><\/div>\n      <div class=\"legend\" style=\"margin-top:10px\">\n        <span><i style=\"background:#dc2626\"><\/i><b>红色流动线<\/b> = 这一步的数据流向（源部件 → 总线 → 目标部件）<\/span>\n        <span><i style=\"background:#dc2626;border-radius:50%\"><\/i>红色小球 = 正在传送的数据，标签就是它的值<\/span>\n        <span><i style=\"background:#f2ecfe;border:1px solid #7c3aed\"><\/i>紫色 = 本步发出的部件<\/span>\n        <span><i style=\"background:#fdeceb;border:1px solid #dc2626\"><\/i>红框 = 本步接收的部件<\/span>\n        <span><i style=\"background:#eaf0ff;border:1px solid #2563eb\"><\/i>蓝色 = CPU 内部寄存器<\/span>\n        <span><i style=\"background:#fff4e3;border:1px solid #d97706\"><\/i>橙色 = 存储器<\/span>\n      <\/div>\n      <div id=\"dpPhase\"><\/div>\n      <div id=\"dpUop\" style=\"margin-top:14px\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 14 · 微程序控制器：换指令看微程序岔路<span class=\"tag\">重点 · 逐步播放<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>选择指令<\/label>\n        <select id=\"mcpInstr\">\n          <option value=\"add\" selected>ADD R1, (R0)　间接寻址加法<\/option>\n          <option value=\"load\">LOAD R1, [2000]　取数<\/option>\n          <option value=\"store\">STORE R1, [2000]　存数<\/option>\n        <\/select>\n        <button class=\"btn\" id=\"mcpPlay\">自动播放<\/button>\n        <button class=\"btn gh\" id=\"mcpNext\">下一步 ▸<\/button>\n        <button class=\"btn gy\" id=\"mcpReset\">重置<\/button>\n        <span style=\"font-size:12px;color:#8b95a3\">所有指令先走同一段「取指微程序」，再按操作码各走各的岔路<\/span>\n      <\/div>\n      <div id=\"mcpStage\"><\/div>\n      <div class=\"steps\" id=\"mcpSteps\" style=\"margin-top:14px\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 15 · 五级流水线时空图：冒险是怎么发生的<span class=\"tag\">三种情形对比<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>情形<\/label>\n        <select id=\"plMode\">\n          <option value=\"ideal\">理想流水（无相关）<\/option>\n          <option value=\"raw\">数据冒险 · 不做处理<\/option>\n          <option value=\"fwd\" selected>数据冒险 · 用转发解决<\/option>\n        <\/select>\n        <label>指令条数<\/label>\n        <select id=\"plN\"><option>4<\/option><option selected>5<\/option><option>6<\/option><\/select>\n        <button class=\"btn\" id=\"plPlay\">播放<\/button>\n        <button class=\"btn gy\" id=\"plReset\">重置<\/button>\n      <\/div>\n      <div style=\"display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:#6b7280;margin-bottom:12px\">\n        <span><i style=\"display:inline-block;width:10px;height:10px;background:#2563eb;border-radius:3px;margin-right:4px\"><\/i>IF 取指<\/span>\n        <span><i style=\"display:inline-block;width:10px;height:10px;background:#0891b2;border-radius:3px;margin-right:4px\"><\/i>ID 译码<\/span>\n        <span><i style=\"display:inline-block;width:10px;height:10px;background:#0f9d6e;border-radius:3px;margin-right:4px\"><\/i>EX 执行<\/span>\n        <span><i style=\"display:inline-block;width:10px;height:10px;background:#d97706;border-radius:3px;margin-right:4px\"><\/i>MEM 访存<\/span>\n        <span><i style=\"display:inline-block;width:10px;height:10px;background:#7c3aed;border-radius:3px;margin-right:4px\"><\/i>WB 写回<\/span>\n        <span><i style=\"display:inline-block;width:10px;height:10px;background:#dc2626;border-radius:3px;margin-right:4px\"><\/i>停顿<\/span>\n        <span><i style=\"display:inline-block;width:10px;height:10px;background:#f59e0b;border-radius:3px;margin-right:4px\"><\/i>转发<\/span>\n      <\/div>\n      <div id=\"plChart\"><\/div>\n      <div id=\"plStat\"><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- ==================== 第 6 章 ==================== -->\n<section class=\"sec\" id=\"ch6\">\n  <div class=\"sec-head\">\n    <span class=\"sec-num\">CHAPTER 06<\/span>\n    <h2>总线<\/h2>\n    <span class=\"weight w1\">低频 · 2-4 分<\/span>\n  <\/div>\n\n  <div class=\"tip i\"><span class=\"ti\">本章定位<\/span><span>篇幅小、考点集中。真正会算的只有<b>总线带宽<\/b>一条公式，其余是分类和三种仲裁方式的特征辨析。复习时把「链式 / 计数器 / 独立请求」三者的控制线数量和优先级特性记住就够了。<\/span><\/div>\n\n  <div class=\"sub\">考点清单<\/div>\n  <div class=\"grid g2\">\n    <div class=\"card\">\n      <h4>1. 总线分类 <span class=\"pt\">必考<\/span><\/h4>\n      <div class=\"fm\">按位置分：片内总线 → 系统总线 → 通信总线\n系统总线 = 数据总线 + 地址总线 + 控制总线<\/div>\n      <ul>\n        <li><b>数据总线<\/b>：双向。位数决定一次能传多少位数据<\/li>\n        <li><b>地址总线<\/b>：单向（CPU 发出）。位数决定寻址空间 = 2ⁿ<\/li>\n        <li><b>控制总线<\/b>：有出有入，传输读/写、中断、时钟等信号<\/li>\n        <li>数据总线位数通常与<b>机器字长或存储字长<\/b>一致<\/li>\n      <\/ul>\n      <div class=\"tip m\"><span class=\"ti\">易混<\/span><span>「数据总线宽度 = 存储字长」是常见前提。若数据总线 32 位、按字节编址，则一次可传输 4 个地址单元。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>2. 总线性能指标 <span class=\"pt\">唯一要算的<\/span><\/h4>\n      <div class=\"fm\">总线带宽 = 工作频率 × 位宽 ÷ 8   （单位 B/s）\n\n一个总线周期传 W 字节，用 T 秒：\n  数据传输率 = W / T<\/div>\n      <div class=\"fm g\">例：总线频率 100 MHz，宽度 32 位\n带宽 = 100×10⁶ × 32 ÷ 8 = 400 MB/s<\/div>\n      <ul>\n        <li>总线宽度：能同时传输的数据位数（不是字节）<\/li>\n        <li>一个总线周期可能包含多个时钟周期<\/li>\n        <li>若「每个总线周期传一个字节，需要 2 个时钟」，则实际带宽要再除以 2<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <h4>3. 三种集中式仲裁 <span class=\"pt\">必考<\/span><\/h4>\n      <table class=\"tb\">\n        <tr><th>方式<\/th><th>控制线<\/th><th>优先级<\/th><\/tr>\n        <tr><td>链式查询<\/td><td><b>最少<\/b>（3 根）<\/td><td>固定，离控制器越近越高<\/td><\/tr>\n        <tr><td>计数器定时查询<\/td><td>较多<\/td><td>可变（可循环、可编程）<\/td><\/tr>\n        <tr><td>独立请求<\/td><td><b>最多<\/b><\/td><td>灵活，响应最快<\/td><\/tr>\n      <\/table>\n      <ul>\n        <li>链式查询对<b>电路故障最敏感<\/b>（某一级坏掉，后面的设备全失效）<\/li>\n        <li>独立请求的响应速度<b>最快<\/b>，但需要的控制线数量随设备数线性增长<\/li>\n        <li>分布式仲裁：无中央仲裁器，各设备通过竞争判定<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <h4>4. 总线定时（通信方式）<\/h4>\n      <table class=\"tb\">\n        <tr><th>方式<\/th><th>特点<\/th><\/tr>\n        <tr><td>同步通信<\/td><td>统一时钟，速度快、控制简单；<b>必须按最慢设备设计<\/b>，适合速度接近的设备<\/td><\/tr>\n        <tr><td>异步通信<\/td><td>握手应答，灵活；速度受限于握手开销<\/td><\/tr>\n        <tr><td>半同步<\/td><td>同步 + 等待信号（WAIT）<\/td><\/tr>\n        <tr><td>分离事务<\/td><td>地址与数据分两个子周期，期间总线可给他人用<\/td><\/tr>\n      <\/table>\n      <div class=\"fm a\">异步通信三种互锁\n不互锁：请求/回答信号都不等对方确认（最快、最不可靠）\n半互锁：请求方等回答，回答方不等请求撤销\n全互锁：双方都等对方确认（最可靠、最慢）<\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"sub a\">原理动画<\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 16 · 总线带宽计算器<span class=\"tag\">改参数实时算<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>总线频率<\/label><input type=\"number\" id=\"bwFreq\" value=\"100\" style=\"width:80px\"><span style=\"font-size:12px\">MHz<\/span>\n        <label>总线宽度<\/label><input type=\"number\" id=\"bwW\" value=\"32\" style=\"width:70px\"><span style=\"font-size:12px\">位<\/span>\n        <label>每个总线周期占<\/label><input type=\"number\" id=\"bwC\" value=\"1\" style=\"width:60px\" min=\"1\"><span style=\"font-size:12px\">个时钟<\/span>\n      <\/div>\n      <div id=\"bwOut\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 17 · 三种集中式仲裁：谁先拿到总线<span class=\"tag\">点击设备发请求<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>仲裁方式<\/label>\n        <select id=\"arbMode\">\n          <option value=\"chain\">链式查询<\/option>\n          <option value=\"counter\">计数器定时查询<\/option>\n          <option value=\"indep\" selected>独立请求<\/option>\n        <\/select>\n        <span style=\"font-size:12px;color:#8b95a3\">点击下方任一设备发起总线请求<\/span>\n      <\/div>\n      <div id=\"arbStage\"><\/div>\n      <div id=\"arbOut\" style=\"margin-top:12px\"><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- ==================== 第 7 章 ==================== -->\n<section class=\"sec\" id=\"ch7\">\n  <div class=\"sec-head\">\n    <span class=\"sec-num\">CHAPTER 07<\/span>\n    <h2>输入/输出系统<\/h2>\n    <span class=\"weight w2\">中频 · 4-6 分<\/span>\n  <\/div>\n\n  <div class=\"tip i\"><span class=\"ti\">本章定位<\/span><span>概念密度高但深度有限。最高频的两组对比是<b>程序查询 / 中断 / DMA 三种 I/O 方式<\/b>和<b>中断与 DMA 的差异<\/b>；最容易失分的是<b>中断隐指令到底做了什么<\/b>（顺序不能错）和<b>DMA 的三种传送方式<\/b>。理解主线只有一句：<span class=\"key\">谁在搬数据、CPU 要不要参与<\/span>。<\/span><\/div>\n\n  <div class=\"tip i\"><span class=\"ti\">跨科目<\/span><span>本章的四种 I/O 控制方式，在 OS 的「I/O 管理」里会从<b>软件层次<\/b>再讲一遍：这里讲<b>硬件怎么发起、DMA 怎么抢总线、中断隐指令做了什么<\/b>，OS 讲<b>设备驱动程序怎么组织请求、中断处理程序进去干什么、磁盘调度怎么排顺序、缓冲怎么配合<\/b>。两章合起来才是一套完整的 I/O 体系。<b>另外磁盘调度算法在 OS 那边，别在这章找。<\/b><\/span><\/div>\n\n  <div class=\"sub\">考点清单<\/div>\n  <div class=\"grid g2\">\n    <div class=\"card\">\n      <h4>1. I/O 接口与端口编址<\/h4>\n      <ul>\n        <li>接口中的三类寄存器：<b>数据寄存器<\/b>（缓冲）、<b>状态寄存器<\/b>、<b>控制寄存器<\/b><\/li>\n        <li>状态寄存器中的关键位：就绪/忙、错误、中断允许<\/li>\n        <li><b>统一编址<\/b>（存储器映射）：I/O 端口占用主存地址空间，用普通访存指令访问，无需专用指令，但占用地址空间<\/li>\n        <li><b>独立编址<\/b>（I/O 映射）：端口有独立地址空间，需专用 I/O 指令（如 IN/OUT），不占主存空间，但指令功能弱<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <h4>2. 三种 I/O 方式 <span class=\"pt\">必考<\/span><\/h4>\n      <table class=\"tb\">\n        <tr><th><\/th><th>程序查询<\/th><th>程序中断<\/th><th>DMA<\/th><\/tr>\n        <tr><td>谁发起<\/td><td>CPU 轮询<\/td><td>设备主动<\/td><td>设备主动<\/td><\/tr>\n        <tr><td>数据搬运<\/td><td>CPU<\/td><td>CPU<\/td><td><b>DMA 控制器<\/b><\/td><\/tr>\n        <tr><td>CPU 与 I/O<\/td><td>串行<\/td><td>并行<\/td><td>并行<\/td><\/tr>\n        <tr><td>响应时机<\/td><td>—<\/td><td>指令执行完<\/td><td>存取周期结束<\/td><\/tr>\n        <tr><td>CPU 开销<\/td><td>极高<\/td><td>中（需保护现场）<\/td><td><b>极低<\/b><\/td><\/tr>\n        <tr><td>适用<\/td><td>简单慢速<\/td><td>键盘、打印机<\/td><td>磁盘、高速块设备<\/td><\/tr>\n      <\/table>\n      <div class=\"tip m\"><span class=\"ti\">关键差异<\/span><span>中断靠<b>程序<\/b>搬数据（要执行中断服务程序，有现场保护开销）；DMA 靠<b>硬件<\/b>搬数据（只需在开始和结束时各打断 CPU 一次）。所以 DMA 优先级<b>高于<\/b>中断。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>3. 中断响应与中断隐指令 <span class=\"pt\">必背顺序<\/span><\/h4>\n      <div class=\"fm g\">中断隐指令（由硬件自动完成，不是程序指令）\n① 关中断        ← 防止响应过程被打断\n② 保存断点      ← 把 PC（下一条指令地址）压栈\n③ 取中断服务程序入口 ← 由中断向量提供<\/div>\n      <ul>\n        <li>响应条件：<span class=\"key\">有中断请求 + 当前指令执行结束 + 允许中断（开中断）<\/span><\/li>\n        <li>中断判优由<b>硬件排队器<\/b>或<b>软件查询<\/b>完成，优先级高的先响应<\/li>\n        <li>进入服务程序后要<b>保存现场<\/b>（通用寄存器、PSW），返回前恢复现场、<b>开中断<\/b>、执行 iret<\/li>\n        <li><b>多重中断（中断嵌套）<\/b>的必要条件：在服务程序中提前<b>开中断<\/b><\/li>\n        <li>中断屏蔽字：1 表示屏蔽（不允许被打断），0 表示开放<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <h4>4. DMA 传送方式 <span class=\"pt\">必考<\/span><\/h4>\n      <table class=\"tb\">\n        <tr><th>方式<\/th><th>特点<\/th><\/tr>\n        <tr><td>停止 CPU 访存<\/td><td>DMA 期间 CPU 完全不访存，结构简单但 CPU 浪费大<\/td><\/tr>\n        <tr><td>周期挪用<br>（周期窃取）<\/td><td>DMA 每次窃取<b>一个存取周期<\/b>，CPU 暂停一个周期；最常见<\/td><\/tr>\n        <tr><td>交替访问<\/td><td>CPU 与 DMA <b>轮流<\/b>各用一个周期，无需申请，效率高但速度受限<\/td><\/tr>\n      <\/table>\n      <ul>\n        <li>DMA 控制器内部：<b>地址寄存器<\/b>（AR）、<b>计数器<\/b>（WC）、状态/控制逻辑、数据缓冲<\/li>\n        <li>传送前 CPU 要预置：主存起始地址、传送字数、传送方向<\/li>\n        <li>DMA 请求的是<b>总线使用权<\/b>，中断请求的是 <b>CPU 处理权<\/b>——这是本质区别<\/li>\n        <li>DMA 传送结束后用<b>中断<\/b>方式通知 CPU 做后续处理<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <h4>5. 通道与外部设备<\/h4>\n      <ul>\n        <li>通道是一种<b>专用处理器<\/b>，能执行通道程序，独立管理一批 I/O 设备<\/li>\n        <li>三种通道类型：字节多路、选择、数组多路<\/li>\n        <li>磁盘存取时间 = 寻道 + 旋转延迟 + 传输；平均旋转延迟 = 转一圈时间 ÷ 2<\/li>\n        <li>显示器分辨率 × 灰度位数 ÷ 8 = 一帧显存容量；刷新带宽 = 一帧容量 × 帧频<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <h4>6. 中断全过程速记<\/h4>\n      <div class=\"fm\">设备发中断请求\n   ↓ 硬件判优，选中优先级最高的\nCPU 在指令结束时响应\n   ↓ 中断隐指令（硬件）：关中断 → 保存断点 → 取入口\n执行中断服务程序（软件）\n   ↓ 保存现场 → 处理 → 恢复现场\n开中断 → 执行 iret 指令返回<\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"sub a\">原理动画<\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 18 · 三种 I/O 方式时间线：CPU 到底有多忙<span class=\"tag\">可播放对比<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <button class=\"btn\" id=\"ioPlay\">播放时间线<\/button>\n        <button class=\"btn gy\" id=\"ioReset\">重置<\/button>\n        <span style=\"font-size:12px;color:#8b95a3\">观察每一行里 CPU 有多少时间是「有效计算」<\/span>\n      <\/div>\n      <div id=\"ioStage\"><\/div>\n      <div id=\"ioOut\" style=\"margin-top:14px\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 19 · 中断响应与处理：一气呵成的十二步<span class=\"tag\">逐步播放<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <button class=\"btn\" id=\"irPlay\">重新播放<\/button>\n        <button class=\"btn gh\" id=\"irNext\">下一步 ▸<\/button>\n      <\/div>\n      <div class=\"steps\" id=\"irSteps\"><\/div>\n      <div id=\"irNote\" style=\"margin-top:12px\"><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<footer>\n  408 计算机组成原理 · 交互式原理全景<br>\n  分值区间的权重排序基于历年统考真题的常见分布，用于确定复习优先级，非官方数据。\n<\/footer>\n<\/main>\n<\/div>\n\n<div class=\"totop\" id=\"totop\">↑<\/div>\n\n<script>\n/* ============================================================\n   通用工具\n   ============================================================ */\n/* ============================================================\n   动画速度总控 —— 所有动画的 setTimeout / setInterval 延迟统一乘倍率\n   只放大 300~2000ms 区间（动画用的范围），不影响其它短延迟逻辑\n   ============================================================ */\nlet ANIM_SPEED = 1.7;                    // 1 = 原始速度，越大越慢\n(function(){\n  const _st = window.setTimeout.bind(window);\n  const _si = window.setInterval.bind(window);\n  const scale = ms => (typeof ms === 'number' && ms >= 300 && ms <= 2000)\n    ? Math.round(ms * ANIM_SPEED) : ms;\n  window.setTimeout = function(fn, ms){ return _st(fn, scale(ms)); };\n  window.setInterval = function(fn, ms){ return _si(fn, scale(ms)); };\n})();\n\nconst $ = id => document.getElementById(id);\nconst qsa = s => Array.prototype.slice.call(document.querySelectorAll(s));\n\n/* 速度切换 */\n/* 速度切换后要通知那些「用 SMIL 做流动动画」的模块重绘（SMIL 不受 setTimeout 总控影响） */\nconst ON_SPEED_CHANGE = [];\nqsa('[data-sp]').forEach(b=>{\n  b.onclick = ()=>{\n    ANIM_SPEED = parseFloat(b.dataset.sp) || 1.7;\n    qsa('[data-sp]').forEach(x=>x.classList.toggle('on', x === b));\n    ON_SPEED_CHANGE.forEach(fn=>{ try{ fn(); }catch(e){} });\n  };\n});\n\n/* 补码工具：n 位 */\nfunction toBits(v, n){\n  let x = BigInt(v < 0 ? v + Math.pow(2,n) : v);\n  let s = '';\n  for(let i = n-1; i >= 0; i--) s += ((x >> BigInt(i)) & 1n).toString();\n  return s;\n}\nfunction bitRow(str, cls){\n  return '<div class=\"bits\">' + str.split('').map((b,i)=>{\n    const c = [cls||'', i===0?'first':'', i===str.length-1?'last':'', b==='1'?'on':''].filter(Boolean).join(' ');\n    return '<i class=\"bit '+c+'\">'+b+'<\/i>';\n  }).join('') + '<\/div>';\n}\n\n/* ---------- 进度条 / 导航高亮 / 回到顶部 ---------- */\nwindow.addEventListener('scroll', ()=>{\n  const h = document.documentElement.scrollHeight - window.innerHeight;\n  $('progress').style.width = (h>0 ? (window.scrollY/h*100) : 0) + '%';\n  $('totop').classList.toggle('on', window.scrollY > 500);\n});\n$('totop').onclick = ()=>window.scrollTo({top:0,behavior:'smooth'});\n\n/* ---------- 小屏抽屉导航 ---------- */\n(function(){\n  const btn = $('navbtn'), side = document.querySelector('.sidebar'), scrim = $('scrim');\n  if(!btn || !side || !scrim) return;\n  function close(){\n    side.classList.remove('open'); scrim.classList.remove('on');\n    btn.classList.remove('on'); btn.setAttribute('aria-expanded','false');\n  }\n  function open(){\n    side.classList.add('open'); scrim.classList.add('on');\n    btn.classList.add('on'); btn.setAttribute('aria-expanded','true');\n  }\n  btn.onclick = ()=>{ side.classList.contains('open') ? close() : open(); };\n  scrim.onclick = close;\n  qsa('.nav-i').forEach(a=>a.addEventListener('click', close));\n  document.addEventListener('keydown', e=>{ if(e.key === 'Escape') close(); });\n  window.addEventListener('resize', ()=>{ if(window.innerWidth > 960) close(); });\n\n  /* 顶部条上的「当前章节」按滚动位置算，跳转后不会滞后 */\n  function syncTitle(){\n    const t = document.querySelector('.mtop-t');\n    if(!t) return;\n    const secs = qsa('section.sec');\n    let cur = secs[0];\n    for(let i = 0; i < secs.length; i++){ if(secs[i].getBoundingClientRect().top <= 96) cur = secs[i]; }\n    const link = qsa('.nav-i').filter(a=>a.getAttribute('href') === '#'+cur.id)[0];\n    if(link) t.textContent = t.dataset.subj + ' · ' + link.querySelector('span').textContent;\n  }\n  window.addEventListener('scroll', syncTitle, {passive:true});\n  syncTitle();\n})();\n\nconst navLinks = qsa('.nav-i');\nconst secs = qsa('.sec');\nconst obs = new IntersectionObserver(es=>{\n  es.forEach(e=>{\n    if(e.isIntersecting){\n      const cur = navLinks.filter(a=>a.getAttribute('href') === '#'+e.target.id)[0];\n      navLinks.forEach(a=>a.classList.toggle('on', a === cur));\n    }\n  });\n},{rootMargin:'-15% 0px -70% 0px'});\nsecs.forEach(s=>obs.observe(s));\n\n/* 分值权重条形入场动画 */\nsetTimeout(()=>{ qsa('.rank-bar i, .rank-sum-bar i').forEach(f=>f.style.width = f.dataset.w + '%'); }, 300);\n\n/* ============================================================\n   第 1 章 · 冯诺依曼部件\n   ============================================================ */\nconst vnInfo = {\n  mem:['存储器','按地址存取指令和数据，容量大但慢。所有执行前提：程序已经装进主存。'],\n  cu:['控制器','指挥中心：取指令 → 译码 → 发出控制信号。由 PC（程序计数器）、IR（指令寄存器）、CU（控制单元）组成。'],\n  alu:['运算器','负责数据加工：算术运算（加减乘除）与逻辑运算（与或非、移位、比较）。核心是 ALU，配 ACC、MQ、X 等寄存器与标志寄存器 PSW。'],\n  'in':['输入设备','把人能识别的形式转换成计算机能处理的二进制，如键盘、鼠标、扫描仪。'],\n  out:['输出设备','把二进制结果转换成人可识别的形式，如显示器、打印机。']\n};\nqsa('.vnbox').forEach(g=>{\n  g.style.cursor = 'pointer';\n  g.onclick = ()=>{\n    const d = vnInfo[g.dataset.k];\n    qsa('.vnbox rect').forEach(r=>r.setAttribute('stroke-width','2'));\n    g.querySelector('rect').setAttribute('stroke-width','4');\n    $('vnRes').innerHTML =\n      '<div class=\"r\"><span class=\"lbl\">部件<\/span><span class=\"val\">'+d[0]+'<\/span><\/div>'+\n      '<div class=\"r\" style=\"color:#5c6779\"><span class=\"lbl\">职责<\/span>'+d[1]+'<\/div>';\n  };\n});\n\n/* ---------- 一条指令的完整旅程（与上方 vnbox 联动高亮） ---------- */\nconst VN_STEPS = [\n  ['① 取指令', 'PC 里存着当前指令的<b>地址<\/b>。控制器把这个地址送上总线送到存储器；存储器按地址把<b>指令<\/b>读出来，送回控制器。',\n   '蓝色小球', ['mem','cu']],\n  ['② 译码', '控制器分析刚取回来的这条指令：要做什么运算？操作数在哪？这一步完全在 CPU 内部完成，<b>不需要访问存储器<\/b>。',\n   'CPU 内部', ['cu']],\n  ['③ 取操作数', '如果指令需要的数据存在存储器里，运算器就把数据的<b>地址<\/b>送上总线，存储器把<b>操作数<\/b>送回来。',\n   '橙色小球', ['alu','mem']],\n  ['④ 执行', '运算器用 ALU 完成计算 —— 加减乘除、逻辑运算、移位比较。结果先暂存在寄存器或累加器里，还没写回。',\n   'CPU 内部', ['alu']],\n  ['⑤ 写回', '如果这条指令要求保存结果，运算器把结果送上总线，存储器按地址写回去。',\n   '橙色小球（反向）', ['alu','mem']],\n  ['⑥ PC 自增，准备下一条', 'PC 自动加 1，指向下一条指令的地址，然后回到第 ① 步。<b>程序就是这样一条接一条自动跑下去的<\/b> —— 这就是「存储程序」的全部含义。',\n   '循环', ['cu']]\n];\nlet vnIdx = -1, vnTimer = null;\nfunction renderVN(){\n  const cur = vnIdx >= 0 ? VN_STEPS[vnIdx] : null;\n  $('vnSteps').innerHTML = VN_STEPS.map((s,i)=>{\n    const cls = i < vnIdx ? 'dn' : (i === vnIdx ? 'act' : '');\n    return `<div class=\"step ${cls}\"><div class=\"n\">${i+1}<\/div><div style=\"flex:1\">\n      <div class=\"t\">${s[0]}<span style=\"font-size:10px;font-weight:700;padding:1px 7px;border-radius:4px;background:#eef2f7;color:#6b7280;margin-left:6px\">${s[2]}<\/span><\/div>\n      <div class=\"d\">${s[1]}<\/div><\/div><\/div>`;\n  }).join('');\n  const hl = cur ? cur[3] : [];\n  qsa('.vnbox').forEach(g=>{\n    g.querySelector('rect').setAttribute('stroke-width', hl.indexOf(g.dataset.k) >= 0 ? '4' : '2');\n  });\n}\n$('vnPlay').onclick = ()=>{\n  clearInterval(vnTimer); vnIdx = -1; renderVN();\n  vnTimer = setInterval(()=>{\n    if(vnIdx < VN_STEPS.length-1){ vnIdx++; renderVN(); }\n    else { clearInterval(vnTimer); vnTimer = null; }\n  }, 1900 bu, 'sign', neg? '反码 + 1' : '= 真值') +\n    row('移码', yi, 'sign', '补码符号位取反（阶码专用）') +\n    '<\/div>' + extra;\n}\n$('codeIn').oninput = e=>renderCodes(e.target.value);\nqsa('[data-code]').forEach(b=>b.onclick = ()=>{ $('codeIn').value = b.dataset.code; renderCodes(b.dataset.code); });\nrenderCodes(-45);\n\n/* ============================================================\n   动画 03 · 补码加法溢出\n   ============================================================ */\nfunction renderOv(){\n  let A = parseInt($('ovA').value,10), B = parseInt($('ovB').value,10);\n  if(isNaN(A)) A = 0; if(isNaN(B)) B = 0;\n  A = Math.max(-128, Math.min(127, A)); B = Math.max(-128, Math.min(127, B));\n\n  const buA = toBits(A,8), buB = toBits(B,8);\n  const sum = A + B;\n  const buS = toBits(((sum % 256) + 256) % 256, 8);\n  const trueOv = sum < -128 || sum > 127;\n\n  // 逐位相加算进位\n  let carry = 0, cs = [];\n  for(let i = 7; i >= 0; i--){\n    const s = (+buA[i]) + (+buB[i]) + carry;\n    cs.unshift(s >= 2 ? 1 : 0);\n    carry = s >= 2 ? 1 : 0;\n  }\n  // cs[0] 是最高位结果；carry 是最高位向外的进位\n  const cout = carry;              // 最高位进位\n  const cin  = (function(){        // 次高位进位\n    let c = 0;\n    for(let i = 7; i >= 1; i--){\n      const s = (+buA[i]) + (+buB[i]) + c;\n      c = s >= 2 ? 1 : 0;\n    }\n    return c;\n  })();\n  const xorOv = (cout ^ cin) === 1;\n\n  const bits = (s,cls)=>'<span class=\"bits\" style=\"font-size:14px\">'+s.split('').map(b=>\n      '<i class=\"bit '+cls+(b==='1'?' on':'')+'\" style=\"width:21px;height:27px\">'+b+'<\/i>').join('')+'<\/span>';\n\n  let verdict;\n  if(trueOv){\n    verdict = '<div class=\"tip e\" style=\"margin-top:6px\"><span class=\"ti\">溢出<\/span><span>'+\n      (sum>127?'正溢':'负溢')+'：真值和 '+sum+' 超出 8 位补码范围 [−128, 127]。'+\n      '溢出位 = C<sub>最高位进位<\/sub> ⊕ C<sub>次高位进位<\/sub> = '+cout+' ⊕ '+cin+' = <span class=\"key\">'+ (xorOv?1:0) +'<\/span>，与真实情况一致。<\/span><\/div>';\n  } else {\n    verdict = '<div class=\"tip s\" style=\"margin-top:6px\"><span class=\"ti\">
