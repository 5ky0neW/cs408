card li{margin:5px 0}\n.card li::marker{color:var(--primary)}\n.card ol{margin:6px 0 0;padding-left:19px;font-size:13.5px;color:#3c4654}\n.card ol li::marker{color:var(--primary);font-weight:700}\n.tip{display:flex;gap:9px;font-size:12.8px;padding:11px 14px;border-radius:9px;margin:12px 0;line-height:1.75}\n.tip .ti{font-weight:800;flex-shrink:0}\n.tip.i{background:#eaf6f9;color:#0b5d70}\n.tip.s{background:var(--green-l);color:#0a6b4a}\n.tip.e{background:var(--red-l);color:#8d2020}\n.kmono{font-family:\"Cascadia Mono\",Consolas,monospace;font-size:12.5px}\n\n/* ---------- 流程图 ---------- */\n.chain{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;margin-top:4px}\n.chain-c{flex:1;min-width:150px;background:#fff;border:1px solid var(--line);border-top:3px solid var(--kc);\n  border-radius:10px;padding:13px 14px;text-align:center;margin-right:-1px}\n.chain-c .ct{font-size:13px;font-weight:800;margin-bottom:4px}\n.chain-c .cs{font-size:11.5px;color:var(--muted);line-height:1.6}\n.chain-c .cn{font-size:10.5px;font-weight:800;letter-spacing:1.2px;color:var(--kc);margin-bottom:3px}\n\nfooter{margin-top:64px;padding-top:22px;border-top:1px solid var(--line);\n  font-size:12px;color:var(--muted);text-align:center;line-height:2}\n.totop{position:fixed;right:24px;bottom:24px;width:40px;height:40px;border-radius:50%;\n  background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;\n  display:flex;align-items:center;justify-content:center;color:#6b6580;font-size:15px;\n  opacity:0;pointer-events:none;transition:.25s;z-index:60}\n.totop.on{opacity:1;pointer-events:auto}\n.totop:hover{color:var(--primary);border-color:var(--primary)}\n<\/style>\n<\/head>\n<body>\n<div class=\"progress\" id=\"progress\"><\/div>\n\n<main class=\"wrap\">\n  <header class=\"hero\">\n    <div class=\"hero-k\">408 · 计算机学科专业基础综合<\/div>\n    <h1>408 全景总览<br><em>四门课的交互式原理页<\/em><\/h1>\n    <p>这里是 408 四门课的总入口。每一门都是一份独立的单文件网页：左边章节导航，右边「考点清单 → 原理剖析 → 能动手的动画」。四份加起来覆盖 408 全部 27 章、60 多个交互动画，全部<b>双击就能开、断网也能用<\/b>。<br>从下面的卡片进去，页面之间也可以互相跳转。<\/p>\n    <div class=\"stats\">\n      <div class=\"stat\"><b>150<\/b><span>408 总分<\/span><\/div>\n      <div class=\"stat\"><b>4<\/b><span>门科目全覆盖<\/span><\/div>\n      <div class=\"stat\"><b>27<\/b><span>章节<\/span><\/div>\n      <div class=\"stat\"><b>60+<\/b><span>交互动画<\/span><\/div>\n    <\/div>\n  <\/header>\n\n  <section class=\"sec\">\n    <div class=\"sub\">四门课与它们的跨科目连接点<span class=\"note\">点任意一张卡进入该科目的完整页面<\/span><\/div>\n    <div class=\"entry\">\n\n      <a class=\"ec\" href=\"数据结构-交互式全景.html\" style=\"--kc:var(--ds)\">\n        <div class=\"ec-top\"><span class=\"ec-n\">01<\/span><span class=\"ec-v\">45 分<\/span><\/div>\n        <div class=\"ec-t\">数据结构<\/div>\n        <div class=\"ec-s\">408 的思维工具库。线性表、栈队列、树、图、查找、排序 —— 这六套结构会原样出现在另外三门课里。<\/div>\n        <div class=\"ec-m\"><span>7 章<\/span><span>20+ 个交互动画<\/span><span>8 个增删改查操作台<\/span><\/div>\n        <div class=\"ec-x\">往外走：<b>调度队列<\/b>（OS）、<b>目录树<\/b>（OS）、<b>位示图<\/b>（OS）、<b>Dijkstra 路由算法<\/b>（计网）、<b>Trie 最长前缀匹配<\/b>（计网）<\/div>\n        <div class=\"ec-go\">进入数据结构页<\/div>\n      <\/a>\n\n      <a class=\"ec\" href=\"计算机组成原理-交互式全景.html\" style=\"--kc:var(--co)\">\n        <div class=\"ec-top\"><span class=\"ec-n\">02<\/span><span class=\"ec-v\">45 分<\/span><\/div>\n        <div class=\"ec-t\">计算机组成原理<\/div>\n        <div class=\"ec-s\">一台机器怎么跑起来。数据怎么表示、指令怎么执行、存储怎么分层、总线与 I/O 怎么协调。<\/div>\n        <div class=\"ec-m\"><span>7 章<\/span><span>18 个交互动画<\/span><span>IEEE 754 拆解器<\/span><\/div>\n        <div class=\"ec-x\">往外走：<b>中断机制<\/b>与<b>存储层次<\/b>是 OS 的地基；<b>DMA 收包<\/b>和<b>CRC 校验码<\/b>直接给计网兜底<\/div>\n        <div class=\"ec-go\">进入计算机组成原理页<\/div>\n      <\/a>\n\n      <a class=\"ec\" href=\"操作系统-交互式全景.html\" style=\"--kc:var(--os)\">\n        <div class=\"ec-top\"><span class=\"ec-n\">03<\/span><span class=\"ec-v\">35 分<\/span><\/div>\n        <div class=\"ec-t\">操作系统<\/div>\n        <div class=\"ec-s\">硬件之上的一层管理者。进程、内存、文件、I/O 四大管理，外加同步互斥与死锁两大难点。<\/div>\n        <div class=\"ec-m\"><span>7 章<\/span><span>16 个交互动画<\/span><span>银行家算法 / 页面置换<\/span><\/div>\n        <div class=\"ec-x\">往里收：从计组接来<b>虚拟存储<\/b>、<b>中断<\/b>、<b>I/O 方式<\/b>；与计网在 <b>socket<\/b>、<b>接收缓冲区<\/b>、<b>协议栈分层<\/b>处相接<\/div>\n        <div class=\"ec-go\">进入操作系统页<\/div>\n      <\/a>\n\n      <a class=\"ec\" href=\"计算机网络-交互式全景.html\" style=\"--kc:var(--cn)\">\n        <div class=\"ec-top\"><span class=\"ec-n\">04<\/span><span class=\"ec-v\">25 分<\/span><\/div>\n        <div class=\"ec-t\">计算机网络<\/div>\n        <div class=\"ec-s\">一群机器怎么连起来。五层协议栈，从物理层的电信号一路走到应用层的 HTTP，全是算得出来、推得出来的题。<\/div>\n        <div class=\"ec-m\"><span>6 章<\/span><span>14 个交互动画<\/span><span>子网划分 / 拥塞控制<\/span><\/div>\n        <div class=\"ec-x\">全靠前三门撑着：<b>路由算路<\/b>用数据结构的图算法、<b>网卡收包<\/b>靠计组的 DMA 与中断、<b>socket<\/b> 属于 OS<\/div>\n        <div class=\"ec-go\">进入计算机网络页<\/div>\n      <\/a>\n\n    <\/div>\n  <\/section>\n\n  <section class=\"sec\">\n    <div class=\"sub\">四门课怎么互相撑着<span class=\"note\">按「从地基到应用」的顺序排<\/span><\/div>\n    <div class=\"panel\">\n      <div class=\"chain\">\n        <div class=\"chain-c\" style=\"--kc:var(--ds)\">\n          <div class=\"cn\">第 1 层<\/div>\n          <div class=\"ct\">数据结构<\/div>\n          <div class=\"cs\">提供思维工具<br>不依赖任何其它三门<\/div>\n        <\/div>\n        <div class=\"chain-c\" style=\"--kc:var(--co)\">\n          <div class=\"cn\">第 2 层<\/div>\n          <div class=\"ct\">计算机组成原理<\/div>\n          <div class=\"cs\">硬件底座<br>讲清「机器怎么执行」<\/div>\n        <\/div>\n        <div class=\"chain-c\" style=\"--kc:var(--os)\">\n          <div class=\"cn\">第 3 层<\/div>\n          <div class=\"ct\">操作系统<\/div>\n          <div class=\"cs\">站在计组肩上<br>虚拟存储靠地址转换<\/div>\n        <\/div>\n        <div class=\"chain-c\" style=\"--kc:var(--cn)\">\n          <div class=\"cn\">第 4 层<\/div>\n          <div class=\"ct\">计算机网络<\/div>\n          <div class=\"cs\">把前三门全用上<br>才是完整的一台联网机器<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"tip i\" style=\"margin-top:16px\"><span class=\"ti\">为什么这样排<\/span><span>\n        <b>数据结构<\/b>给的是「怎么组织数据」的方法，跟具体机器无关，所以它排在最前、也最好先学。\n        <b>计组<\/b>回答「这台机器是怎么跑起来的」—— 中断、DMA、存储层次这些概念，后面两门都要用。\n        <b>操作系统<\/b>是软硬件的第一层接口：它的虚拟存储、中断处理、I/O 管理，全都建立在计组讲过的机制之上。\n        <b>计网<\/b>最综合：路由算法来自数据结构，网卡收包靠计组的 DMA 与中断，socket 是 OS 的系统调用 ——\n        这四门在计网这一层是全打通的，四份页面的 <b>SECTION 00<\/b> 里都写了这些交叉点。<\/span><\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"sec\">\n    <div class=\"sub\">分值分布与复习投入<span class=\"note\">按分值降序，条长按分值等比<\/span><\/div>\n    <div class=\"panel\">\n      <div class=\"row\"><div class=\"row-n\">数据结构<\/div>\n        <div class=\"bar\"><i data-w=\"100\" style=\"background:linear-gradient(90deg,#c4b0f5,#7c3aed)\"><\/i><\/div>\n        <div class=\"row-v\">45<\/div><div class=\"row-b\" style=\"background:#f2ecfe;color:#7c3aed\">30%<\/div><\/div>\n      <div class=\"row\"><div class=\"row-n\">计算机组成原理<\/div>\n        <div class=\"bar\"><i data-w=\"100\" style=\"background:linear-gradient(90deg,#93b4fd,#2563eb)\"><\/i><\/div>\n        <div class=\"row-v\">45<\/div><div class=\"row-b\" style=\"background:#eaf0ff;color:#2563eb\">30%<\/div><\/div>\n      <div class=\"row\"><div class=\"row-n\">操作系统<\/div>\n        <div class=\"bar\"><i data-w=\"78\" style=\"background:linear-gradient(90deg,#5eead4,#0f766e)\"><\/i><\/div>\n        <div class=\"row-v\">35<\/div><div class=\"row-b\" style=\"background:#e0f5f2;color:#0f766e\">23%<\/div><\/div>\n      <div class=\"row\"><div class=\"row-n\">计算机网络<\/div>\n        <div class=\"bar\"><i data-w=\"56\" style=\"background:linear-gradient(90deg,#fcd34d,#d97706)\"><\/i><\/div>\n        <div class=\"row-v\">25<\/div><div class=\"row-b\" style=\"background:#fff4e3;color:#d97706\">17%<\/div><\/div>\n      <div class=\"total\">\n        <span>合计 <b>150<\/b> 分 · 27 章<\/span>\n        <span>单选 40 分（2 分 × 20 题）· 综合应用 70 分（7 分 × 10 题）<\/span>\n      <\/div>\n      <div class=\"tip s\"><span class=\"ti\">时间怎么分<\/span><span>\n        分值就是投入比。<b>数据结构与计组各 45 分，是绝对主力<\/b>，应该占掉大部分复习时间；\n        OS 35 分次之；计网只有 25 分，但它是四门里「投入产出比最高」的 —— 题型固定、全是计算和过程推演，\n        <b>练熟就是稳分，性价比极高<\/b>。不要因为分值低就把它放到最后才看。<\/span><\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"sec\">\n    <div class=\"sub\">每份页面怎么用<span class=\"note\">四份的结构完全一致，学会一份就等于学会四份<\/span><\/div>\n    <div class=\"grid g2\">\n      <div class=\"card\">\n        <h4>1. 先看 SECTION 00 <span class=\"pt\">别跳过<\/span><\/h4>\n        <p>每份页面的第一节都是「四门课全景定位」：这门课在 408 里占多少分、它和另外三门在哪几个点上交叉。<\/p>\n        <ul>\n          <li>这张图决定了你复习时的<b>联想方向<\/b><\/li>\n          <li>看到「虚拟存储」，要立刻想到「这是计组的地址转换 + OS 的页表」<\/li>\n        <\/ul>\n      <\/div>\n      <div class=\"card\">\n        <h4>2. 用 hero 里的分值权重定顺序<\/h4>\n        <p>每份页面的开头都有一张「各章分值权重与复习优先级」，<b>按分值降序排，不是按章节号<\/b>。<\/p>\n        <ul>\n          <li>分三档：<b>核心<\/b>（红，必考大题）/ <b>主力<\/b>（科目主色）/ <b>补充<\/b>（灰）<\/li>\n          <li>章节号是教材顺序，分值顺序才是复习顺序<\/li>\n        <\/ul>\n      <\/div>\n      <div class=\"card\">\n        <h4>3. 先自己推一遍，再用动画核对 <span class=\"pt\">关键<\/span><\/h4>\n        <p>每章都是「考点卡片 → 原理动画」。<b>顺序反过来没效果<\/b> —— 先看动画只会让你产生「原来是这样的」的错觉。<\/p>\n        <ul>\n          <li>计算器类（子网划分、分片、时延）：先手算，再改参数验证<\/li>\n          <li>过程类（握手、滑窗、路由）：先在纸上画出来，再逐帧对<\/li>\n        <\/ul>\n      <\/div>\n      <div class=\"card\">\n        <h4>4. 动画速度可以调<\/h4>\n        <p>侧栏底部有「<b>慢 / 中 / 快<\/b>」三个档，默认是「中」。切换后对下一次播放生效。<\/p>\n        <ul>\n          <li>第一次看建议切「<b>慢<\/b>」—— 要一边看图、一边对文字、一边想原理，快一点就跟不上<\/li>\n          <li>熟悉之后切「快」过一遍即可<\/li>\n        <\/ul>\n      <\/div>\n    <\/div>\n    <div class=\"tip e\" style=\"margin-top:16px\"><span class=\"ti\">两个必须知道的约定<\/span><span>\n      <b>① 公式一律是纯文本 + Unicode 符号<\/b>（× ÷ ⊕ ≥ ≈ ² ³），没有 LaTeX —— 这样在笔记软件里也能正常显示。\n      <b>② 四门课各有主色<\/b>：数据结构紫、计组蓝、OS 青绿、计网琥珀橙。在页面之间跳转时，看颜色就知道自己现在在哪一门。<\/span><\/div>\n  <\/section>\n\n  <footer>\n    408 四门课 · 交互式原理全景<br>\n    四份单文件网页，全部零外部依赖、断网可用、公式纯文本<br>\n    这是四门课的<b>离线合集版<\/b> —— 双击就能打开，断网也能用，不需要其它文件\n  <\/footer>\n<\/main>\n\n<div class=\"totop\" id=\"totop\">↑<\/div>\n\n<script>\nconst $ = id => document.getElementById(id);\nwindow.addEventListener('scroll', ()=>{\n  const h = document.documentElement.scrollHeight - window.innerHeight;\n  $('progress').style.width = (h > 0 ? (window.scrollY / h * 100) : 0) + '%';\n  $('totop').classList.toggle('on', window.scrollY > 500);\n});\n$('totop').onclick = ()=>window.scrollTo({top:0,behavior:'smooth'});\nsetTimeout(()=>{ document.querySelectorAll('.bar i').forEach(f=>f.style.width = f.dataset.w + '%'); }, 300);\n<\/script>\n<script>\n/* 打包桥接：见 build_四门课合集.py 的说明 */\n(function(){\n  document.addEventListener(\"click\", function(e){\n    var a = e.target && e.target.closest ? e.target.closest(\"a[href]\") : null;\n    if(!a) return;\n    var href = a.getAttribute(\"href\") || \"\";\n    if(href.charAt(0) === \"#\"){\n      var t = document.getElementById(href.slice(1));\n      if(t){ e.preventDefault(); t.scrollIntoView({ block: \"start\" }); }\n      return;\n    }\n    if(!/\\.html$/i.test(href)) return;\n    e.preventDefault();\n    try { parent.postMessage({ __pack: \"goto\", page: href }, \"*\"); } catch(err){}\n  }, true);\n})();\n<\/script>\n<\/body>\n<\/html>\n",
  "操作系统-交互式全景.html": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>408 操作系统 · 交互式全景<\/title>\n<style>\n:root{\n  --bg:#f4f6fa; --panel:#fff; --text:#171a21; --muted:#6b7280; --line:#e3e8ef;\n  --primary:#0f766e; --primary-l:#e4f5f2;\n  --accent:#d97706; --accent-l:#fff4e3;\n  --green:#15803d; --green-l:#e8f6ec;\n  --red:#dc2626; --red-l:#fdeceb;\n  --purple:#7c3aed; --purple-l:#f2ecfe;\n  --blue:#2563eb; --blue-l:#eaf0ff;\n  --cyan:#0891b2; --cyan-l:#e2f7fb;\n  --radius:12px;\n  --shadow:0 1px 2px rgba(16,24,40,.035),0 8px 22px -14px rgba(16,24,40,.15);\n}\n*{box-sizing:border-box}\nhtml{scroll-behavior:smooth}\nbody{\n  margin:0;background:var(--bg);color:var(--text);font-size:15px;line-height:1.8;\n  font-family:system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",\"PingFang SC\",sans-serif;\n  -webkit-font-smoothing:antialiased;\n}\n::-webkit-scrollbar{width:10px;height:10px}\n::-webkit-scrollbar-thumb{background:#cdd5e0;border-radius:6px;border:2px solid var(--bg)}\n::-webkit-scrollbar-thumb:hover{background:#b4bfcd}\n\n.progress{position:fixed;top:0;left:0;height:3px;width:0;z-index:99;\n  background:linear-gradient(90deg,var(--primary),var(--cyan));transition:width .1s linear}\n\n/* ---------- 布局 ---------- */\n.app{display:flex;align-items:flex-start}\n.sidebar{position:fixed;top:0;left:0;width:256px;height:100vh;background:var(--panel);\n  border-right:1px solid var(--line);padding:20px 14px;overflow-y:auto;z-index:50}\n.brand{padding:4px 10px 16px;border-bottom:1px dashed var(--line);margin-bottom:14px}\n.brand-t{font-size:15px;font-weight:800;letter-spacing:.2px}\n.brand-s{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.5}\n.nav{display:flex;flex-direction:column;gap:2px}\n.nav-sep{font-size:10.5px;font-weight:800;letter-spacing:1.2px;color:#b6c0cc;padding:12px 10px 5px}\n.speed{margin-top:20px;padding:13px 10px 2px;border-top:1px dashed var(--line)}\n.speed-t{font-size:10.5px;font-weight:800;letter-spacing:1.2px;color:#bcb6cc;margin-bottom:8px}\n.speed-b{display:flex;gap:5px}\n.speed-b button{flex:1;font-family:inherit;font-size:12px;font-weight:650;padding:6px 0;border-radius:7px;\n  border:1px solid var(--line);background:#fff;color:#6b6580;cursor:pointer;transition:.16s}\n.speed-b button:hover{border-color:var(--primary);color:var(--primary)}\n.speed-b button.on{background:var(--primary);border-color:var(--primary);color:#fff}\n.speed-note{font-size:10.5px;color:#bcb6cc;margin-top:7px;line-height:1.6}\n.nav-i{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;\n  text-decoration:none;color:#455061;font-size:13px;transition:.18s;border-left:2px solid transparent}\n.nav-i b{font-size:11px;font-weight:700;color:#9aa4b2;font-variant-numeric:tabular-nums;min-width:16px}\n.nav-i:hover{background:#f2f5f9;color:var(--text)}\n.nav-i.on{background:var(--primary-l);color:var(--primary);font-weight:650;border-left-color:var(--primary)}\n.nav-i.on b{color:var(--primary)}\n.nav-tag{font-size:10px;padding:1px 5px;border-radius:4px;margin-left:auto;font-weight:600}\n.t3{background:var(--red-l);color:var(--red)}\n.t2{background:var(--accent-l);color:var(--accent)}\n.t1{background:#eef2f7;color:#7b8798}\n\n.content{margin-left:256px;flex:1;min-width:0;max-width:1100px;padding:0 34px 90px}\n/* ---------- 小屏：顶部条 + 抽屉式章节导航 ---------- */\n.mtop{display:none}\n.navbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;\n  width:38px;height:38px;flex-shrink:0;padding:0;border-radius:10px;cursor:pointer;\n  border:1px solid var(--line);background:#fff}\n.navbtn i{display:block;width:16px;height:2px;border-radius:2px;background:#5c5773;transition:.2s}\n.navbtn.on i:nth-child(1){transform:translateY(6px) rotate(45deg)}\n.navbtn.on i:nth-child(2){opacity:0}\n.navbtn.on i:nth-child(3){transform:translateY(-6px) rotate(-45deg)}\n.mtop-t{font-size:13.5px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.scrim{position:fixed;inset:0;z-index:70;background:rgba(18,23,33,.45);\n  opacity:0;pointer-events:none;transition:opacity .22s}\n\n@media(max-width:980px){\n  .mtop{display:flex;align-items:center;gap:11px;position:fixed;top:0;left:0;right:0;z-index:90;\n    height:56px;padding:0 14px;background:rgba(255,255,255,.94);\n    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);\n    border-bottom:1px solid var(--line);box-shadow:0 8px 20px -16px rgba(16,24,40,.6)}\n  .sidebar{top:56px;height:calc(100vh - 56px);transform:translateX(-100%);\n    transition:transform .22s ease;z-index:80;box-shadow:none}\n  .sidebar.open{transform:none;box-shadow:0 20px 60px -18px rgba(16,24,40,.5)}\n  .scrim.on{opacity:1;pointer-events:auto}\n  .content{margin-left:0;padding:58px 16px 60px}\n  .hero{padding-top:20px}\n}\n\n/* ---------- Hero ---------- */\n.hero{padding:58px 0 34px;border-bottom:1px solid var(--line);margin-bottom:44px}\n.hero-k{font-size:11.5px;letter-spacing:2.6px;color:var(--primary);font-weight:700;text-transform:uppercase}\n.hero h1{font-size:32px;margin:14px 0 12px;font-weight:800;letter-spacing:-.4px;line-height:1.32}\n.hero p{color:var(--muted);margin:0 0 28px;max-width:620px;font-size:14px;line-height:1.9}\n.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:660px}\n@media(max-width:820px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}\n.stat{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 16px;box-shadow:var(--shadow)}\n.stat b{display:block;font-size:21px;font-weight:800;color:var(--primary);font-variant-numeric:tabular-nums;line-height:1.35}\n.stat span{display:block;font-size:11px;color:var(--muted);line-height:1.45}\n\n/* ---------- 四门课地图 ---------- */\n.subj{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:24px 0 0}\n@media(max-width:980px){.subj{grid-template-columns:repeat(2,minmax(0,1fr))}}\n.sj{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);\n  padding:15px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:.2s}\n.sj.cur{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-l),var(--shadow)}\n.sj.cur::before{content:\"当前\";position:absolute;top:0;right:0;background:var(--primary);color:#fff;\n  font-size:9.5px;font-weight:800;letter-spacing:.6px;padding:3px 9px;border-radius:0 0 0 9px}\n.sj-n{font-size:11px;font-weight:800;color:#b6c0cc;letter-spacing:1px}\n.sj-t{font-size:14.5px;font-weight:800;margin:3px 0 7px}\n.sj-s{font-size:11.5px;color:var(--muted);line-height:1.7}\n.sj-bar{height:6px;border-radius:3px;background:#eef2f7;margin-top:10px;overflow:hidden}\n.sj-bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#5eead4,var(--primary))}\n.sj.mut .sj-bar i{background:#c9d3e0}\n.sj.mut .sj-t{color:#8b95a3}\n/* ---------- 四门课地图的跳转（2026-09-29 补） ---------- */\n.hero-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}\n.home-link{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted);text-decoration:none;\n  border:1px solid var(--line);border-radius:20px;padding:4px 14px;transition:.18s;background:#fff;white-space:nowrap}\n.home-link:hover{color:var(--primary);border-color:var(--primary);box-shadow:0 4px 12px -8px rgba(16,24,40,.4)}\na.sj{text-decoration:none;color:inherit;cursor:pointer}\na.sj:hover{border-color:var(--primary);transform:translateY(-2px);\n  box-shadow:0 10px 22px -12px rgba(16,24,40,.34),var(--shadow)}\na.sj:hover .sj-t{color:var(--primary)}\na.sj::after{content:\"进入 →\";position:absolute;right:12px;bottom:8px;font-size:10.5px;font-weight:800;\n  color:var(--primary);opacity:0;transform:translateX(-4px);transition:.2s}\na.sj:hover::after{opacity:1;transform:translateX(0)}\n.sj.cur::after{content:\"本页\";position:absolute;right:12px;bottom:8px;font-size:10.5px;\n  font-weight:800;color:#8b95a main class=\"content\">\n\n<div class=\"mtop\">\n  <button class=\"navbtn\" id=\"navbtn\" type=\"button\" aria-label=\"章节导航\" aria-expanded=\"false\" aria-controls=\"nav\"><i><\/i><i><\/i><i><\/i><\/button>\n  <span class=\"mtop-t\" data-subj=\"操作系统\">操作系统<\/span>\n<\/div>\n\n<header class=\"hero\">\n  <div class=\"hero-top\">\n    <div class=\"hero-k\">408 · Operating Systems<\/div>\n    <a class=\"home-link\" href=\"408-全景总览.html\">← 回 408 全景总览<\/a>\n  <\/div>\n  <h1>操作系统<br>交互式原理全景<\/h1>\n  <p>408 四门课里，操作系统是「承上启下」的那一门：向上承接数据结构提供的队列、树、图、位图，向下直连计算机组成原理的中断、地址转换与 I/O 机制。这一页把它放回四门课的整体框架里讲，每个关键考点都标出跨科目的接口。<\/p>\n  <div class=\"stats\">\n    <div class=\"stat\"><b>35<\/b><span>本科分值（满分 150）<\/span><\/div>\n    <div class=\"stat\"><b>7<\/b><span>章节全覆盖<\/span><\/div>\n    <div class=\"stat\"><b>16<\/b><span>交互动画<\/span><\/div>\n    <div class=\"stat\"><b>100%<\/b><span>可离线打开<\/span><\/div>\n  <\/div>\n\n  <div class=\"subj\">\n    <a class=\"sj mut\" href=\"数据结构-交互式全景.html\">\n      <div class=\"sj-n\">01<\/div>\n      <div class=\"sj-t\">数据结构<\/div>\n      <div class=\"sj-s\">线性表 / 树 / 图 / 查找 / 排序<br>OS 的队列、目录树、位图都源于此<\/div>\n      <div class=\"sj-bar\"><i style=\"width:100%\"><\/i><\/div>\n    <\/a>\n    <a class=\"sj mut\" href=\"计算机组成原理-交互式全景.html\">\n      <div class=\"sj-n\">02<\/div>\n      <div class=\"sj-t\">计算机组成原理<\/div>\n      <div class=\"sj-s\">存储层次 / 中断 / 指令周期 / I/O<br>与 OS 交叉最深的科目<\/div>\n      <div class=\"sj-bar\"><i style=\"width:100%\"><\/i><\/div>\n    <\/a>\n    <div class=\"sj cur\">\n      <div class=\"sj-n\">03<\/div>\n      <div class=\"sj-t\">操作系统<\/div>\n      <div class=\"sj-s\">进程 / 内存 / 文件 / I/O 管理<br>本页<\/div>\n      <div class=\"sj-bar\"><i style=\"width:78%\"><\/i><\/div>\n    <\/div>\n    <a class=\"sj mut\" href=\"计算机网络-交互式全景.html\">\n      <div class=\"sj-n\">04<\/div>\n      <div class=\"sj-t\">计算机网络<\/div>\n      <div class=\"sj-s\">体系结构 / TCP-IP / 应用层<br>进程通信的延伸<\/div>\n      <div class=\"sj-bar\"><i style=\"width:56%\"><\/i><\/div>\n    <\/a>\n  <\/div>\n\n  <div class=\"rank\">\n    <div class=\"rank-h\">\n      <div class=\"rank-t\">各章分值权重与复习优先级<\/div>\n      <div class=\"rank-s\">按历年统考真题中的<b>大致分值降序<\/b>排列 —— 排在前面的章节，复习投入应当明显更多。分值区间为估计值，用于确定复习顺序，<b>非官方数据<\/b>。<\/div>\n    <\/div>\n\n    <div class=\"rank-r\"><div class=\"rank-n\">05 内存管理<\/div><div class=\"rank-bar\"><i data-w=\"100\" style=\"background:linear-gradient(90deg,#fca5a5,#dc2626)\"><\/i><\/div><div class=\"rank-v\">7-9<\/div><div class=\"rank-b tier1\">核心<\/div><\/div>\n    <div class=\"rank-r\"><div class=\"rank-n\">03 同步与互斥<\/div><div class=\"rank-bar\"><i data-w=\"100\" style=\"background:linear-gradient(90deg,#fca5a5,#dc2626)\"><\/i><\/div><div class=\"rank-v\">7-9<\/div><div class=\"rank-b tier1\">核心<\/div><\/div>\n    <div class=\"rank-r\"><div class=\"rank-n\">02 进程与线程<\/div><div class=\"rank-bar\"><i data-w=\"88\" style=\"background:linear-gradient(90deg,#fca5a5,#dc2626)\"><\/i><\/div><div class=\"rank-v\">6-8<\/div><div class=\"rank-b tier1\">核心<\/div><\/div>\n    <div class=\"rank-r\"><div class=\"rank-n\">04 死锁<\/div><div class=\"rank-bar\"><i data-w=\"50\" style=\"background:linear-gradient(90deg,#5eead4,#0f766e)\"><\/i><\/div><div class=\"rank-v\">3-5<\/div><div class=\"rank-b tier2\">主力<\/div><\/div>\n    <div class=\"rank-r\"><div class=\"rank-n\">06 文件管理<\/div><div class=\"rank-bar\"><i data-w=\"44\" style=\"background:linear-gradient(90deg,#5eead4,#0f766e)\"><\/i><\/div><div class=\"rank-v\">3-4<\/div><div class=\"rank-b tier2\">主力<\/div><\/div>\n    <div class=\"rank-r\"><div class=\"rank-n\">07 输入/输出管理<\/div><div class=\"rank-bar\"><i data-w=\"38\" style=\"background:linear-gradient(90deg,#5eead4,#0f766e)\"><\/i><\/div><div class=\"rank-v\">2-4<\/div><div class=\"rank-b tier2\">主力<\/div><\/div>\n    <div class=\"rank-r\"><div class=\"rank-n\">01 操作系统概述<\/div><div class=\"rank-bar\"><i data-w=\"31\" style=\"background:linear-gradient(90deg,#dde3ec,#b6c0cc)\"><\/i><\/div><div class=\"rank-v\">2-3<\/div><div class=\"rank-b tier3\">补充<\/div><\/div>\n\n    <div class=\"rank-sum\">\n      <div class=\"rank-legend\">\n        <span><i style=\"background:#dc2626\"><\/i>核心章（≥6 分）—— 大题高发区，要反复练<\/span>\n        <span><i style=\"background:#0f766e\"><\/i>主力章（3-5 分）—— 题型固定，吃透公式<\/span>\n        <span><i style=\"background:#b6c0cc\"><\/i>补充章（&lt;3 分）—— 单选为主，快速过<\/span>\n      <\/div>\n      <div class=\"rank-sum-r\"><div>核心 3 章<\/div><div class=\"rank-sum-bar\"><i data-w=\"65\" style=\"background:linear-gradient(90deg,#fca5a5,#dc2626)\"><\/i><\/div><div class=\"rank-sum-v\">65%<\/div><\/div>\n      <div class=\"rank-sum-r\"><div>主力 3 章<\/div><div class=\"rank-sum-bar\"><i data-w=\"28\" style=\"background:linear-gradient(90deg,#5eead4,#0f766e)\"><\/i><\/div><div class=\"rank-sum-v\">28%<\/div><\/div>\n      <div class=\"rank-sum-r\"><div>补充 1 章<\/div><div class=\"rank-sum-bar\"><i data-w=\"7\" style=\"background:linear-gradient(90deg,#dde3ec,#b6c0cc)\"><\/i><\/div><div class=\"rank-sum-v\">7%<\/div><\/div>\n      <div class=\"rank-note\">\n        <b>怎么用这张表：<\/b>核心 3 章占了本科约 <b>65%<\/b> 的分值，而且正是<b>大题的高发区<\/b> ——\n        「用信号量写同步互斥代码」和「地址转换 + 页面置换」几乎每年都出现。主力 3 章题型固定（银行家算法、索引计算、磁盘调度），\n        吃透公式就能拿分；概述只出单选，花半天过一遍概念即可。<br>\n        <b>与其它科目的联动：<\/b>第 05 章（内存管理）与计组的「存储系统」、第 07 章（I/O 管理）与计组的「I/O 系统」\n        是两对孪生章节，<b>建议同步学<\/b>，它们合起来是 80 分里的重头。\n      <\/div>\n    <\/div>\n  <\/div>\n<\/header>\n\n<\!-- ==================== 408 全局定位 ==================== -->\n<section class=\"sec\" id=\"g0\">\n  <div class=\"sec-head\">\n    <span class=\"sec-num\">SECTION 00<\/span>\n    <h2>四门课全景定位<\/h2>\n    <span class=\"weight w3\">先看这一节<\/span>\n  <\/div>\n\n  <div class=\"tip i\"><span class=\"ti\">为什么先看这个<\/span><span>408 的四门课不是四条平行线。命题人最喜欢出的题，恰恰<b>落在两门课的交界处<\/b>——比如「虚拟地址怎么变成物理地址」既考 OS 的页表也考计组的地址转换；「生产者-消费者用信号量怎么写」既考 OS 的同步机制也用数据结构的队列。把交界处想明白了，四门课才是通的。<\/span><\/div>\n\n  <div class=\"sub\">四门课的分值与章节骨架<\/div>\n  <div class=\"grid g2\">\n    <div class=\"card\">\n      <h4>分值分布（共 150 分）<\/h4>\n      <table class=\"tb\">\n        <tr><th>科目<\/th><th>分值<\/th><th>占比<\/th><\/tr>\n        <tr><td>数据结构<\/td><td class=\"mono\">45<\/td><td>30%<\/td><\/tr>\n        <tr><td>计算机组成原理<\/td><td class=\"mono\">45<\/td><td>30%<\/td><\/tr>\n        <tr><td><b>操作系统<\/b><\/td><td class=\"mono\"><b>35<\/b><\/td><td>约 23%<\/td><\/tr>\n        <tr><td>计算机网络<\/td><td class=\"mono\">25<\/td><td>约 17%<\/td><\/tr>\n      <\/table>\n      <div class=\"fm\">计组 + 操作系统 = 80 分，超过一半\n两门课共享「存储管理」和「I/O」两条主线<\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>操作系统内部结构（35 分的分布）<\/h4>\n      <table class=\"tb\">\n        <tr><th>章节<\/th><th>权重<\/th><th>典型题<\/th><\/tr>\n        <tr><td>进程与线程<\/td><td>高<\/td><td>状态转换、调度计算<\/td><\/tr>\n        <tr><td>同步与互斥<\/td><td>高<\/td><td><b>大题常客<\/b>：信号量编程<\/td><\/tr>\n        <tr><td>内存管理<\/td><td>高<\/td><td>地址转换、页面置换<\/td><\/tr>\n        <tr><td>文件管理<\/td><td>中<\/td><td>索引结构、空闲空间<\/td><\/tr>\n        <tr><td>I/O 管理<\/td><td>中<\/td><td>磁盘调度计算<\/td><\/tr>\n        <tr><td>概述<\/td><td>低<\/td><td>概念辨析（单选）<\/td><\/tr>\n      <\/table>\n    <\/div>\n  <\/div>\n\n  <div class=\"sub p\">跨科目接口图：OS 与另外三门的连接点<\/div>\n  <div class=\"grid g2\">\n    <div class=\"xlink\">\n      <h4><span class=\"tagx\">OS × 计组<\/span>交叉最深，80 分里有大半在这里<\/h4>\n      <div class=\"xitem\"><div class=\"xa\">虚拟存储<\/div><div class=\"xb\">OS 的页式管理要用计组的地址转换硬件；TLB 就是 Cache 思想用在页表上<\/div><\/div>\n      <div class=\"xitem\"><div class=\"xa\">中断与异常<\/div><div class=\"xb\">计组讲中断响应的硬件流程，OS 讲中断处理程序做什么（时钟中断驱动调度）<\/div><\/div>\n      <div class=\"xitem\"><div class=\"xa\">I/O 方式<\/div><div class=\"xb\">程序查询 / 中断 / DMA / 通道——计组讲硬件原理，OS 讲软件层次怎么管<\/div><\/div>\n      <div class=\"xitem\"><div class=\"xa\">进程切换<\/div><div class=\"xb\">保存/恢复的正是计组里的 PC、PSW、通用寄存器<\/div><\/div>\n      <div class=\"xitem\"><div class=\"xa\">存储层次<\/div><div class=\"xb\">寄存器—Cache—主存—辅存，OS 管的是后两级的调度<\/div><\/div>\n    <\/div>\n    <div class=\"xlink\" style=\"border-left-color:var(--blue)\">\n      <h4><span class=\"tagx\" style=\"background:var(--blue-l);color:var(--blue)\">OS × 数据结构<\/span>算法与结构的直接应用<\/h4>\n      <div class=\"xitem\"><div class=\"xa\">调度队列<\/div><div class=\"xb\">就绪队列、阻塞队列本质就是队列；多级反馈队列是队列的组合<\/div><\/div>\n      <div class=\"xitem\"><div class=\"xa\">目录结构<\/div><div class=\"xb\">树形目录 = 树；无环图目录 = 有向无环图<\/div><\/div>\n      <div class=\"xitem\"><div class=\"xa\">死锁检测<\/div><div class=\"xb\">资源分配图化简 = 图的拓扑/环检测<\/div><\/div>\n      <div class=\"xitem\"><div class=\"xa\">空闲空间管理<\/div><div class=\"xb\">位示图 = 位图；成组链接 = 链表 + 数组<\/div><\/div>\n      <div class=\"xitem\"><div class=\"xa\">页面置换<\/div><div class=\"xb\">LRU 的实现要用栈或链表（计组的 Cache 替换同理）<\/div><\/div>\n    <\/div>\n    <div class=\"xlink\" style=\"border-left-color:var(--cyan)\">\n      <h4><span class=\"tagx\" style=\"background:var(--cyan-l);color:#0b5d70\">OS × 计网<\/span>进程通信向外延伸<\/h4>\n      <div class=\"xitem\"><div class=\"xa\">进程间通信<\/div><div class=\"xb\">socket 是消息传递机制在网络上的延伸<\/div><\/div>\n      <div class=\"xitem\"><div class=\"xa\">缓冲区<\/div><div class=\"xb\">OS 的缓冲池思想，与 TCP 的发送/接收缓冲区同源<\/div><\/div>\n      <div class=\"xitem\"><div class=\"xa\">中断处理<\/div><div class=\"xb\">网卡收包是靠中断通知 CPU 的（NAPI 是中断 + 轮询的混合）<\/div><\/div>\n    <\/div>\n    <div class=\"xlink\" style=\"border-left-color:var(--accent)\">\n      <h4><span class=\"tagx\" style=\"background:var(--accent-l);color:#8a5209\">复习路线建议<\/span><\/h4>\n      <div class=\"xitem\"><div class=\"xa\">先修<\/div><div class=\"xb\">学 OS 前先过一遍计组的<b>存储层次<\/b>和<b>中断机制<\/b><\/div><\/div>\n      <div class=\"xitem\"><div class=\"xa\">同步推进<\/div><div class=\"xb\">OS 的「内存管理」和计组的「存储系统」放在一起学，一次打通<\/div><\/div>\n      <div class=\"xitem\"><div class=\"xa\">难点排序<\/div><div class=\"xb\">同步互斥（信号量编程）＞ 内存管理 ＞ 进程调度计算 ＞ 文件索引 ＞ 概念辨析<\/div><\/div>\n      <div class=\"xitem\"><div class=\"xa\">大题分布<\/div><div class=\"xb\">408 的 OS 大题通常出「信号量编程」或「地址转换 + 页面置换」<\/div><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"sub\">学这一页之前，你需要先知道<\/div>\n  <div class=\"grid g3\">\n    <div class=\"card\">\n      <h4>计组 · 存储层次<\/h4>\n      <p>寄存器 — Cache — 主存 — 辅存。OS 管的是<b>主存与辅存之间的调度<\/b>（虚拟内存），而 Cache 归硬件管。这个分工要分清。<\/p>\n    <\/div>\n    <div class=\"card\">\n      <h4>计组 · 中断<\/h4>\n      <p>中断隐指令做了三件事：<b>关中断、保存断点、取中断服务程序入口<\/b>。OS 的中断处理程序就是在它之后接手的。<\/p>\n    <\/div>\n    <div class=\"card\">\n      <h4>计组 · 地址<\/h4>\n      <p>逻辑地址 vs 物理地址的区别，是理解 OS 内存管理的前提。计组讲的是「怎么转」，OS 讲的是「谁来管这张表」。<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- ==================== 第 1 章 ==================== -->\n<section class=\"sec\" id=\"os1\">\n  <div class=\"sec-head\">\n    <span class=\"sec-num\">CHAPTER 01<\/span>\n    <h2>操作系统概述<\/h2>\n    <span class=\"weight w2\">基础 · 单选为主<\/span>\n  <\/div>\n\n  <div class=\"tip i\"><span class=\"ti\">本章定位<\/span><span>概念密度大、几乎不考大题，但有两个点会连着后面章节一起考：<b>内核态 / 用户态与特权指令<\/b>（理解系统调用和中断的前提）、<b>并发与共享<\/b>（后面所有同步问题的根）。这章快速过，但这两个点要真懂。<\/span><\/div>\n\n  <div class=\"sub\">考点清单<\/div>\n  <div class=\"grid g2\">\n    <div class=\"card\">\n      <h4>1. 操作系统的功能<\/h4>\n      <ul>\n        <li><b>处理机管理<\/b>：进程控制、同步、通信、调度<\/li>\n        <li><b>存储器管理<\/b>：内存分配回收、地址映射、内存保护、内存扩充<\/li>\n        <li><b>文件管理<\/b>：文件存储空间、目录、读写管理、共享保护<\/li>\n        <li><b>设备管理<\/b>：缓冲、设备分配、设备处理（虚拟设备）<\/li>\n        <li>接口：<b>命令接口<\/b>（联机/脱机）、<b>程序接口<\/b>（系统调用）、GUI<\/li>\n      <\/ul>\n      <div class=\"tip m\"><span class=\"ti\">辨析<\/span><span>「编译程序」「汇编程序」属于<b>语言处理程序<\/b>，是系统软件但不属于 OS。「数据库管理系统」也是系统软件。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>2. 四大特征 <span class=\"pt hot\">必考<\/span><\/h4>\n      <table class=\"tb\">\n        <tr><th>特征<\/th><th>含义<\/th><\/tr>\n        <tr><td><b>并发<\/b><\/td><td>宏观上同时、微观上交替。单核同一时刻只有一个程序在运行<\/td><\/tr>\n        <tr><td><b>共享<\/b><\/td><td>互斥共享（打印机）、同时共享（磁盘）<\/td><\/tr>\n        <tr><td><b>虚拟<\/b><\/td><td>时分复用（CPU）、空分复用（内存）<\/td><\/tr>\n        <tr><td><b>异步<\/b><\/td><td>进程走走停停，以不可预知的速度推进<\/td><\/tr>\n      <\/table>\n      <div class=\"fm g\">并发 ≠ 并行\n并发：单核也能做到（宏观同时、微观交替）\n并行：必须多核，同一时刻真正同时执行<\/div>\n      <div class=\"tip s\"><span class=\"ti\">关系<\/span><span><b>并发和共享互为存在条件<\/b>：没有并发就谈不上共享，没有共享并发也无法有效工作。这是常考的一句话。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>3. 运行机制：两种状态 <span class=\"pt hot\">核心<\/span><\/h4>\n      <table class=\"tb\">\n        <tr><th><\/th><th>用户态（目态）<\/th><th>内核态（管态）<\/th><\/tr>\n        <tr><td>能执行的指令<\/td><td>只能非特权指令<\/td><td>全部指令<\/td><\/tr>\n        <tr><td>典型场景<\/td><td>应用程序运行<\/td><td>中断处理、系统调用、内核代码<\/td><\/tr>\n      <\/table>\n      <div class=\"fm\">特权指令（只能内核态执行）\n  开/关中断、I/O 指令、置时钟、清主存、\n  修改 PSW、设置页表寄存器、加载页表\n\n用户态 → 内核态：唯一途径是 <b>中断 / 异常 / 系统调用<\/b>\n内核态 → 用户态：执行特权指令修改 PSW<\/div>\n      <div class=\"tip e\"><span class=\"ti\">易错<\/span><span>「陷阱指令（trap）」是<b>用户态主动引发<\/b>的，属于内部异常，不是特权指令。用户程序可以执行 trap，但 trap 执行后 CPU 就进了内核态。另外，<b>陷入（trap）<\/b>一词也可以泛指「进入内核态」这件事。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>4. 中断与异常<\/h4>\n      <table class=\"tb\">\n        <tr><th>类型<\/th><th>来源<\/th><th>例子<\/th><\/tr>\n        <tr><td><b>外中断<\/b><br>（中断）<\/td><td>CPU 外部<\/td><td>时钟中断、I/O 完成、键盘<\/td><\/tr>\n        <tr><td><b>内中断<\/b><br>（异常）<\/td><td>CPU 内部<\/td><td>陷入 trap、除零、缺页、非法操作码、地址越界<\/td><\/tr>\n      <\/table>\n      <div class=\"fm a\">异常再分三类\n故障 fault：可修复，返回当前指令（如缺页）\n自陷 trap：有意引发，如系统调用\n终止 abort：不可恢复，如除零<\/div>\n      <div class=\"tip i\"><span class=\"ti\">与计组的接口<\/span><span>这里就是 OS 与计组的交叉点：计组讲<b>中断响应<\/b>的硬件流程（中断隐指令），OS 讲<b>中断处理程序<\/b>进去之后做什么。见本页「408 全局定位」。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>5. 系统调用 <span class=\"pt hot\">必考<\/span><\/h4>\n      <ul>\n        <li>操作系统提供给应用程序的<b>程序接口<\/b>，是用户态使用内核功能的唯一入口<\/li>\n        <li>发生系统调用时 CPU 从<b>用户态切换到内核态<\/b>，由内核代为完成，再返回用户态<\/li>\n        <li>分类：设备管理、文件管理、进程控制、进程通信、内存管理<\/li>\n      <\/ul>\n      <div class=\"fm b\">库函数 vs 系统调用\nprintf() 是库函数 —— 它内部可能调用 write() 系统调用\n但也有一些库函数（如 strcpy）完全不涉及系统调用<\/div>\n      <div class=\"tip m\"><span class=\"ti\">考点<\/span><span>「哪些操作需要进内核态」是经典送分题：进程切换、文件读写、内存分配、设备操作 <b>需要<\/b>；算术运算、字符串比较、向变量赋值 <b>不需要<\/b>。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>6. 内核结构<\/h4>\n      <table class=\"tb\">\n        <tr><th>结构<\/th><th>特点<\/th><\/tr>\n        <tr><td><b>宏内核<\/b><br>（大内核）<\/td><td>所有功能都在内核，性能高；但结构复杂、难维护。<b>Linux 属于此类<\/b><\/td><\/tr>\n        <tr><td><b>微内核<\/b><\/td><td>只留最基本功能（进程管理、中断），其余移到用户态。可靠性高、易扩展；但<b>态切换频繁、性能开销大<\/b><\/td><\/tr>\n        <tr><td>分层<\/td><td>自底向上分层，便于调试，但效率低<\/td><\/tr>\n        <tr><td>模块化<\/td><td>内核模块可动态加载，Linux 支持<\/td><\/tr>\n      <\/table>\n      <div class=\"tip s\"><span class=\"ti\">一句话<\/span><span>微内核的核心思想是<b>机制与策略分离<\/b>：内核只提供机制（如消息传递），把策略（如具体怎么调度）交给用户态服务进程。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>7. 引导与其它<\/h4>\n      <ul>\n        <li>启动流程：<b>CPU 复位 → BIOS 自检 → 读 MBR（主引导记录）→ 引导程序 → 加载 OS 内核<\/b><\/li>\n        <li>OS 的分类：批处理（单道 / 多道）、分时、实时（硬实时 / 软实时）、网络、分布式、嵌入式<\/li>\n        <li>分时系统的时间片用完就切换，<b>交互性<\/b>是它的核心目标<\/li>\n        <li>实时系统的首要目标是<b>在截止期限内完成<\/b>，而不是快<\/li>\n        <li>分布式系统各节点<b>无主从之分<\/b>；网络系统有<\/li>\n      <\/ul>\n    <\/div>\n  <\/div>\n\n  <div class=\"sub a\">原理动画<\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 01 · 系统调用：用户态是怎么进内核态的<span class=\"tag\">逐步播放<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <button class=\"btn\" id=\"scPlay\">自动播放<\/button>\n        <button class=\"btn gh\" id=\"scNext\">下一步 ▸<\/button>\n        <button class=\"btn gy\" id=\"scReset\">重置<\/button>\n        <label style=\"margin-left:8px\">选择调用<\/label>\n        <select id=\"scPick\">\n          <option value=\"read\">read()　读文件<\/option>\n          <option value=\"fork\">fork()　创建进程<\/option>\n          <option value=\"ioctl\">设备 I/O 指令（特权指令）<\/option>\n        <\/select>\n      <\/div>\n      <div id=\"scStage\"><\/div>\n      <div class=\"steps\" id=\"scSteps\" style=\"margin-top:16px\"><\/div>\n      <div id=\"scNote\" style=\"margin-top:12px\"><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- ==================== 第 2 章 ==================== -->\n<section class=\"sec\" id=\"os2\">\n  <div class=\"sec-head\">\n    <span class=\"sec-num\">CHAPTER 02<\/span>\n    <h2>进程与线程<\/h2>\n    <span class=\"weight w3\">高频 · 必有大题<\/span>\n  <\/div>\n\n  <div class=\"tip i\"><span class=\"ti\">本章定位<\/span><span>OS 分值最集中的一块。<b>进程状态转换<\/b>是选择题的常客，<b>调度算法的计算<\/b>几乎每年都有一道（求周转时间、带权周转时间、画甘特图）。这两类题都有固定套路，把动画点几遍就熟了。章节末尾的调度对比器可以直接输入数据验算你的手算结果。<\/span><\/div>\n\n  <div class=\"sub\">考点清单<\/div>\n  <div class=\"grid g2\">\n    <div class=\"card\">\n      <h4>1. 进程与 PCB <span class=\"pt\">必考<\/span><\/h4>\n      <div class=\"fm\">进程 = 程序段 + 数据段 + PCB\nPCB 是进程存在的<b>唯一标志<\/b><\/div>\n      <ul>\n        <li>PCB 内容：进程描述信息（PID/UID）、控制与管理信息、资源分配清单、处理机相关信息（各寄存器值）<\/li>\n        <li>进程特征：<b>动态性<\/b>（最基本）、并发性、独立性、异步性、结构性<\/li>\n        <li>进程是<b>资源分配<\/b>的基本单位，线程是<b>调度<\/b>的基本单位<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <h4>2. 进程状态转换 <span class=\"pt hot\">必考<\/span><\/h4>\n      <div class=\"fm g\">三态：运行 → 就绪 → 阻塞\n五态：再加 创建、终止\n七态：再加 就绪挂起、阻塞挂起\n\n合法转换\n  就绪 → 运行：被调度程序选中\n  运行 → 就绪：时间片用完 / 被抢占\n  运行 → 阻塞：主动请求资源（如等 I/O）★主动\n  阻塞 → 就绪：等待的事件发生了 ★被动\n  创建 → 就绪、运行 → 终止\n\n<b>不可能<\/b>：阻塞 → 运行（必须经过就绪）<\/div>\n      <div class=\"tip e\"><span class=\"ti\">高频陷阱<\/span><span>「<b>阻塞→运行<\/b>」永远错。进程被唤醒后只是回到就绪队列，还要再被调度才能运行。另外「运行→阻塞」是进程<b>主动<\/b>行为，「运行→就绪」是<b>被动<\/b>（被剥夺）。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>3. 进程控制原语<\/h4>\n      <ul>\n        <li>原语的特点：<b>执行期间不可中断<\/b>（靠关中断实现）<\/li>\n        <li>创建：申请 PCB → 分配资源 → 初始化 PCB → 插入就绪队列<\/li>\n        <li>终止：找到 PCB → 若在运行则剥夺 CPU → 释放资源 → 移出队列<\/li>\n        <li>阻塞 / 唤醒：<b>成对使用<\/b>，阻塞是主动的，唤醒是其他进程或中断处理程序做的<\/li>\n        <li>进程切换要保存上下文（PC、PSW、通用寄存器）→ <b>这正是计组的接口点<\/b><\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <h4>4. 进程通信<\/h4>\n      <table class=\"tb\">\n        <tr><th>方式<\/th><th>特点<\/th><\/tr>\n        <tr><td>共享存储<\/td><td>最快，但需要同步互斥；分「基于数据结构」和「基于存储区」<\/td><\/tr>\n        <tr><td>消息传递<\/td><td>以格式化消息为单位；直接（指名收/发）或间接（信箱）<\/td><\/tr>\n        <tr><td>管道通信<\/td><td>半双工、写入缓冲区、需要同步互斥；本质是共享文件<\/td><\/tr>\n      <\/table>\n      <div class=\"tip m\"><span class=\"ti\">注意<\/span><span>共享存储的两种方式中，<b>基于存储区<\/b>的共享速度更快、更灵活，因为不受数据结构格式的限制。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>5. 线程 <span class=\"pt hot\">必考<\/span><\/h4>\n      <div class=\"fm b\">线程私有：程序计数器、寄存器、栈、线程 ID\n线程共享：地址空间、全局变量、打开的文件、信号处理<\/div>\n      <table class=\"tb\">\n        <tr><th><\/th><th>用户级线程<\/th><th>内核级线程<\/th><\/tr>\n        <tr><td>管理者<\/td><td>用户库函数<\/td><td>操作系统内核<\/td><\/tr>\n        <tr><td>切换开销<\/td><td>小（不用进内核）<\/td><td>大（要进内核）<\/td><\/tr>\n        <tr><td>并发能力<\/td><td>一个线程阻塞则<b>整个进程阻塞<\/b><\/td><td>可多线程真正并行<\/td><\/tr>\n        <tr><td>内核是否可见<\/td><td>不可见<\/td><td>可见<\/td><\/tr>\n      <\/table>\n      <div class=\"tip s\"><span class=\"ti\">多线程模型<\/span><span>多对一（用户级，效率低）、一对一（内核级，开销大）、<b>多对多<\/b>（前两者折中，最优）。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>6. 处理机调度<\/h4>\n      <ul>\n        <li>三级调度：<b>高级<\/b>（作业调度，外存→内存）、<b>中级<\/b>（内存调度，对换）、<b>低级<\/b>（进程调度，最高频）<\/li>\n        <li>调度时机：创建、终止、阻塞、唤醒、时间片到、更高优先级进程就绪<\/li>\n        <li><b>不能<\/b>进行调度的情况：中断处理过程中、进程访问临界资源时、原子操作中<\/li>\n        <li>抢占式 vs 非抢占式：抢占式响应快但切换开销大、可能影响一致性<\/li>\n      <\/ul>\n      <div class=\"fm a\">调度评价指标\n周转时间    = 完成时间 − 到达时间\n带权周转时间 = 周转时间 ÷ 服务时间   （≥1，越小越好）\n等待时间    = 周转时间 − 服务时间\n响应时间    = 首次响应时刻 − 提交时刻<\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>7. 调度算法 <span class=\"pt hot\">大题<\/span><\/h4>\n      <table class=\"tb\">\n        <tr><th>算法<\/th><th>特点<\/th><\/tr>\n        <tr><td>FCFS 先来先服务<\/td><td>公平、非抢占；对<b>长作业有利、短作业不利<\/b><\/td><\/tr>\n        <tr><td>SJF/SPF 短作业优先<\/td><td><b>平均等待时间最短<\/b>；可能饥饿；分抢占/非抢占<\/td><\/tr>\n        <tr><td>HRRN 高响应比<\/td><td>响应比 =(等待+要求服务)/要求服务，折中，不饥饿<\/td><\/tr>\n        <tr><td>优先级<\/td><td>分抢占/非抢占；可能饥饿<\/td><\/tr>\n        <tr><td>RR 时间片轮转<\/td><td><b>响应快<\/b>、适合分时；时间片太小切换开销大<\/td><\/tr>\n        <tr><td>多级反馈队列<\/td><td>综合最优，不需预知运行时间；<b>越往下时间片越长、优先级越低<\/b><\/td><\/tr>\n      <\/table>\n      <div class=\"tip e\"><span class=\"ti\">易错<\/span><span>「<b>SJF 的平均周转时间最短<\/b>」是所有算法里严格成立的结论，但「SJF 对短作业有利」≠「对长作业不利到永不执行」——那是<b>饥饿<\/b>的表述。多级反馈队列里，新进程<b>总是先进入第 1 级队列<\/b>。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>8. 上下文切换<\/h4>\n      <ul>\n        <li>切换内容：保存当前进程的 PC、PSW、通用寄存器到 PCB，再从新进程 PCB 恢复<\/li>\n        <li>切换<b>有开销<\/b>（纯开销，不产生有效工作）<\/li>\n        <li>进程切换比线程切换开销大（要换地址空间、刷新 TLB）<\/li>\n        <li>同进程内的线程切换不用换页表，所以更快<\/li>\n      <\/ul>\n      <div class=\"tip i\"><span class=\"ti\">与计组的接口<\/span><span>切换时保存的 PC、PSW、通用寄存器，正是计组第 5 章讲的 CPU 内部寄存器。计组告诉你这些寄存器是什么，OS 告诉你为什么要保存它们。<\/span><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"sub a\">原理动画<\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 02 · 进程状态转换机：哪些转换不可能发生<span class=\"tag\">点击状态看转换<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>状态模型<\/label>\n        <select id=\"fsmMode\">\n          <option value=\"3\">三态（运行 / 就绪 / 阻塞）<\/option>\n          <option value=\"5\">五态（+ 创建 / 终止）<\/option>\n          <option value=\"7\">七态（+ 挂起）<\/option>\n        <\/select>\n        <button class=\"btn gh\" id=\"fsmTry\">测试「阻塞 → 运行」<\/button>\n      <\/div>\n      <div id=\"fsmStage\"><\/div>\n      <div id=\"fsmOut\" style=\"margin-top:16px\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 03 · 调度算法对比器：自动算周转时间<span class=\"tag\">重点 · 可改数据验算<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>进程数据（到达时间,服务时间）<\/label>\n        <input type=\"text\" id=\"schData\" value=\"0,7;2,4;4,1;5,4\" style=\"width:230px\">\n        <button class=\"btn gh sm\" data-sch=\"0,7;2,4;4,1;5,4\">例一<\/button>\n        <button class=\"btn gh sm\" data-sch=\"0,3;2,6;4,4;6,5\">例二<\/button>\n        <label>时间片<\/label><input type=\"number\" id=\"schQ\" value=\"2\" min=\"1\" style=\"width:60px\">\n      <\/div>\n      <div class=\"ctl\">\n        <label>算法<\/label>\n        <select id=\"schAlgo\">\n          <option value=\"fcfs\">FCFS 先来先服务<\/option>\n          <option value=\"sjf\">SJF 短作业优先（非抢占）<\/option>\n          <option value=\"hrrn\">HRRN 高响应比优先<\/option>\n          <option value=\"rr\">RR 时间片轮转<\/option>\n          <option value=\"prio\">优先级调度（编号越小优先级越高）<\/option>\n        <\/select>\n        <button class=\"btn\" id=\"schAll\">对比全部算法<\/button>\n      <\/div>\n      <div id=\"schStage\"><\/div>\n      <div id=\"schStat\" style=\"margin-top:16px\"><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- ==================== 第 3 章 ==================== -->\n<section class=\"sec\" id=\"os3\">\n  <div class=\"sec-head\">\n    <span class=\"sec-num\">CHAPTER 03<\/span>\n    <h2>同步与互斥<\/h2>\n    <span class=\"weight w3\">大题主战场<\/span>\n  <\/div>\n\n  <div class=\"tip i\"><span class=\"ti\">本章定位<\/span><span>408 操作系统大题<b>出现频率最高<\/b>的一章。典型形态：给一个场景（几个进程、几类资源、若干约束），要求<b>用信号量写出同步互斥代码<\/b>。评分看的是信号量设置对不对、PV 顺序对不对。这章别背题，要练「分析约束 → 定信号量初值 → 安排 P/V 位置」这套动作。<\/span><\/div>\n\n  <div class=\"sub\">考点清单<\/div>\n  <div class=\"grid g2\">\n    <div class=\"card\">\n      <h4>1. 基本概念与四原则 <span class=\"pt hot\">必考<\/span><\/h4>\n      <ul>\n        <li><b>临界资源<\/b>：一次只允许一个进程使用的资源（打印机、共享变量、缓冲区）<\/li>\n        <li><b>临界区<\/b>：访问临界资源的那段代码<\/li>\n        <li>进入区 / 临界区 / 退出区 / 剩余区<\/li>\n      <\/ul>\n      <div class=\"fm g\">临界区互斥的四条准则\n① 空闲让进 —— 没人在用就必须能进\n② 忙则等待 —— 有人用就必须等\n③ 有限等待 —— 不能让人无限期等（不能饥饿）\n④ 让权等待 —— 进不去要放弃 CPU（不能忙等占着处理机）<\/div>\n      <div class=\"tip m\"><span class=\"ti\">记忆<\/span><span>前三条是<b>正确性<\/b>要求，第四条是<b>效率<\/b>要求。软件方法和硬件方法大多满足前三条，但普遍<b>不满足第四条<\/b>（都是忙等）。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>2. 软件实现四法 <span class=\"pt\">理解即可<\/span><\/h4>\n      <table class=\"tb\">\n        <tr><th>方法<\/th><th>问题<\/th><\/tr>\n        <tr><td>单标志法<\/td><td>违背<b>空闲让进<\/b>（必须交替进入）<\/td><\/tr>\n        <tr><td>双标志·先检查<\/td><td>违背<b>忙则等待<\/b>（双方同时检查、同时进入）<\/td><\/tr>\n        <tr><td>双标志·后检查<\/td><td>违背<b>空闲让进<\/b>与<b>有限等待<\/b>（可能互相谦让，都进不去）<\/td><\/tr>\n        <tr><td><b>Peterson 算法<\/b><\/td><td><b>正确<\/b>，但仍是忙等<\/td><\/tr>\n      <\/table>\n      <div class=\"fm b\">Peterson 算法的核心（双标志 + 单标志 组合）\nflag[i] = true;    // 我要求进入\nturn = j;          // 但先让给你\nwhile (flag[j] && turn == j);   // 你要是坚持，我就等\n  ...临界区...\nflag[i] = false;<\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>3. 硬件实现<\/h4>\n      <ul>\n        <li><b>中断屏蔽<\/b>：关中断 → 临界区 → 开中断。单核有效，多核不行<\/li>\n        <li><b>TestAndSet（TS）<\/b>：原子地读出并置真<\/li>\n        <li><b>Swap / Exchange<\/b>：原子地交换两个字的内容<\/li>\n        <li>共同缺点：<b>不满足「让权等待」<\/b>，都是忙等；且可能不满足「有限等待」（TS 可能让某个进程一直抢不到）<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <h4>4. 信号量机制 <span class=\"pt hot\">核心<\/span><\/h4>\n      <div class=\"fm\">整型信号量：只用一个整数，<b>不满足让权等待<\/b>（忙等）\n记录型信号量：整数 + 等待队列，<b>四个条件全满足<\/b><\/div>\n      <div class=\"fm g\">记录型信号量的 P / V（原语，不可中断）\n\nP(S) / wait(S)          V(S) / signal(S)\n  S.value--;              S.value++;\n  if (S.value &lt; 0)          if (S.value &lt;= 0)\n     block(S.queue);         wakeup(S.queue);<\/div>\n      <div class=\"tip s\"><span class=\"ti\">读懂这两行<\/span><span>S.value 初值代表<b>可用资源数<\/b>。执行 P 后若 value <b>小于 0<\/b>，说明资源不够，自己阻塞；这个负数的绝对值就是<b>等待队列里的进程数<\/b>。V 操作后有进程在等（value ≤ 0），就唤醒一个。<b>理解这个语义，编程题就不会写反。<\/b><\/span><\/div>\n      <div class=\"tip e\"><span class=\"ti\">顺序陷阱<\/span><span>用信号量实现<b>互斥<\/b>时，P 操作必须在临界区之前、V 操作之后（P 在前）；用信号量实现<b>同步<\/b>时，V 操作写在前驱动作之后、P 操作写在后继动作之前。<b>P 和 V 谁前谁后写反，就会死锁<\/b>——这是最常扣分的地方。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>5. 信号量的三种用法<\/h4>\n      <table class=\"tb\">\n        <tr><th>用途<\/th><th>初值<\/th><th>要点<\/th><\/tr>\n        <tr><td><b>互斥<\/b><\/td><td class=\"mono\">1<\/td><td>P、V 夹住临界区，同一进程内成对<\/td><\/tr>\n        <tr><td><b>同步<\/b>（前驱）<\/td><td class=\"mono\">0<\/td><td>前操作后 V，后操作前 P<\/td><\/tr>\n        <tr><td><b>资源计数<\/b><\/td><td class=\"mono\">n<\/td><td>初值 = 资源总数<\/td><\/tr>\n      <\/table>\n      <div class=\"fm a\">一个信号量既能互斥又能同步吗？\n能，但通常<b>分开设<\/b>更清晰。\n经典生产者-消费者就用了三个：\n  empty（同步，初值 n）\n  full （同步，初值 0）\n  mutex（互斥，初值 1）<\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>6. 经典问题信号量设置 <span class=\"pt hot\">必背<\/span><\/h4>\n      <div class=\"fm\">【生产者-消费者】缓冲区大小 n\nsemaphore mutex = 1;   // 互斥访问缓冲区\nsemaphore empty = n;   // 空槽位数\nsemaphore full  = 0;   // 产品数\n\n生产者：            消费者：\n  P(empty);           P(full);\n  P(mutex);           P(mutex);\n    ...放入...          ...取出...\n  V(mutex);           V(mutex);\n  V(full);            V(empty);\n\n★ 两个 P 的顺序：<b>必须先 P 资源信号量，再 P 互斥信号量<\/b>\n  反了就死锁（拿了锁却等不到槽位，别人也进不来）<\/div>\n      <div class=\"fm g\">【读者-写者】\n读优先（可能饿死写者）：\n  semaphore rw = 1;       // 读写互斥\n  semaphore mutex = 1;    // 保护 count\n  int count = 0;          // 读者数\n\n  读者：P(mutex); if(++count==1) P(rw); V(mutex);\n        读... \n        P(mutex); if(--count==0) V(rw); V(mutex);\n  写者：P(rw); 写...; V(rw);\n\n写优先：再加一个 w = 1 信号量，读者进门先 P(w)、出门 V(w)<\/div>\n      <div class=\"fm p\">【哲学家进餐】5 人 5 筷，每人需两筷\n方案① 最多允许 4 人同时拿筷（设信号量初值 4）\n方案② 奇数号先拿左、偶数号先拿右\n方案③ 只有左右两支筷都可用时才允许拿（AND 型信号量）<\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>7. 管程<\/h4>\n      <ul>\n        <li>把<b>共享变量 + 对它的操作<\/b>封装在一起，进程只能通过管程的过程访问<\/li>\n        <li>管程内的操作<b>互斥<\/b>执行（编译器保证，不用手写 PV）<\/li>\n        <li><b>条件变量<\/b>：wait（阻塞并释放管程）/ signal（唤醒等待者）<\/li>\n        <li>与信号量的区别：信号量<b>分散<\/b>在进程里，管程<b>集中<\/b>封装；管程的互斥是自动的<\/li>\n      <\/ul>\n      <div class=\"tip m\"><span class=\"ti\">对比<\/span><span>Java 的 <span class=\"mono\">synchronized<\/span> 就是管程思想。管程 = 类 + 自动加锁。<\/span><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"sub a\">原理动画<\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 04 · PV 操作模拟器：生产者-消费者的三个信号量<span class=\"tag\">重点 · 逐步执行<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>缓冲区大小<\/label><input type=\"number\" id=\"pcBuf\" value=\"3\" min=\"1\" max=\"6\" style=\"width:60px\">\n        <button class=\"btn\" id=\"pcReset\">重置<\/button>\n        <button class=\"btn gh\" id=\"pcProd\">生产者投递一次<\/button>\n        <button class=\"btn gh\" id=\"pcCons\">消费者取走一次<\/button>\n        <button class=\"btn gy\" id=\"pcAuto\">自动跑一轮<\/button>\n      <\/div>\n      <div id=\"pcStage\"><\/div>\n      <div id=\"pcSems\" style=\"margin-top:16px\"><\/div>\n      <div id=\"pcNote\" style=\"margin-top:12px\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 05 · 两个 P 操作写反了会死锁<span class=\"tag\">对比两种顺序<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <button class=\"btn\" id=\"ordPlay\">模拟一遍<\/button>\n        <button class=\"btn gy\" id=\"ordReset\">重置<\/button>\n      <\/div>\n      <div id=\"ordStage\"><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- ==================== 第 4 章 ==================== -->\n<section class=\"sec\" id=\"os4\">\n  <div class=\"sec-head\">\n    <span class=\"sec-num\">CHAPTER 04<\/span>\n    <h2>死锁<\/h2>\n    <span class=\"weight w2\">中频 · 概念 + 计算<\/span>\n  <\/div>\n\n  <div class=\"tip i\"><span class=\"ti\">本章定位<\/span><span>分值不如前后两章高，但<b>银行家算法<\/b>是稳定考点（选择题常给一张表让你判断某个请求能否满足）。另外「四个必要条件」和「预防 vs 避免 vs 检测」的区分是必考辨析。<\/span><\/div>\n\n  <div class=\"sub\">考点清单<\/div>\n  <div class=\"grid g2\">\n    <div class=\"card\">\n      <h4>1. 死锁的概念与辨析<\/h4>\n      <ul>\n        <li><b>死锁<\/b>：多个进程因竞争资源而互相等待，没有外力介入谁都无法推进<\/li>\n        <li><b>饥饿<\/b>：某个进程长期得不到资源（如 SJF 下的长作业）。<b>饥饿不一定死锁<\/b>，死锁也不一定饥饿<\/li>\n        <li><b>死循环<\/b>：程序逻辑问题，不是资源分配问题，OS 不负责<\/li>\n        <li>死锁进程<b>至少两个<\/b>（自己等自己不算死锁）<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <h4>2. 四个必要条件 <span class=\"pt hot\">必背<\/span><\/h4>\n      <div class=\"fm\">① 互斥条件      资源排他使用\n② 不可剥夺      不能强行抢走\n③ 请求并保持    拿着手里的，还要申请新的\n④ 循环等待      存在一个进程—资源的循环等待链<\/div>\n      <div class=\"tip s\"><span class=\"ti\">记忆<\/span><span>四个条件是<b>必要不充分<\/b>——四个都满足不一定死锁，但死锁一定四个都满足。所以「破坏任意一个」就能预防死锁。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>3. 四种处理策略 <span class=\"pt hot\">必考<\/span><\/h4>\n      <table class=\"tb\">\n        <tr><th>策略<\/th><th>做法<\/th><th>代价<\/th><\/tr>\n        <tr><td><b>预防<\/b><\/td><td>破坏四个必要条件之一<\/td><td>资源利用率低<\/td><\/tr>\n        <tr><td><b>避免<\/b><\/td><td>银行家算法，动态判断本次分配是否安全<\/td><td>计算开销大，需预知最大需求<\/td><\/tr>\n        <tr><td><b>检测<\/b><\/td><td>允许发生，定期用资源分配图找环路<\/td><td>检测开销 + 解除代价<\/td><\/tr>\n        <tr><td><b>解除<\/b><\/td><td>剥夺资源 / 撤销进程 / 进程回退<\/td><td>可能丢工作<\/td><\/tr>\n      <\/table>\n      <div class=\"fm a\">预防的四种破坏方式\n破坏互斥      → 很难（有些资源天生互斥）\n破坏不可剥夺  → 允许抢，但可能丢工作\n破坏请求并保持→ <b>资源静态分配<\/b>（一次要够）或释放后再申请\n破坏循环等待  → <b>资源有序分配<\/b>（编号小的先申请）<\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>4. 银行家算法 <span class=\"pt hot\">高频<\/span><\/h4>\n      <div class=\"fm b\">四个数据结构（n 个进程，m 类资源）\nAvailable[j]   ：系统现有可分配的第 j 类资源数\nMax[i][j]      ：进程 i 对资源 j 的最大需求\nAllocation[i][j]：已分配\nNeed[i][j]     = Max − Allocation  ：还需要多少\n\n安全性算法（找安全序列）\nwhile (存在 Pi 满足 Need[i] ≤ Available) {\n    Available += Allocation[i];   // 它跑完了，资源还回来\n    把 Pi 加入安全序列;\n}\n若能纳入全部进程 → 安全；否则不安全<\/div>\n      <div class=\"tip e\"><span class=\"ti\">易错<\/span><span>银行家算法判的是「<b>本次分配后系统是否仍处于安全状态<\/b>」。请求能不能满足，要先判断 <span class=\"mono\">Request ≤ Need<\/span> 且 <span class=\"mono\">Request ≤ Available<\/span>，再<b>试分配<\/b>跑一遍安全性算法，安全才真的分配。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>5. 资源分配图与检测<\/h4>\n      <ul>\n        <li>图形：圆圈是进程，方框是资源（框内小圆点表示实例数）<\/li>\n        <li>申请边 Pi → Rj，分配边 Rj → Pi<\/li>\n        <li><b>每类资源只有一个实例<\/b>时：图中有环 ⟺ 死锁<\/li>\n        <li><b>每类资源有多个实例<\/b>时：有环<b>不一定<\/b>死锁，要化简图<\/li>\n        <li>化简方法：找「需求能被满足」的进程，去掉它的所有边（假设它跑完归还资源），反复直到不能再化简。<b>能消去所有边则无死锁<\/b><\/li>\n      <\/ul>\n      <div class=\"tip s\"><span class=\"ti\">与数据结构接口<\/span><span>资源分配图化简本质是<b>图的遍历 / 拓扑消解<\/b>，和数据结构里的图论是同一套思路。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>6. 常见结论速记<\/h4>\n      <ul>\n        <li>系统发生死锁时，一定存在循环等待，但存在循环等待<b>不一定<\/b>死锁（多实例时）<\/li>\n        <li>资源有序分配法破坏了<b>循环等待<\/b>条件<\/li>\n        <li>资源静态分配法破坏了<b>请求并保持<\/b>条件<\/li>\n        <li>银行家算法属于<b>死锁避免<\/b>，不属于预防<\/li>\n        <li>单道批处理系统中<b>不会发生死锁<\/b> —— 死锁至少需要两个进程互相等待，而单道同一时刻只有一个程序在运行<\/li>\n      <\/ul>\n    <\/div>\n  <\/div>\n\n  <div class=\"sub a\">原理动画<\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 06 · 银行家算法：试分配 + 安全性检查<span class=\"tag\">重点 · 可改数据<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>Available<\/label><input type=\"text\" id=\"bkAvail\" value=\"3,3,2\" style=\"width:100px\">\n        <button class=\"btn\" id=\"bkRun\">跑一遍安全性算法<\/button>\n        <button class=\"btn gy\" id=\"bkReset\">重置示例<\/button>\n      <\/div>\n      <div id=\"bkStage\"><\/div>\n      <div id=\"bkOut\" style=\"margin-top:16px\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 07 · 资源分配图：什么时候有环也不死锁<span class=\"tag\">切换实例数看差别<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>资源实例数<\/label>\n        <select id=\"ragMode\">\n          <option value=\"1\">每类资源 1 个实例<\/option>\n          <option value=\"2\">R1 有 2 个实例<\/option>\n        <\/select>\n        <button class=\"btn\" id=\"ragRun\">化简资源分配图<\/button>\n      <\/div>\n      <div id=\"ragStage\"><\/div>\n      <div id=\"ragOut\" style=\"margin-top:16px\"><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- ==================== 第 5 章 ==================== -->\n<section class=\"sec\" id=\"os5\">\n  <div class=\"sec-head\">\n    <span class=\"sec-num\">CHAPTER 05<\/span>\n    <h2>内存管理<\/h2>\n    <span class=\"weight w3\">核心 · 与计组交叉最深<\/span>\n  <\/div>\n\n  <div class=\"tip i\"><span class=\"ti\">本章定位<\/span><span>OS 里<b>与计组结合最紧<\/b>的一章，也是大题的高产区。两条主线：<b>地址转换<\/b>（逻辑地址怎么变成物理地址）和<b>页面置换<\/b>（内存不够了换出谁）。这两件事在计组里叫「虚拟存储」，在 OS 里叫「内存管理」——是同一套机制的两种讲法，建议两本书对照着看。<\/span><\/div>\n\n  <div class=\"sub\">考点清单<\/div>\n  <div class=\"grid g2\">\n    <div class=\"card\">\n      <h4>1. 装入与链接<\/h4>\n      <table class=\"tb\">\n        <tr><th>装入方式<\/th><th>特点<\/th><\/tr>\n        <tr><td>绝对装入<\/td><td>编译时就知道放哪，只适用于单道<\/td><\/tr>\n        <tr><td>静态重定位<\/td><td>装入时一次性改地址。<b>运行期间不能移动<\/b><\/td><\/tr>\n        <tr><td><b>动态重定位<\/b><\/td><td>运行时由<b>重定位寄存器（基址）<\/b>换算，可移动，是现代 OS 的基础<\/td><\/tr>\n      <\/table>\n      <div class=\"fm b\">链接方式\n静态链接：装入前全部链接好\n装入时动态链接：边装入边链接\n运行时动态链接：用到才链接（最灵活，省空间）<\/div>\n      <div class=\"tip m\"><span class=\"ti\">保护<\/span><span>内存保护常用<b>基址寄存器 + 限长寄存器<\/b>：地址必须满足 基址 ≤ 物理地址 &lt; 基址+限长，否则越界中断。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>2. 连续分配管理 <span class=\"pt\">基础<\/span><\/h4>\n      <table class=\"tb\">\n        <tr><th>方式<\/th><th>碎片<\/th><\/tr>\n        <tr><td>单一连续分配<\/td><td>只支持单道<\/td><\/tr>\n        <tr><td>固定分区分配<\/td><td><b>内部碎片<\/b>（分区内用不完）<\/td><\/tr>\n        <tr><td>动态分区分配<\/td><td><b>外部碎片<\/b>（空闲区太小用不上）<\/td><\/tr>\n      <\/table>\n      <div class=\"fm g\">动态分区的四种分配算法\n首次适应 FF  ：从低地址找第一个够用的  → 综合最好，性能最优\n最佳适应 BF  ：找最小的够用分区      → 产生最多外部碎片\n最坏适应 WF  ：找最大的分区         → 大分区很快被切光\n邻近适应 NF  ：从上次结束处继续找    → 高地址大块容易被切碎<\/div>\n      <div class=\"tip e\"><span class=\"ti\">结论<\/span><span>四种算法里 <b>首次适应通常最好<\/b>（不是最佳适应！名字有迷惑性）。最佳适应的名字指的是\"最省空间\"，但它会留下大量极小的碎片，反而最差。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>3. 基本分页 <span class=\"pt hot\">必考<\/span><\/h4>\n      <div class=\"fm\">逻辑地址 = 页号 P + 页内偏移 W\n物理地址 = 页框号 F + 页内偏移 W\n（偏移不变！）<\/div>\n      <ul>\n        <li>页面大小 = 页框大小，通常 4 KB（偏移占 12 位）<\/li>\n        <li>页表：页号 → 页框号，存放在<b>内存<\/b>中，页表基址寄存器 PTBR 指向它<\/li>\n        <li><b>无 TLB 时访存 2 次<\/b>：一次查页表、一次取数据<\/li>\n        <li><b>有 TLB 命中时访存 1 次<\/b>；TLB 未命中仍是 2 次<\/li>\n        <li>页表项长度固定，所以「页号」字段可以省略（用索引隐式给出）<\/li>\n      <\/ul>\n      <div class=\"tip i\"><span class=\"ti\">与计组的接口<\/span><span>TLB 就是「用 SRAM 做的页表缓存」，本质是 Cache 思想：把最常用的页表项放在离 CPU 最近的地方。有效访问时间 <span class=\"mono\">EAT<\/span> 的计算和 Cache 平均访问时间完全同构。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>4. 分段与段页式<\/h4>\n      <table class=\"tb\">\n        <tr><th><\/th><th>分页<\/th><th>分段<\/th><\/tr>\n        <tr><td>划分依据<\/td><td>物理，固定大小<\/td><td>逻辑，大小不等<\/td><\/tr>\n        <tr><td>对用户<\/td><td><b>不可见<\/b><\/td><td><b>可见<\/b><\/td><\/tr>\n        <tr><td>地址<\/td><td>一维（一个数）<\/td><td>二维（段号+段内偏移）<\/td><\/tr>\n        <tr><td>碎片<\/td><td>内部碎片<\/td><td>外部碎片<\/td><\/tr>\n        <tr><td>共享保护<\/td><td>不易<\/td><td><b>易于<\/b>（按逻辑模块）<\/td><\/tr>\n      <\/table>\n      <div class=\"fm p\">段页式：先分段，段内再分页\n地址 = 段号 S + 页号 P + 页内偏移 W\n无 TLB 时访存 <b>3 次<\/b>（查段表 → 查页表 → 取数）\n有 TLB 命中时 1 次<\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>5. 请求分页与页表项 <span class=\"pt hot\">必考<\/span><\/h4>\n      <div class=\"fm\">请求分页的页表项比基本分页多了几位\n  页框号 | 状态位(有效位) | 访问位 | 修改位 | 外存地址\n\n状态位：该页是否在内存中（0 → 缺页）\n访问位：最近是否被访问过（供置换算法用）\n修改位：调入后是否被改过（脏位，决定换出时要不要写回）<\/div>\n      <ul>\n        <li>缺页时产生<b>缺页中断<\/b>，属于<b>内中断 / 故障（fault）<\/b><\/li>\n        <li>缺页中断处理完要<b>重新执行<\/b>那条引发缺页的指令<\/li>\n        <li>一条指令可能产生<b>多次缺页中断<\/b>（比如指令本身跨页、操作数又跨页）<\/li>\n        <li>地址变换顺序：<b>查 TLB → 查页表（未命中）→ 缺页则调页<\/b><\/li>\n      <\/ul>\n      <div class=\"tip e\"><span class=\"ti\">常考判断<\/span><span>缺页中断<b>不是<\/b>外部中断；缺页中断处理时进程会阻塞（等待 I/O），属于「运行 → 阻塞」的转换。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>6. 页面置换算法 <span class=\"pt hot\">大题常客<\/span><\/h4>\n      <table class=\"tb\">\n        <tr><th>算法<\/th><th>特点<\/th><\/tr>\n        <tr><td><b>OPT<\/b> 最佳<\/td><td>淘汰<b>未来最久不用<\/b>的页。<b>缺页最少<\/b>，但不可实现，只作标尺<\/td><\/tr>\n        <tr><td><b>FIFO<\/b><\/td><td>淘汰最早进入的。<b>可能出现 Belady 异常<\/b>（增加页框反而缺页更多）<\/td><\/tr>\n        <tr><td><b>LRU<\/b><\/td><td>淘汰<b>过去最久未用<\/b>的。性能接近 OPT，但需要硬件支持、开销大<\/td><\/tr>\n        <tr><td>CLOCK<\/td><td>环形队列 + 访问位，访问位为 1 则清零并跳过<\/td><\/tr>\n        <tr><td><b>改进 CLOCK<\/b><\/td><td>同时看<b>访问位 A 和 修改位 M<\/b>，优先淘汰 A=0,M=0（不用写回）<\/td><\/tr>\n      <\/table>\n      <div class=\"fm a\">改进型 CLOCK 的淘汰顺序（四轮扫描）\n① 找 A=0, M=0  → 直接淘汰（最理想，不用写回）\n② 找 A=0, M=1  → 淘汰并写回\n   扫描过程中把经过的 A 置 0\n③ 重复第①轮（此时 M=1 的都变 A=0,M=1）\n④ 重复第②轮<\/div>\n      <div class=\"tip s\"><span class=\"ti\">只考三种<\/span><span>考试真正要手算的通常只有 <b>OPT、FIFO、LRU<\/b> 三种。CLOCK 系列多考概念和淘汰次序。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>7. 抖动与工作集<\/h4>\n      <ul>\n        <li><b>抖动（颠簸）<\/b>：刚换出的页马上又要用，频繁缺页。根因是<b>分配的页框数少于局部性所需<\/b><\/li>\n        <li><b>工作集<\/b>：某段时间窗口内实际访问的页面集合。窗口大小 Δ 的选取影响结果<\/li>\n        <li>解决办法：按工作集大小分配页框；或挂起部分进程（降低多道程度）<\/li>\n        <li>页面大小的影响：太大 → 内部碎片多、调入慢；太小 → 页表大、缺页频繁<\/li>\n      <\/ul>\n      <div class=\"fm g\">页面分配策略三种\n固定分配局部置换：页框数固定，只能换自己的页\n可变分配全局置换：可从整个系统取空闲页框\n可变分配局部置换：页框数可变，但只在自身页之间换（<b>最合理<\/b>）<\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"sub a\">原理动画<\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 08 · 分页地址转换：从逻辑地址到物理地址<span class=\"tag\">动手输入<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>逻辑地址（十进制）<\/label><input type=\"number\" id=\"vmAddr\" value=\"8196\" min=\"0\" style=\"width:120px\">\n        <label>页面大小<\/label>\n        <select id=\"vmPage\"><option value=\"1024\">1 KB<\/option><option value=\"4096\" selected>4 KB<\/option><option value=\"8192\">8 KB<\/option><\/select>\n        <button class=\"btn gh sm\" data-vm=\"0\">页首<\/button>\n        <button class=\"btn gh sm\" data-vm=\"8196\">跨页<\/button>\n      <\/div>\n      <div class=\"ctl\">\n        <button class=\"btn\" id=\"vmPlay\">逐步演示<\/button>\n        <button class=\"btn gh\" id=\"vmNext\">下一步 ▸<\/button>\n        <button class=\"btn gy\" id=\"vmReset\">重置<\/button>\n      <\/div>\n      <div id=\"vmStage\"><\/div>\n      <div id=\"vmOut\" style=\"margin-top:16px\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 09 · 页面置换算法对比：OPT / FIFO / LRU<span class=\"tag\">重点 · 输入访问串<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>页面访问串<\/label><input type=\"text\" id=\"pgRef\" value=\"7,0,1,2,0,3,0,4,2,3,0,3,2,1,2,0,1,7,0,1\" style=\"width:300px\">\n        <label>页框数<\/label><input type=\"number\" id=\"pgFrames\" value=\"3\" min=\"1\" max=\"5\" style=\"width:56px\">\n      <\/div>\n      <div class=\"ctl\">\n        <button class=\"btn gh sm\" data-pg=\"7,0,1,2,0,3,0,4,2,3,0,3,2,1,2,0,1,7,0,1\">经典例题<\/button>\n        <button class=\"btn gh sm\" data-pg=\"1,2,3,4,1,2,5,1,2,3,4,5\">FIFO 异常例<\/button>\n        <label>演示算法<\/label>\n        <select id=\"pgAlgo\">\n          <option value=\"all\">三种一起对比<\/option>\n          <option value=\"opt\" selected>OPT<\/option>\n          <option value=\"fifo\">FIFO<\/option>\n          <option value=\"lru\">LRU<\/option>\n        <\/select>\n      <\/div>\n      <div id=\"pgStage\"><\/div>\n      <div id=\"pgStat\" style=\"margin-top:16px\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 10 · 动态分区分配：四种算法怎么选空闲块<span class=\"tag\">对比看碎片<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>空闲分区（KB，逗号分隔）<\/label><input type=\"text\" id=\"ffFree\" value=\"100,500,200,300,600\" style=\"width:200px\">\n        <label>请求大小<\/label><input type=\"number\" id=\"ffReq\" value=\"180\" style=\"width:70px\">\n        <label>算法<\/label>\n        <select id=\"ffAlgo\">\n          <option value=\"ff\">首次适应 FF<\/option>\n          <option value=\"bf\">最佳适应 BF<\/option>\n          <option value=\"wf\">最坏适应 WF<\/option>\n          <option value=\"nf\">邻近适应 NF<\/option>\n        <\/select>\n      <\/div>\n      <div id=\"ffStage\"><\/div>\n      <div id=\"ffOut\" style=\"margin-top:16px\"><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- ==================== 第 6 章 ==================== -->\n<section class=\"sec\" id=\"os6\">\n  <div class=\"sec-head\">\n    <span class=\"sec-num\">CHAPTER 06<\/span>\n    <h2>文件管理<\/h2>\n    <span class=\"weight w2\">中频 · 计算为主<\/span>\n  <\/div>\n\n  <div class=\"tip i\"><span class=\"ti\">本章定位<\/span><span>概念多但题型固定。<b>混合索引的最大文件大小计算<\/b>和<b>位示图的字号位号换算<\/b>是两个稳定的计算考点，都有固定公式，练熟就是送分。文件分配方式的优劣对比是概念题的常客。<\/span><\/div>\n\n  <div class=\"sub\">考点清单<\/div>\n  <div class=\"grid g2\">\n    <div class=\"card\">\n      <h4>1. 文件与目录<\/h4>\n      <ul>\n        <li><b>FCB（文件控制块）<\/b>：存放文件名、物理位置、逻辑结构、存取权限等，是文件存在的标志<\/li>\n        <li><b>索引结点（inode）<\/b>：把<b>文件名<\/b>留在目录项，其余信息全放到索引结点里。这样目录项变小，检索更快<\/li>\n        <li>目录结构：单级 → 两级 → 树形 → 无环图<\/li>\n        <li><b>树形目录<\/b>支持路径名和分类，但<b>不便于共享<\/b>；<b>无环图<\/b>解决了共享问题<\/li>\n      <\/ul>\n      <div class=\"fm\">树形目录的两种路径\n绝对路径：从根目录开始 /home/user/a.txt\n相对路径：从当前目录开始 ../user/a.txt<\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>2. 文件共享 <span class=\"pt\">易混<\/span><\/h4>\n      <table class=\"tb\">\n        <tr><th><\/th><th>硬链接<\/th><th>软链接<\/th><\/tr>\n        <tr><td>本质<\/td><td>多个目录项指向<b>同一个 inode<\/b><\/td><td>新建一个文件，内容是<b>路径<\/b><\/td><\/tr>\n        <tr><td>计数<\/td><td>inode 的链接计数 +1<\/td><td>不影响原文件计数<\/td><\/tr>\n        <tr><td>删除原文件<\/td><td>文件仍可用（计数&gt;0）<\/td><td><b>链接失效<\/b><\/td><\/tr>\n        <tr><td>跨文件系统<\/td><td>不行<\/td><td>可以<\/td><\/tr>\n      <\/table>\n      <div class=\"tip m\"><span class=\"ti\">记忆<\/span><span>硬链接是「<b>同一份东西多个名字<\/b>」，软链接是「<b>一张写着地址的纸条<\/b>」。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>3. 文件物理结构 <span class=\"pt hot\">必考<\/span><\/h4>\n      <table class=\"tb\">\n        <tr><th>方式<\/th><th>随机访问<\/th><th>问题<\/th><\/tr>\n        <tr><td>连续分配<\/td><td>快<\/td><td>不利于扩展、<b>外部碎片<\/b><\/td><\/tr>\n        <tr><td>隐式链接<\/td><td><b>只能顺序<\/b><\/td><td>指针占空间、可靠性差<\/td><\/tr>\n        <tr><td>显式链接（FAT）<\/td><td>可以（FAT 常驻内存）<\/td><td>FAT 表占内存<\/td><\/tr>\n        <tr><td>索引分配<\/td><td>快<\/td><td>索引块本身占空间<\/td><\/tr>\n      <\/table>\n      <div class=\"fm g\">索引分配的三种形式\n单级索引：一个索引块\n多级索引：索引块指向索引块（文件很大时）\n混合索引：直接块 + 一级/二级/三级间接（UNIX 采用）<\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>4. 混合索引计算 <span class=\"pt hot\">高频<\/span><\/h4>\n      <div class=\"fm b\">典型参数（UNIX 风格）\n索引结点含 13 个地址项：\n  10 个直接地址项\n  1 个一级间接\n  1 个二级间接\n  1 个三级间接\n\n设磁盘块大小 4 KB，每个地址项 4 B\n  则一个索引块能放 4 KB ÷ 4 B = <b>1024<\/b> 个地址项\n\n最大文件大小\n  直接：10 × 4 KB\n  一级：1024 × 4 KB\n  二级：1024² × 4 KB\n  三级：1024³ × 4 KB\n  合计 ≈ 4 TB 量级<\/div>\n      <div class=\"tip s\"><span class=\"ti\">怎么考<\/span><span>通常给一个逻辑块号（如「第 5000 块」），问需要几次访盘。做法：先减掉直接块（10），再减一级间接（1024），看落在哪一级，然后算 <b>1 次索引块 + 1 次数据块<\/b>（二级间接就是 2 次索引 + 1 次数据）。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>5. 空闲空间管理 <span class=\"pt hot\">计算题<\/span><\/h4>\n      <table class=\"tb\">\n        <tr><th>方法<\/th><th>特点<\/th><\/tr>\n        <tr><td>空闲表法<\/td><td>连续分配适用，记录起始块号和块数<\/td><\/tr>\n        <tr><td>空闲链表法<\/td><td>空闲盘块链 / 空闲盘区链<\/td><\/tr>\n        <tr><td><b>位示图法<\/b><\/td><td>一个二进制位对应一个盘块，<b>1 表示占用、0 表示空闲<\/b>（或相反，看约定）<\/td><\/tr>\n        <tr><td>成组链接法<\/td><td>UNIX 采用。把空闲块分组，每组第一块记录下一组的块号和数量<\/td><\/tr>\n      <\/table>\n      <div class=\"fm a\">位示图换算公式（字长为 n 位，编号从 1 开始）\n盘块号 b  →  字号 = (b−1) ÷ n + 1\n            位号 = (b−1) mod n + 1\n\n反过来：盘块号 = (字号−1) × n + 位号<\/div>\n      <div class=\"tip e\"><span class=\"ti\">易错<\/span><span>「从 0 开始编号」和「从 1 开始编号」公式差 1，做题<b>一定先看清题干怎么约定<\/b>。位示图里 0/1 哪个表示占用，也依题干而定。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>6. 文件系统层次<\/h4>\n      <div class=\"fm\">用户接口\n  ↓\n文件目录系统\n  ↓\n存取控制验证\n  ↓\n逻辑文件系统与文件信息缓冲区\n  ↓\n物理文件系统\n  ↓\n辅助分配模块 / 设备管理模块<\/div>\n      <ul>\n        <li><b>挂载<\/b>：把一个文件系统接到目录树的某个节点上<\/li>\n        <li>虚拟文件系统 VFS：屏蔽不同文件系统的差异，提供统一接口<\/li>\n      <\/ul>\n    <\/div>\n  <\/div>\n\n  <div class=\"sub a\">原理动画<\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 11 · 混合索引寻址：第 N 块要访盘几次<span class=\"tag\">动手输入块号<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>逻辑块号<\/label><input type=\"number\" id=\"ixBlk\" value=\"5000\" min=\"0\" style=\"width:110px\">\n        <label>块大小<\/label><input type=\"number\" id=\"ixSize\" value=\"4096\" style=\"width:90px\"><span style=\"font-size:12px\">B<\/span>\n        <label>地址项大小<\/label><input type=\"number\" id=\"ixPtr\" value=\"4\" style=\"width:70px\"><span style=\"font-size:12px\">B<\/span>\n      <\/div>\n      <div id=\"ixStage\"><\/div>\n      <div id=\"ixOut\" style=\"margin-top:16px\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 12 · 位示图：盘块号与字号 / 位号的互换<span class=\"tag\">输入即算<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>字长（位）<\/label><input type=\"number\" id=\"bmW\" value=\"32\" style=\"width:70px\">\n        <label>编号起点<\/label>\n        <select id=\"bmBase\"><option value=\"1\">从 1 开始<\/option><option value=\"0\">从 0 开始<\/option><\/select>\n        <label>盘块号<\/label><input type=\"number\" id=\"bmBlk\" value=\"100\" style=\"width:80px\">\n      <\/div>\n      <div id=\"bmStage\"><\/div>\n      <div id=\"bmOut\" style=\"margin-top:16px\"><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- ==================== 第 7 章 ==================== -->\n<section class=\"sec\" id=\"os7\">\n  <div class=\"sec-head\">\n    <span class=\"sec-num\">CHAPTER 07<\/span>\n    <h2>输入/输出管理<\/h2>\n    <span class=\"weight w2\">中频 · 与计组交叉<\/span>\n  <\/div>\n\n  <div class=\"tip i\"><span class=\"ti\">本章定位<\/span><span>与计组的 I/O 系统是<b>同一件事的两面<\/b>：计组讲硬件怎么发起和完成 I/O，OS 讲软件怎么组织和管理它。<b>磁盘调度算法<\/b>（求移臂总量）是稳定考点，<b>缓冲区的处理时间计算<\/b>是易错考点。<\/span><\/div>\n\n  <div class=\"sub\">考点清单<\/div>\n  <div class=\"grid g2\">\n    <div class=\"card\">\n      <h4>1. I/O 控制方式 <span class=\"pt hot\">与计组重叠<\/span><\/h4>\n      <table class=\"tb\">\n        <tr><th>方式<\/th><th>CPU 参与度<\/th><th>单位<\/th><\/tr>\n        <tr><td>程序查询<\/td><td>全程忙等<\/td><td>字/字节<\/td><\/tr>\n        <tr><td>程序中断<\/td><td>每传一次打断一次<\/td><td>字/字节<\/td><\/tr>\n        <tr><td>DMA<\/td><td>只在开始结束参与<\/td><td><b>数据块<\/b><\/td><\/tr>\n        <tr><td>通道<\/td><td>几乎不参与<\/td><td><b>一组数据块<\/b><\/td><\/tr>\n      <\/table>\n      <div class=\"tip s\"><span class=\"ti\">一句话分工<\/span><span>计组告诉你 <b>DMA 控制器怎么抢总线<\/b>，OS 告诉你<b>驱动程序怎么把请求交给它<\/b>。<\/span><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h4>2. I/O 软件层次<\/h4>\n      <div class=\"fm\">用户层 I/O 软件（库函数，如 printf）\n  ↓\n设备独立性软件（统一接口、缓冲、分配）\n  ↓\n设备驱动程序（把抽象请求变成设备指令）★厂商写\n  ↓\n中断处理程序\n  ↓\n硬件<\/div>\n      <ul>\n        <li><b>设备独立性<\/b>：上层用逻辑设备名，不关心具体是什么设备<\/li>\n        <li>设备驱动程序<b>与硬件直接相关<\/b>，通常由设备厂商提供<\/li>\n        <li>设备按传输单位分：块设备（磁盘）、字符设备（键盘）<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <h4>3. 缓冲技术 <span class=\"pt hot\">易错计算<\/span><\/h4>\n      <div class=\"fm b\">设：T = 输入一块到缓冲区的时间\n    C = CPU 处理一块的时间\n    M = 把缓冲区数据送到用户区的时间\n\n单缓冲：处理一块耗时 = <b>max(C, T) + M<\/b>\n双缓冲：处理一块耗时 = <b>max(C + M, T)<\/b>\n\n系统处理 n 块的总时间\n  单缓冲：n × (max(C,T) + M)\n  双缓冲：n × max(C+M, T)  （或再加首块开销）<\/div>\n      <div class=\"tip e\"><span class=\"ti\">易错<\/span><span>单缓冲里那个 <span class=\"mono\">M<\/span> 是<b>加在 max 外面<\/b>的，不是里面 —— 因为把数据从缓冲区搬到用户区时，设备和 CPU 都闲着，这段是纯粹串行的开销。这一点很容易记反。<\/span><\/div>\n      <ul>\n        <li>缓冲池（buffer pool）：多个缓冲区统一管理，分空白缓冲队列、输入队列、输出队列<\/li>\n        <li>缓冲的作用：缓和 CPU 与 I/O 的速度差、减少中断频率、解决数据粒度不匹配<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <h4>4. 设备分配与 SPOOLing<\/h4>\n      <ul>\n        <li>设备分配考虑：设备固有属性（独占/共享/虚拟）、分配算法（FCFS / 优先级）、安全性<\/li>\n        <li><b>SPOOLing（假脱机）<\/b>：用磁盘上的输入井/输出井模拟独占设备，把独占设备改造为<b>共享设备<\/b><\/li>\n        <li>典型例子：<b>打印机<\/b>。多个进程的打印请求排成队列，由守护进程依次输出<\/li>\n        <li>SPOOLing 提高了 I/O 速度，把独占设备虚拟成共享设备<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <h4>5. 磁盘<\/h4>\n      <div class=\"fm g\">磁盘访问时间 = 寻道时间 + 旋转延迟 + 传输时间\n  寻道时间：磁头移动到目标磁道   ← 主导，占大部分\n  旋转延迟：扇区转到磁头下\n    平均旋转延迟 = 转一圈时间 ÷ 2\n    转一圈时间 = 60 ÷ 转速(r/min) 秒\n  传输时间 = 读取字节数 ÷ 传输速率<\/div>\n      <div class=\"fm\">磁盘地址 = 柱面号 + 磁头号 + 扇区号\n（柱面号 = 磁道号；磁头号 = 盘面号）<\/div>\n      <ul>\n        <li>格式化容量比非格式化容量小<\/li>\n        <li>坏块处理：扇区备用、扇区滑动<\/li>\n        <li>引导块：磁盘第一个扇区（MBR）<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"card\">\n      <h4>6. 磁盘调度算法 <span class=\"pt hot\">必考计算<\/span><\/h4>\n      <table class=\"tb\">\n        <tr><th>算法<\/th><th>做法<\/th><th>特点<\/th><\/tr>\n        <tr><td>FCFS<\/td><td>按请求顺序<\/td><td>公平，但移臂距离大<\/td><\/tr>\n        <tr><td><b>SSTF<\/b><\/td><td>优先最近的<\/td><td>平均寻道最短；<b>可能饥饿<\/b><\/td><\/tr>\n        <tr><td><b>SCAN<\/b>（电梯）<\/td><td>单向扫到头再折返<\/td><td>不会饥饿；中间磁道更占便宜<\/td><\/tr>\n        <tr><td>C-SCAN<\/td><td>单向扫到头后<b>直接回到起点<\/b><\/td><td>更公平，回程不做服务<\/td><\/tr>\n        <tr><td>LOOK<\/td><td>SCAN 的改进：到<b>最远请求<\/b>就折返<\/td><td>不必扫到物理末端<\/td><\/tr>\n        <tr><td>C-LOOK<\/td><td>C-SCAN 的改进版<\/td><td>到最远请求就返回起点<\/td><\/tr>\n      <\/table>\n      <div class=\"tip m\"><span class=\"ti\">关键区别<\/span><span><b>SCAN / C-SCAN 扫到磁盘物理末端<\/b>，<b>LOOK / C-LOOK 扫到最远的那个请求就返回<\/b>。这是最容易混的一处，看题干问的是哪种。<\/span><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"sub a\">原理动画<\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 13 · 磁盘调度：移臂总量对比<span class=\"tag\">重点 · 可改序列<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>磁道请求序列<\/label><input type=\"text\" id=\"dkSeq\" value=\"98,183,37,122,14,124,65,67\" style=\"width:250px\">\n        <label>当前磁头<\/label><input type=\"number\" id=\"dkHead\" value=\"53\" style=\"width:70px\">\n        <label>磁道总数<\/label><input type=\"number\" id=\"dkMax\" value=\"200\" style=\"width:70px\">\n      <\/div>\n      <div class=\"ctl\">\n        <label>算法<\/label>\n        <select id=\"dkAlgo\">\n          <option value=\"all\">全部对比<\/option>\n          <option value=\"fcfs\">FCFS<\/option>\n          <option value=\"sstf\" selected>SSTF<\/option>\n          <option value=\"scan\">SCAN（先向大号）<\/option>\n          <option value=\"cscan\">C-SCAN<\/option>\n          <option value=\"look\">LOOK<\/option>\n        <\/select>\n        <button class=\"btn gh sm\" data-dk=\"98,183,37,122,14,124,65,67\">经典例题<\/button>\n      <\/div>\n      <div id=\"dkStage\"><\/div>\n      <div id=\"dkStat\" style=\"margin-top:16px\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"demo\">\n    <div class=\"demo-h\"><span class=\"dot\"><\/span>动画 14 · 单缓冲 vs 双缓冲：那块时间到底加在哪<span class=\"tag\">改参数看公式<\/span><\/div>\n    <div class=\"demo-b\">\n      <div class=\"ctl\">\n        <label>T 输入一块<\/label><input type=\"number\" id=\"bfT\" value=\"100\" style=\"width:70px\"><span style=\"font-size:12px\">μs<\/span>\n        <label>C 处理一块<\/label><input type=\"number\" id=\"bfC\" value=\"50\" style=\"width:70px\"><span style=\"font-size:12px\">μs<\/span>\n        <label>M 传送到用户区<\/label><input type=\"number\" id=\"bfM\" value=\"20\" style=\"width:70px\"><span style=\"font-size:12px\">μs<\/span>\n        <label>块数 n<\/label><input type=\"number\" id=\"bfN\" value=\"10\" style=\"width:60px\">\n      <\/div>\n      <div id=\"bfStage\"><\/div>\n      <div id=\"bfOut\" style=\"margin-top:16px\"><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- ##INSERT## -->\n\n<footer>\n  408 操作系统 · 交互式原理全景<br>\n  分值分布按历年统考真题的常见情况估计，用于确定复习优先级，非官方数据。\n<\/footer>\n<\/main>\n<\/div>\n\n<div class=\"totop\" id=\"totop\">↑<\/div>\n\n<script>\n/* ============================================================\n   通用工具\n   ============================================================ */\n/* ============================================================\n   动画速度总控 —— 所有动画的 setTimeout / setInterval 延迟统一乘倍率\n   只放大 300~2000ms 区间（动画用的范围），不影响其它短延迟逻辑\n   ============================================================ */\nlet ANIM_SPEED = 1.7;                    // 1 = 原始速度，越大越慢\n(function(){\n  const _st = window.setTimeout.bind(window);\n  const _si = window.setInterval.bind(window);\n  const scale = ms => (typeof ms === 'number' && ms >= 300 && ms <= 2000)\n    ? Math.round(ms * ANIM_SPEED) : ms;\n  window.setTimeout = function(fn, ms){ return _st(fn, scale(ms)); };\n  window.setInterval = function(fn, ms){ return _si(fn, scale(ms)); };\n})();\n\nconst $ = id => document.getElementById(id);\nconst qsa = s => Array.prototype.slice.call(document.querySelectorAll(s));\n\n/* 速度切换 */\nqsa('[data-sp]').forEach(b=>{\n  b.onclick = ()=>{\n    ANIM_SPEED = parseFloat(b.dataset.sp) || 1.7;\n    qsa('[data-sp]').forEach(x=>x.classList.toggle('on', x === b));\n  };\n});\n\nwindow.addEventListener('scroll', ()=>{\n  const h = document.documentElement.scrollHeight - window.innerHeight;\n  $('progress').style.width = (h>0 ? (window.scrollY/h*100) : 0) + '%';\n  $('totop').classList.toggle('on', window.scrollY > 500);\n});\n$('totop').onclick = ()=>window.scrollTo({top:0,behavior:'smooth'});\n\n/* ---------- 小屏抽屉导航 ---------- */\n(function(){\n  const btn = $('navbtn'), side = document.querySelector('.sidebar'), scrim = $('scrim');\n  if(!btn || !side || !scrim) return;\n  function close(){\n    side.classList.remove('open'); scrim.classList.remove('on');\n    btn.classList.remove('on'); btn.setAttribute('aria-expanded','false');\n  }\n  function open(){\n    side.classList.add('open'); scrim.classList.add('on');\n    btn.classList.add('on'); btn.setAttribute('aria-expanded','true');\n  }\n  btn.onclick = ()=>{ side.classList.contains('open') ? close() : open(); };\n  scrim.onclick = close;\n  qsa('.nav-i').forEach(a=>a.addEventListener('click', close));\n  document.addEventListener('keydown', e=>{ if(e.key === 'Escape') close(); });\n  window.addEventListener('resize', ()=>{ if(window.innerWidth > 980) close(); });\n\n  /* 顶部条上的「当前章节」按滚动位置算，跳转后不会滞后 */\n  function syncTitle(){\n    const t = document.querySelector('.mtop-t');\n    if(!t) return;\n    const secs = qsa('section.sec');\n    let cur = secs[0];\n    for(let i = 0; i < secs.length; i++){ if(secs[i].getBoundingClientRect().top <= 96) cur = secs[i]; }\n    const link = qsa('.nav-i').filter(a=>a.getAttribute('href') === '#'+cur.id)[0];\n    if(link) t.textContent = t.dataset.subj + ' · ' + link.querySelector('span').textContent;\n  }\n  window.addEventListener('scroll', syncTitle, {passive:true});\n  syncTitle();\n})();\n\nconst navLinks = qsa('.nav-i');\nconst secs = qsa('.sec');\nconst obs = new IntersectionObserver(es=>{\n  es.forEach(e=>{\n    if(e.isIntersecting){\n      const cur = navLinks.filter(a=>a.getAttribute('href') === '#'+e.target.id)[0];\n      navLinks.forEach(a=>a.classList.toggle('on', a === cur));\n    }\n  });\n},{rootMargin:'-15% 0px -70% 0px'});\nsecs.forEach(s=>obs.observe(s));\n\n/* 分值权重条形入场动画 */\nsetTimeout(()=>{ qsa('.rank-bar i, .rank-sum-bar i').forEach(f=>f.style.width = f.dataset.w + '%'); }, 300);\n\n/* ============================================================\n   动画 01 · 系统调用：用户态 → 内核态\n   ============================================================ */\nconst SC = {\n  read: {\n    title: 'read() 读文件',\n    kind: 'normal',\n    steps: [\n      ['用户程序调用 read()', '应用程序执行到 read(fd, buf, n)。此刻 CPU 处于<b>用户态<\/b>，只能执行非特权指令。', '用户态'],\n      ['准备系统调用参数', '把 fd、buf、n 依次放进约定的寄存器，并把「系统调用号」写入指定寄存器（如 eax）。', '用户态'],\n      ['执行陷入指令 trap', '执行陷入指令（<span class=\"mono\">int 0x80<\/span> / <span class=\"mono\">syscall<\/span>）。这是<b>用户态进入内核态的唯一途径<\/b>——用户程序无法直接跳进内核。', '用户态 → 内核态'],\n      ['硬件切换状态', '硬件保存现场（PC、PSW 压栈），按中断向量跳到系统调用的统一入口。此时 CPU 已在<b>内核态<\/b>。', '内核态'],\n      ['按调用号分发', '内核用系统调用号查系统调用表，找到对应的服务例程 sys_read。', '内核态'],\n      ['内核执行实际工作', '检查参数合法性 → 查文件系统定位数据 → 启动磁盘 I/O。这些涉及特权指令，<b>只能在核心态完成<\/b>。', '内核态'],\n      ['返回用户态', '把返回值写入寄存器，用特权指令恢复 PSW，CPU 回到用户态，应用程序从下一行继续。', '内核态 → 用户态']\n    ],\n    note: '<div class=\"tip s\"><span class=\"ti\">要点<\/span><span>系统调用过程中<b>至少发生两次状态切换<\/b>（进内核、回用户态），每次切换都有开销。这就是为什么「尽量减少系统调用次数」是性能优化的常见手段（比如用缓冲一次性读写，而不是一个字节一个字节地读）。<\/span><\/div>'\n  },\n  fork: {\n    title: 'fork() 创建进程',\n    kind: 'normal',\n    steps: [\n      ['用户程序调用 fork()', '进程希望创建子进程。当前处于<b>用户态<\/b>。', '用户态'],\n      ['执行陷入指令', '同样通过 trap 进入内核态。', '用户态 → 内核态'],\n      ['内核态处理', '内核为子进程申请 PCB、分配 PID、复制父进程的地址空间和打开的文件表，然后把子进程插入就绪队列。', '内核态'],\n      ['返回时的差异', 'fork() 在父进程里返回子进程的 PID，在子进程里返回 0。<b>同一个调用点，两个进程拿到不同的返回值<\/b>。', '内核态 → 用户态'],\n      ['父进程继续', '父进程拿到子进程 PID，可以继续做别的事。', '用户态'],\n      ['子进程被调度', '子进程处于就绪态，等调度程序选中它之后才开始执行 fork() 之后的代码。', '用户态']\n    ],\n    note: '<div class=\"tip i\"><span class=\"ti\">考点<\/span><span>fork() 之后子进程<b>从 fork 的返回处继续执行<\/b>，而不是从头开始。这是它和「加载一个新程序」的本质区别（后者是 exec）。另外，创建进程的整个过程必须在内核态完成，因为它要操作 PCB 和就绪队列这些内核数据结构。<\/span><\/div>'\n  },\n  ioctl: {\n    title: '用户程序直接执行特权指令',\n    kind: 'illegal',\n    steps: [\n      ['用户程序试图直接操作设备', '比如直接执行一条 I/O 指令去读磁盘。当前处于<b>用户态<\/b>。', '用户态'],\n      ['CPU 检查指令权限', 'CPU 发现这是一条<b>特权指令<\/b>，而当前处于用户态 —— 权限不足。', '用户态'],\n      ['触发非法指令异常', '硬件产生一个内部异常（非法操作码 / 特权指令异常），这是<b>内中断<\/b>。', '用户态 → 内核态'],\n      ['内核介入处理', '操作系统捕获这个异常，通常认定为程序错误，向该进程发送信号（如 SIGILL）。', '内核态'],\n      ['进程被终止', '进程收到信号后通常被<b>强制终止<\/b>，不会真的执行那条 I/O 指令。', '内核态 → 终止']\n    ],\n    note: '<div class=\"tip e\"><span class=\"ti\">为什么<\/span><span>如果用户程序能直接执行 I/O 指令，就可以绕过操作系统随意读写磁盘、破坏其他进程的数据。<b>特权指令 + 两种执行状态，正是操作系统保护自身和进程隔离的硬件基础。<\/b>要操作设备，唯一正路是发起系统调用让内核代劳。<\/span><\/div>'\n  }\n};\nlet scIdx = -1, scTimer = null;\nfunction renderSC(){\n  const d = SC[$('scPick').value];\n  const cur = scIdx >= 0 ? d.steps[scIdx] : null;\n  const inKernel = cur && cur[2].indexOf('内核态') >= 0 && cur[2].indexOf('→ 用户态') < 0;\n\n  $('scStage').innerHTML =\n    `<div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px\">\n      <div style=\"flex:1;min-width:120px;padding:10px 14px;border-radius:10px;text-align:center;font-size:13px;font-weight:750;\n        background:${inKernel?'#f4f7fb':'var(--primary-l)'};color:${inKernel?'#aab3c0':'var(--primary)'};\n        border:1px solid ${inKernel?'#e3e8ef':'var(--primary)'};transition:.3s\">\n        用户态<span style=\"display:block;font-size:10.5px;font-weight:500\">只能执行非特权指令<\/span><\/div>\n      <div style=\"display:flex;align-ite
