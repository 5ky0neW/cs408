 return; }\n  SL.busy = true;\n  SL.over = {}; SL.temp = null; SL.ghost = -1; SL.hlLink = [];\n  slLog(`按值查找：找 ${val}`, 'ok');\n  let i = 0, cmp = 0;\n  const step = ()=>{\n    if(i >= SL.arr.length){\n      SL.hl = {h:null};\n      slLog(`走到 NULL，没找到 ${val}，共比较 ${cmp} 次`, 'err');\n      slRender('find', 3);\n      SL.busy = false; return;\n    }\n    cmp++;\n    SL.hl = {h:null}; SL.hl[i] = 'cmp';\n    if(SL.arr[i] === val){\n      SL.hl[i] = 'new';\n      slLog(`第 ${i+1} 个结点就是 ${val}，比较 ${cmp} 次找到`, 'ok');\n      slLog('⚠ 对比顺序表：链表<b>不能随机访问<\/b>，必须从头一个个走', 'mut');\n      slRender('find', 2);\n      SL.busy = false; return;\n    }\n    slLog(`比较第 ${i+1} 个结点 ${SL.arr[i]} ≠ ${val}，p 后移`, 'warn');\n    slRender('find', 2);\n    i++;\n    SL.timer = setTimeout(step, 400);\n  };\n  SL.hl = {h:'act'};\n  slRender('find', 1);\n  SL.timer = setTimeout(step, 350);\n}\nfunction slUpdate(){\n  if(SL.busy) return; slStop();\n  const pos = parseInt($('slPos').value,10);\n  const val = parseInt($('slVal').value,10);\n  if(isNaN(pos) || pos < 1 || pos > SL.arr.length){\n    slLog('位置越界：合法范围 1 ~ ' + SL.arr.length, 'err'); slRender('upd',-1); return;\n  }\n  SL.over = {}; SL.temp = null; SL.ghost = -1; SL.hlLink = [];\n  const old = SL.arr[pos-1];\n  SL.arr[pos-1] = isNaN(val) ? old : val;\n  SL.hl = {}; SL.hl.h = null; SL.hl[pos-1] = 'new';\n  slLog(`先把 p 走到第 ${pos} 个结点（O(n)），再把 ${old} 改成 ${SL.arr[pos-1]}（O(1)）`, 'ok');\n  slRender('upd', 2);\n}\nfunction slByIdx(){\n  if(SL.busy) return; slStop();\n  const pos = parseInt($('slPos').value,10);\n  if(isNaN(pos) || pos < 1 || pos > SL.arr.length){\n    slLog('位置越界：合法范围 1 ~ ' + SL.arr.length, 'err'); slRender('idx',1); return;\n  }\n  SL.busy = true;\n  SL.over = {}; SL.temp = null; SL.ghost = -1; SL.hlLink = [];\n  slLog(`按位查找第 ${pos} 个结点 —— 注意链表<b>没法直接跳到第 ${pos} 个<\/b>`, 'ok');\n  let j = 1;\n  const step = ()=>{\n    if(j > pos){\n      SL.hl = {h:null}; SL.hl[pos-1] = 'new';\n      slLog(`结果：第 ${pos} 个结点是 ${SL.arr[pos-1]}`, 'ok');\n      slLog(`一共走了 <b>${pos} 步<\/b>。第 1 个走 1 步，第 n 个要走 n 步，平均 n/2 —— 所以按位查找是 <b>O(n)<\/b>`, 'mut');\n      slLog(`对比顺序表：同样第 ${pos} 个元素，顺序表直接算地址 <b>O(1)<\/b>。这就是两者最本质的差距`, 'warn');\n      slRender('idx', 4);\n      SL.busy = false; return;\n    }\n    SL.hl = {h:null};\n    if(j > 1) SL.hl[j-2] = 'shift';\n    SL.hl[j-1] = 'act';\n    slLog(`p 指向第 ${j} 个结点${j===pos?' —— 就是它！':'，还不是，p = p->next 继续走'}`, 'warn');\n    slRender('idx', 2);\n    j++;\n    SL.timer = setTimeout(step, 420);\n  };\n  SL.hl = {h:'act'};\n  slRender('idx', 1);\n  SL.timer = setTimeout(step, 420);\n}\n$('slIdx').onclick = slByIdx;\n$('slIns').onclick = ()=>slInsert(parseInt($('slPos').value,10), parseInt($('slVal').value,10), false);\n$('slHead').onclick = ()=>slInsert(1, parseInt($('slVal').value,10), true);\n$('slDel').onclick = slDelete;\n$('slFind').onclick = slFind;\n$('slUpd').onclick = slUpdate;\n$('slReset').onclick = slReset;\nslReset();\n\n/* ============================================================\n   动画 22 · 双链表操作台\n   ============================================================ */\nconst DL = { arr:[12,25,8,47], hl:{h:null}, over:{ next:{}, prior:{} }, temp:null, tempX:0,\n             hlLink:[], ghost:-1, log:[], timer:null, busy:false };\nconst DL_CODE = {\n  ins: ['// 在双链表第 pos 个位置插入 s（知道前驱 p 之后）',\n        's->next = p->next;              // ① s 的后继指向 p 的后继',\n        'if (p->next) p->next->prior = s; // ② 后结点的前驱指向 s',\n        's->prior = p;                    // ③ s 的前驱指向 p',\n        'p->next = s;                     // ④ p 的后继指向 s',\n        '// 四步顺序不能乱，否则会断链'],\n  del: ['// 删除结点 q（已找到 q 本身）',\n        'p = q->prior;                    // ★ 不用遍历就能拿到前驱！',\n        'p->next = q->next;',\n        'if (q->next) q->next->prior = p;',\n        'free(q);',\n        '// 这正是双链表存在的理由'],\n  find:['// 双链表可以双向查找','可以从头往尾找 p = p->next',\n        '也可以从尾往头找 p = p->prior','// 但随机访问仍然是 O(n)'],\n  upd: ['// 修改某个结点','先找到结点 p（O(n)）','p->data = newVal;',\n        '// 改值是 O(1)'],\n  idx: ['// 按位查找第 pos 个结点','和单链表一样，只能从头（或从尾）一步步走',\n        'p = head->next;  j = 1;','while (p && j < pos) { p = p->next; j++; }',\n        '// 双向只是多一个方向可选，仍然是 O(n)',\n        '// 双链表的优势在「已知结点删它自己」，不在查找']\n};\nfunction dlLog(t,k){ DL.log.push({t:'> '+t, k:k}); }\nfunction dlRender(codeKey, activeLine){\n  const NW = 84, NH = 50, GAP = 64, Y = 60, X0 = 26;\n  const n = DL.arr.length;\n  const items = [{ key:'h', x:X0, val:'H', cls:DL.hl.h, sub:'头结点 · 不计位置' }];\n  DL.arr.forEach((v,i)=>{\n    items.push({ key:i, x:X0 + (i+1)*(NW+GAP), val:v, cls:DL.hl[i],\n                 sub:`第 ${i+1} 个`, ghost: i === DL.ghost });\n  });\n  const posOf = {}; items.forEach(it=>{ posOf[it.key] = it.x; });\n  const TY = Y + NH + 116;\n  const H = DL.temp ? TY + NH + 48 : Y + NH + 86;\n  const W = Math.max(660, X0 + (n+1)*(NW+GAP) + 130);\n  const NY = Y - 14, PY = Y + NH + 14;\n\n  let aN = '', aP = '';\n  items.forEach((it, idx)=>{\n    // ── next 箭头（上方，从左往右）──\n    const defN = idx < items.length-1 ? items[idx+1].key : 'null';\n    const tN = Object.prototype.hasOwnProperty.call(DL.over.next, it.key) ? DL.over.next[it.key] : defN;\n    const cN = DL.hlLink.indexOf('next:'+it.key) >= 0 ? '#d97706' : (it.ghost ? '#c9c3d6' : '#b9a8f0');\n    const mN = 'url(#dla' + arMark(cN) + ')';\n    const x1 = it.x + NW - 18;\n    if(tN === 'null'){\n      aN += `<line x1=\"${x1}\" y1=\"${NY}\" x2=\"${x1+34}\" y2=\"${NY}\" stroke=\"${cN}\" stroke-width=\"2.4\" marker-end=\"${mN}\"/>\n        <text x=\"${x1+42}\" y=\"${NY+5}\" font-size=\"12\" font-weight=\"800\" fill=\"#a49db8\">NULL<\/text>`;\n    } else if(tN === 'temp'){\n      const tx = DL.tempX + NW - 18;\n      aN += `<path d=\"M${x1},${NY} C${x1+46},${NY-40} ${tx-46},${TY-34} ${tx},${TY-4}\"\n        fill=\"none\" stroke=\"${cN}\" stroke-width=\"2.6\" marker-end=\"${mN}\"/>`;\n    } else {\n      const tx = posOf[tN];\n      aN += ((tx - it.x) > (NW + GAP - 10))\n        ? `<path d=\"M${x1},${NY} Q${(it.x+tx+NW)/2},${NY-28} ${tx-6},${NY}\" fill=\"none\" stroke=\"${cN}\" stroke-width=\"2.4\" marker-end=\"${mN}\"/>`\n        : `<line x1=\"${x1}\" y1=\"${NY}\" x2=\"${tx-6}\" y2=\"${NY}\" stroke=\"${cN}\" stroke-width=\"2.4\" marker-end=\"${mN}\"/>`;\n    }\n    // ── prior 箭头（下方，从右往左）──\n    const defP = idx > 0 ? items[idx-1].key : 'null';\n    const tP = Object.prototype.hasOwnProperty.call(DL.over.prior, it.key) ? DL.over.prior[it.key] : defP;\n    const cP = DL.hlLink.indexOf('prior:'+it.key) >= 0 ? '#d97706' : (it.ghost ? '#c9c3d6' : '#8b7fd4');\n    const mP = 'url(#dla' + arMark(cP) + ')';\n    const px1 = it.x + 18;\n    if(tP === 'null'){\n      aP += `<line x1=\"${px1}\" y1=\"${PY}\" x2=\"${px1-34}\" y2=\"${PY}\" stroke=\"${cP}\" stroke-width=\"2.2\" marker-end=\"${mP}\"/>\n        <text x=\"${px1-42}\" y=\"${PY+5}\" text-anchor=\"end\" font-size=\"12\" font-weight=\"800\" fill=\"#a49db8\">NULL<\/text>`;\n    } else if(tP === 'temp'){\n      const tx = DL.tempX + 18;\n      aP += `<path d=\"M${px1},${PY} C${px1-46},${PY+40} ${tx+46},${TY+NH+34} ${tx},${TY+NH+4}\"\n        fill=\"none\" stroke=\"${cP}\" stroke-width=\"2.6\" marker-end=\"${mP}\"/>`;\n    } else {\n      const tx = posOf[tP] + NW;\n      aP += ((px1 - tx) > (NW + GAP - 10))\n        ? `<path d=\"M${px1},${PY} Q${(tx+px1)/2},${PY+28} ${tx+6},${PY}\" fill=\"none\" stroke=\"${cP}\" stroke-width=\"2.2\" marker-end=\"${mP}\"/>`\n        : `<line x1=\"${px1}\" y1=\"${PY}\" x2=\"${tx+6}\" y2=\"${PY}\" stroke=\"${cP}\" stroke-width=\"2.2\" marker-end=\"${mP}\"/>`;\n    }\n  });\n\n  // 悬空新结点 s\n  let tempSvg = '';\n  if(DL.temp){\n    tempSvg += slNodeBox(DL.tempX, TY, NW, NH, DL.temp.val, DL.hl.temp, '新结点 s');\n    const tN2 = DL.over.next.temp, tP2 = DL.over.prior.temp;\n    if(tN2 !== undefined){\n      const sx = DL.tempX + NW - 18;\n      if(tN2 === 'null'){\n        tempSvg += `<line x1=\"${sx}\" y1=\"${TY+NH/2}\" x2=\"${sx+30}\" y2=\"${TY+NH/2}\" stroke=\"#15803d\" stroke-width=\"2.6\" marker-end=\"url(#dlag)\"/>\n          <text x=\"${sx+38}\" y=\"${TY+NH/2+5}\" font-size=\"11.5\" font-weight=\"800\" fill=\"#15803d\">NULL<\/text>`;\n      } else {\n        const tx = posOf[tN2] - 6;\n        tempSvg += `<path d=\"M${sx},${TY-4} C${sx+50},${TY-46} ${tx},${NY+30} ${tx},${NY+2}\"\n          fill=\"none\" stroke=\"#15803d\" stroke-width=\"2.8\" marker-end=\"url(#dlag)\"/>`;\n      }\n    }\n    if(tP2 !== undefined){\n      const sx = DL.tempX + 18;\n      if(tP2 === 'null'){\n        tempSvg += `<line x1=\"${sx}\" y1=\"${TY+NH+6}\" x2=\"${sx-30}\" y2=\"${TY+NH+6}\" stroke=\"#0891b2\" stroke-width=\"2.6\" marker-end=\"url(#dlac)\"/>\n          <text x=\"${sx-38}\" y=\"${TY+NH+11}\" text-anchor=\"end\" font-size=\"11.5\" font-weight=\"800\" fill=\"#0891b2\">NULL<\/text>`;\n      } else {\n        const tx = posOf[tP2] + NW + 6;\n        tempSvg += `<path d=\"M${sx},${TY+NH+6} C${sx-50},${TY+NH+58} ${tx},${PY+26} ${tx},${PY+4}\"\n          fill=\"none\" stroke=\"#0891b2\" stroke-width=\"2.8\" marker-end=\"url(#dlac)\"/>`;\n      }\n    }\n  }\n\n  const nodeSvg = items.map(it=> slNodeBox(it.x, Y, NW, NH, it.val, it.ghost ? 'ghost' : it.cls, it.sub)).join('');\n\n  $('dlStage').innerHTML =\n    `<div style=\"font-size:12.5px;font-weight:700;color:#4b5765;margin-bottom:5px\">双链表 —— 每个结点有 <span class=\"mono\">prior<\/span> 和 <span class=\"mono\">next<\/span> 两条指针<\/div>\n     <div style=\"font-size:11.5px;color:#8b8699;margin-bottom:10px;line-height:1.75\">\n       <b>上方的箭头是 next 链（从左往右）<\/b>，<b>下方的箭头是 prior 链（从右往左）<\/b>。\n       双链表的插入删除之所以比单链表麻烦，就是<b>两条链都得改<\/b> —— 做操作时上下一起看。\n     <\/div>\n     <svg viewBox=\"0 0 ${W} ${H}\" style=\"width:100%;max-width:${Math.min(W,920)}px;height:auto;display:block\">${arrowDefs('dla')}${aN}${aP}${nodeSvg}${tempSvg}<\/svg>\n     <div class=\"legend\">\n       <span><i style=\"background:#b9a8f0\"><\/i>next 链（→）<\/span>\n       <span><i style=\"background:#8b7fd4\"><\/i>prior 链（←）<\/span>\n       <span><i style=\"background:#d97706\"><\/i><b>正在被改的指针<\/b><\/span>\n       <span><i style=\"background:#15803d\"><\/i>s-&gt;next<\/span>\n       <span><i style=\"background:#0891b2\"><\/i>s-&gt;prior<\/span>\n     <\/div>\n     <div class=\"tip s\" style=\"margin-top:12px\"><span class=\"ti\">双链表的杀手锏<\/span><span>\n       单链表删除一个结点，必须先<b>从头遍历找到它的前驱<\/b>（O(n)）；\n       双链表只要拿到<b>该结点本身<\/b>，就能用 <span class=\"mono\">q-&gt;prior<\/span> 直接拿到前驱，删除是 <b>O(1)<\/b>。\n       代价是每个结点多一个指针域，<b>存储密度更低<\/b>。<br>\n       另外注意插入那四步的<b>顺序<\/b>：前两步是「接住后面」，后两步才是「改前面」——\n       顺序乱了同样会丢链。\n     <\/span><\/div>`;\n  if(codeKey) renderCode('dlCode', DL_CODE[codeKey], activeLine);\n  renderLog('dlLog', DL.log);\n}\nfunction dlStop(){ if(DL.timer){ clearTimeout(DL.timer); DL.timer = null; } DL.busy = false; }\nfunction dlReset(){\n  dlStop();\n  DL.arr = [12,25,8,47]; DL.hl = {h:null};\n  DL.over = { next:{}, prior:{} }; DL.temp = null; DL.hlLink = []; DL.ghost = -1;\n  DL.log = [];\n  DL.log.push({t:'初始双链表：H ⇄ 12 ⇄ 25 ⇄ 8 ⇄ 47 ⇄ NULL（上下两条链都是完整的）', k:'mut'});\n  dlRender('del', -1);\n}\nfunction dlInsert(){\n  if(DL.busy) return; dlStop();\n  const pos = parseInt($('dlPos').value,10);\n  const val = parseInt($('dlVal').value,10);\n  const n = DL.arr.length;\n  if(isNaN(val)){ dlLog('请输入一个数值','err'); dlRender('ins',-1); return; }\n  if(isNaN(pos) || pos < 1 || pos > n+1){\n    dlLog('位置越界：合法范围 1 ~ ' + (n+1), 'err'); dlRender('ins',-1); return;\n  }\n  DL.busy = true;\n  DL.over = { next:{}, prior:{} }; DL.temp = null; DL.ghost = -1;\n  const pKey = pos === 1 ? 'h' : pos - 2;\n  const hasNext = (pos - 1) < n;\n\n  dlLog(`在第 ${pos} 个位置插入 ${val} —— 双链表要改 <b>四条指针<\/b>，盯住上下两条链`, 'ok');\n  DL.hl = {}; DL.hl[pKey] = 'act'; DL.hlLink = ['next:'+pKey];\n  dlLog(`第 0 步：先找<b>前驱 p<\/b>（第 ${pos-1} 个结点），插入点就在 p 的后面`, 'ok');\n  dlRender('ins', 0);\n\n  DL.timer = setTimeout(()=>{\n    DL.temp = { val }; DL.tempX = 110 + (pos-1) * 50;\n    DL.hl = {}; DL.hl[pKey] = 'act'; DL.hl.temp = 'new'; DL.hlLink = ['next:'+pKey];\n    dlLog(`① <span class=\"mono\">s = new Node(${val})<\/span> —— 新结点先悬在外面，<b>两个指针都还不知道指向谁<\/b>`, 'warn');\n    dlRender('ins', 0);\n\n    DL.timer = setTimeout(()=>{\n      DL.over.next.temp = hasNext ? (pos-1) : 'null';\n      dlLog(`② <span class=\"mono\">s-&gt;next = p-&gt;next<\/span> —— 先让新结点的 next <b>接住后面那半条 next 链<\/b>`, 'ok');\n      dlRender('ins', 1);\n\n      DL.timer = setTimeout(()=>{\n        if(hasNext){\n          DL.over.prior[pos-1] = 'temp';\n          dlLog(`③ <span class=\"mono\">p-&gt;next-&gt;prior = s<\/span> —— 把<b>后结点的 prior 改指到 s<\/b>（看下方青色箭头）`, 'ok');\n          dlLog('★ 这一步单链表完全没有 —— 这就是双链表多出来的工作量', 'warn');\n        } else {\n          dlLog('③ 插入位置在表尾，后面没有结点了，这一步跳过', 'mut');\n        }\n        dlRender('ins', 2);\n\n        DL.timer = setTimeout(()=>{\n          DL.over.prior.temp = pKey;\n          dlLog(`④ <span class=\"mono\">s-&gt;prior = p<\/span> —— 新结点的 prior 指向 p（另一条青色箭头）`, 'ok');\n          dlRender('ins', 3);\n\n          DL.timer = setTimeout(()=>{\n            DL.over.next[pKey] = 'temp';\n            DL.hlLink = ['next:'+pKey];\n            dlLog(`⑤ <span class=\"mono\">${pKey==='h'?'head':'p'}-&gt;next = s<\/span> —— <b>最后才改前驱的 next<\/b>（橙色箭头）`, 'ok');\n            dlLog('为什么放最后？因为前面都用到了 p->next。先改它就找不到后面的结点了', 'warn');\n            dlRender('ins', 4);\n\n            DL.timer = setTimeout(()=>{\n              DL.arr.splice(pos-1, 0, val);\n              DL.temp = null; DL.over = { next:{}, prior:{} }; DL.hlLink = [];\n              DL.hl = {}; DL.hl[pos-1] = 'new';\n              dlLog(`插入完成，表长变为 ${DL.arr.length}`, 'ok');\n              dlLog('对比单链表：同样插入，单链表改 <b>2 条<\/b>指针，双链表要改 <b>4 条<\/b> —— 这就是它更\"重\"的原因', 'mut');\n              dlRender('ins', 5);\n              DL.busy = false;\n            }, 900);\n          }, 900);\n        }, 900);\n      }, 900);\n    }, 900);\n  }, 900);\n}\nfunction dlDelete(){\n  if(DL.busy) return; dlStop();\n  const pos = parseInt($('dlPos').value,10);\n  const n = DL.arr.length;\n  if(isNaN(pos) || pos < 1 || pos > n){\n    dlLog('位置越界：合法范围 1 ~ ' + n, 'err'); dlRender('del',-1); return;\n  }\n  DL.busy = true;\n  DL.over = { next:{}, prior:{} }; DL.temp = null; DL.ghost = -1;\n  const removed = DL.arr[pos-1];\n  const pKey = pos === 1 ? 'h' : pos - 2;\n  dlLog(`删除第 ${pos} 个结点（值为 ${removed}）`, 'ok');\n  dlLog(`<b>关键对比<\/b>：单链表要先用 O(n) 从头找前驱；双链表直接用 <span class=\"mono\">q-&gt;prior<\/span> 就拿到了 —— 这是 <b>O(1)<\/b>`, 'ok');\n  DL.hl = {}; DL.hl[pKey] = 'act'; DL.hl[pos-1] = 'del';\n  DL.hlLink = ['next:'+pKey, 'prior:'+pos-1];\n  dlRender('del', 1);\n\n  DL.timer = setTimeout(()=>{\n    DL.over.next[pKey] = (pos < n) ? pos : 'null';\n    dlLog(`① <span class=\"mono\">${pKey==='h'?'head':'p'}-&gt;next = q-&gt;next<\/span> —— <b>next 链跨过 q<\/b>（橙色箭头）`, 'ok');\n    dlRender('del', 2);\n\n    DL.timer = setTimeout(()=>{\n      if(pos < n){\n        DL.over.prior[pos] = pKey;\n        dlLog(`② <span class=\"mono\">q-&gt;next-&gt;prior = p<\/span> —— <b>prior 链也跨过 q<\/b>（下方橙色箭头）`, 'ok');\n        dlLog('两条链都得改，否则从后往前遍历会走到一个已经删掉的结点上', 'warn');\n      } else {\n        dlLog('② q 是最后一个结点，没有后继，这一步跳过', 'mut');\n      }\n      dlRender('del', 3);\n\n      DL.timer = setTimeout(()=>{\n        DL.ghost = pos-1;\n        DL.hl = {}; DL.hl[pKey] = 'act'; DL.hlLink = [];\n        dlLog('此刻 q <b>两条链都不指向它了<\/b>，已经完全孤立（灰色虚线框）', 'warn');\n        dlLog('但内存还没释放 —— 这一步和单链表一样，别忘了 free', 'err');\n        dlRender('del', 4);\n\n        DL.timer = setTimeout(()=>{\n          DL.arr.splice(pos-1, 1);\n          DL.ghost = -1; DL.over = { next:{}, prior:{} }; DL.hl = {}; DL.hlLink = [];\n          dlLog(`<span class=\"mono\">free(q)<\/span> 释放空间，删除完成，表长变为 ${DL.arr.length}`, 'ok');\n          dlLog('总结：单链表删除 = O(n) 找前驱 + 改 1 条指针；双链表 = O(1) 拿前驱 + 改 2 条指针', 'mut');\n          dlRender('del', 5);\n          DL.busy = false;\n        }, 900);\n      }, 880);\n    }, 880);\n  }, 880);\n}\nfunction dlFind(){\n  if(DL.busy) return; dlStop();\n  const val = parseInt($('dlVal').value,10);\n  if(isNaN(val)){ dlLog('请输入要查找的值','err'); dlRender('find',-1); return; }\n  DL.busy = true;\n  DL.over = { next:{}, prior:{} }; DL.temp = null; DL.ghost = -1; DL.hlLink = [];\n  dlLog(`查找 ${val}：可以从头往尾走 next 链，也可以从尾往头走 prior 链`, 'ok');\n  let i = 0;\n  const step = ()=>{\n    if(i >= DL.arr.length){\n      DL.hl = {h:null}; dlLog(`没找到 ${val}`, 'err'); dlRender('find',1); DL.busy = false; return;\n    }\n    DL.hl = {h:null}; DL.hl[i] = 'cmp';\n    if(DL.arr[i] === val){\n      DL.hl[i] = 'new';\n      dlLog(`找到 ${val}，位于第 ${i+1} 个结点`, 'ok');\n      dlLog('注：双链表虽然能双向走，但<b>随机访问仍是 O(n)<\/b>，没有变成 O(1)', 'mut');\n      dlRender('find', 0); DL.busy = false; return;\n    }\n    dlLog(`比较第 ${i+1} 个结点 ${DL.arr[i]} ≠ ${val}`, 'warn');\n    dlRender('find', 0);\n    i++; DL.timer = setTimeout(step, 380);\n  };\n  DL.hl = {h:'act'};\n  dlRender('find', 0);\n  DL.timer = setTimeout(step, 340);\n}\nfunction dlUpdate(){\n  if(DL.busy) return; dlStop();\n  const pos = parseInt($('dlPos').value,10);\n  const val = parseInt($('dlVal').value,10);\n  if(isNaN(pos) || pos < 1 || pos > DL.arr.length){\n    dlLog('位置越界：合法范围 1 ~ ' + DL.arr.length, 'err'); dlRender('upd',-1); return;\n  }\n  DL.over = { next:{}, prior:{} }; DL.temp = null; DL.ghost = -1; DL.hlLink = [];\n  const old = DL.arr[pos-1];\n  DL.arr[pos-1] = isNaN(val) ? old : val;\n  DL.hl = {}; DL.hl.h = null; DL.hl[pos-1] = 'new';\n  dlLog(`定位到第 ${pos} 个结点，把 ${old} 改为 ${DL.arr[pos-1]}`, 'ok');\n  dlRender('upd', 2);\n}\nfunction dlByIdx(){\n  if(DL.busy) return; dlStop();\n  const pos = parseInt($('dlPos').value,10);\n  if(isNaN(pos) || pos < 1 || pos > DL.arr.length){\n    dlLog('位置越界：合法范围 1 ~ ' + DL.arr.length, 'err'); dlRender('idx',1); return;\n  }\n  DL.busy = true;\n  DL.over = { next:{}, prior:{} }; DL.temp = null; DL.ghost = -1; DL.hlLink = [];\n  dlLog(`按位查找第 ${pos} 个结点`, 'ok');\n  dlLog('双链表虽然能双向走，但<b>仍然不能直接跳到第 pos 个<\/b>', 'warn');\n  let j = 1;\n  const step = ()=>{\n    if(j > pos){\n      DL.hl = {h:null}; DL.hl[pos-1] = 'new';\n      dlLog(`结果：第 ${pos} 个结点是 ${DL.arr[pos-1]}，共走 ${pos} 步`, 'ok');\n      dlLog('结论：<b>双链表的优势不在查找<\/b>，而在「已知结点删它自己」—— 那时它能 O(1) 拿到前驱', 'mut');\n      dlRender('idx', 3);\n      DL.busy = false; return;\n    }\n    DL.hl = {h:null};\n    if(j > 1) DL.hl[j-2] = 'shift';\n    DL.hl[j-1] = 'act';\n    dlLog(`p 指向第 ${j} 个结点${j===pos?' —— 找到':'，继续后移'}`, 'warn');\n    dlRender('idx', 2);\n    j++;\n    DL.timer = setTimeout(step, 420);\n  };\n  DL.hl = {h:'act'};\n  dlRender('idx', 1);\n  DL.timer = setTimeout(step, 420);\n}\n$('dlIdx').onclick = dlByIdx;\n$('dlIns').onclick = dlInsert;\n$('dlDel').onclick = dlDelete;\n$('dlFind').onclick = dlFind;\n$('dlUpd').onclick = dlUpdate;\n$('dlReset').onclick = dlReset;\ndlReset();\n\n/* ============================================================\n   动画 23 · 栈操作台\n   ============================================================ */\nconst ST = { arr:[], hl:{top:false}, log:[], timer:null, busy:false, cap:8 };\nconst ST_CODE = {\n  push:['// 入栈 push（顺序栈）','if (top == MaxSize-1) return 栈满;',\n        'top++;','data[top] = val;','// 只在栈顶操作，O(1)'],\n  pop: ['// 出栈 pop','if (top == -1) return 栈空;','val = data[top];','top--;',\n        '// 后进先出：最后进来的先出去'],\n  peek:['// 取栈顶元素（不出栈）','if (top == -1) return 栈空;','return data[top];',\n        '// 只读不删，栈不变']\n};\nfunction stLog(t,k){ ST.log.push({t:'> '+t, k:k}); }\nfunction stRender(codeKey, activeLine){\n  const rows = [];\n  for(let i = ST.cap - 1; i >= 0; i--){\n    const v = ST.arr[i];\n    const isTop = i === ST.arr.length - 1 && ST.arr.length > 0;\n    const cls = ST.hl[i] || (isTop ? 'top' : '');\n    const bg = cls === 'act' ? 'var(--primary)' : cls === 'new' ? 'var(--green-l)' : cls === 'del' ? 'var(--red-l)' : cls === 'top' ? '#f0eefe' : '#fbfaff';\n    const bd = cls === 'act' ? 'var(--primary)' : cls === 'new' ? 'var(--green)' : cls === 'del' ? 'var(--red)' : cls === 'top' ? '#b9a8f0' : '#e9e6f3';\n    const fg = cls === 'act' ? '#fff' : cls === 'new' ? '#0a6b4a' : cls === 'del' ? '#8d2020' : cls === 'top' ? '#5b21b6' : '#bcb6cc';\n    rows.push(`<div style=\"display:flex;align-items:center;gap:10px\">\n      <span style=\"width:26px;font-size:10.5px;color:#a49db8;text-align:right;font-family:Consolas,monospace\">${i}<\/span>\n      <div style=\"flex:1;max-width:220px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:space-between;\n        padding:0 12px;background:${bg};border:1.5px solid ${bd};color:${fg};font-weight:700;font-family:Consolas,monospace;font-size:14px;transition:.3s\">\n        <span>${v===undefined?'':v}<\/span>\n        ${isTop?'<span style=\"font-size:10px;font-weight:800;letter-spacing:.5px\">← top 栈顶<\/span>':''}\n      <\/div>\n    <\/div>`);\n  }\n  const full = ST.arr.length === ST.cap;\n  const empty = ST.arr.length === 0;\n  $('stStage').innerHTML =\n    `<div style=\"display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start\">\n      <div>\n        <div style=\"font-size:12.5px;font-weight:700;color:#4b5765;margin-bottom:5px\">从下到上：栈底 → 栈顶<\/div>\n        <div style=\"font-size:11.5px;color:#8b8699;margin-bottom:10px;line-height:1.75\">\n          左边的数字是<b>数组下标<\/b>（从 0 开始），<span class=\"mono\">top<\/span> 存的就是栈顶元素的下标 ——\n          空栈时 <span class=\"mono\">top == −1<\/span>，这是顺序栈的标准约定。\n        <\/div>\n        <div style=\"display:flex;flex-direction:column;gap:4px\">${rows.join('')}<\/div>\n      <\/div>\n      <div style=\"flex:1;min-width:210px\">\n        <div class=\"res\">\n          <div class=\"r\"><span class=\"lbl\">栈中元素<\/span><span class=\"val\">${ST.arr.length}<\/span>\n            <span style=\"font-size:12px;color:#8b95a3\">容量 ${ST.cap}<\/span><\/div>\n          <div class=\"r\"><span class=\"lbl\">top 下标<\/span><span class=\"val\">${ST.arr.length-1}<\/span><\/div>\n          <div class=\"r\"><span class=\"lbl\">状态<\/span>\n            <span style=\"font-size:13px;font-weight:700;color:${full?'#dc2626':(empty?'#a49db8':'#15803d')}\">${full?'栈满（top == MaxSize−1）':(empty?'栈空（top == −1）':'可继续入栈')}<\/span><\/div>\n        <\/div>\n        <div style=\"margin-top:12px;font-size:12px;color:#5c5773;line-height:1.85;background:#f8f7fc;border:1px solid var(--line);border-radius:9px;padding:11px 14px\">\n          <b>后进先出<\/b>：无论 push 还是 pop，都只动栈顶那一个位置。<br>\n          所以入栈、出栈都是 <b>O(1)<\/b>，这是栈最大的特点。\n        <\/div>\n      <\/div>\n    <\/div>`;\n  if(codeKey) renderCode('stCode', ST_CODE[codeKey], activeLine);\n  renderLog('stLog', ST.log);\n}\nfunction stReset(){\n  if(ST.timer){ clearTimeout(ST.timer); ST.timer = null; } ST.busy = false;\n  ST.arr = []; ST.hl = {top:false}; ST.log = [];\n  ST.log.push({t:'空栈：top = −1，栈中没有任何元素', k:'mut'});\n  stRender('push', -1);\n}\nfunction stPush(){\n  if(ST.busy) return;\n  const val = parseInt($('stVal').value,10);\n  if(isNaN(val)){ stLog('请输入一个数值','err'); stRender('push',-1); return; }\n  if(ST.arr.length >= ST.cap){ stLog('栈满！top 已达 MaxSize−1，不能再入栈', 'err'); stRender('push',0); return; }\n  ST.arr.push(val);\n  ST.hl = {}; ST.hl[ST.arr.length-1] = 'new';\n  stLog(`push(${val})：top 先加 1，再写入 data[${ST.arr.length-1}]`, 'ok');\n  stLog(`现在栈顶是 ${val}，栈中 ${ST.arr.length} 个元素`, 'mut');\n  stRender('push', 2);\n}\nfunction stPop(){\n  if(ST.busy) return;\n  if(!ST.arr.length){ stLog('栈空！top == −1，无法出栈（下溢）', 'err'); stRender('pop',1); return; }\n  const val = ST.arr[ST.arr.length-1];\n  ST.arr.pop();\n  ST.hl = {}; if(ST.arr.length) ST.hl[ST.arr.length-1] = 'act';\n  stLog(`pop()：取出栈顶元素 ${val}，然后 top 减 1`, 'ok');\n  stLog(`注意取出的永远是<b>最后入栈<\/b>的那个 —— 这就是后进先出`, 'warn');\n  stRender('pop', 2);\n}\nfunction stPeek(){\n  if(!ST.arr.length){ stLog('栈空，没有栈顶元素', 'err'); stRender('peek',1); return; }\n  const val = ST.arr[ST.arr.length-1];\n  ST.hl = {}; ST.hl[ST.arr.length-1] = 'act';\n  stLog(`top() 返回 ${val}，但<b>不删除<\/b>它，栈里还是 ${ST.arr.length} 个元素`, 'ok');\n  stRender('peek', 2);\n}\n$('stPush').onclick = stPush;\n$('stPop').onclick = stPop;\n$('stPeek').onclick = stPeek;\n$('stReset').onclick = stReset;\n(function(){ ST.arr = [3, 17]; stReset(); ST.arr = [3,17]; ST.log = [{t:'初始栈：[3, 17]（17 是栈顶）', k:'mut'}]; stRender(null,-1); })();\n\n/* ============================================================\n   动画 24 · 顺序队列操作台（专门演示「假溢出」）\n   ============================================================ */\nconst LQ = { arr:[], M:6, front:0, rear:0, hl:{}, log:[] };\nconst LQ_CODE = {\n  enq:['// 入队','if (rear == M) return 溢出;    ← rear 撞到数组末尾就进不来了',\n       'data[rear] = val;','rear++;',\n       '// rear 只增不减，永远不会回头'],\n  deq:['// 出队','if (front == rear) return 队空;','val = data[front];',\n       'front++;','// front 也只增不减'],\n  空: ['// 顺序队列的三个判断','队空：front == rear',\n       '元素个数：rear − front','假溢出：(rear == M) && (front > 0)',\n       '// 前面的格子明明空着，却再也用不上']\n};\nfunction lqLog(t,k){ LQ.log.push({t:'> '+t, k:k}); }\nfunction lqRender(codeKey, activeLine){\n  const M = LQ.M;\n  const cnt = LQ.rear - LQ.front;\n  const empty = LQ.front === LQ.rear;\n  const stuck = LQ.rear >= M;                 // rear 已到末尾\n  const fake  = stuck && LQ.front > 0;        // 且前面还有空位 = 假溢出\n\n  let cells = '', arrows = '';\n  for(let i=0;i<M;i++){\n    const inQ = i >= LQ.front && i < LQ.rear;\n    const passed = i < LQ.front;\n    const h = LQ.hl[i] || '';\n    let bg, fg, bd, txt;\n    if(inQ){ bg = '#f0eefe'; fg = '#5b21b6'; bd = '#b9a8f0'; txt = LQ.arr[i]; }\n    else if(passed){\n      bg = 'repeating-linear-gradient(45deg,#faf9fd,#faf9fd 5px,#f1eefb 5px,#f1eefb 10px)';\n      fg = '#bfb8cf'; bd = '#e9e6f3'; txt = '空';\n    }\n    else { bg = '#fbfaff'; fg = '#d8d4e6'; bd = '#e9e6f3'; txt = '·'; }\n    if(h === 'new'){ bg = '#e8f6ec'; fg = '#0a6b4a'; bd = '#15803d'; txt = LQ.arr[i]; }\n    if(h === 'del'){ bg = '#fdeceb'; fg = '#8d2020'; bd = '#dc2626'; txt = LQ.arr[i]; }\n    cells += `<div style=\"position:relative\">\n      ${inQ?`<div style=\"position:absolute;left:-4px;top:-4px;right:-4px;bottom:8px;border:1.8px solid #d97706;border-radius:13px;pointer-events:none\"><\/div>`:''}\n      <div style=\"width:54px;height:48px;border-radius:9px;display:flex;align-items:center;justify-content:center;\n        background:${bg};border:1.5px solid ${bd};color:${fg};font-weight:700;font-family:Consolas,monospace;\n        font-size:14px;transition:.3s\">${txt}<\/div>\n      <div style=\"text-align:center;font-size:10px;color:#a49db8;margin-top:3px;font-family:Consolas,monospace\">${i}<\/div>\n    <\/div>`;\n    arrows += `<div style=\"width:54px;margin-left:2px;text-align:center;font-size:9.5px;font-weight:800;height:16px\">\n      ${i === LQ.front ? '<span style=\"color:#15803d\">front↓<\/span>' : ''}\n      ${i === LQ.rear ? '<span style=\"color:#d97706\">rear↓<\/span>' : ''}\n    <\/div>`;\n  }\n\n  /* 假溢出时，在数组右侧立一堵\"墙\" */\n  const wall = stuck ? `<div style=\"display:flex;flex-direction:column;align-items:center;justify-content:flex-start;margin-left:6px\">\n      <div style=\"width:10px;height:48px;border-radius:3px;\n        background:repeating-linear-gradient(45deg,#dc2626,#dc2626 3px,#fff 3px,#fff 6px)\"><\/div>\n      <div style=\"font-size:9.5px;font-weight:800;color:#dc2626;margin-top:3px;white-space:nowrap\">到此为止<\/div>\n    <\/div>` : '';\n\n  $('lqStage').innerHTML =\n    `<div style=\"font-size:12px;font-weight:700;color:#4b5765;margin-bottom:9px\">顺序队列（数组容量 M = ${M}）—— <b>注意它是一排，rear 回不了头<\/b><\/div>\n     <div style=\"display:flex;gap:4px;align-items:flex-start;flex-wrap:wrap\">${cells}${wall}<\/div>\n     <div style=\"display:flex;gap:4px;flex-wrap:wrap\">${arrows}<\/div>\n     <div class=\"legend\">\n       <span><i style=\"background:#15803d;border-radius:50%\"><\/i><b>front<\/b> 指向队头元素<\/span>\n       <span><i style=\"background:#d97706;border-radius:50%\"><\/i><b>rear<\/b> 指向队尾元素的下一个位置<\/span>\n       <span><i style=\"background:#fff4e3;border:1px solid #d97706\"><\/i>橙色外框 = 队列占用的单元<\/span>\n       <span><i style=\"background:#f1eefb;border:1px solid #e9e6f3\"><\/i>斜纹格 = 已出队，<b>空着但再也用不上<\/b><\/span>\n     <\/div>\n     <div style=\"margin-top:10px;padding:10px 12px;background:#f8f7fc;border:1px solid var(--line);border-radius:9px;\n       font-family:Consolas,monospace;font-size:12px;color:#5c5773;line-height:2\">\n       front = <b style=\"color:#15803d\">${LQ.front}<\/b>　rear = <b style=\"color:#d97706\">${LQ.rear}<\/b>　\n       元素个数 = rear − front = <b>${cnt}<\/b><br>\n       队空判断 front == rear → <b>${empty?'成立（当前队空）':'不成立'}<\/b>　·　\n       rear 是否已到末尾 rear == M → <b>${stuck?'是':'否'}<\/b><br>\n       斜纹空格数（用不上）= <b>${LQ.front}<\/b>　·　rear 后面剩余空位 = <b>${M - LQ.rear}<\/b>\n     <\/div>\n     ${fake ? `<div class=\"tip e\" style=\"margin-top:10px\"><span class=\"ti\">这就是假溢出<\/span><span>\n       rear 已经走到数组末尾（rear = ${LQ.rear} = M），但<b>队列里其实只有 ${cnt} 个元素<\/b> ——\n       前面那 ${LQ.front} 个斜纹格子<b>是空的，却再也塞不进东西<\/b>。<br>\n       <b>「假」就假在这里：不是没空间，而是空间用不上。<\/b>\n       解法就是下一张卡片的循环队列 —— 让 rear 到末尾时能绕回开头（<span class=\"mono\">rear = (rear+1) % M<\/span>）。<\/span><\/div>` : ''}\n     ${!stuck && LQ.rear > 0 ? `<div class=\"tip i\" style=\"margin-top:10px\"><span class=\"ti\">继续入队试试<\/span><span>\n       rear 现在在 ${LQ.rear}，还能再入 ${M - LQ.rear} 个。一直入到 rear = M，就能看到假溢出了。<\/span><\/div>` : ''}`;\n  if(codeKey) renderCode('lqCode', LQ_CODE[codeKey], activeLine);\n  renderLog('lqLog', LQ.log);\n}\nfunction lqReset(){\n  LQ.M = Math.max(3, Math.min(10, parseInt($('lqCap').value,10) || 6));\n  LQ.arr = new Array(LQ.M).fill(null);\n  LQ.front = 0; LQ.rear = 0; LQ.hl = {}; LQ.log = [];\n  LQ.log.push({t:`初始化：M = ${LQ.M}，front = rear = 0，队空`, k:'mut'});\n  lqRender('空', -1);\n}\nfunction lqEnq(){\n  const val = parseInt($('lqVal').value,10);\n  if(isNaN(val)){ lqLog('请输入一个数值','err'); lqRender('enq',-1); return; }\n  if(LQ.rear >= LQ.M){\n    lqLog(`入队失败！rear = ${LQ.rear} 已经等于 M = ${LQ.M}，撞上数组末尾`\n      + (LQ.front > 0 ? `。前面还有 ${LQ.front} 个空格子，可 rear 回不去 —— 假溢出` : ''), 'err');\n    lqRender('enq',1); return;\n  }\n  LQ.arr[LQ.rear] = val;\n  LQ.hl = {}; LQ.hl[LQ.rear] = 'new';\n  const at = LQ.rear;\n  LQ.rear++;\n  lqLog(`入队 ${val}：data[${at}] = ${val}，rear 变成 ${LQ.rear}`, 'ok');\n  lqRender('enq', 2);\n}\nfunction lqDeq(){\n  if(LQ.front === LQ.rear){\n    lqLog('队空！front == rear，无法出队', 'err'); lqRender('deq',1); return;\n  }\n  const at = LQ.front;\n  const val = LQ.arr[at];\n  LQ.arr[at] = null;\n  LQ.hl = {}; LQ.hl[at] = 'del';\n  LQ.front++;\n  lqLog(`出队 ${val}：取出 data[${at}]，front 变成 ${LQ.front} —— 这个格子从此空着，但 rear 不会再回来用它`, 'warn');\n  lqRender('deq', 3);\n}\n$('lqEnq').onclick = lqEnq;\n$('lqDeq').onclick = lqDeq;\n$('lqReset').onclick = lqReset;\n$('lqCap').oninput = lqReset;\nlqReset();\n\n/* ============================================================\n   动画 25 · 循环队列操作台\n   ============================================================ */\nconst CQ = { arr:[], M:6, front:0, rear:0, hl:{}, log:[], timer:null, wrap:null };\nconst CQ_CODE = {\n  enq:['// 入队（牺牲一个单元的方案）','if ((rear+1) % M == front) return 队满;',\n       'data[rear] = val;','rear = (rear+1) % M;','// rear 指向队尾元素的下一个位置'],\n  deq:['// 出队','if (front == rear) return 队空;','val = data[front];',\n       'front = (front+1) % M;','// front 指向队头元素'],\n   空: ['// 判空判满（必背公式）','队空：front == rear',\n       '队满：(rear + 1) % M == front','元素个数：(rear − front + M) % M',\n       '// 牺牲一个单元，是为了区分「空」和「满」']\n};\nfunction cqLog(t,k){ CQ.log.push({t:'> '+t, k:k}); }\n/* ---------- 循环队列 · 圆环视图 ---------- */\nconst CQ_CX = 200, CQ_CY = 200, CQ_R = 130;\nfunction cqAng(i, M){ return (-90 + i * 360 / M) * Math.PI / 180; }\nfunction cqPt(i, M, r, offDeg){\n  const a = cqAng(i, M) + (offDeg || 0) * Math.PI / 180;\n  return { x: CQ_CX + r * Math.cos(a), y: CQ_CY + r * Math.sin(a) };\n}\nfunction cqRender(codeKey, activeLine){\n  const M = CQ.M;\n  const cnt = (CQ.rear - CQ.front + M) % M;\n  const full = (CQ.rear + 1) % M === CQ.front;\n  const empty = CQ.front === CQ.rear;\n\n  let cells = '';\n  for(let i=0;i<M;i++){\n    const p = cqPt(i, M, CQ_R, 0);\n    const has = CQ.arr[i] !== undefined && CQ.arr[i] !== null;\n    const h = CQ.hl[i] || '';\n    let bg = has ? '#f0eefe' : '#fbfaff';\n    let fg = has ? '#5b21b6' : '#cfcadd';\n    let bd = has ? '#b9a8f0' : '#e9e6f3';\n    if(h === 'act'){ bg = '#7c3aed'; fg = '#fff'; bd = '#7c3aed'; }\n    if(h === 'new'){ bg = '#e8f6ec'; fg = '#0a6b4a'; bd = '#15803d'; }\n    if(h === 'del'){ bg = '#fdeceb'; fg = '#8d2020'; bd = '#dc2626'; }\n    const inRing = cnt > 0 && ((i - CQ.front + M) % M) < cnt;\n    cells += `<g>\n      ${inRing ? `<rect x=\"${(p.x-31).toFixed(1)}\" y=\"${(p.y-29).toFixed(1)}\" width=\"62\" height=\"58\" rx=\"15\" fill=\"#fff4e3\" stroke=\"#d97706\" stroke-width=\"1.6\" opacity=\".9\"/>` : ''}\n      <rect x=\"${(p.x-26).toFixed(1)}\" y=\"${(p.y-25).toFixed(1)}\" width=\"52\" height=\"50\" rx=\"11\" fill=\"${bg}\" stroke=\"${bd}\" stroke-width=\"${h?2.8:1.6}\" style=\"transition:.3s\"/>\n      <text x=\"${p.x.toFixed(1)}\" y=\"${(p.y+2).toFixed(1)}\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" font-family=\"Consolas,monospace\" fill=\"${fg}\">${has?CQ.arr[i]:'·'}<\/text>\n      <text x=\"${p.x.toFixed(1)}\" y=\"${(p.y+19).toFixed(1)}\" text-anchor=\"middle\" font-size=\"10\" font-family=\"Consolas,monospace\" fill=\"${has?'#a49db8':'#ddd8ea'}\">${i}<\/text>\n    <\/g>`;\n  }\n\n  /* front / rear 指针：从圆心指向对应格子，两个方向各错开 5° 免得重叠 */\n  const f0 = cqPt(CQ.front, M, 30, -5), f1 = cqPt(CQ.front, M, 96, -5);\n  const r0 = cqPt(CQ.rear,  M, 30,  5), r1 = cqPt(CQ.rear,  M, 96,  5);\n\n  /* 绕回：rear / front 从最后一格回到第 0 格时，沿圆周转过去 —— 这就是\"循环\"的具象 */\n  let wrapArc = '';\n  if(CQ.wrap){\n    const RW = 178;\n    const s = cqPt(CQ.wrap.from, M, RW, 0), e = cqPt(CQ.wrap.to, M, RW, 0);\n    let a1 = cqAng(CQ.wrap.from, M), a2 = cqAng(CQ.wrap.to, M);\n    if(a2 <= a1) a2 += Math.PI * 2;\n    const mid = (a1 + a2) / 2;\n    const mw = { x: CQ_CX + (RW + 18) * Math.cos(mid), y: CQ_CY + (RW + 18) * Math.sin(mid) };\n    wrapArc = `\n      <path d=\"M${s.x.toFixed(1)},${s.y.toFixed(1)} A${RW},${RW} 0 0 1 ${e.x.toFixed(1)},${e.y.toFixed(1)}\"\n        fill=\"none\" stroke=\"#dc2626\" stroke-width=\"3.4\" stroke-linecap=\"round\" marker-end=\"url(#cqWrap)\"/>\n      <text x=\"${mw.x.toFixed(1)}\" y=\"${(mw.y+4).toFixed(1)}\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"800\" fill=\"#dc2626\">${CQ.wrap.who} 绕回<\/text>`;\n  }\n\n  $('cqStage').innerHTML =\n    `<div style=\"font-size:12px;font-weight:700;color:#4b5765;margin-bottom:6px\">循环队列（容量 M = ${M}，实际最多存 ${M-1} 个元素）<\/div>\n     <div style=\"max-width:430px;margin:0 auto\">\n       <svg viewBox=\"0 0 400 400\" style=\"width:100%;height:auto;display:block\">\n         <defs>\n           <marker id=\"cqF\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6.5\" refY=\"3\" orient=\"auto\">\n             <path d=\"M0,0 L6.5,3 L0,6 z\" fill=\"#15803d\"/><\/marker>\n           <marker id=\"cqR\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6.5\" refY=\"3\" orient=\"auto\">\n             <path d=\"M0,0 L6.5,3 L0,6 z\" fill=\"#d97706\"/><\/marker>\n           <marker id=\"cqWrap\" markerWidth=\"10\" markerHeight=\"10\" refX=\"7\" refY=\"3.2\" orient=\"auto\">\n             <path d=\"M0,0 L7,3.2 L0,6.4 z\" fill=\"#dc2626\"/><\/marker>\n         <\/defs>\n\n         <circle cx=\"${CQ_CX}\" cy=\"${CQ_CY}\" r=\"${CQ_R - 44}\" fill=\"none\" stroke=\"#f1efe9\" stroke-width=\"38\"/>\n         ${wrapArc}\n         ${cells}\n\n         <line x1=\"${f0.x.toFixed(1)}\" y1=\"${f0.y.toFixed(1)}\" x2=\"${f1.x.toFixed(1)}\" y2=\"${f1.y.toFixed(1)}\"\n           stroke=\"#15803d\" stroke-width=\"2.6\" marker-end=\"url(#cqF)\"/>\n         <line x1=\"${r0.x.toFixed(1)}\" y1=\"${r0.y.toFixed(1)}\" x2=\"${r1.x.toFixed(1)}\" y2=\"${r1.y.toFixed(1)}\"\n           stroke=\"#d97706\" stroke-width=\"2.6\" marker-end=\"url(#cqR)\"/>\n\n         <circle cx=\"${CQ_CX}\" cy=\"${CQ_CY}\" r=\"27\" fill=\"#f8f7fc\" stroke=\"#e9e6f3\"/>\n         <text x=\"${CQ_CX}\" y=\"${CQ_CY-2}\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"800\" fill=\"#7c3aed\">M = ${M}<\/text>\n         <text x=\"${CQ_CX}\" y=\"${CQ_CY+13}\" text-anchor=\"middle\" font-size=\"10\" fill=\"#a49db8\">元素 ${cnt} 个<\/text>\n       <\/svg>\n     <\/div>\n     <div class=\"legend\">\n       <span><i style=\"background:#15803d;border-radius:50%\"><\/i>绿色箭头 = <b>front<\/b>（指向队头元素）<\/span>\n       <span><i style=\"background:#d97706;border-radius:50%\"><\/i>橙色箭头 = <b>rear<\/b>（指向队尾元素的<b>下一个<\/b>空位）<\/span>\n       <span><i style=\"background:#fff4e3;border:1px solid #d97706\"><\/i>橙色外框 = 当前队列实际占用的单元<\/span>\n       <span><i style=\"background:#f0eefe;border:1px solid #b9a8f0\"><\/i>有数据的格子<\/span>\n       <span>格子里的数字 = <b>数组下标<\/b>（0 在正上方，顺时针递增）<\/span>\n     <\/div>\n     <div style=\"margin-top:10px;padding:10px 12px;background:#f8f7fc;border:1px solid var(--line);border-radius:9px;\n       font-family:Consolas,monospace;font-size:12px;color:#5c5773;line-height:2\">\n       front = <b style=\"color:#15803d\">${CQ.front}<\/b>　rear = <b style=\"color:#d97706\">${CQ.rear}<\/b>　\n       元素个数 = (rear − front + M) % M = (${CQ.rear} − ${CQ.front} + ${M}) % ${M} = <b>${cnt}<\/b><br>\n       队空判断 front == rear → <b>${empty?'成立（当前队空）':'不成立'}<\/b>　·　\n       队满判断 (rear+1)%M == front → <b>${full?'成立（当前队满）':'不成立'}<\/b>\n     <\/div>\n     <div class=\"tip i\" style=\"margin-top:10px\"><span class=\"ti\">为什么画成圆<\/span><span>\n       循环队列在内存里其实是<b>一个普通的一维数组<\/b>，但它的两个指针会「绕回来」——\n       所以画成<b>首尾相接的圆<\/b>才能看出「循环」在哪。<b>下标 0 和下标 M−1 是相邻的<\/b>，\n       这正是取模运算 <span class=\"mono\">(rear + 1) % M<\/span> 干的事：\n       <b>加到 M 就自动归 0<\/b>。看动画时注意 rear 走到最后一格之后的那一步 —— 它会跨过红线绕回起点。<\/span><\/div>\n     <div class=\"tip e\" style=\"margin-top:8px\"><span class=\"ti\">为什么要牺牲一个单元<\/span><span>\n       如果不牺牲，队空和队满都会出现 <span class=\"mono\">front == rear<\/span>，无法区分。\n       牺牲一个存储单元后，<b>队满时 rear 的下一个位置就是 front<\/b>，两个条件就分开了。\n       代价是容量为 M 的数组<b>最多只能存 M−1 个元素<\/b>。<\/span><\/div>`;\n  if(codeKey) renderCode('cqCode', CQ_CODE[codeKey], activeLine);\n  renderLog('cqLog', CQ.log);\n}\nfunction cqReset(){\n  CQ.M = Math.max(3, Math.min(10, parseInt($('cqCap').value,10) || 6));\n  CQ.arr = new Array(CQ.M).fill(null);\n  CQ.front = 0; CQ.rear = 0; CQ.hl = {}; CQ.log = []; CQ.wrap = null;\n  CQ.log.push({t:`初始化：M = ${CQ.M}，front = rear = 0，队空`, k:'mut'});\n  CQ.log.push({t:'注意：数组有 ' + CQ.M + ' 个格子，但最多只能存 ' + (CQ.M-1) + ' 个元素', k:'warn'});\n  cqRender('空', -1);\n}\nfunction cqEnq(){\n  const val = parseInt($('cqVal').value,10);\n  if(isNaN(val)){ cqLog('请输入一个数值','err'); cqRender('enq',-1); return; }\n  const M = CQ.M;\n  if((CQ.rear + 1) % M === CQ.front){\n    cqLog('队满！(rear+1)%M == front，不能再入队', 'err'); cqRender('enq',0); return;\n  }\n  const oldRear = CQ.rear;\n  CQ.arr[oldRear] = val;\n  CQ.hl = {}; CQ.hl[oldRear] = 'new';\n  CQ.rear = (CQ.rear + 1) % M;\n  CQ.wrap = (CQ.rear < oldRear) ? { from: oldRear, to: CQ.rear, who:'rear' } : null;\n  cqLog(`入队 ${val}：写入 data[${oldRear}]，然后 rear = (${oldRear}+1) % ${M} = ${CQ.rear}`\n    + (CQ.wrap ? '  ← rear 从最后一格绕回开头！' : ''), CQ.wrap ? 'warn' : 'ok');\n  cqRender('enq', 3);\n}\nfunction cqDeq(){\n  const M = CQ.M;\n  if(CQ.front === CQ.rear){\n    cqLog('队空！front == rear，无法出队', 'err'); cqRender('deq',1); return;\n  }\n  const oldFront = CQ.front;\n  const val = CQ.arr[oldFront];\n  CQ.arr[oldFront] = null;\n  CQ.hl = {}; CQ.hl[oldFront] = 'del';\n  CQ.front = (CQ.front + 1) % M;\n  CQ.wrap = (CQ.front < oldFront) ? { from: oldFront, to: CQ.front, who:'front' } : null;\n  cqLog(`出队 ${val}：取出 data[${oldFront}]，然后 front = (${oldFront}+1) % ${M} = ${CQ.front}`\n    + (CQ.wrap ? '  ← front 从最后一格绕回开头！' : ''), CQ.wrap ? 'warn' : 'ok');\n  cqRender('deq', 3);\n}\n$('cqEnq').onclick = cqEnq;\n$('cqDeq').onclick = cqDeq;\n$('cqReset').onclick = cqReset;\n$('cqCap').oninput = cqReset;\ncqReset();\n\n/* ============================================================\n   动画 26 · 出栈序列合法性判断器\n   ============================================================ */\nfunction parseSeq(s){\n  return (s||'').split(/[,，\\s]+/).map(x=>x.trim()).filter(Boolean);\n}\nfunction renderSeq(){\n  const inSeq = parseSeq($('seqIn').value);\n  const outSeq = parseSeq($('seqTarget').value);\n  if(!inSeq.length || !outSeq.length){\n    $('seqStage').innerHTML = '<div class=\"tip m\"><span class=\"ti\">提示<\/span><span>请填写入栈序列和待判断的出栈序列。<\/span><\/div>';\n    $('seqRes').innerHTML = ''; return;\n  }\n  if(inSeq.length !== outSeq.length){\n    $('seqStage').innerHTML = '<div class=\"tip m\"><span class=\"ti\">提示<\/span><span>两个序列的元素个数必须相同。<\/span><\/div>';\n    $('seqRes').innerHTML = ''; return;\n  }\n\n  // 模拟\n  const stack = [];\n  let i = 0;\n  const trace = [];\n  let ok = true, badAt = -1;\n  for(let k=0;k<outSeq.length;k++){\n    const want = outSeq[k];\n    // 一直入栈直到栈顶等于 want\n    while(i < inSeq.length && (stack.length === 0 || stack[stack.length-1] !== want)){\n      stack.push(inSeq[i]);\n      trace.push({ op:'push', v:inSeq[i], stack:stack.slice(), note:`把 ${inSeq[i]} 入栈` });\n      i++;\n    }\n    if(stack.length && stack[stack.length-1] === want){\n      stack.pop();\n      trace.push({ op:'pop', v:want, stack:stack.slice(), note:`栈顶正好是 ${want}，让它出栈` });\n    } else {\n      ok = false; badAt = k;\n      trace.push({ op:'fail', v:want, stack:stack.slice(), note:`想要 ${want} 出栈，但栈顶是 ${stack.length?stack[stack.length-1]:'(空)'}，而入栈序列已经用完 —— 不可能` });\n      break;\n    }\n  }\n\n  const maxLen = Math.max.apply(null, trace.map(t=>t.stack.length).concat([1]));\n  const stackSvg = trace.map((t,ti)=>{\n    let cells = '';\n    for(let d=0;d<maxLen;d++){\n      const v = t.stack[d];\n      const isTop = d === t.stack.length-1;\n      cells += `<div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:3px\">\n        <div style=\"width:30px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;\n          font-size:11.5px;font-weight:700;font-family:Consolas,monospace;\n          background:${v!==undefined?(isTop?'#7c3aed':'#f0eefe'):'transparent'};\n          color:${v!==undefined?(isTop?'#fff':'#5b21b6'):'transparent'};\n          border:1px solid ${v!==undefined?(isTop?'#7c3aed':'#b9a8f0'):'transparent'}\">${v!==undefined?v:''}<\/div>\n      <\/div>`;\n    }\n    return `<div style=\"min-width:64px;padding:8px 6px;border-radius:8px;text-align:center;\n      background:${t.op==='fail'?'#fdeceb':(ti===trace.length-1?'#f3ecfe':'#fbfaff')};\n      border:1px solid ${t.op==='fail'?'#f0b9b7':'#e9e6f3'}\">\n      <div style=\"font-size:10px;font-weight:800;color:${t.op==='push'?'#2563eb':(t.op==='pop'?'#15803d':'#dc2626')};margin-bottom:5px\">\n        ${t.op==='push'?'入栈 '+t.v:(t.op==='pop'?'出栈 '+t.v:'✗ 卡住')}<\/div>\n      <div style=\"display:flex;gap:3px\">${cells}<\/div>\n      <div style=\"font-size:9.5px;color:#a49db8;margin-top:5px\">栈状态<\/div>\n    <\/div>`;\n  }).join('');\n\n  $('seqStage').innerHTML =\n    `<div style=\"display:flex;gap:10px;overflow-x:auto;padding-bottom:6px\">${stackSvg}<\/div>\n     <div class=\"legend\" style=\"margin-top:12px\">\n       <span><i style=\"background:#7c3aed\"><\/i>栈顶元素<\/span>\n       <span><i style=\"background:#f0eefe;border:1px solid #b9a8f0\"><\/i>栈中其他元素<\/span>\n       <span>每个方框 = 一步操作后的栈状态（左边是栈底）<\/span>\n     <\/div>`;\n\n  $('seqRes').innerHTML = ok\n    ? `<div class=\"tip s\"><span class=\"ti\">合法<\/span><span>\n        <b>序列 [${outSeq.join(', ')}] 是合法的出栈序列。<\/b>用栈模拟一遍就能走通 —— 这也是考试时判断的主流方法：\n        把入栈序列逐个压进去，栈顶和目标一致就弹出，最后能全部弹出就合法。<br><br>\n        本题 n = ${inSeq.length}，理论上可能的出栈序列共 <b>C(2n,n)/(n+1) = ${Math.round(\n          (function(n){ let r=1; for(let k=1;k<=n;k++) r = r*(n+k)/k; return r; })(inSeq.length)/(inSeq.length+1)\n        )}<\/b> 种（卡特兰数）。<\/span><\/div>`\n    : `<div class=\"tip e\"><span class=\"ti\">不合法<\/span><span>\n        <b>序列 [${outSeq.join(', ')}] 不可能是合法出栈序列。<\/b>卡在第 ${badAt+1} 步：\n        想让 <b>${outSeq[badAt]}<\/b> 出栈，但此时栈顶是 <b>${trace[trace.length-1].stack.length?trace[trace.length-1].stack[trace[trace.length-1].stack.length-1]:'（空栈）'}<\/b>，\n        而所有元素都已经入过栈了 —— 说明 ${outSeq[badAt]} 被压在栈底出不来。<br><br>\n        <b>快速判断口诀<\/b>：出栈序列中，若某个元素先出栈，那么<b>在它之前入栈、且尚未出栈的元素，必须按逆序出现在它后面<\/b>。<\/span><\/div>`;\n}\n$('seqRun').onclick = renderSeq;\n$('seqReset').onclick = ()=>{ $('seqIn').value = '1,2,3,4'; $('seqTarget').value = '3,2,4,1'; renderSeq(); };\n$('seqIn').oninput = renderSeq;\n$('seqTarget').oninput = renderSeq;\nrenderSeq();\n\n/* ============================================================\n   树的可视化通用函数\n   ============================================================ */\nfunction treeNodesOf(root){\n  // 中序遍历确定水平位置，深度确定垂直位置\n  const out = [];\n  let idx = 0;\n  (function walk(node, depth){\n    if(!node) return;\n    walk(node.l, depth+1);\n    node._i = idx++; node._d = depth;\n    out.push(node);\n    walk(node.r, depth+1);\n  })(root, 0);\n  const DX = 56, DY = 72, PAD = 44;\n  let maxD = 0;\n  out.forEach(n=>{ if(n._d > maxD) maxD = n._d; });\n  const W = PAD*2 + Math.max(1, idx) * DX;\n  const H = PAD + maxD * DY + 60;\n  out.forEach(n=>{\n    n._x = PAD + n._i * DX + DX/2;\n    n._y = PAD + n._d * DY;\n  });\n  return { list: out, W, H };\n}\nfunction treeSvg(root, opts){\n  opts = opts || {};\n  if(!root) return { svg:`<svg viewBox=\"0 0 300 90\" style=\"width:100%;height:auto;display:block\">\n      <text x=\"150\" y=\"52\" text-anchor=\"middle\" font-size=\"13\" fill=\"#a49db8\">（空树）<\/text><\/svg>`, W:300, H:90 };\n  const { list, W, H } = treeNodesOf(root);\n  const hl = opts.hl || {};\n  const cmp = opts.cmp || [];\n  let edges = '', nodes = '';\n  list.forEach(n=>{\n    [['l', n.l], ['r', n.r]].forEach(([side, child])=>{\n      if(child){\n        edges += `<line x1=\"${n._x}\" y1=\"${n._y+21}\" x2=\"${child._x}\" y2=\"${child._y-21}\"\n          stroke=\"#d5cdf0\" stroke-width=\"2.2\"/>`;\n      }\n    });\n  });\n  list.forEach(n=>{\n    let fill = '#fff', stroke = '#d8d4e6', fg = '#403a55';\n    if(cmp.indexOf(n._i) >= 0){ fill = 'var(--accent-l)'; stroke = 'var(--accent)'; fg = '#9a5b06'; }\n    if(hl[n._i]){ fill = hl[n._i]==='new' ? 'var(--green-l)' : (hl[n._i]==='del' ? 'var(--red-l)' : 'var(--primary)');\n                  stroke = hl[n._i]==='new' ? 'var(--green)' : (hl[n._i]==='del' ? 'var(--red)' : 'var(--primary)');\n                  fg = hl[n._i]==='new' ? '#0a6b4a' : (hl[n._i]==='del' ? '#8d2020' : '#fff'); }\n    else if(hl[n._i] === 'act'){ fill = 'var(--primary)'; stroke = 'var(--primary)'; fg = '#fff'; }\n    nodes += `<g>\n      <circle cx=\"${n._x}\" cy=\"${n._y}\" r=\"21\" fill=\"${fill}\" stroke=\"${stroke}\" stroke-width=\"2.2\" style=\"transition:.3s\"/>\n      <text x=\"${n._x}\" y=\"${n._y+5}\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"800\" fill=\"${fg}\">${n.v}<\/text>\n      ${opts.bf ? `<text x=\"${n._x+18}\" y=\"${n._y-14}\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"800\"\n        fill=\"${bfColor(n.bf)}\">${n.bf>0?'+':''}${n.bf}<\/text>` : ''}\n    <\/g>`;\n  });\n  return {\n    svg: `<svg viewBox=\"0 0 ${W} ${H}\" style=\"width:100%;max-width:${Math.min(W,860)}px;height:auto;display:block;margin:0 auto\">${edges}${nodes}<\/svg>`,\n    W, H\n  };\n}\nfunction bfColor(b){ return Math.abs(b) > 1 ? '#dc2626' : (b === 0 ? '#a49db8' : '#7c3aed'); }\nfunction treeHeight(n){ return n ? 1 + Math.max(treeHeight(n.l), treeHeight(n.r)) : 0; }\nfunction calcBF(n){\n  if(!n) return 0;\n  n.bf = treeHeight(n.l) - treeHeight(n.r);\n  calcBF(n.l); calcBF(n.r);\n  return n.bf;\n}\n\n/* ============================================================\n   动画 27 · 数组地址计算器（行优先 vs 列优先）\n   ============================================================ */\nfunction adNum(id, def, min, max){\n  const el = $(id); if(!el) return def;\n  let v = parseFloat(el.value);\n  if(!isFinite(v)) v = def;\n  v = Math.round(v);\n  if(min != null && v < min) v = min;\n  if(max != null && v > max) v = max;\n  return v;\n}\nfunction adRender(){\n  const m = adNum('adM', 3, 2, 8);\n  const n = adNum('adN', 4, 2, 8);\n  const L = adNum('adL', 4, 1, 16);\n  const base = adNum('adBase', 1000, 0, 99999999);\n  const col = $('adMode').value === 'col';\n  const rawI = adNum('adI', 2, 0, 99);\n  const rawJ = adNum('adJ', 3, 0, 99);\n  const i = Math.min(rawI, m - 1);\n  const j = Math.min(rawJ, n - 1);\n  const clamped = (rawI !== i || rawJ !== j);\n\n  const kRow = i * n + j;              // 行优先：前面有多少个元素\n  const kCol = j * m + i;              // 列优先\n  const k = col ? kCol : kRow;\n  const addr = base + k * L;\n  const maxK = m * n - 1;\n  const posOf = (r, c) => col ? (c * m + r) : (r * n + c);\n\n  let cells = '';\n  for(let r = 0; r < m; r++){\n    for(let c = 0; c < n; c++){\n      const kk = posOf(r, c);\n      const isT = (r === i && c === j);\n      const light = 94 - (kk / Math.max(1, maxK)) * 34;\n      const bg = isT ? '#7c3aed' : 'hsl(262, 55%, ' + light.toFixed(0) + '%)';\n      const fg = isT ? '#fff' : '#4b3f66';\n      const bd = isT ? '#7c3aed' : '#e3ddf2';\n      cells += `<div style=\"border:1.4px solid ${bd};border-radius:8px;background:${bg};color:${fg};\n        padding:6px 2px;text-align:center;font-family:Consolas,monospace;transition:.3s\">\n        <div style=\"font-size:11.5px;font-weight:800\">${r},${c}<\/div>\n        <div style=\"font-size:10px;opacity:.72\">#${kk}<\/div><\/div>`;\n    }\n  }\n\n  $('adStage').innerHTML =\n    `<div style=\"font-size:12px;font-weight:700;color:#4b5765;margin-bottom:8px\">\n       ${col ? '列优先' : '行优先'}的存储顺序（格子上行 = <span class=\"mono\">a[行][列]<\/span>，下行 = <b>存储序号<\/b>）<\/div>\n     <div style=\"display:grid;grid-template-columns:repeat(${n},minmax(0,1fr));gap:5px;max-width:540px;margin:0 auto\">${cells}<\/div>\n     <div class=\"legend\">\n       <span><i style=\"background:linear-gradient(90deg,hsl(262,55%,94%),hsl(262,55%,60%))\"><\/i>颜色越深 = 存储序号越大（越靠后）<\/span>\n       <span><i style=\"background:#7c3aed\"><\/i>紫色格 = 目标元素 a[${i}][${j}]<\/span>\n     <\/div>`;\n\n  $('adOut').innerHTML =\n    `<div class=\"res\">\n       <div class=\"r\"><span class=\"lbl\">存储方式<\/span>\n         <span class=\"val\">${col ? '列优先（Fortran / MATLAB）' : '行优先（C / Java）'}<\/span><\/div>\n       <div class=\"r\"><span class=\"lbl\">公式<\/span>\n         <span class=\"mono\" style=\"font-size:12.5px\">${col ? 'LOC(a[i][j]) = LOC(a[0][0]) + (j × m + i) × L' : 'LOC(a[i][j]) = LOC(a[0][0]) + (i × n + j) × L'}<\/span><\/div>\n       <div class=\"r\"><span class=\"lbl\">代入<\/span>\n         <span class=\"mono\" style=\"font-size:12.5px\">${base} + (${col ? j + ' × ' + m + ' + ' + i : i + ' × ' + n + ' + ' + j}) × ${L}<\/span><\/div>\n       <div class=\"r\"><span class=\"lbl\">前面有多少个元素<\/span><span class=\"val\">${k} 个<\/span><\/div>\n       <div class=\"r\"><span class=\"lbl\">字节偏移<\/span><span class=\"val\">${k} × ${L} = ${k * L} 字节<\/span><\/div>\n       <div class=\"r\" style=\"border-top:1px dashed var(--line);padding-top:7px\">\n         <span class=\"lbl\">目标地址<\/span>\n         <span class=\"val\" style=\"font-size:17px\">${addr}<\/span>\n         <span class=\"mono\" style=\"font-size:12px;color:var(--muted)\">= 0x${addr.toString(16).toUpperCase()}H<\/span><\/div>\n     <\/div>\n     <div class=\"res\" style=\"margin-top:10px;background:#fbfaff;border-color:#e3ddf2\">\n       <div class=\"r\"><span class=\"lbl\">如果行优先<\/span>\n         <span class=\"mono\" style=\"font-size:12.5px\">${base} + (${i} × ${n} + ${j}) × ${L} = <b style=\"color:var(--primary)\">${base + kRow * L}<\/b><\/span><\/div>\n       <div class=\"r\"><span class=\"lbl\">如果列优先<\/span>\n         <span class=\"mono\" style=\"font-size:12.5px\">${base} + (${j} × ${m} + ${i}) × ${L} = <b style=\"color:var(--primary)\">${base + kCol * L}<\/b><\/span><\/div>\n       <div class=\"r\"><span class=\"lbl\">两者相差<\/span>\n         <span class=\"val\">${Math.abs(kRow - kCol) * L} 字节<\/span>\n         <span style=\"font-size:12px;color:var(--muted)\">同一个元素，换种存储方式地址就完全不同<\/span><\/div>\n     <\/div>\n     <div class=\"tip s\"><span class=\"ti\">一句话记住<\/span><span>\n       <b>行优先乘的是「列数 n」<\/b>（一行有 n 个元素），<b>列优先乘的是「行数 m」<\/b>（一列有 m 个元素）。\n       把上面两种方式来回切一下，看格子里存储序号的跳法 ——\n       <b>行优先是横着数过去，列优先是竖着数过去。<\/b><\/span><\/div>\n     ${clamped ? `<div class=\"tip e\"><span class=\"ti\">下标越界<\/span><span>\n       你输入的是 a[${rawI}][${rawJ}]，但 ${m}×${n} 的数组下标范围是\n       行 0~${m-1}、列 0~${n-1}。已按 a[${i}][${j}] 计算。<\/span><\/div>` : ''}`;\n}\n['adM','adN','adL','adBase','adI','adJ'].forEach(id=>{ $(id).oninput = adRender; });\n$('adMode').onchange = adRender;\nadRender();\n\n/* ============================================================\n   动画 28 · 二叉树遍历\n   ============================================================ */\nfunction buildDemoTree(){\n  return { v:'1', l:{ v:'2', l:{v:'4',l:null,r:null}, r:{v:'5',l:null,r:null} },\n                  r:{ v:'3', l:{v:'6',l:null,r:null}, r:null } };\n}\nfunction traversalOrder(root, mode){\n  const out = [];\n  if(mode === 'level'){\n    const q = [root];\n    while(q.length){ const n = q.shift(); if(!n) continue; out.push(n); q.push(n.l); q.push(n.r); }\n    return out;\n  }\n  (function walk(n){\n    if(!n) return;\n    if(mode === 'pre') out.push(n);\n    walk(n.l);\n    if(mode === 'in') out.push(n);\n    walk(n.r);\n    if(mode === 'post') out.push(n);\n  })(root);\n  return out;\n}\nconst TR_NAME = { pre:'先序遍历（根 → 左 → 右）', in:'中序遍历（左 → 根 → 右）', post:'后序遍历（左 → 右 → 根）', level:'层序遍历（逐层从左到右）' };\nlet trIdx = -1, trTimer = null;\nfunction renderTR(){\n  const mode = $('trMode').value;\n  const root = buildDemoTree();\n  const order = traversalOrder(root, mode);\n  const { list } = treeNodesOf(root);\n  const idxOf = new Map(list.map(n=>[n, n._i]));\n\n  const hl = {}, visited = [];\n  for(let i=0;i<=trIdx && i<order.length;i++){\n    hl[idxOf.get(order[i])] = (i === trIdx) ? 'act' : 'new';\n    if(i < trIdx) visited.push(order[i].v);\n  }\n  if(trIdx >= 0 && trIdx < order.length) visited.push(order[trIdx].v);\n\n  const { svg } = treeSvg(root, { hl });\n\n  $('trStage').innerHTML =\n    `<div style=\"display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start\">\n      <div style=\"flex:1;min-width:280px\">${svg}<\/div>\n      <div style=\"min-width:200px;flex:0 0 auto\">\n        <div class=\"res\">\n          <div class=\"r\"><span class=\"lbl\">当前遍历<\/span><span style=\"font-size:12.5px\">${TR_NAME[mode]}<\/span><\/div>\n          <div class=\"r\" style=\"margin-top:6px\"><span class=\"lbl\">已访问序列<\/span>\n            <span style=\"font-family:Consolas,monospace;font-size:15px;font-weight:800;color:var(--primary)\">\n            ${visited.length?visited.join(' → '):'（还没开始）'}<\/span><\/div>\n        <\/div>\n        <div style=\"margin-top:12px;font-size:12px;color:#5c5773;line-height:1.9;background:#f8f7fc;\n          border:1px solid var(--line);border-radius:9px;padding:11px 13px\">\n          ${mode==='pre'?'先序：<b>先访问根<\/b>，再递归左子树，最后递归右子树。<br>根永远是第一个被访问的。'\n            : mode==='in'?'中序：先递归左子树，<b>再访问根<\/b>，最后右子树。<br>对 BST 来说，中序序列就是<b>升序<\/b>。'\n            : mode==='post'?'后序：先左右子树，<b>最后访问根<\/b>。<br>根永远是最后一个被访问的，常用于释放树。'\n            : '层序：用<b>队列<\/b>实现，逐层从左到右。<br>本质是图的 BFS。'}\n        <\/div>\n      <\/div>\n    <\/div>`;\n\n  $('trOut').innerHTML =\n    trIdx >= order.length - 1\n      ? `<div class=\"tip s\"><span class=\"ti\">完成<\/span><span>\n          完整序列：<b style=\"font-family:Consolas,monospace;font-size:15px\">${order.map(n=>n.v).join(' → ')}<\/b><br><br>\n          换个遍历方式对比一下。注意<b>无论哪种遍历，每个结点都恰好被访问一次<\/b>，\n          所以时间复杂度都是 <b>O(n)<\/b>；递归实现的空间复杂度是 <b>O(h)<\/b>（h 为树高，即递归栈深度）。\n        <\/span><\/div>`\n      : `<div class=\"tip i\"><span class=\"ti\">提示<\/span><span>点「下一步」逐个结点推进，或点「自动播放」看完整过程。<\/span><\/div>`;\n}\n$('trPlay').onclick = ()=>{\n  clearInterval(trTimer); trIdx = -1; renderTR();\n  trTimer = setInterval(()=>{\n    const n = traversalOrder(buildDemoTree(), $('trMode').value).length;\n    if(trIdx < n-1){ trIdx++; renderTR(); } else { clearInterval(trTimer); trTimer = null; }\n  }, 700);\n};\n$('trStep').onclick = ()=>{\n  clearInterval(trTimer); trTimer = null;\n  const n = traversalOrder(buildDemoTree(), $('trMode').value).length;\n  if(trIdx < n-1){ trIdx++; renderTR(); }\n};\n$('trReset').onclick = ()=>{ clearInterval(trTimer); trTimer = null; trIdx = -1; renderTR(); };\n$('trMode').onchange = ()=>{ clearInterval(trTimer); trTimer = null; trIdx = -1; renderTR(); };\nrenderTR();\n\n/* ============================================================\n   动画 29 · 二叉排序树操作台\n   ============================================================ */\nlet BST_ROOT = null;\nconst BST_LOG = [];\nconst BST_CODE = {\n  ins: ['// BST 插入','if (root == NULL) { root = new Node(val); return; }',\n        'if (val < root->data) 递归插入左子树;','else if (val > root->data) 递归插入右子树;',\n        'else 已存在，不插入;','// 新结点一定插在叶子位置'],\n  find:['// BST 查找','while (p && p->data != val) {',\n        '    if (val < p->data) p = p->l;  // 往左走',\n        '    else p = p->r;                // 往右走','}','return p;   // 平均 O(log n)'],\n  del: ['// BST 删除（三种情况）','① 叶子结点   → 直接删',\n        '② 只有左或右孩子 → 用孩子替代','③ 有两个孩子 → 用中序直接前驱（左子树最右）',\n        '   或中序直接后继（右子树最左）替代它，','   然后递归删除那个替身']\n};\nfunction bstLog(t,k){ BST_LOG.push({t:'> '+t, k:k}); }\nfunction bstRender(codeKey, activeLine, hl, cmp){\n  const { svg } = treeSvg(BST_ROOT, { hl: hl||{}, cmp: cmp||[] });\n  const inOrder = [];\n  (function w(n){ if(!n) return; w(n.l); inOrder.push(n.v); w(n.r); })(BST_ROOT);\n  $('bstStage').innerHTML =\n    `<div style=\"display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start\">\n      <div style=\"flex:1;min-width:280px\">${svg}<\/div>\n      <div style=\"min-width:196px;flex:0 0 auto\">\n        <div class=\"res\">\n          <div class=\"r\"><span class=\"lbl\">中序序列<\/span>\n            <span style=\"font-family:Consolas,monospace;font-size:13px;font-weight:700;color:var(--primary)\">\n            ${inOrder.length?inOrder.join(' , '):'—'}<\/span><\/div>\n          <div class=\"r\" style=\"margin-top:5px\"><span class=\"lbl\">说明<\/span>\n            <span style=\"font-size:12px;color:#8b95a3\">BST 的中序序列一定是<b>升序<\/b><\/span><\/div>\n        <\/div>\n        <div class=\"legend\" style=\"margin-top:12px;flex-direction:column;gap:6px\">\n          <span><i style=\"background:#fff4e3;border:1px solid #d97706\"><\/i>查找/插入走过的路径<\/span>\n          <span><i style=\"background:#7c3aed\"><\/i>当前结点<\/span>\n          <span><i style=\"background:#e8f6ec;border:1px solid #15803d\"><\/i>新插入的结点<\/span>\n          <span><i style=\"background:#fdeceb;border:1px solid #dc2626\"><\/i>待删除<\/span>\n        <\/div>\n      <\/div>\n    <\/div>`;\n  if(codeKey) renderCode('bstCode', BST_CODE[codeKey], activeLine);\n  renderLog('bstLog', BST_LOG);\n}\nfunction bstInsertNode(root, v){\n  if(!root) return { v, l:null, r:null };\n  if(v < root.v) root.l = bstInsertNode(root.l, v);\n  else if(v > root.v) root.r = bstInsertNode(root.r, v);\n  return root;\n}\nfunction bstFindPath(root, v, path){\n  path = path || [];\n  if(!root) return { found:false, path };\n  path.push(root);\n  if(v === root.v) return { found:true, path, node:root };\n  if(v < root.v) return bstFindPath(root.l, v, path);\n  return bstFindPath(root.r, v, path);\n}\nfunction bstDelNode(root, v){\n  if(!root) return null;\n  if(v < root.v){ root.l = bstDelNode(root.l, v); return root; }\n  if(v > root.v){ root.r = bstDelNode(root.r, v); return root; }\n  // 找到了\n  if(!root.l && !root.r) return null;                    // 叶子\n  if(!root.l) return root.r;                             // 只有右孩子\n  if(!root.r) return root.l;                             // 只有左孩子\n  // 两个孩子：找中序直接前驱（左子树最右）\n  let p = root.l;\n  while(p.r) p = p.r;\n  root.v = p.v;\n  root.l = bstDelNode(root.l, p.v);\n  return root;\n}\nfunction bstReset(){\n  BST_ROOT = null; BST_LOG.length = 0;\n  [50, 30, 70, 20, 40, 60, 80].forEach(v=>{ BST_ROOT = bstInsertNode(BST_ROOT, v); });\n  bstLog('初始 BST：50 30 70 20 40 60 80（按此顺序插入得到）', 'mut');\n  bstLog(`中序序列：[50, 30, 70, 20, 40, 60, 80] 的中序遍历结果是升序，验证它确实是 BST`, 'mut');\n  bstRender('ins', -1, {}, []);\n}\nfunction bstDoInsert(){\n  const v = parseInt($('bstVal').value,10);\n  if(isNaN(v)){ bstLog('请输入一个数值','err'); bstRender('ins',-1,{},[]); return; }\n  const { found, path } = bstFindPath(BST_ROOT, v);\n  const cmpIdx = path.map(n=>n._i || 0);\n  if(found){\n    bstLog(`${v} 已经存在，BST 中不允许重复关键字，插入被忽略`, 'err');\n    const { list } = treeNodesOf(BST_ROOT);\n    bstRender('ins', 4, { [path[path.length-1]._i]:'del' }, []);\n    return;\n  }\n  bstLog(`插入 ${v}：从根开始比较`, 'ok');\n  path.forEach(n=> bstLog(`  与 ${n.v} 比较 → ${v < n.v ? '比它小，往左走' : '比它大，往右走'}`, 'warn'));\n  BST_ROOT = bstInsertNode(BST_ROOT, v);\n  const { list } = treeNodesOf(BST_ROOT);\n  const target = list.find(n=>n.v === v);\n  bstLog(`${v} 插入到叶子的位置（BST 的新结点一定是叶子）`, 'ok');\n  bstRender('ins', 5, target ? { [target._i]:'new' } : {}, []);\n}\nlet BST_BUSY = false;\nfunction bstDoDelete(){\n  if(BST_BUSY) return;\n  const v = parseInt($('bstVal').value,10);\n  if(isNaN(v)){ bstLog('请输入一个数值','err'); bstRender('del',-1,{},[]); return; }\n  const { found, node } = bstFindPath(BST_ROOT, v);\n  if(!found){ bstLog(`树中没有 ${v}，无法删除`, 'err'); bstRender('del',-1,{},[]); return; }\n  const caseNo = (!node.l && !node.r) ? 1 : ((!node.l || !node.r) ? 2 : 3);\n  const caseTxt = ['', '是叶子结点 → 直接摘掉就行', '只有一个孩子 → 让这个孩子顶替它的位置',\n    '有两个孩子 → <b>不能直接删<\/b>，得先找一个「替身」'][caseNo];\n  bstLog(`删除 ${v}：<b>第 ${caseNo} 种情况<\/b> —— ${caseTxt}`, 'ok');\n  const zi = node._i;\n\n  if(caseNo !== 3){\n    BST_BUSY = true;\n    bstRender('del', caseNo === 1 ? 1 : 2, { [zi]:'del' }, []);\n    setTimeout(()=>{\n      BST_ROOT = bstDelNode(BST_ROOT, v);\n      bstLog(caseNo === 1 ? '它是叶子，直接摘掉，没有任何指针要改'\n                          : '把它的唯一孩子整个接到它原来的位置上', 'warn');\n      bstLog(`删除完成`, 'ok');\n      bstRender('del', 5, {}, []);\n      BST_BUSY = false;\n    }, 900);\n    return;\n  }\n\n  // ── 情况③：左右子树都在 ─────────────────────\n  BST_BUSY = true;\n  let pred = node.l; while(pred.r) pred = pred.r;\n  const pi = pred._i;\n  bstRender('del', 3, { [zi]:'del' }, []);\n  bstLog('它左右两棵子树都在，直接删会把它拆成两半、接不上。所以要找<b>替身<\/b>', 'warn');\n\n  setTimeout(()=>{\n    bstRender('del', 3, { [zi]:'del', [pi]:'act' }, []);\n    bstLog(`替身 = <b>中序直接前驱<\/b> = 左子树里最右的那个结点 = <b>${pred.v}<\/b>（橙色那个）`, 'ok');\n    bstLog('为什么选它？因为它是左子树里<b>最大的<\/b>，放到根的位置上正好能满足「左 &lt; 根 &lt; 右」', 'mut');\n    bstLog('（等价做法：用中序直接<b>后继<\/b> —— 右子树里最左的结点）', 'mut');\n\n    setTimeout(()=>{\n      node.v = pred.v;\n      const zi2 = node._i;\n      bstRender('del', 3, { [zi2]:'new' }, []);\n      bstLog(`<b>第 1 步<\/b>：把替身的值 <b>${pred.v}<\/b> 复制到要删的那个结点上（绿色那个）`, 'warn');\n      bstLog(`看图上：现在树里出现了两个 ${pred.v}，但树的<b>结构一点没变<\/b>`, 'mut');\n\n      setTimeout(()=>{\n        BST_ROOT = bstDelNode(BST_ROOT, pred.v);\n        bstLog(`<b>第 2 步<\/b>：把原来那个替身结点删掉。它<b>一定没有右孩子<\/b>，所以退化成简单情况`, 'warn');\n        bstLog(`删除完成 —— 值 ${pred.v} 留下了，被摘掉的只是原来那个替身结点`, 'ok');\n        bstRender('del', 5, {}, []);\n        BST_BUSY = false;\n      }, 1050);\n    }, 1050);\n  }, 950);\n}\nfunction bstDoFind(){\n  const v = parseInt($('bstVal').value,10);\n  if(isNaN(v)){ bstLog('请输入一个数值','err'); bstRender('find',-1,{},[]); return; }\n  const { found, path } = bstFindPath(BST_ROOT, v);\n  const { list } = treeNodesOf(BST_ROOT);\n  const cmpIdx = path.map(n=>n._i);\n  bstLog(`查找 ${v}：从根开始，每次比较决定往左还是往右`, 'ok');\n  path.forEach((n,i)=> bstLog(`  第 ${i+1} 次比较：${n.v} → ${v===n.v?'相等，找到了':(v<n.v?'往左子树走':'往右子树走')}`, 'warn'));\n  if(found){\n    bstLog(`找到 ${v}，共比较 ${path.length} 次`, 'ok');\n    bstRender('find', 5, { [path[path.length-1]._i]:'new' }, cmpIdx);\n  } else {\n    bstLog(`走到空指针，${v} 不存在。共比较 ${path.length} 次`, 'err');\n    bstRender('find', 5, {}, cmpIdx);\n  }\n}\n$('bstIns').onclick = bstDoInsert;\n$('bstDel').onclick = bstDoDelete;\n$('bstFind').onclick = bstDoFind;\n$('bstReset').onclick = bstReset;\nbstReset();\n\n/* ============================================================\n   动画 30 · 平衡二叉树 AVL\n   ============================================================ */\nconst avlH = n => n ? n.h : 0;\nconst avlUpd = n => { n.h = 1 + Math.max(avlH(n.l), avlH(n.r)); };\nconst avlBFof = n => n ? avlH(n.l) - avlH(n.r) : 0;\nfunction rotR(y){ const x = y.l; y.l = x.r; x.r = y; avlUpd(y); avlUpd(x); return x; }\nfunction rotL(x){ const y = x.r; x.r = y.l; y.l = x; avlUpd(x); avlUpd(y); return y; }\n\nlet AVL_ROOT = null, AVL_BEFORE = null, AVL_ROT = '';\nconst AVL_LOG = [];\nfunction avlLog(t,k){ AVL_LOG.push({t:'> '+t, k:k}); }\n/* 纯 BST 插入（先不旋转）—— 这样才能把「失衡那一刻」单独截出来给用户看 */\nfunction bstPlain(node, v){\n  if(!node) return { v, l:null, r:null, h:1 };\n  if(v < node.v) node.l = bstPlain(node.l, v);\n  else if(v > node.v) node.r = bstPlain(node.r, v);\n  return node;\n}\nfunction avlUpdAll(n){\n  if(!n) return 0;\n  n.h = 1 + Math.max(avlUpdAll(n.l), avlUpdAll(n.r));\n  return n.h;\n}\n/* 后序遍历找失衡结点 —— 先深后浅，拿到最低的那个 */\nfunction avlFindBad(n){\n  if(!n) return null;\n  const a = avlFindBad(n.l); if(a) return a;\n  const b = avlFindBad(n.r); if(b) return b;\n  return Math.abs(avlBFof(n)) > 1 ? n : null;\n}\n/* 自底向上修复失衡 */\nfunction avlFix(node){\n  if(!node) return null;\n  node.l = avlFix(node.l);\n  node.r = avlFix(node.r);\n  avlUpd(node);\n  const bf = avlBFof(node);\n  if(bf > 1){ if(avlBFof(node.l) < 0) node.l = rotL(node.l); return rotR(node); }\n  if(bf < -1){ if(avlBFof(node.r) > 0) node.r = rotR(node.r); return rotL(node); }\n  return node;\n}\nfunction avlRotType(bad, v){\n  const bf = avlBFof(bad);\n  if(bf > 1) return (v < bad.l.v) ? 'LL 型 · 右旋' : 'LR 型 · 先左旋后右旋';\n  return (v > bad.r.v) ? 'RR 型 · 左旋' : 'RL 型 · 先右旋后左旋';\n}\n/* 一套完整流程：插入 → 判失衡 → 快照 → 旋转 */\nfunction avlStep(v){\n  AVL_ROOT = bstPlain(AVL_ROOT, v);\n  avlUpdAll(AVL_ROOT);\n  const bad = avlFindBad(AVL_ROOT);\n  AVL_BEFORE = null; AVL_ROT = '';\n  if(bad){\n    const bf = avlBFof(bad);\n    AVL_ROT = avlRotType(bad, v);\n    avlLog(`插入 ${v} 后，结点 <b>${bad.v}<\/b> 的平衡因子变成 <b>${bf}<\/b>（|bf| &gt; 1）→ <b>失衡<\/b>`, 'err');\n    avlLog(`判断类型看两件事：<b>失衡结点在哪边重<\/b>（左重还是右重）、<b>新结点插在哪边<\/b>。本例是 <b>${AVL_ROT}<\/b>`, 'warn');\n    AVL_BEFORE = avlSnap(AVL_ROOT);\n    AVL_ROOT = avlFix(AVL_ROOT);\n    avlLog('旋转完成 —— 对比上面两张图，看清<b>谁变成了谁的孩子<\/b>', 'ok');\n  } else {\n    avlLog(`插入 ${v}：所有结点的 |平衡因子| 都 ≤ 1，<b>不需要旋转<\/b>`, 'ok');\n  }\n}\nfunction avlSnap(n){ return n ? { v:n.v, l:avlSnap(n.l), r:avlSnap(n.r), h:n.h } : null; }\nfunction avlMarkBF(n){ if(!n) return; n.bf = avlBFof(n); avlMarkBF(n.l); avlMarkBF(n.r); }\nfunction avlRender(hl, rotate){\n  const root = AVL_ROOT;\n  if(root) avlMarkBF(root);\n  const main = treeSvg(root, { hl: hl||{}, bf:true });\n\n  const sideNote =\n    `<div style=\"min-width:206px;flex:0 0 auto\">\n      <div class=\"tip i\" style=\"margin-top:0\"><span class=\"ti\">平衡因子<\/span><span>\n        结点右上角的数字 = <b>左子树高 − 右子树高<\/b>。<br>\n        <b>|平衡因子| ≤ 1<\/b> 才是 AVL 树，红色表示失衡。<\/span><\/div>\n      <div class=\"legend\" style=\"margin-top:12px;flex-direction:column;gap:6px\">\n        <span><i style=\"background:#7c3aed\"><\/i>刚插入 / 旋转涉及的结点<\/span>\n        <span><i style=\"background:#dc2626\"><\/i>失衡结点<\/span>\n      <\/div>\n    <\/div>`;\n\n  if(AVL_BEFORE && rotate){\n    avlMarkBF(AVL_BEFORE);\n    const before = treeSvg(AVL_BEFORE, { hl:{}, bf:true });\n    $('avlStage').innerHTML =\n      `<div style=\"display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:center;\n         padding:16px 14px;background:#f8f7fc;border:1px solid var(--line);border-radius:10px\">\n        <div style=\"flex:1;min-width:196px\">\n          <div style=\"text-align:center;font-size:12px;font-weight:800;color:#dc2626;margin-bottom:8px\">① 插入后 · 失衡<\/div>\n          ${before.svg}\n        <\/div>\n        <div style=\"flex:0 0 auto;text-align:center;padding:0 4px\">\n          <div style=\"font-size:22px;color:var(--primary);line-height:1.1\">➜<\/div>\n          <div style=\"font-size:11.5px;font-weight:800;color:var(--primary);white-space:nowrap;margin-top:4px\">${rotate}<\/div>\n        <\/div>\n        <div style=\"flex:1;min-width:196px\">\n          <div style=\"text-align:center;font-size:12px;font-weight:800;color:#15803d;margin-bottom:8px\">② 旋转后 · 平衡<\/div>\n          ${main.svg}\n        <\/div>\n      <\/div>\n      <div style=\"display:flex;gap:20px;flex-wrap:wrap;margin-top:14px\">${sideNote}<\/div>`;\n  } else {\n    $('avlStage').innerHTML =\n      `<div style=\"display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start\">\n        <div style=\"flex:1;min-width:260px\">${main.svg}<\/div>\n        ${sideNote}\n      <\/div>`;\n  }\n  renderLog('avlLog', AVL_LOG);\n}\nfunction avlReset(){\n  AVL_ROOT = null; AVL_LOG.length = 0; AVL_BEFORE = null; AVL_ROT = '';\n  avlLog('清空。点右边的示例按钮，或直接输入值逐个插入。', 'mut');\n  avlRender({}, '');\n}\nfunction avlInsert(v){\n  avlLog(`插入 ${v}`, 'ok');\n  avlStep(v);\n  if(AVL_ROOT){\n    const { list } = treeNodesOf(AVL_ROOT);\n    const t = list.find(n=>n.v === v);\n    avlLog(`当前 ${list.length} 个结点，树高 ${avlH(AVL_ROOT)}（理论最小高度 ⌈log₂(n+1)⌉ = ${Math.ceil(Math.log2(list.length+1))}）`, 'mut');\n    avlRender(t ? { [t._i]:'new' } : {}, AVL_ROT);\n  } else {\n    avlRender({}, '');\n  }\n}\n$('avlIns').onclick = ()=>{\n  const v = parseInt($('avlVal').value,10);\n  if(isNaN(v)){ avlLog('请输入一个数值','err'); avlRender({}); return; }\n  avlInsert(v);\n};\n$('avlReset').onclick = avlReset;\nqsa('[data-avl]').forEach(b=>b.onclick = ()=>{\n  const seq = { ll:[3,2,1], rr:[1,2,3], lr:[3,1,2], rl:[1,3,2] }[b.dataset.avl];\n  AVL_ROOT = null; AVL_LOG.length = 0; AVL_BEFORE = null; AVL_ROT = '';\n  avlLog(`<b>${b.dataset.avl.toUpperCase()} 型示例<\/b>：按顺序插入 ${seq.join(' → ')}`, 'mut');\n  seq.forEach(v=>{ avlStep(v); });\n  avlRender({}, AVL_ROT);\n});\navlReset();\n\n/* ============================================================\n   动画 31 · 大根堆操作台\n   ============================================================ */\nlet HEAP = [];\nconst HP_LOG = [];\nfunction hpLog(t,k){ HP_LOG.push({t:'> '+t, k:k}); }\nfunction heapSvg(hl, swapPair){\n  const n = HEAP.length;\n  if(!n) return '<svg viewBox=\"0 0 300 80\" style=\"width:100%;height:auto;display:block\"><text x=\"150\" y=\"46\" text-anchor=\"middle\" font-size=\"13\" fill=\"#a49db8\">（空堆）<\/text><\/svg>';\n  const h = Math.floor(Math.log2(n)) + 1;\n  const W = Math.max(360, Math.pow(2, h-1) * 76), H = h * 76 + 20;\n  const pos = i => {\n    const d = Math.floor(Math.log2(i+1));\n    const idx = i - (Math.pow(2, d) - 1);\n    const slots = Math.pow(2, d);\n    return { x: (idx + 0.5) / slots * W, y: 40 + d * 76 };\n  };\n  let edges = '', nodes = '';\n  for(let i=0;i<n;i++){\n    const p = pos(i);\n    [2*i+1, 2*i+2].forEach(c=>{\n      if(c < n){ const q = pos(c);\n        edges += `<line x1=\"${p.x}\" y1=\"${p.y+20}\" x2=\"${q.x}\" y2=\"${q.y-20}\" stroke=\"#d5cdf0\" stroke-width=\"2.2\"/>`; }\n    });\n  }\n  for(let i=0;i<n;i++){\n    const p = pos(i);\n    let fill = '#fff', stroke = '#d8d4e6', fg = '#403a55';\n    if(hl[i]){ fill = hl[i]==='new' ? 'var(--green-l)' : (hl[i]==='del' ? 'var(--red-l)' : 'var(--primary)');\n               stroke = hl[i]==='new' ? 'var(--green)' : (hl[i]==='del' ? 'var(--red)' : 'var(--primary)');\n               fg = hl[i]==='new' ? '#0a6b4a' : (hl[i]==='del' ? '#8d2020' : '#fff'); }\n    nodes += `<g>\n      <circle cx=\"${p.x}\" cy=\"${p.y}\" r=\"20\" fill=\"${fill}\" stroke=\"${stroke}\" stroke-width=\"2.2\" style=\"transition:.3s\"/>\n      <text x=\"${p.x}\" y=\"${p.y+5}\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"800\" fill=\"${fg}\">${HEAP[i]}<\/text>\n      <text x=\"${p.x}\" y=\"${p.y+34}\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#a49db8\">[${i}]<\/text>\n    <\/g>`;\n  }\n  return `<svg viewBox=\"0 0 ${W} ${H}\" style=\"width:100%;max-width:${Math.min(W,800)}px;height:auto;display:block;margin:0 auto\">${edges}${nodes}<\/svg>`;\n}\nfunction hpRender(hl){\n  hl = hl || {};\n  const n = HEAP.length;\n  const sorted = HEAP.slice().sort((a,b)=>b-a);\n  const isHeap = JSON.stringify(HEAP) === JSON.stringify(sorted);\n  $('hpStage')
